# The desktop extension's environment: Claude Desktop runs `uv run server.py` here, and uv installs this
# pinned jobwatch from PyPI. scripts/release.py keeps both versions on the release.
[project]
name = "jobwatch-desktop"
version = "0.7.0"
description = "jobwatch's MCP server, packaged as a Claude Desktop extension"
requires-python = ">=3.10"
dependencies = ["jobwatch[mcp]==0.7.0"]
