name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp,browser]"
      # tests/test_browser.py drives the page in Chromium. The runner's apt mirror is flaky, so
      # retry with system deps, then fall back to Chromium alone (the runner has most of its libraries).
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            sleep 10
          done
          python -m playwright install chromium
      - run: ruff check .
      - run: python -m pytest -q
