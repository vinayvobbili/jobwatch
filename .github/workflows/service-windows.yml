name: Service on Windows

# Runs `jobwatch service install/status/uninstall` (the Task Scheduler backend in jobwatch/service.py) on a real
# Windows machine. scripts/windows_service_check.ps1 does the checking and writes the job summary.
#
# What a runner cannot test: the ONLOGON trigger and a reboot (there is no logon to wait for). The trigger is checked
# only in the task XML, and the page is started with `schtasks /Run`, as the installer does. Whether Task Scheduler
# restarts a process killed with Stop-Process -Force is observed and reported in the summary, not assumed.

on:
  workflow_dispatch:
  push:
    paths:
      - jobwatch/service.py
      - scripts/windows_service_check.ps1
      - .github/workflows/service-windows.yml

permissions:
  contents: read

jobs:
  service:
    name: jobwatch service (Windows Task Scheduler)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - name: Install, check, kill, uninstall
        shell: pwsh
        run: ./scripts/windows_service_check.ps1 -Port 8765
