<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The installed app's icon: macOS's grid (an 824 px tile on 1024, room for its shadow). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5cf2"/><stop offset="1" stop-color="#a24af0"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="sweep" cx="512" cy="512" r="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e1050" flood-opacity=".35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- the radar's sweep: a wedge behind the hand -->
  <path d="M512 512 L689 359 A234 234 0 0 0 512 278 Z" fill="url(#sweep)"/>
  <circle cx="512" cy="512" r="234" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="44"/>
  <circle cx="512" cy="512" r="110" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="44"/>
  <path d="M512 512 L719 333" stroke="#fff" stroke-width="55" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="50" fill="#fff"/>
  <circle cx="660" cy="640" r="26" fill="#fff" fill-opacity=".9"/>
</svg>
