<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobwatch</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5a5cf2">
<style>
:root {
  --bg: #f3f4fa; --glow-1: rgba(99, 102, 241, .16); --glow-2: rgba(236, 72, 153, .09);
  --panel: rgba(255, 255, 255, .88); --panel-solid: #fff; --text: #141a2e; --muted: #626a84; --line: #e2e5f0;
  --accent: #5457f0; --accent-2: #a14cf2; --accent-text: #fff; --accent-soft: rgba(84, 87, 240, .1);
  --good: #0c9468; --warn: #c26d00; --bad: #d83450; --chip: #eef0f8; --chip-text: #3a4160;
  --shadow: 0 1px 2px rgba(20, 26, 46, .04), 0 10px 28px -16px rgba(20, 26, 46, .16);
  --shadow-hover: 0 2px 4px rgba(20, 26, 46, .05), 0 22px 44px -20px rgba(70, 60, 190, .34);
  --radius: 16px;
  --grad: linear-gradient(135deg, #5a5cf2, #a24af0);  /* filled surfaces carry white text in both themes */
  --s-applied: #3b82f6; --s-screening: #8b5cf6; --s-interviewing: #f59e0b; --s-offer: #10b981;
  --s-rejected: #94a3b8; --s-withdrawn: #a8a29e;
  --s-queued: #06b6d4; --s-skipped: #a8a29e; --s-snoozed: #8b5cf6; --s-new: #5a5cf2; --s-shown: #5a5cf2;
  color-scheme: light;
}
/* dark: set by the Theme setting, or by the computer's when that is System (applyDisplay) */
:root[data-theme="dark"] {
    --bg: #0a0d16; --glow-1: rgba(99, 102, 241, .2); --glow-2: rgba(192, 80, 240, .1);
    --panel: rgba(21, 25, 38, .86); --panel-solid: #151926; --text: #e9ebf5; --muted: #8f97b2; --line: #252a3b;
    --accent: #8d8fff; --accent-2: #c77dff; --accent-text: #0a0d16; --accent-soft: rgba(141, 143, 255, .14);
    --good: #3ddc97; --warn: #fbbf24; --bad: #ff7a93; --chip: #1e2333; --chip-text: #c3c9e0;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 32px -20px rgba(0, 0, 0, .9);
    --shadow-hover: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 22px 48px -20px rgba(110, 100, 255, .5);
    color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1100px 560px at 8% -12%, var(--glow-1), transparent 62%),
    radial-gradient(900px 520px at 102% -6%, var(--glow-2), transparent 60%), var(--bg);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.ico { flex: none; vertical-align: -2px; }

/* header */
header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-solid) 74%, transparent); backdrop-filter: saturate(1.5) blur(16px);
  -webkit-backdrop-filter: saturate(1.5) blur(16px); }
.bar { max-width: 1680px; margin: 0 auto; padding: 12px 32px; display: flex; gap: 16px; align-items: center; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  margin-right: 10px; }
.brand b { background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
nav { display: flex; gap: 2px; padding: 4px; background: var(--chip); border-radius: 12px; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 14px; border-radius: 9px;
  font: inherit; font-weight: 550; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: color .15s, background .15s; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--text); background: var(--panel-solid); box-shadow: 0 1px 3px rgba(20, 26, 46, .12); }
/* the open tab gets a gradient underline that sweeps in */
nav button { position: relative; }
nav button.on::before { content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px; height: 2.5px;
  border-radius: 2px; background: var(--grad); transform-origin: left; animation: grow .35s cubic-bezier(.2, .7, .2, 1); }
/* a tab still loading: a small ring on its button, and the page it's replacing dims */
nav button.loading::after { content: ""; width: 9px; height: 9px; border: 2px solid currentColor;
  border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
main[aria-busy="true"] { opacity: .5; pointer-events: none; transition: opacity .2s; }
.count { font-size: 11.5px; font-weight: 700; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px;
  display: inline-grid; place-items: center; color: #fff;
  background: var(--grad); }
#duecount .count { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.spacer { flex: 1; }
.status { color: var(--muted); font-size: 13.5px; }

main { max-width: 1680px; margin: 0 auto; padding: 28px 32px 80px; }
:root[data-width="wide"] main, :root[data-width="wide"] .bar { max-width: 2400px; }
:root[data-width="full"] main, :root[data-width="full"] .bar { max-width: none; }
.pagehead { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.pagehead > div:first-child { flex: 1; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.025em; margin: 0; font-weight: 800; }
.sub { color: var(--muted); margin: 6px 0 0; }
h2 { font-size: 20px; letter-spacing: -.01em; margin: 8px 0 4px; }
h3 { font-size: 15.5px; margin: 0; letter-spacing: -.005em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* stats */
.hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 22px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
.stat .num { font-size: 28px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  line-height: 1.1; }
.stat .lbl { color: var(--muted); font-size: 13px; margin-top: 2px; }
.stat.lead { color: #fff; border-color: transparent; background: var(--grad); }
.stat.lead .lbl { color: rgba(255, 255, 255, .82); }
.stat.warn .num { color: var(--warn); }
.stat.good .num { color: var(--good); }
.stat:nth-child(2) { animation-delay: 50ms; } .stat:nth-child(3) { animation-delay: 100ms; }
.stat:nth-child(4) { animation-delay: 150ms; }
.filtered { color: var(--muted); font-size: 13px; margin: -10px 0 14px; }

/* the filter bar on Today: the filters in force, each edited in place, and what they hide */
.fbar { position: relative; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px;
  box-shadow: var(--shadow); margin: 0 0 18px; font-size: 14px; }
.fbar > .ico { color: var(--accent); margin: 0 4px 0 4px; }
.fpart { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid transparent; background: none;
  font: inherit; color: var(--text); padding: 4px 9px; border-radius: 9px; cursor: pointer; max-width: 100%;
  text-align: left; transition: background .15s, border-color .15s; }
.fpart:hover { background: var(--chip); }
.fpart.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.fpart .k { color: var(--muted); }
.fpart .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
.fpart.off .v { color: var(--muted); font-weight: 500; }
.fbar .sep { color: var(--muted); opacity: .45; }
.fbar .edit { margin-left: auto; }
.fline { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--muted);
  font-size: 13px; border-top: 1px dashed var(--line); margin-top: 3px; padding: 7px 6px 1px; }
.fline b { color: var(--text); font-weight: 650; }
.fline.bad, .fline.bad b { color: var(--bad); }
.fline a { color: inherit; }
.hchip { border: 0; font: inherit; font-size: 12.5px; font-weight: 550; background: var(--chip); color: var(--chip-text);
  border-radius: 999px; padding: 1px 10px; cursor: pointer; transition: background .15s, color .15s; }
.hchip:hover { background: var(--accent-soft); color: var(--accent); }
.hchip .n { font-variant-numeric: tabular-nums; font-weight: 750; margin-right: 4px; }
.fpop { position: absolute; top: calc(100% + 6px); left: 0; width: min(420px, calc(100vw - 32px));
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 2px 16px 14px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .45); animation: pop .2s cubic-bezier(.2, .8, .2, 1) both; }
.fpop.all { width: min(680px, calc(100vw - 32px)); }
.fpop textarea { min-height: 88px; }
.fpop .foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.fpop .foot .msg { flex: 1; font-size: 13px; }
.hidden-list .list-item { align-items: flex-start; }
.hidden-list a.title { color: var(--text); font-weight: 650; text-decoration: none; }
.hidden-list a.title:hover { color: var(--accent); text-decoration: underline; }
.hidden-list .meta { margin: 1px 0 0; }
.chip.why { background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn); white-space: nowrap; }
.company.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.company.bad .x { opacity: 1; }
.company .who .err { color: var(--bad); white-space: normal; font-weight: 550; }

/* pipeline */
.pipeline { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); margin: -8px 0 22px; }
.pipeline .bar-track { display: flex; gap: 4px; height: 12px; }
.pipeline .seg { background: var(--sc); border-radius: 6px; min-width: 12px; transform-origin: left;
  animation: grow .7s cubic-bezier(.2, .7, .2, 1) both; }
.pipeline .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.pipeline .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--sc);
  margin-right: 6px; }
.pipeline .legend b { color: var(--text); margin-left: 3px; }

/* buttons */
button.btn, a.btn { font: inherit; font-size: 14px; font-weight: 550; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--text); border-radius: 10px; padding: 6px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .12s, box-shadow .15s, border-color .15s; }
a.btn { text-decoration: none; } /* a link that opens a page, drawn as a button (Apply ↗, prep sheets) */
button.btn:hover, a.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
button.btn:active, a.btn:active { transform: translateY(1px); }
button.primary, a.btn.primary { color: #fff; border-color: transparent; background: var(--grad);
  box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
button.primary:hover, a.btn.primary:hover { border-color: transparent; filter: brightness(1.07);
  box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--accent) 90%, transparent); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 5px 10px; }
button.ghost:hover { color: var(--text); background: var(--chip); border-color: transparent; }
button.btn:disabled { opacity: .55; cursor: default; }
.spin .ico { animation: spin 1s linear infinite; }

/* cards */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px 16px 22px; margin: 12px 0; box-shadow: var(--shadow); overflow: hidden;
  transition: transform .2s cubic-bezier(.2, .7, .2, 1), box-shadow .2s, border-color .2s;
  animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, transparent); }
.card.job:hover, .card.app:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover);
  border-color: color-mix(in srgb, var(--stripe, var(--accent)) 35%, var(--line)); }
/* a job card (Today, Queue): header (logo, title, one meta line; a compact ring beside them, top right), labeled rows
   in a fixed order across the card's width with the labels in one column, the bottom line, and the actions pinned to
   the bottom, so every card reads the same way */
.card.job { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto auto auto;
  gap: 0 16px; }
.card.job > .mono { grid-area: 1 / 1; }
.card.job > .jc-id { grid-area: 1 / 2; min-width: 0; }
.card.job > .fitbox { grid-area: 1 / 3; align-self: start; display: grid; grid-template-columns: auto auto;
  column-gap: 8px; align-items: center; text-align: left; padding-left: 0; }
.card.job > .fitbox .ring { width: 48px; height: 48px; grid-row: 1 / 3; margin: 0; }
.card.job > .fitbox .ring span { width: 38px; height: 38px; font-size: 15px; }
.card.job > .fitbox small { margin-top: 0; align-self: end; }
.card.job > .fitbox .scorer { margin-top: 3px; justify-self: start; align-self: start; }
.card.job > .jc-rows { grid-area: 2 / 1 / 3 / -1; min-width: 0; margin-top: 10px; }
.card.job > .verdict { grid-area: 3 / 1 / 4 / -1; }
.card.job > .jc-note { grid-area: 4 / 1 / 5 / -1; margin-top: 10px; }
.card.job > .jc-note input { width: 100%; box-sizing: border-box; }
.card.job > .jc-foot { grid-area: 5 / 1 / 6 / -1; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.jc-title { display: flex; gap: 6px; align-items: center; min-height: 26px; }
.jc-title a.title, .jc-title span.title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jc-title .badge, .jc-title .chip { flex: none; }
.meta.jc-meta { flex-wrap: nowrap; margin: 2px 0 0; white-space: nowrap; }
.kv > .small.muted { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kv .note { border-left: 0; padding-left: 0; }
.jc-meta > * { flex: none; }
.jc-meta .co { flex: none; min-width: 0; max-width: 50%; overflow: hidden; text-overflow: ellipsis; }
.jc-meta .place { flex: 0 1 auto; min-width: 0; display: flex; gap: 4px; }
.jc-meta .place .pl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.jc-meta .place .more { flex: none; opacity: .75; }
.krow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 6px 0;
  border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent); font-size: 13.5px; }
.klabel { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 6px; }
/* Each row's icon in a soft tile of its own color, so a row is found by color before it's read. */
.klabel .ico { flex: none; box-sizing: content-box; padding: 3px; border-radius: 6px; color: var(--rc, var(--accent));
  background: color-mix(in srgb, var(--rc, var(--accent)) 14%, transparent); }
.krow[data-row="pay"] { --rc: var(--good); } .krow[data-row="why"] { --rc: #d97706; }
.krow[data-row="gaps"] { --rc: #e11d48; } .krow[data-row="skills"] { --rc: #7c3aed; }
.krow[data-row="people"] { --rc: #0284c7; } .krow[data-row="check"] { --rc: #ea580c; }
.krow[data-row="note"] { --rc: #64748b; }
.kv-none { color: var(--muted); opacity: .6; }
/* The bottom line above the buttons: a tinted strip whose color is the call. */
.verdict { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 8px 10px; border-radius: 10px;
  font-size: 13px; font-weight: 550; color: var(--vc); border: 1px solid color-mix(in srgb, var(--vc) 30%, transparent);
  background: linear-gradient(90deg, color-mix(in srgb, var(--vc) 14%, transparent), color-mix(in srgb, var(--vc) 4%, transparent)); }
.verdict .vic { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff;
  background: var(--vc); }
.verdict .vtext { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.verdict.apply { --vc: var(--good); } .verdict.stretch { --vc: #d97706; } .verdict.hold { --vc: #0284c7; }
.verdict.skip { --vc: var(--bad); }
.kv { min-width: 0; }
.kv > * { margin-top: 0; margin-bottom: 0; }
.kv > * + * { margin-top: 3px; }
.kv .gaps { margin: 0; }
.kv .dim, .kv .whyfit summary, .kv .whyfit { color: var(--muted); font-size: 12.5px; }
.kv .whyfit summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paychip { display: inline-block; color: var(--good); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px;
  padding: 1px 10px; border-radius: 999px; background: color-mix(in srgb, var(--good) 14%, transparent); }
/* A job's pay, one chip per source in one wrapping row; a source with nothing is dimmed (its reason is the hover) */
.psrcs { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 4px; }
.psrc { display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%; padding: 1px 9px; border-radius: 999px;
  background: var(--chip); color: var(--chip-text); font-size: 12.5px; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psrc b { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
/* psrc-* names: .empty and .posted already style other things on the page */
.psrc-posted, .psrc-ask { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); font-weight: 700; }
.psrc-posted b, .psrc-ask b { color: inherit; opacity: .75; }
.psrc-levels, .psrc-lca { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.psrc-levels b, .psrc-lca b { color: inherit; opacity: .75; }
.psrc-none { background: transparent; border: 1px dashed var(--muted); color: var(--muted); opacity: .7; font-style: italic; cursor: help; }
.kv .advice { margin: 0; }
.kv .advice .atext { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kv .warns { margin: 0; }
.kv .chips { margin: 0; max-height: 50px; overflow: hidden; }
.kv .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kv .note { margin: 0; }
.person { display: flex; gap: 6px; align-items: center; color: var(--good); min-width: 0; }
.person .ptext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .dont { flex: none; margin-left: auto; }
.pmore { color: var(--muted); font-size: 13px; }
.pmore a { color: var(--muted); text-decoration: none; }
.pmore a:hover { color: var(--accent); text-decoration: underline; }
.card.fit-hi { --stripe: var(--good); } .card.fit-mid { --stripe: var(--warn); } .card.fit-lo { --stripe: var(--bad); }
.card.fit-none { --stripe: color-mix(in srgb, var(--accent) 35%, transparent); }
.card a.title { color: var(--text); font-weight: 700; font-size: 17px; letter-spacing: -.01em; text-decoration: none; }
.card a.title:hover { color: var(--accent); }
.mono { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-weight: 800;
  font-size: 16px; letter-spacing: -.02em; background: hsl(var(--h) 80% 93%); color: hsl(var(--h) 60% 36%);
  box-shadow: inset 0 0 0 1px hsl(var(--h) 60% 50% / .12); }
:root[data-theme="dark"] .mono { background: hsl(var(--h) 45% 20%); color: hsl(var(--h) 90% 80%); }
.mono { position: relative; overflow: hidden; flex: none; }
.mono img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 18%;
  box-sizing: border-box; background: #fff; opacity: 0; }
.mono.logo img { opacity: 1; }
.meta { color: var(--muted); font-size: 13.5px; margin: 3px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 8px;
  align-items: center; }
.meta b { color: var(--text); font-weight: 600; }
.meta .sep { opacity: .45; }
.pay { color: var(--good); font-weight: 650; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions { margin-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.chip { display: inline-block; background: var(--chip); color: var(--chip-text); border-radius: 999px;
  padding: 1px 10px; font-size: 12.5px; font-weight: 500; }
.chip.hit { background: var(--accent-soft); color: var(--accent); }
.chip.gap { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.chip.gap.must { border-style: solid; border-color: var(--warn); color: var(--warn); }
.badge { font-size: 11px; font-weight: 800; letter-spacing: .06em; border-radius: 6px; padding: 2px 7px;
  text-transform: uppercase; }
.badge.new { color: #fff; background: var(--grad);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: pulse 2.4s ease-out infinite; }

.fitbox { text-align: center; padding-left: 4px; }
.ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto;
  background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--chip) 0); animation: fade .6s both; }

/* Rescore: a small round button on the ring's edge, shown on hover; a ring being scored again spins its rim */
.ring { position: relative; }
.rescore-btn { position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; padding: 0; cursor: pointer; color: var(--accent);

  opacity: 0; transform: scale(.8); transition: opacity .15s, transform .15s, color .15s; }

.card.ref { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; }

/* a job's tailored resume: what's kept, and what a build just said (review it before applying) */

/* overlay, toast, forms */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text);
  color: var(--bg); border-radius: 12px; padding: 10px 16px; display: none; gap: 14px; align-items: center;
  z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .45);
  animation: rise .3s cubic-bezier(.2, .7, .2, 1); font-weight: 550; }
.toast button { background: none; border: 0; color: inherit; font: inherit; font-weight: 800; cursor: pointer;
  text-decoration: underline; }
/* a colored edge says what kind of news it is: good news is green, a no gets a sunrise (it's not the end) */
.toast { overflow: hidden; padding-left: 20px; }
.toast::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--grad); }
.toast[data-tone="win"]::before { background: linear-gradient(180deg, #34d399, #10b981); }
.toast[data-tone="onward"]::before { background: linear-gradient(180deg, #fbbf24, #f472b6); }
.toast { animation: toast-in .3s cubic-bezier(.2, .7, .2, 1); }
.toast[data-tone="win"] { animation: toast-pop .5s cubic-bezier(.2, .7, .2, 1); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes toast-pop { from { opacity: 0; transform: translate(-50%, 14px) scale(.92); }
  60% { transform: translate(-50%, -3px) scale(1.03); } }
.overlay { position: fixed; inset: 0; background: rgba(8, 10, 20, .5); backdrop-filter: blur(4px);
  display: none; z-index: 10; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.dialog { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; max-width: 780px;
  width: 100%; padding: 22px 24px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); animation: rise .3s both; }
.posting { white-space: pre-wrap; font-size: 14px; max-height: 60vh; overflow-y: auto; border-top: 1px solid
  var(--line); margin-top: 14px; padding-top: 14px; line-height: 1.6; }
label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 5px; }
.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], input[type=date], textarea, select { font: inherit; color: var(--text);
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; width: 100%;
  transition: border-color .15s, box-shadow .15s; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 70px; resize: vertical; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.list-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }

.error { color: var(--bad); }
.done-ok { color: var(--good); }
/* Settings' Fit scoring panel: stat tiles for the backend in effect, a count per backend, and the Claude cost */
.use-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0; }
/* use-* names: .lead and .bar already style Settings' intro lines and the page header */

.use-tiles .use-bar { height: 6px; border-radius: 3px; background: var(--chip); margin-top: 8px; overflow: hidden; }
.use-tiles .use-bar i { display: block; height: 100%; background: var(--grad); border-radius: 3px; transition: width .6s ease; }
.use-cost { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, transparent),
  color-mix(in srgb, #a24af0 10%, transparent)); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin-top: 14px; }

.chip.on { background: var(--accent-soft); color: var(--accent); }

/* where the AI runs: a tile per choice (pick the main one), then the fallback chain */
/* three across where there's room (Settings), stacked in a narrow card (onboarding) */
.ai-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0 14px; }

  transition: transform .14s, box-shadow .14s, border-color .14s; }
.ai-tile:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(84, 87, 240, .12); }
.ai-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ai-tile.on { border-color: transparent; cursor: default; box-shadow: 0 12px 30px rgba(84, 87, 240, .2);
  background: linear-gradient(var(--panel-solid), var(--panel-solid)) padding-box, var(--grad) border-box; }
.ai-tile .main-tag { position: absolute; top: -10px; left: 16px; background: var(--grad); color: #fff; font-size: 10.5px;

.ai-tile .top { display: flex; align-items: center; gap: 10px; }

  background: var(--accent-soft); color: var(--accent); }

.ai-tile .name { font-weight: 700; font-size: 15px; }

  padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.ai-tile .state.ready { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.ai-tile .state.setup { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.ai-tile .state.wait { background: var(--chip); color: var(--muted); }
.ai-tile .about { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.meters { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: center; font-size: 12px; color: var(--muted); }

.meters .bars i.f { background: var(--grad); }
.ai-steps { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 10px;
  counter-reset: step; font-size: 12.5px; }

.ai-steps li::before { content: counter(step); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 11.5px; }
.ai-steps a { font-weight: 600; }
.cmd { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.cmd code { flex: 1; min-width: 0; font-size: 12px; padding: 6px 9px; border-radius: 9px; background: var(--chip); overflow-wrap: anywhere; }
.ai-key { display: grid; gap: 6px; }
.ai-key .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.ai-tile .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
.ai-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 16px; border-radius: 14px;
  background: var(--accent-soft); margin: 0 0 12px; }
.ai-chain .title { flex-basis: 100%; font-weight: 700; font-size: 13.5px; }
.ai-chain .cap { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.ai-chain .link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px; font: inherit;
  font-weight: 600; font-size: 13px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--panel-solid);
  cursor: pointer; transition: transform .12s; }
.ai-chain .link:hover { transform: translateY(-1px); }
.ai-chain .link.main { background: var(--grad); color: #fff; border-color: transparent; cursor: default; transform: none; }
.ai-chain .link.off { border-style: dashed; border-color: var(--muted); color: var(--muted); opacity: .7; }

.ai-chain .link .n { font-size: 11px; font-weight: 800; opacity: .8; }
/* a chain step: its number, backend, model menu and ← → × tools; a paused one (out of credit or quota) is dimmed */
.ai-chain .step { cursor: default; padding: 4px 6px 4px 12px; }
.ai-chain .step:hover { transform: none; }
.ai-chain .step-model, .ai-chain .step-add { width: auto; font-size: 12.5px; padding: 3px 8px; border-radius: 999px;
  background: var(--panel-solid); color: var(--text); border: 1px solid var(--line); cursor: pointer; }
.ai-chain .step.main .step-model { background: rgba(255, 255, 255, .18); color: #fff; border-color: rgba(255, 255, 255, .35); }

.ai-chain .step-btn { width: 22px; height: 22px; border-radius: 50%; border: 0; display: grid; place-items: center;
  padding: 0; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; color: inherit;
  background: color-mix(in srgb, currentColor 10%, transparent); transition: background .15s, transform .15s; }
.ai-chain .step-btn:hover:not(:disabled) { background: color-mix(in srgb, currentColor 22%, transparent); transform: scale(1.1); }
.ai-chain .step-btn:disabled { opacity: .3; cursor: default; }
.ai-chain .step.paused { border-style: dashed; opacity: .75; }

  padding: 1px 8px; border-radius: 999px; color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }

label.check.off { opacity: .55; cursor: not-allowed; }
.onboard > .card { max-width: 760px; margin-bottom: 16px; }

.welcome { padding: 32px; border: 0; color: #fff; background: var(--grad); }

.companies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.company { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel-solid); transition: border-color .15s, transform .15s; }
.company:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-1px); }

.company .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  opacity: 0; transition: opacity .15s; }

.count.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
.stat.lead { position: relative; overflow: hidden; }
.stat.lead::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%);
  animation: sheen 1.6s .4s ease-in-out both; }
.card.job .ring { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }

.empty.done { border-style: solid; border-color: color-mix(in srgb, var(--good) 35%, var(--line)); animation: rise .5s both; }

main.quiet .card, main.quiet .stat, main.quiet .seg, main.quiet .ring, main.quiet .stat.lead::after { animation: none; }
/* wide layout: sidebar + content */
.layout { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 28px; align-items: start; }
.layout > aside { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 14px;
  max-height: calc(100vh - 104px); overflow-y: auto; padding: 2px 4px 12px 2px; margin: -2px -4px 0 -2px;
  scrollbar-width: thin; }
.layout > aside .hero { grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }

.layout > aside .stat { padding: 12px 14px; }
.layout > aside .stat .num { font-size: 24px; }
.layout > aside .filtered { margin: 0; padding: 0 4px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); }
.panel h4 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.pipeline.panel { margin: 0; padding: 14px; }
input[type=search] { font: inherit; color: var(--text); background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 11px; width: 100%; }

.seg-ctl { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }

  color: var(--muted); padding: 5px 6px; border-radius: 8px; cursor: pointer; }
.seg-ctl button.on { background: var(--panel-solid); color: var(--text); box-shadow: 0 1px 3px rgba(20, 26, 46, .12); }
.facet { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; border: 0;
  background: none; font: inherit; font-size: 13.5px; color: var(--text); padding: 5px 8px; border-radius: 8px;
  cursor: pointer; text-align: left; }
.facet:hover { background: var(--chip); }
.facet.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }

.facet-tools { display: flex; gap: 6px; align-items: center; margin: 0 0 8px; }
.facet-tools .facet-search { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 999px; font-size: 13px; }

.facet.row { justify-content: flex-start; gap: 8px; padding: 0 8px; cursor: default; }

  transition: transform .12s; }

.facet.row .fname { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left;
  padding: 5px 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet.row.off { cursor: pointer; animation: rise .25s ease-out; }

.to-watch { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.to-watch:last-child { border-bottom: 0; padding-bottom: 0; }
.to-watch .top { display: flex; justify-content: space-between; gap: 8px; }
.to-watch .c { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }

.chip.toggle:hover { transform: translateY(-1px); }
.chip.toggle.on { background: var(--grad); color: #fff; }
.showing:empty { display: none; }
.scoring:empty { display: none; }
.scoring { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13.5px; margin: 0 0 10px; min-height: 30px; }

.showing { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13.5px; margin: 0 0 10px; min-height: 30px; }
.pace:empty { display: none; }
.pace { display: flex; margin: 0 0 10px; }
.pace span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 16px; font-size: 13.5px;

/* the pace, board check, scoring and "Showing" lines share one row above the cards, wrapping when it's narrow */

ol.vr-ops { list-style: none; margin: 8px 0; padding: 0; counter-reset: op; }
ol.vr-ops li { position: relative; margin: 0 0 8px; padding: 8px 12px 8px 44px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); counter-increment: op; animation: rise .35s both; }
ol.vr-ops li::before { content: counter(op); position: absolute; left: 10px; top: 8px; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; background: var(--grad); }

  background: linear-gradient(135deg, var(--accent-soft), transparent 70%); }
@media (max-width: 600px) { .vb, .vb.me { max-width: 96%; width: auto; } .vb.me { width: 96%; } .vm-dock { gap: 10px; } .mic { width: 58px; height: 58px; } }

  70%, 100% { box-shadow: 0 0 0 8px transparent; } }

<body>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script>
"use strict";
const TOKEN = "__JOBWATCH_TOKEN__";

// Theme and page width from the watchlist's display settings. The last ones used are kept in this browser too,
// so the page opens in the right colors before the settings arrive.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function applyDisplay(d) {
  const theme = (d && d.theme) || "system", width = (d && d.width) || "standard";
  document.documentElement.dataset.theme = theme === "system" ? (darkQuery.matches ? "dark" : "light") : theme;
  document.documentElement.dataset.width = width;
  remember("display", JSON.stringify({ theme, width }));
}
function lastDisplay() { try { return JSON.parse(remembered("display", "{}")); } catch { return {}; } }
darkQuery.addEventListener("change", () => applyDisplay((settings && settings.display) || lastDisplay()));
applyDisplay(lastDisplay());
const main = document.getElementById("main");
let tab = "today";
let settings = null;

// -- tiny helpers: build DOM with textContent only, so posting text can't inject markup
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "href") el.href = safeUrl(v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
// replaceChildren doesn't flatten arrays of cards
function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false)); }
function put(...kids) { fill(main, ...kids); }
// A link's address: http(s) anywhere, or this page's own origin (a prep sheet's path, a blob download); a bare #fragment stays.
function safeUrl(u) {
  try { const x = new URL(u, location.href);
    return String(u).startsWith("#") ? u : /^https?:$/.test(x.protocol) || (x.origin !== "null" && x.origin === location.origin) ? x.href : "#";
  } catch { return "#"; }
}
// No link without a URL: an empty href opens jobwatch itself in a new tab (a job added by hand with no posting link).
function link(url, text, cls) {
  if (!url || url === "#") return h("span", { class: cls }, text);
  return h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: cls }, text);
}

const ICONS = {
  refresh: "M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5",
  calendar: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
  users: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  plus: "M12 5v14M5 12h14",
  pencil: "M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z",
  check: "M20 6 9 17l-5-5",
  arrow: "M5 12h14M13 5l7 7-7 7",
  clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2",
  inbox: "M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z",
  sparkle: "M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15v5M16.5 17.5h5M5 3v4M3 5h4",
  lock: "M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4",
  cloud: "M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z",
  send: "M12 19V5M5 12l7-7 7 7",
  stop: "M7 7h10v10H7z",
  x: "M18 6 6 18M6 6l12 12",
  clip: "M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48",
  file: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6",
  copy: "M9 9h11v11H9zM5 15H4V4h11v1",
  download: "M12 3v12M7 10l5 5 5-5M5 21h14",
  dollar: "M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
  bulb: "M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.74V16h8v-1.26A7 7 0 0 0 12 2z",
  target: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
  zap: "M13 2 3 14h9l-1 8 10-12h-9z",
  alert: "M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
  pause: "M10 4H6v16h4zM18 4h-4v16h4z",
  mic: "M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8",
  volume: "M11 5 6 9H2v6h4l5 4zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07",
  mute: "M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6",
};
function icon(name, size = 15) {
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: size, height: size, fill: "none", stroke: "currentColor",
    "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", class: "ico", "aria-hidden": "true" })) svg.setAttribute(k, v);
  const path = document.createElementNS(ns, "path"); path.setAttribute("d", ICONS[name]); svg.append(path);
  return svg;
}

// A company's logo from its own site once jobwatch has found it (see logos.py), else its initials on a color
// picked from its name: the same company always looks the same.
function monogram(name) {
  const words = (name || "?").replace(/[^A-Za-z0-9 ]+/g, " ").trim().split(/\s+/).filter(Boolean);
  const letters = (words.length > 1 ? words[0][0] + words[1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
  let hash = 7;
  for (const c of (name || "").toLowerCase()) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  const el = h("div", { class: "mono", style: `--h:${hash % 360}`, "aria-hidden": "true" }, letters);
  if (name) {
    const img = h("img", { src: `/logo/${TOKEN}/${encodeURIComponent(name)}`, alt: "", loading: "lazy", decoding: "async",
      onload: () => el.classList.add("logo"), onerror: () => img.remove() });
    el.append(img);
  }
  return el;
}

function pagehead(title, sub, ...right) {
  return h("div", { class: "pagehead" }, h("div", {}, h("h1", {}, title), sub ? h("p", { class: "sub" }, sub) : null), right);
}
// Big numbers across the top: [value, label, class].
function hero(tiles) {
  return h("div", { class: "hero" }, tiles.map(([n, label, cls]) =>
    h("div", { class: "stat " + (cls || "") }, (() => { const el = h("div", { class: "num" }, "0"); countUp(el, n); return el; })(),
      h("div", { class: "lbl" }, label))));
}
function section(title, n, cls) {
  return h("div", { class: "section " + (cls || "") }, h("h3", {}, title), h("span", { class: "n" }, n));
}
function emptyState(text, extra) { return h("div", { class: "empty" }, icon("inbox", 30), text, extra); }

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDay(day, today) {
  if (!day) return "";
  const [y, m, d] = day.split("-").map(Number);
  return `${MONTHS[m - 1]} ${d}` + (today && today.slice(0, 4) !== String(y) ? `, ${y}` : "");
}
function dayDiff(day, today) { return Math.round((Date.parse(day) - Date.parse(today)) / 86400000); }
function relDay(day, today) {
  const n = dayDiff(day, today);
  return n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n > 0 ? `in ${n} days` : `${-n} days ago`;
}
function addDays(day, n) { return new Date(Date.parse(day) + n * 86400000).toISOString().slice(0, 10); }

// jobwatch was restarted since this page loaded, so its token is a new one: load the page again to get it (once,
// not in a loop if the reload doesn't help).
function staleToken() {
  try {
    const last = Number(sessionStorage.getItem("jobwatch-reloaded")) || 0;
    if (Date.now() - last < 30000) return;
    sessionStorage.setItem("jobwatch-reloaded", String(Date.now()));
  } catch { return; }
  toast("jobwatch restarted: reloading the page…");
  setTimeout(() => location.reload(), 800);
}
// The watchlist file as /api/settings last gave it. Every save of settings sends it back, so a save from a page
// that read before the file changed is refused instead of writing its old values over the change.
let settingsFile = null;
async function api(path, body, raw) {
  const opts = { method: body === undefined && !raw ? "GET" : "POST", headers: { "X-Jobwatch-Token": TOKEN } };
  const saving = path === "/api/settings" && body !== undefined && !raw;
  if (raw) { opts.body = raw; }
  else if (body !== undefined) {
    opts.body = JSON.stringify(saving && settingsFile ? { ...body, file_version: settingsFile } : body);
    opts.headers["Content-Type"] = "application/json";
  }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (r.status === 403 && /wrong token/.test(data.error || "")) staleToken();
  if (r.ok && data.file_version) settingsFile = data.file_version;  // settings, and the saves that write the file too
  if (saving && r.status === 409) {  // the file changed since the page read it: read it again, then show why
    try { settings = await api("/api/settings"); } catch { /* the next read will */ }
  }
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

let toastTimer;
// tone: "win" for good news, "onward" for a no or a skip, nothing for the rest (see .toast[data-tone]).
function toast(text, undo, tone, label = "Undo") {
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  t.dataset.tone = tone || "";
  const b = document.getElementById("toastUndo");
  b.textContent = label;
  b.style.display = undo ? "" : "none";
  b.onclick = async () => { t.style.display = "none"; await undo(); };
  t.style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 6000);
}

// -- delight: small celebrations for real progress. All of it stays still under "reduce motion".

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CONFETTI = ["#5a5cf2", "#a24af0", "#10b981", "#f59e0b", "#3b82f6", "#ec4899", "#22d3ee"];

// Paper confetti from an element (or the top of the screen), drawn on a throwaway canvas.
function confetti(from, { count = 90, power = 1 } = {}) {
  if (REDUCED) return;
  const canvas = h("canvas", { style: "position:fixed;inset:0;pointer-events:none;z-index:30" });
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px";
  document.body.append(canvas);
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const r = from && from.getBoundingClientRect ? from.getBoundingClientRect() : { left: W / 2, top: H * .25, width: 0, height: 0 };
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const bits = Array.from({ length: count }, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1, v = (6 + Math.random() * 9) * power;
    return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, color: CONFETTI[Math.floor(Math.random() * CONFETTI.length)],
      round: Math.random() < .3 };
  });
  const start = performance.now(), life = 1800 + 400 * power;
  (function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - life * .6) / (life * .4));
    for (const b of bits) {
      b.vx *= .985; b.vy = b.vy * .985 + .32; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.color;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot * 2)) + 2);
      ctx.restore();
    }
    if (t < life) requestAnimationFrame(frame); else canvas.remove();
  })(start);
}

// Slide a card out and close the gap it leaves.
async function leave(el, dir = 1) {
  if (!el) return;
  if (REDUCED) return el.remove();
  const hgt = el.offsetHeight;
  await el.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${dir * 48}px) scale(.98)` }],
    { duration: 260, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).finished;
  await el.animate([{ height: hgt + "px", marginTop: "12px", marginBottom: "12px", paddingTop: "18px", paddingBottom: "16px" },
    { height: "0px", marginTop: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px" }],
    { duration: 220, easing: "ease-out", fill: "forwards" }).finished;
  el.remove();
}

// Numbers roll up from zero when a page opens.
function countUp(el, n) {
  if (REDUCED || !n || main.classList.contains("quiet")) { el.textContent = Number(n).toLocaleString(); return; }
  const start = performance.now(), dur = 700 + Math.min(600, n * 4);
  (function frame(now) {
    const k = Math.min(1, (now - start) / dur), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(n * eased).toLocaleString();
    if (k < 1) requestAnimationFrame(frame);
  })(start);
}

function bump(el) { if (!el || REDUCED) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

// A job search is mostly waiting and hearing no, so the page stays on the person's side: every step they take gets
// a kind word, and every no gets put in its place. One picked at random, so it doesn't read like a form letter.
const pick = list => list[Math.floor(Math.random() * list.length)];
const CHEERS = ["Nice work!", "Another one out the door.", "That's momentum. Keep going!", "Shot taken. Good luck!",
  "One step closer.", "You showed up. That's the hard part."];
const cheer = () => pick(CHEERS);
const QUEUED = ["Good pick.", "Worth a shot.", "This one could be it.", "Nice find."];
const SKIPPED = ["Onward.", "Not the one. Next!", "Saving room for a better fit.", "Good filter."];
const PASSED = ["Their loss. Onward.", "Their loss: someone else will say yes.", "Not your fit, not your fault. Next!",
  "Every no clears the way for the right yes.", "It stings, and it says nothing about what you're worth."];
// The toast for an application moved to a stage, from its card, its table row or its gone-quiet bar.
function stageWords(company, to) {
  return {
    screening: `📞 ${company} wants to talk. Nice!`, interviewing: `🎯 Interviewing at ${company}. You've got this.`,
    offer: `🥂 An offer from ${company}! Congratulations!`, rejected: `🌱 ${company} passed. ${pick(PASSED)}`,
    withdrawn: `Withdrawn from ${company}. Good call: your time is worth protecting.`,
    applied: `${company}: back to applied.` }[to] || `${company}: marked ${to}.`;
}
const TONES = { applied: "win", queued: "win", screening: "win", interviewing: "win", offer: "win",
  rejected: "onward", withdrawn: "onward", skipped: "onward", snoozed: "onward" };

// The day's hello on Today, by the local hour.
// The greeting ends in an emoji, so a dash joins it to the line, not a full stop.
function todayLine(hello, companies) { return `${hello} — new roles at the ${companies} companies you watch, best fit first.`; }
function greeting(hour) {
  return hour < 5 ? "Burning the midnight oil 🌙" : hour < 12 ? "Good morning ☀️" : hour < 17 ? "Good afternoon 🌤️"
    : "Good evening 🌆";

function showError(where, err) {

}

function age(days) {
  if (days === null || days === undefined) return "";
  return days === 0 ? "posted today" : `posted ${days}d ago`;
}

// "just now", "12 min ago", "2 h ago", "3 days ago", from an ISO time.
function ago(iso) {
  const min = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${Math.round(min)} min ago`;
  if (min < 48 * 60) return `${Math.round(min / 60)} h ago`;
  return `${Math.round(min / 1440)} days ago`;
}

// "8 AM", "2:30 PM": the time of day of an ISO time, on the hour without the minutes.
function clock(iso) {
  const t = new Date(iso);
  return t.toLocaleTimeString(undefined, { hour: "numeric", ...(t.getMinutes() ? { minute: "2-digit" } : {}) });
}
// "a", "a and b", "a, b and c".
function listed(items) { return items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} and ${items.at(-1)}`; }

// A job whose board's hosted job pages are offline: where to apply instead (the server's link_note).

function people(list, most = 3) {

    (p.why ? ` — ${p.why}` : ""));

// Whom to ask for a referral, or not to: use/skip/clear, with a few words about the person (the Referrals tab, and

// Who you know there, people you chose to ask first and then the strongest ties, and a way to find an introduction

// One contact: name (position) — why, the note you gave them, and "Don't use" to stop suggesting them. `tag` is the

function fitClass(score) { return score >= 75 ? "hi" : score >= 50 ? "mid" : "lo"; }

function scorerLabel(by) {

// key: the job's, for its Rescore button and so a new score from /events can take this one's place

// Rescore: a small button on the ring opens a dialog of the models the score can be made again with (the scoring
// chain first). The job is scored in the background; its new score arrives on /events and takes the ring's place.
const RESCORING = new Set();  // jobs being scored again: their ring spins until the event comes
function rescoreButton(key) {
  const b = h("button", { type: "button", class: "rescore-btn", title: "Score again with a model you pick",
    "aria-label": "Score again" }, icon("refresh", 12));
  b.onclick = e => { e.stopPropagation(); openRescore(key); };
  return b;
}
async function openRescore(key) {
  const shade = h("div", { class: "overlay rescore-shade", style: "display:flex" });
  const box = h("div", { class: "dialog rescore-dialog", role: "dialog", "aria-modal": "true",
    "aria-label": "Score again" }, h("p", { class: "muted" }, "Loading the models…"));
  const close = () => { shade.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  shade.onclick = e => { if (e.target === shade) close(); };
  document.addEventListener("keydown", esc);
  shade.append(box);
  document.body.append(shade);
  let d;
  try { d = await api(`/api/rescore?key=${encodeURIComponent(key)}`); }
  catch (e) { fill(box, h("p", { class: "small error" }, e.message)); return; }
  const where = { claude: "API", agy: "agy", local: "local" };
  let picked = d.choices.find(c => c.ready && `${c.backend}:${c.model}` !== d.scored_by) || d.choices.find(c => c.ready);
  const list = h("div", { class: "rescore-list", role: "radiogroup", "aria-label": "Model" });
  const draw = () => fill(list, d.choices.map(c => {
    const on = picked === c, now = `${c.backend}:${c.model}` === d.scored_by;
    const row = h("button", { type: "button", class: "rescore-pick" + (on ? " on" : ""), role: "radio",
      "aria-checked": String(on), disabled: !c.ready, title: c.ready ? c.model : `${c.backend} isn't set up here` },
      h("span", { class: "dot" }),
      h("span", { class: "who" }, h("b", {}, shortModel(c.model)), h("span", { class: "muted small" }, ` · ${where[c.backend]}`)),
      h("span", { class: "tags" },
        c.role ? h("span", { class: "chip" }, c.role) : null,
        now ? h("span", { class: "chip on" }, "scored this") : null,
        h("span", { class: "cost " + c.backend }, c.cost)));
    row.onclick = () => { picked = c; draw(); };
    return row;
  }));
  draw();
  const go = h("button", { class: "btn primary", type: "button" }, icon("refresh", 13), "Score again");
  const msg = h("span", { class: "small muted", role: "status" });
  go.disabled = d.running || !picked;
  if (d.running) msg.textContent = "Already being scored again.";
  go.onclick = async () => {
    go.disabled = true; msg.className = "small muted"; msg.textContent = "Starting…";
    try {
      await api("/api/rescore", { key, backend: picked.backend, model: picked.model });
      RESCORING.add(key);
      document.querySelectorAll(`[data-fit="${CSS.escape(key)}"]`).forEach(el => el.classList.add("rescoring"));
      close();
      toast(`Scoring again with ${shortModel(picked.model)} (${where[picked.backend]}): the score updates when it's done`);
    } catch (e) { msg.className = "small error"; msg.textContent = e.message; go.disabled = false; }
  };

    h("div", { class: "row", style: "align-items:center" }, h("h2", { style: "flex:1;margin:0" }, "Score again"),
      h("button", { class: "btn ghost", type: "button", "aria-label": "Close", onclick: close }, icon("x", 14))),
    h("p", { class: "small muted" }, d.scored_by ? `Scored now by ${scorerLabel(d.scored_by)}${d.stale ? " (an older scorer)" : ""}. ` +
      "Pick the model to score it again with; the new score replaces it." : "Pick the model to score it with."),
    list,
    h("div", { class: "row", style: "margin-top:14px;align-items:center" }, go, msg));
}
// /events: a rescore's new score (or why it failed) takes the place of the job's rings on the page
function listenForEvents() {
  if (typeof EventSource === "undefined") return;
  const es = new EventSource(`/events?t=${encodeURIComponent(TOKEN)}`);
  es.addEventListener("score", e => {
    const d = JSON.parse(e.data);
    RESCORING.delete(d.key);
    for (const k of d.keys || [d.key])
      document.querySelectorAll(`[data-fit="${CSS.escape(k)}"]`).forEach(el => el.replaceWith(fitBox(d.fit, k)));
    toast(`New score: ${Math.round(d.fit.score)} by ${scorerLabel(d.fit.scored_by || "")}`, null, "win");
  });
  es.addEventListener("score-failed", e => {
    const d = JSON.parse(e.data);
    RESCORING.delete(d.key);
    document.querySelectorAll(`[data-fit="${CSS.escape(d.key)}"]`).forEach(el => el.classList.remove("rescoring"));
    toast(`Scoring again failed: ${d.error}`);
  });
}
// Under the ring: the model that made the score and where it ran ("Sonnet 5.5 · agy", "Qwen3.5-9B · local"). A score
// is never made again on its own, a fallback's included: `jobwatch score --rescore` does that when asked.
function scorerTag(fit) {
  if (!fit.scored_by) return null;
  const [backend, ...rest] = fit.scored_by.split(":"), model = rest.join(":");
  const where = backend === "claude" ? "API" : backend;
  return h("span", { class: "scorer" + (backend === "claude" ? "" : " local") },
    model ? `${shortModel(model)} · ${where}` : backend === "claude" ? "Claude API" : backend);
}
// A model id as people say it: claude-sonnet-5-5-medium is "Sonnet 5.5", gemini-3.8-flash-medium "Gemini 3.8 Flash",
// mlx-community/Qwen3.5-9B-MLX-4bit "Qwen3.5-9B"; anything else as it is.
function shortModel(model) {
  const m = model.split("/").pop(), cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  let x;
  if ((x = m.match(/^claude-(opus|sonnet|haiku|fable)-(\d+)(?:-(\d{1,2}))?(?!\d)/))) return `${cap(x[1])} ${x[2]}${x[3] ? "." + x[3] : ""}`;
  if ((x = m.match(/^gemini-([\d.]+)-([a-z]+)/))) return `Gemini ${x[1]} ${cap(x[2])}`;
  return m.replace(/-MLX.*$/i, "");
}

// Queue it or skip it, and why (advice.py). A queued job only shows a reason to hold off.
// A job card's Why row: the reasons for and against, ticked or crossed; the card's bottom line (verdictLine) makes
// the call.
function adviceLine(job) {
  const a = job.advice;
  if (!a || (job.status === "queued" && a.action === "queue")) return null;
  const why = a.reasons.join("; ") + (a.though.length ? ` (though ${a.though[0]})` : "");
  return h("div", { class: `advice ${a.action}`, "data-advice": job.key }, icon(a.action === "queue" ? "check" : "x", 14),
    h("span", { class: "atext", title: why }, why.charAt(0).toUpperCase() + why.slice(1)));
}
// In a job's details, where the ring would be: why there's no score yet (no posting text, still in line, ...).
function noFitBox(job) {
  const why = job.unscored?.code === "no_text" ? "no posting text" : "not scored yet";
  return h("div", { class: "fitbox", title: job.unscored?.text || "Not scored yet" },
    h("div", { class: "ring", style: "--p:0" }, h("span", {}, "–")), h("small", {}, why));
}

// `bare` is the gap sentence alone, for a job card's Gaps row (the row says what it is; click opens it past two lines).
function gapsLine(fit, bare = false) {
  if (!fit || !fit.gaps || !fit.gaps.length) return null;
  const el = h("div", { class: "gaps", title: bare ? fit.gaps.join(" · ") : "Click to see every gap" },

// Each requirement the fit score judged: its verdict and the resume's words behind it.
const VERDICT = { met: "met", partial: "partly", not_met: "missing" };
function whyScore(fit) {
  if (!fit || !fit.requirements || !fit.requirements.length) return null;
  return h("details", { class: "whyfit" }, h("summary", {}, "Why this score"),
    h("ul", {}, fit.requirements.map(r => h("li", {},
      h("span", { class: `v ${r.verdict}` }, VERDICT[r.verdict] || r.verdict),
      r.requirement, r.kind === "must_have" ? h("span", { class: "muted small" }, " · must-have") : null,
      (r.evidence || []).slice(0, 2).map(q => h("q", {}, q))))));
}

// A job's pay, one small chip per source in a fixed order (Posted, Levels, LCA, Recruiter, Glassdoor, Ask; see
// paysources.py). A source with nothing is a dimmed chip and its reason shows on hover, so a blank is never a mystery.
function paySources(job) {
  const items = job.pay_sources;
  if (!items) return job.pay ? h("span", { class: "paychip" }, job.pay) : null;
  return h("div", { class: "psrcs", "data-pay": job.key }, items.map(s => s.value
    ? h("span", { class: `psrc psrc-${s.key}`, title: s.detail || s.value }, h("b", {}, s.label), s.short || s.value)
    : h("span", { class: "psrc psrc-none", title: s.reason }, h("b", {}, s.label), s.blank)));
}

// How the Levels.fyi and H-1B (U.S. DOL LCA, base only, not total compensation) figures were worked out, with
// their credit, folded away under the chips in a job's details.
function payWhy(job) {
  const p = job.expected_pay && !job.expected_pay.pending && !job.expected_pay.refused ? job.expected_pay : null;
  const l = job.lca_pay;
  if (!p && !l) return h("span", { "data-paywhy": job.key });
  return h("details", { class: "whyfit", "data-paywhy": job.key }, h("summary", {}, "How the pay was worked out"),
    h("ul", {},
      p ? [p.why.map(w => h("li", {}, w)), h("li", {}, link(p.url, p.credit + " ↗"))] : null,
      l ? [h("li", {}, h("b", {}, l.line)), l.why.map(w => h("li", {}, w)),
        h("li", {}, l.label + ". ", link(l.url, l.credit + " ↗"))] : null));
}

// Fills in expected pay that's still being looked up in the background, until none is left. One poll per
// `scope`, so the Details dialog doesn't stop the page's.
const payTimers = {};
function watchPay(jobs, scope = "page") {
  clearTimeout(payTimers[scope]);
  let tries = 0;
  const poll = async () => {
    const waiting = jobs.filter(j => j.expected_pay && j.expected_pay.pending);
    if (!waiting.length || ++tries > 60) return;
    try {
      const r = await api("/api/pay", { keys: waiting.map(j => j.key) });
      for (const j of waiting) {
        if (!(j.key in r.pay) || (r.pay[j.key] && r.pay[j.key].pending)) continue;
        j.expected_pay = r.pay[j.key];
        if (r.sources && r.sources[j.key]) j.pay_sources = r.sources[j.key];
        document.querySelectorAll(`[data-pay="${CSS.escape(j.key)}"]`).forEach(el => el.replaceWith(paySources(j)));
        document.querySelectorAll(`[data-paywhy="${CSS.escape(j.key)}"]`).forEach(el => el.replaceWith(payWhy(j)));
        // the advice and the bottom line again, now that the pay is known (a job applied to is past advice)
        if (r.advice && j.key in r.advice && !APPLIED.includes(j.status)) {
          Object.assign(j, r.advice[j.key]);
          document.querySelectorAll(`[data-advice="${CSS.escape(j.key)}"]`).forEach(el =>
            el.replaceWith(adviceLine(j) || noAdvice(j)));
          document.querySelectorAll(`[data-verdict="${CSS.escape(j.key)}"]`).forEach(el => el.replaceWith(verdictLine(j)));
        }
      }
      if (r.running) payTimers[scope] = setTimeout(poll, 5000);
    } catch { /* the page may be restarting: the next render tries again */ }
  };
  payTimers[scope] = setTimeout(poll, 3000);
}

// One short place for the meta line: the first, "+N more" after it, the whole list on hover.
function placeSummary(locations) {

}
function placeItem(locations) {

    p.more ? h("span", { class: "more" }, `+${p.more} more`) : null) : null;

// The labeled rows of a job card, always in this order, each with its icon. The first five are on every card (a dash
// when there's nothing), so each sits in the same place; Check and Note come last, only when there is one.
const CARD_ROWS = [["pay", "Pay", "dollar"], ["why", "Why", "bulb"], ["gaps", "Gaps", "target"],
  ["skills", "Skills", "zap"], ["people", "People", "users"], ["check", "Check", "alert", true], ["note", "Note", "pencil", true]];
const hasKids = c => [c].flat(Infinity).some(k => k !== null && k !== undefined && k !== false);
const none = () => h("span", { class: "kv-none" }, "—");
function cardRows(parts) {
  return CARD_ROWS.filter(([key, , , optional]) => !optional || hasKids(parts[key])).map(([key, label, ic]) =>
    h("div", { class: "krow", "data-row": key }, h("div", { class: "klabel" }, icon(ic, 13), label),
      h("div", { class: "kv" }, hasKids(parts[key]) ? parts[key] : none())));
