// Every application as one row: sort by a column's header, change a stage in place, open the details.
const APP_COLUMNS = [
  ["company", "Company"], ["title", "Role"], ["status", "Stage"], ["applied_at", "Applied"],
  ["next", "Next step"], [null, "Sent", "col-sent"], [null, ""]];

// The table's order: the column picked (appView.sort), either way (appView.dir).
function sortApps(apps, d) {
  const byNext = a => [freshDue(a) ? 0 : isEndedStatus(a.status) ? 2 : 1, a.follow_up || "9999", a.applied_at ? -Date.parse(a.applied_at) : 0];
  const key = {
    company: a => [a.company.toLowerCase()], title: a => [a.title.toLowerCase()],
    status: a => [d.stages.indexOf(a.status)], applied_at: a => [a.applied_at || ""], next: byNext }[appView.sort];
  const cmp = (x, y) => { for (let n = 0; n < x.length; n++) if (x[n] !== y[n]) return x[n] < y[n] ? -1 : 1; return 0; };
  return [...apps].sort((a, b) => cmp(key(a), key(b)) * appView.dir);
}

function appTable(rows, d, redraw) {
  const head = h("tr", {}, APP_COLUMNS.map(([k, label, cls]) => k
    ? h("th", { "aria-sort": appView.sort === k ? (appView.dir > 0 ? "ascending" : "descending") : null },
      h("button", { class: "sort" + (appView.sort === k ? " on" : ""), onclick: () => {
        appView.dir = appView.sort === k ? -appView.dir : 1; appView.sort = k; redraw(); } },
        label, h("span", { class: "arrow" }, appView.sort === k ? (appView.dir > 0 ? "↑" : "↓") : "")))

  return h("div", { class: "table-wrap" }, h("table", { class: "apps" },

function isEndedStatus(s) { return s === "rejected" || s === "withdrawn"; }

// A stage picked on a card or a table row: save it, cheer the good news, offer an undo.
async function changeStage(a, d, stage) {
  const before = a.status;
  try {
    const to = stage.value;
    await api("/api/track", { key: a.key, status: to });
    const forward = d.stages.indexOf(to) > d.stages.indexOf(before) && !isEndedStatus(to);
    toast(stageWords(a.company, to), async () => { await api("/api/track", { key: a.key, status: before }); render(); },
      TONES[to]);
    if (to === "offer") { confetti(null, { count: 220, power: 1.4 }); setTimeout(() => confetti(stage, { count: 80 }), 350); }
    else if (forward) confetti(stage, { count: 70, power: .8 });
    render();
  } catch (e) { toast(e.message); stage.value = before; }
}

function stageSelect(value, stages) {
  const sel = h("select", {}, stages.map(s => h("option", { value: s }, STAGE_NAMES[s])));
  sel.value = value;
  return sel;
}

function nextLine(a, today) {
  if (!a.next_step && !a.follow_up) return null;
  const n = a.follow_up ? dayDiff(a.follow_up, today) : null;
  const urgency = n === null ? "" : n < 0 ? "late" : n === 0 ? "now" : n <= 3 ? "soon" : "";
  return h("div", { class: "next " + urgency },
    h("span", { class: "what" }, a.next_step || "Follow up"),
    a.follow_up ? h("span", { class: "when-chip" }, icon("calendar", 12), `${fmtDay(a.follow_up, today)} · ${relDay(a.follow_up, today)}`) : null);
}

// Under a quiet application: how long, what to do next (never done for you), and one-click ways to do it.
function quietBar(a, d) {
  const q = a.quiet, bar = h("div", { class: "quiet-bar" });

    try {
      await api("/api/track", { key: a.key, status });

        TONES[status]);
      render();
    } catch (e) { toast(e.message); }
  };
  const snooze = async () => {
    try {
      const r = await api("/api/snooze", { key: a.key, days: 7 });
      toast(`${a.company}: follow up ${fmtDay(r.follow_up, d.today)}. A little patience goes a long way.`,
        async () => { await api("/api/track", { key: a.key, follow_up: a.follow_up || "" }); render(); });
      render();
    } catch (e) { toast(e.message); }

  const view = () => fill(bar,
    h("div", {}, h("b", {}, `Quiet ${q.days} days`), h("span", { class: "why" },

    h("div", { class: "acts" },

      h("button", { class: "btn ghost", onclick: end("withdrawn") }, "Mark withdrawn"),
      h("button", { class: "btn ghost", onclick: end("rejected") }, "Mark rejected"),
      h("button", { class: "btn ghost", onclick: add }, "Add note")));

      try { await api("/api/track", { key: a.key, add_note: text.value }); render(); } catch (e) { toast(e.message); }
    };

// A job found somewhere else. A link to one job on a board jobwatch reads fills in the rest; for anything else
// (LinkedIn, a company's own site) give the company and title, and paste the posting so it can be scored.
// d: the Applications data (stages, today), or null to add a job to the queue, to consider.
function addForm(d) {
  const queued = !d;

        status: queued ? "queued" : stage.value, ...(f ? f.values() : {}) });

      stage ? h("div", {}, h("label", {}, "Stage"), stage) : null),

    f ? f.el : null,

// -- settings

function lines(v) { return (v || []).join("\n"); }
// One per line, or comma-separated; a comma inside brackets or after a backslash is a pattern's own (`{0,40}`, `[,;]`).
function unlines(v) {
  const out = [];
  for (const line of v.split("\n")) {
    let depth = 0, from = 0;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === "\\") i++;
      else if ("([{".includes(c)) depth++;
      else if (")]}".includes(c)) depth = Math.max(0, depth - 1);
      else if (c === "," && !depth) { out.push(line.slice(from, i)); from = i + 1; }
    }
    out.push(line.slice(from));
  }
  return out.map(s => s.trim()).filter(Boolean);
}
// Places and company names, one per line: "Boulder, CO" is one place, "Initech, Inc." one company.
function placeLines(v) { return v.split("\n").map(s => s.trim()).filter(Boolean); }

// A setting in Settings: a short label, its input, and a line of help under it (so inputs side by side line up).
function field(label, input, help, cls) {
  const f = h("div", { class: "field" + (cls ? " " + cls : "") + (help ? " has-help" : "") }, h("label", {}, label,
    help ? h("span", { class: "qm", role: "button", tabindex: "0", title: help, "aria-label": "Help",
      onclick: e => { e.preventDefault(); f.classList.toggle("open"); e.currentTarget.classList.toggle("on"); },
      onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.currentTarget.click(); } } }, "?") : null),
    input, help ? h("div", { class: "help" }, help) : null);
  return f;
}
// Inputs for settings that may be left blank: blank is the default, shown as the placeholder.
function numInput(value, placeholder, { min = 0, max, step = 1 } = {}) {
  const i = h("input", { type: "number", min, max, step, placeholder: placeholder ?? "" });
  i.value = value ?? "";
  return i;
}
function textInput(value, placeholder) {
  const i = h("input", { type: "text", placeholder: placeholder ?? "" });
  i.value = value ?? "";
  return i;
}
function areaInput(list, placeholder) {
  const t = h("textarea", { placeholder: placeholder ?? "" });
  t.value = lines(list);
  return t;
}
function choice(options, value) {
  const s = h("select", {}, options.map(([v, label]) => h("option", { value: v }, label)));
  s.value = value ?? "";
  return s;
}
function checkLine(on, text) {
  const box = h("input", { type: "checkbox" });
  box.checked = !!on;
  return { box, el: h("label", { class: "check" }, box, h("span", {}, text)) };
}
function numberOf(i) { return i.value.trim() === "" ? null : Number(i.value); }
function textOf(i) { return i.value.trim() || null; }
// A watchlist section as saved, with these settings set; one left blank (null) is left out, for its default.
// Settings in it that the page doesn't edit are kept. null when nothing's left.
function merged(base, values) {
  const out = { ...(base || {}) };
  for (const [k, v] of Object.entries(values)) {
    if (v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)) delete out[k];
    else out[k] = v;
  }
  return Object.keys(out).length ? out : null;
}
// A Settings card, with an id for the bar's links to it
// Each card has an icon, a hue shift for its tile, and a one-line subtitle (used when the card gives no hint).
const SET_LOOK = {
  goals: ["sparkle", 0, "What you want next"], companies: ["cloud", -30, "The job boards jobwatch checks"],
  filters: ["check", 25, "A job must pass these to show"], keywords: ["pencil", 50, "Words that rank a job higher"],
  today: ["calendar", -50, "How much Today shows and your pace"], resume: ["file", 15, "Your resume and fit scores"],
  people: ["users", 40, "Who you know at companies"], usage: ["dollar", 35, "Which backend scores, and what it cost"],
  prompts: ["pencil", -20, "What the model is told"],
  chat: ["send", 30, "Ask jobwatch"], pay: ["dollar", -60, "Expected pay"], alerts: ["inbox", 10, "Job-alert emails"],
  suggestions: ["plus", -10, "Companies worth watching"], skills: ["arrow", 55, "What to learn next"],
  display: ["refresh", -40, "Theme, width and files"],
  applicant: ["users", 70, "Your details for application forms"],
  extension: ["send", -70, "Fill application forms from jobwatch"],
};
// A card's header: an icon orb, the title (plus anything in extra), and a one-line subtitle.
function setHead(id, title, hint, extra) {
  const [ic, hue, dflt] = SET_LOOK[id] || ["sparkle", 0, ""];
  return h("div", { class: "set-head" }, h("div", { class: "set-orb", style: `--hue:${hue}deg` }, icon(ic, 19)),
    h("div", { class: "t" }, h("h3", {}, title, extra || null), h("p", { class: "set-sub" }, hint || dflt)));
}
function setCard(id, title, hint, ...kids) {
  return h("div", { class: "card", id: "set-" + id }, setHead(id, title, hint), kids);
}

function uploadField(kind, accept, current, help) {
  const input = h("input", { type: "file", accept });
  const status = h("span", { class: "muted small" }, current ? `Using ${current}` : "Not set");
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    status.textContent = "Uploading…";
    try {
      const r = await api(`/api/upload?kind=${kind}&name=${encodeURIComponent(file.name)}`, undefined, file);
      settings[kind] = r[kind];
      status.textContent = `Saved as ${r[kind]}` + (r.people !== undefined ? ` (${r.people} people` +
        (r.known !== undefined ? `, ${r.known} you've been in touch with` : "") + ")" : "");
    } catch (e) { status.textContent = e.message; status.className = "error small"; }
  };
  return h("div", {}, h("div", { class: "row upload" }, input, status),
    h("details", { class: "howto" }, h("summary", {}, "How does this work?"), h("div", { class: "help" }, help)));
}

// Looking up a company's board by name or job link (/api/find), with an Add button on each board found. has(hit):
// already added; add(hit, typed): add it (may be async; if it throws, the error shows in place of the button).
// {input, button, out} for the caller to lay out.
function companyFinder(has, add) {
  const input = h("input", { type: "text", placeholder: "Company name, or paste a link to one of their jobs" });
  const out = h("div", {});
  const button = h("button", { class: "btn" }, "Find");
  const find = async () => {
    button.disabled = true; out.replaceChildren(h("div", { class: "muted small" }, "Looking…"));
    try {
      const hits = await api("/api/find", { company: input.value });
      out.replaceChildren(...(hits.length ? hits.map(hit => h("div", { class: "list-item" },
        h("div", { style: "flex:1" },
          h("div", {}, h("b", {}, hit.name || hit.board), ` · ${hit.open_roles} open jobs · `, link(hit.careers, "careers page")),
          h("div", { class: "muted small" }, "e.g. " + hit.sample_titles.slice(0, 3).join(" · "))),
        has(hit) ? h("span", { class: "muted small" }, "added")
          : h("button", { class: "btn primary", onclick: async e => {
              const b = e.target;
              b.disabled = true;
              try { await add(hit, input.value.trim()); b.replaceWith(h("span", { class: "muted small" }, "added")); }
              catch (err) { b.disabled = false; b.replaceWith(h("span", { class: "error small" }, err.message)); }
            } }, "Add")))
        : [h("div", { class: "muted small" }, "No Greenhouse, Lever, Ashby, Workday, Eightfold, Rippling, SmartRecruiters, Avature, iCIMS or Jobvite board found. Try a link to their " +
            "careers page or one of their job postings. Some companies use other systems that jobwatch can't read yet.")]));
    } catch (e) { out.replaceChildren(h("div", { class: "error small" }, e.message)); }
    button.disabled = false;
  };
  button.onclick = find;
  input.addEventListener("keydown", e => { if (e.key === "Enter") find(); });
  return { input, button, out };
}

// -- goals: what you want next (goals), your pay target and the Comps weights. Settings' first card and the first
// steps of onboarding share these.

const GOAL_KINDS = [["tech", "A tech company"], ["consulting", "A consultancy"], ["enterprise", "A large enterprise"]];
const GOAL_ROLES = [["product", "Building the product"], ["customer", "Working with customers"], ["internal", "Building internal tools"]];
const GOAL_STAGES = [["startup", "A startup (seed to Series B)"], ["growth", "Growth stage (Series C and later)"], ["public", "A large or public company"]];
const CHOICES = ["1st", "2nd", "3rd", "4th"];

// A few choices in order of preference, best first, or "I don't mind". value() is the list as the watchlist keeps it
// (["any"] for no preference, [] for none said).
function rankPicker(options, saved) {
  const any = checkLine(saved.length === 1 && saved[0] === "any", "I don't mind");
  const picks = options.map((_, n) => choice([["", "—"], ...options], saved[n] && saved[n] !== "any" ? saved[n] : ""));
  const sync = () => picks.forEach(p => { p.disabled = any.box.checked; });
  any.box.addEventListener("change", sync);
  sync();
  return {
    el: h("div", {}, h("div", { class: "fields" }, picks.map((p, n) => field(`${CHOICES[n]} choice`, p))), any.el),
    value: () => any.box.checked ? ["any"] : [...new Set(picks.map(p => p.value).filter(Boolean))],
  };
}

// The pay target as written ("180000" or "170000-200000"), and back: {target, target_max} for the watchlist.
function targetText(p) { return p.target_max ? `${p.target}-${p.target_max}` : String(p.target ?? ""); }
function targetValues(text) {
  const t = text.trim();
  return { target: t === "" ? null : /^\d+$/.test(t) ? Number(t) : t, target_max: null };
}

// "Tell me about yourself" and the questions after it. values() is `goals` as the watchlist keeps it (null when
// nothing is said); what the page doesn't edit is kept.
function goalsForm(s) {
  const g = s.goals || {};
  const about = h("textarea", { rows: 5, placeholder: "e.g. Staff engineer, ten years in security tooling. I want to build a product again, " +
    "and I'd rather join a company that sells software than one that uses it." });
  about.value = g.about || "";
  const kinds = rankPicker(GOAL_KINDS, g.company_kinds || []), roles = rankPicker(GOAL_ROLES, g.roles || []);
  const stages = rankPicker(GOAL_STAGES, g.stages || []);
  let track = g.track || "either";
  const trackCtl = segmented([["ic", "Individual contributor"], ["manager", "Manager"], ["either", "Either"]], track, v => {
    track = v;
    trackCtl.dispatchEvent(new Event("change", { bubbles: true }));  // Settings marks it unsaved

// The five parts of the Comps suggestion as sliders, each showing its share of the whole. values() is
// comps.weights (null while they are all the defaults).
const COMP_PARTS = { career: ["Career value", "What the company and role are worth to you (from your goals)."],
  pay: ["Pay", "Against your target."], fit: ["Fit score", "How well your resume matches."],
  progress: ["How far along", "Further along the process counts more."], health: ["Company health", "Funding, layoffs, ratings."] };
function weightSliders(s) {
  const dflt = s.defaults.comps.weights, saved = (s.comps || {}).weights || {};
  const raw = Object.fromEntries(Object.keys(dflt).map(k => [k, saved[k] ?? dflt[k]]));
  const sum = Object.values(raw).reduce((a, b) => a + b, 0) || 1;
  const rows = Object.keys(dflt).map(k => {
    const input = h("input", { type: "range", min: 0, max: 100, step: 1, "aria-label": COMP_PARTS[k][0] });
    input.value = Math.round(raw[k] / sum * 100);
    return { k, input, out: h("output", {}) };
  });
  const show = () => {
    const total = rows.reduce((a, r) => a + Number(r.input.value), 0);
    for (const r of rows) r.out.textContent = total ? `${Math.round(Number(r.input.value) / total * 100)}%` : "0%";
  };
  for (const r of rows) r.input.addEventListener("input", show);
  show();
  return {
    el: h("div", { class: "fields" }, rows.map(r => field(COMP_PARTS[r.k][0], h("div", { class: "fitrange" }, r.input, r.out),
      COMP_PARTS[r.k][1]))),
    values: () => {
      const given = Object.fromEntries(rows.map(r => [r.k, Number(r.input.value)]));
      if (!Object.values(given).some(Boolean)) throw new Error("The Comps weights can't all be 0: the suggestion would weigh nothing.");
      const isDefault = !Object.keys(saved).length && rows.every(r => given[r.k] === Math.round(dflt[r.k] * 100));
      return isDefault ? null : given;
    },
  };
}

// Onboarding's plain-words way to set the Comps weights: what matters most in a company, best first. 1st 35, 2nd 25,
// 3rd 20, 4th 10, how far along 10; parts left out share what's left. "I don't mind" or nothing picked keeps the
// defaults (null). Settings' sliders fine-tune the same weights.
const MATTERS = [["pay", "Pay"], ["career", "What it adds to my career"], ["health", "A stable, healthy company"],
  ["fit", "A job that fits what I've done"]];
const MATTER_SHARE = [35, 25, 20, 10];
function mattersWeights(order) {
  if (!order.length || order[0] === "any") return null;
  const left = MATTERS.map(([k]) => k).filter(k => !order.includes(k));
  const spare = MATTER_SHARE.slice(order.length).reduce((a, b) => a + b, 0);
  return { progress: 10, ...Object.fromEntries(order.map((k, n) => [k, MATTER_SHARE[n]])),
    ...Object.fromEntries(left.map(k => [k, Math.round(spare / left.length)])) };
}
// The saved weights as that order (heaviest first), or [] while they are the defaults.
function mattersOrder(s) {
  const saved = (s.comps || {}).weights || {};
  if (!Object.keys(saved).length) return [];
  return MATTERS.map(([k]) => k).sort((a, b) => (saved[b] ?? 0) - (saved[a] ?? 0));
}
function mattersField(s) {
  const pick = rankPicker(MATTERS, mattersOrder(s));
  return {
    el: h("div", { class: "field" }, h("label", {}, "What matters most to you in a company?"),
      h("div", { class: "help" }, "Best first. The Comps tab weighs jobs by it; Settings fine-tunes the weights. " +
        "Anything else (remote, mission, team size)? Say it in Tell me about yourself."), pick.el),
    weights: () => mattersWeights(pick.value()),
  };
}

// One prompt in a fold, closed until opened: its text to edit, "edited" while it isn't the default, "Reset to
// default", and the placeholders it must keep. p: {name, about, text, default, placeholders}. {fold, text, changed}.
function promptFold(p, editable = true) {
  const text = h("textarea", { spellcheck: "false", readonly: !editable, "aria-label": p.name,
    rows: Math.min(20, p.text.split("\n").length + 1) });
  text.value = p.text;
  const mark = h("span", { class: "chip hit" }, "edited");
  const reset = h("button", { class: "btn", onclick: () => { text.value = p.default; sync(); } }, "Reset to default");
  const changed = () => text.value.trim() !== p.default.trim();
  const sync = () => { mark.style.display = changed() ? "" : "none"; reset.disabled = !changed(); };
  text.addEventListener("input", sync);
  sync();
  const keep = p.placeholders.length ? h("span", { class: "hint" }, "Keep ",
    p.placeholders.map((x, i) => [i ? ", " : "", h("code", {}, `{${x}}`)]), ": the data goes there.") : h("span");
  const fold = h("details", { class: "prompt" },
    h("summary", {}, h("code", {}, p.name), mark, h("span", { class: "hint" }, p.about)),
    text, editable ? h("div", { class: "row" }, keep, reset) : null);
  return { text, changed, fold };
}

// The browser extension's token: pasted into the extension once, it lets the extension ask jobwatch for your
// details, past answers and resume, and record an application when you submit it.
// -- fit scoring: the backend in effect and what it has cost (from /api/scoring/usage, see scorestats.py)
const USD = n => n > 0 && n < 0.01 ? "under $0.01" : "$" + Number(n || 0).toFixed(2);
// The Claude cost this month as {main, notes}: recorded dollars (tokens kept from the API replies) plus an
// estimate for scores made before tokens were recorded; "not recorded" when there's nothing to average from.
function claudeCostText(c) {
  const notes = [];
  const scores = (n, what = "score") => `${n} ${what}${n === 1 ? "" : "s"}`;
  if (c.recorded_jobs) notes.push(`${USD(c.recorded_usd)} recorded for ${scores(c.recorded_jobs)}`);
  if (c.estimated_jobs) notes.push(`${USD(c.estimated_usd)} estimated for ${scores(c.estimated_jobs, "earlier score")}, at ${USD(c.average_usd)} each`);
  if (c.not_recorded_jobs) notes.push(`${scores(c.not_recorded_jobs)} made before tokens were recorded: cost not recorded`);
  if (c.unpriced && c.unpriced.length) notes.push(`no price known for ${c.unpriced.join(", ")}`);
  const main = !c.recorded_jobs && !c.estimated_jobs && !c.not_recorded_jobs ? "$0.00"
    : !c.recorded_jobs && !c.estimated_jobs ? "not recorded"
    : USD(c.total_usd) + (c.estimated_jobs ? " (partly estimated)" : "");
  return { main, notes };
}

    document.getElementById("ivcount").replaceChildren(iv ? h("span", { class: "count", title: "interviews today" }, iv) : "");

// -- notices: what's worth a look (a new strong fit for a job Today shows, the mailbox couldn't be read, no board
// could be read, scoring stopped; the server marks them notable: see watch.news). The page asks every minute, on any tab: one that comes in
// while it's open shows as a toast, and the ones not seen yet as a count on the Activity tab and in the browser
// tab's title. Opening Activity marks them seen. "Seen" is the newest one's time, kept per browser; the first
// time on a browser, what came before counts as seen (it's all on the tab).
const notices = { newest: null, timer: null, list: null };
async function watchNotices() {
  clearTimeout(notices.timer);
  try {
    if (settings && settings.exists) {
      const seen = remembered("activity.seen", "");
      const d = await api("/api/activity?notable=1&limit=50&since=" + encodeURIComponent(seen || "0"));
      if (!seen) remember("activity.seen", d.events[0]?.at || "0");
      const unseen = !seen || tab === "activity" ? [] : d.events;
      const fresh = notices.newest === null ? [] : unseen.filter(e => e.at > notices.newest);
      notices.newest = d.events[0]?.at ?? notices.newest ?? "0";
      notices.list = unseen.length ? actListFor(unseen[0].kind) : null;
      showNoticeCount(unseen.length);
      if (fresh.length) toast(fresh.length === 1 ? `Worth a look: ${fresh[0].text}` : `${fresh.length} things worth a look`,
        () => go("activity"), "win", "Show");
    }
  } catch { /* the page may be restarting: try again next minute */ }
  notices.timer = setTimeout(watchNotices, 60000);
}
function showNoticeCount(n) {
  document.getElementById("actcount").replaceChildren(n ? h("span", { class: "count", title: "worth a look" }, n) : "");
  document.title = n ? `(${n}) jobwatch` : "jobwatch";
}

function companyBlurb(c) {
  const n = (k, what) => c[k] ? `${c[k]} ${what}` : null;
  return [n("applications", c.applications === 1 ? "application" : "applications"), n("queued", "queued"), n("skipped", "skipped"),
    n("open", c.open === 1 ? "open role" : "open roles")].filter(Boolean).join(" · ") || "closed postings";
}

function elsewhere(q) {

      h("a", { href: "#", onclick: e => { e.preventDefault(); openCompany(hits[0].name); } }, "open →"),
      hits.length > 1 ? ` (and ${hits.length - 1} more compan${hits.length === 2 ? "y" : "ies"})` : null);

}
async function jumpFind() {
  const q = jump.value.trim(), seq = ++jumpSeq;
  if (q.length < 2) return jumpClose();
  try {
    const hits = await api("/api/companies?q=" + encodeURIComponent(q));
    if (seq !== jumpSeq) return;
    jumpHits = hits; jumpAt = hits.length ? 0 : -1; jumpDraw();
  } catch { jumpClose(); }
}
jump.addEventListener("input", () => { clearTimeout(jumpTimer); jumpTimer = setTimeout(jumpFind, 120); });
jump.addEventListener("focus", () => { if (jump.value.trim().length >= 2) jumpFind(); });
jump.addEventListener("blur", jumpClose);
jump.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!jumpHits.length) return;
    e.preventDefault();
    jumpAt = (jumpAt + (e.key === "ArrowDown" ? 1 : -1) + jumpHits.length) % jumpHits.length; jumpDraw();
  } else if (e.key === "Enter" && jump.value.trim() && !e.isComposing) {
    e.preventDefault();
    openCompany(jumpHits[jumpAt]?.name || jump.value.trim());
  } else if (e.key === "Escape") { jump.value = ""; jumpClose(); jump.blur(); }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey || t.closest?.("input, textarea, select, [contenteditable]") ||
    document.getElementById("overlay").style.display === "flex") return;
  e.preventDefault();
  if (tab === "company") { jump.focus(); jump.select(); return; }
  jumpNext = true;  // once the Company tab has drawn its box
  go("company");
});

// A company's job's status word. "New" means not acted on yet, so a role still open from long ago (all of a
// board's open roles arrive as new when it's first watched) says how old it is instead of looking fresh.
function companyStatus(j, today, maxAge) {
  const age = j.posted ? -dayDiff(j.posted.slice(0, 10), today) : null;
  if ((j.status === "new" || j.status === "shown") && age != null && age > (maxAge || 30))
    return [age >= 365 ? `Posted ${Math.floor(age / 365)}y+ ago` : `Posted ${Math.round(age / 30)}mo ago`,
      `Still open, but posted ${age} days ago: older than Today shows (${maxAge || 30} days), so it isn't new`];
  return [STAGE_NAMES[j.status] || j.status[0].toUpperCase() + j.status.slice(1),
    j.status === "new" ? "Not acted on yet" : null];
}
// The chip before a job's title on the company page: its status, unless it's simply open to act on.
function stageChip(j, today) {
  const [word, why] = companyStatus(j, today, (settings.filters || {}).max_age_days);
  if ((j.status === "new" || j.status === "shown") && word === (STAGE_NAMES[j.status] || j.status[0].toUpperCase() + j.status.slice(1))) return null;
  return h("span", { class: "chip stage-chip", title: why,
    style: `background:color-mix(in srgb, var(--s-${j.status}) 15%, transparent);color:var(--s-${j.status})` }, word);
}
// What only the company page says about a job: the day applied, what's next, what a snoozed job waits for.
function companyFacts(j, today) {
  const waiting = j.status === "snoozed" && (j.waiting_on || []).length;
  const lines = [
    j.applied_at ? `Applied ${fmtDay(j.applied_at, today)}` : null,
    j.closed ? `Posting closed ${fmtDay(j.closed, today)}` : null,
    waiting ? `Waiting on ${j.waiting_on.map(a => a.title).join(", ")}` + (j.follow_up ? `; back by ${fmtDay(j.follow_up, today)}` : "") : null,
    j.status !== "snoozed" && (j.next_step || j.follow_up) ? (j.due ? "Due: " : "Next: ") +
      [j.next_step, j.follow_up && `follow up ${fmtDay(j.follow_up, today)}`].filter(Boolean).join(" · ") : null,
    j.status === "queued" && j.note ? `Note: ${j.note}` : null,  // other statuses have the card's Note row
  ].filter(Boolean);
  return lines.length ? h("div", { class: "facts" }, lines.map(l => h("div", {}, l))) : null;
}
// A job card as on Today and the Queue, with the buttons its status calls for. Marking one keeps it on the page,
// now at its new status, with a way back; the counts above follow.
function companyCard(j, i, c) {
  const today = new Date().toISOString().slice(0, 10);
  const redraw = () => document.getElementById("job-" + j.key)?.replaceWith(companyCard(j, i, c));
  const move = async (to, note) => {
    const r = await api("/api/mark", { keys: [j.key], status: to, note });
    c.counts[j.status] = Math.max(0, (c.counts[j.status] || 0) - 1);
    c.counts[to] = (c.counts[to] || 0) + 1;
    j.status = to;
    j.follow_up = r.follow_up;
    refreshQueueCount();
    return r;
  };
  const act = async (status, label) => {
    const was = j.status, origin = document.activeElement;
    try {
      const r = await move(status);
      if (status === "applied") { confetti(origin); return render(); }  // other jobs here can be snoozed now
      redraw(); drawCompanyTiles();
      toast(r.warning ? `${label}. ${r.warning}` : label, async () => { await move(was); redraw(); drawCompanyTiles(); }, TONES[status]);
    } catch (e) { toast(e.message); }
  };
  const queueIt = (label = "Queue") => j.closed ? null : h("button", { class: "btn primary",
    onclick: () => act("queued", `📌 Queued: ${j.title}. ${pick(QUEUED)}`) }, label);
  const skipIt = () => h("button", { class: "btn", onclick: () => act("skipped", `Skipped: ${j.title}. ${pick(SKIPPED)}`) }, "Skip");
  const posting = () => link(j.url, "Posting ↗");
  const score = () => scoreButton(j, j.can_score, x => companyCard(x, i, c));
  const actions = APPLIED.includes(j.status) ? [detailsButton(j), posting(),
      j.has_package ? h("span", { class: "sent-chip", title: "What you sent is saved with this job" }, icon("clip", 13), "package saved") : null]
    : j.status === "queued" ? [applyButton(j, true), tailorButton(j),
      h("button", { class: "btn", onclick: () => act("applied") }, icon("check", 14), "I applied"),
      snoozeButton(j, act), skipIt(), detailsButton(j), score()]
    : j.status === "snoozed" ? [queueIt("Queue now"), applyButton(j, false), skipIt(), detailsButton(j), score()]
    : j.status === "skipped" ? [queueIt(), applyButton(j, false), detailsButton(j), score()]
    : [queueIt(), applyButton(j, false, () => act("queued", `📌 Queued and opened: ${j.title}. Submit it there.`)),
      snoozeButton(j, act), j.closed ? null : skipIt(), detailsButton(j), score()];
  return jobCard(j, actions, i, companyFacts(j, today), stageChip(j, today));
}

// Tiles across the top of a company's page: how many jobs at each status, jobs not acted on as one.
function companyTiles(c) {
  const open = (c.counts.new || 0) + (c.counts.shown || 0);
  const order = ["applied", "screening", "interviewing", "offer", "queued", "snoozed", "rejected", "withdrawn", "skipped"];
  const tiles = order.filter(s => c.counts[s]).map(s => [c.counts[s], s]);
  return hero([open ? [open, "open to act on", "lead"] : null, ...tiles].filter(Boolean));
}
const companyView = { q: remembered("company.q", ""), every: false, page: 1 };
let drawCompanyTiles = () => {};
function openCompany(q, every = false) {
  jump.value = ""; jumpClose(); jump.blur();
  document.getElementById("overlay").style.display = "none";
  Object.assign(companyView, { q, every, page: 1 });
  remember("company.q", q);
  tab = "company";
  history.replaceState(null, "", "#company/" + encodeURIComponent(q));
  render();
}
let jumpNext = false;  // `/` pressed on another tab: the box gets the keys once it's drawn
// Draws the page with the search box at its top, keeping the cursor in the box if it's there.
function putCompany(head, ...kids) {
  const typing = document.activeElement === jump || jumpNext;
  put(head, ...kids);
  if (typing) jump.focus();
  jumpNext = false;
}
async function renderCompany() {
  const v = companyView, sub = "Everything tracked at one company, whatever its status.";
  if (!v.q) {
    jumpNext = true;  // nothing to read here yet: straight to the box
    return putCompany(pagehead("Company", sub, jumpBox),
      emptyState("Type a company's name in the search box above to see its jobs here."));
  }
  if (jumpNext) putCompany(pagehead("Company", sub, jumpBox));  // the box first, while the jobs load
  let c;
  try { c = await api("/api/company?q=" + encodeURIComponent(v.q) + (v.every ? "&all=1" : "")); }
  catch (e) { return putCompany(pagehead("Company", sub, jumpBox), emptyState(e.message)); }
  const w = c.watch;
  const watch = async b => {
    b.disabled = true;
    try {
      await api("/api/suggestions/add", { company: c.company });
      settings = await api("/api/settings");
      toast(`Watching ${c.company}. Press “Check for new jobs” to see its roles.`);
      render();
    } catch (e) { b.disabled = false; toast(e.message); }
  };
  const tiles = h("div", {}), list = h("div", { class: "cards grid-cards" }), showing = h("div", { class: "showing" }), pager = h("div", {});
  drawCompanyTiles = () => fill(tiles, companyTiles(c));
  const draw = () => {
    const pg = paged(c.jobs, v, c.company, draw);
    fill(showing, pg.range ? `Showing ${pg.range}` : null);
    fill(list, c.jobs.length ? pg.items.map((j, i) => companyCard(j, i, c))
      : emptyState("Nothing to list here: every role is hidden by your filters or closed."));
    fill(pager, pg.nav);
  };
  const more = [
    c.more_open ? h("div", { class: "small muted" }, `${c.more_open} more open role${c.more_open === 1 ? "" : "s"} you haven't acted on: see Today`) : null,
    c.left_out ? h("div", { class: "small muted" },
      `${c.left_out} open role${c.left_out === 1 ? "" : "s"} your filters leave out (` +
      Object.entries(c.left_out_by).map(([k, n]) => `${k} ${n}`).join(", ") + "). ",
      h("button", { class: "btn ghost", onclick: () => openCompany(c.company, true),
        title: "Settings → Display → Company page lists them every time" }, "Show them")) : null,
    c.closed_unacted ? h("div", { class: "small muted" }, `${c.closed_unacted} closed posting${c.closed_unacted === 1 ? "" : "s"} you never acted on, not listed`) : null,
  ].filter(Boolean);
  putCompany(
    pagehead(c.company, "Everything tracked here, whatever its status.", jumpBox),
    layout([
      tiles,
      c.contacts.length || c.find_referral ? panel("People you know", peopleRow(c, 8)) : null,
      w.watched ? null : panel("Not watched", h("div", { class: "warns" }, "Its board isn't on your watchlist, so new roles there aren't checked. "),
        w.suggested ? h("button", { class: "btn", onclick: e => watch(e.currentTarget),
          title: w.entry ? `Watch ${w.entry}` : "Look for its board by name and watch it" }, "Watch its board")
          : h("div", { class: "hint" }, w.entry ? `Add ${w.entry} in Settings.` : "Look for its board with Settings → Add a company.")),
      more.length ? panel("Not listed", more) : null,
      c.also.length ? panel("Also matches", h("div", { class: "chips" },
        c.also.map(n => h("button", { class: "chip toggle", onclick: () => openCompany(n) }, n)))) : null,
    ], [h("div", { class: "status-row" }, showing), list, pager]));
  drawCompanyTiles();
  draw();
  watchPay(c.jobs);
}

let lastTab = null;
async function render() {
  main.classList.toggle("quiet", tab === lastTab);  // entrance animations only when a tab opens
  lastTab = tab;
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  document.getElementById("fetchBtn").style.display = settings.companies.length ? "" : "none";
  const home = tab === "today" && settings.exists && settings.companies.length > 0;
  chatFab.style.display = home ? "" : "none";
  if (!home) homeChat(false);
  try {
    if (tab === "settings") renderSettings();
    else if (!settings.exists || (!settings.companies.length && tab !== "applied")) renderWelcome();
    else await loading(document.querySelector(`#tabs button[data-tab="${tab}"]`),
      { today: renderToday, interviews: renderInterviews, queue: renderQueue, applied: renderApplied, company: renderCompany, comps: renderComps, referrals: renderReferrals, skills: renderSkills,
        activity: renderActivity }[tab]);
  } catch (e) { showError(main, e); }
  refreshQueueCount();
}

// A tab that takes a moment to load says so: after a beat (so quick ones don't flicker) its button gets a
// spinning ring and the page it's replacing dims. Only the latest one clears it, so a slow tab that finishes
// after another was clicked can't stop that one's spinner.
let loads = 0;
async function loading(button, work, delay = 150) {
  const n = ++loads;
  for (const b of document.querySelectorAll("#tabs button.loading")) b.classList.remove("loading");
  const timer = setTimeout(() => {
    if (n !== loads) return;
    button?.classList.add("loading");
    main.setAttribute("aria-busy", "true");
  }, delay);
  try { return await work(); }
  finally {
    clearTimeout(timer);
    if (n === loads) {
      button?.classList.remove("loading");
      main.removeAttribute("aria-busy");
    }
  }
}

function go(name) {
  tab = name;
  history.replaceState(null, "", "#" + name + (name === "company" && companyView.q ? "/" + encodeURIComponent(companyView.q) : ""));
  render();
}
for (const b of document.querySelectorAll("#tabs button")) b.onclick = () => go(b.dataset.tab);
listenForEvents();
const TABS = ["today", "interviews", "queue", "applied", "company", "comps", "referrals", "skills", "activity", "settings"];
window.addEventListener("hashchange", () => {
  const to = pageOfHash(location.hash, TABS);
  if (!to || !settings) return;
  if (to.tab === "company" && to.sub && to.sub !== companyView.q) return openCompany(to.sub);
  if (to.tab !== tab) { tab = to.tab; render(); }
  else if (tab === "settings" && to.sub && renderSettings.show) renderSettings.show(to.sub, { card: to.card, hash: false });
});

fill(document.getElementById("fetchBtn"), icon("refresh", 14), "Check for new jobs");
document.getElementById("fetchBtn").onclick = async () => {
  const btn = document.getElementById("fetchBtn"), status = document.getElementById("fetchStatus");
  btn.disabled = true; btn.classList.add("spin"); status.textContent = "Checking every company…";
  try {
    const r = await api("/api/fetch", {});
    const failed = Object.keys(r.errors).length, warned = Object.keys(r.warnings || {}).length;
    status.textContent = `${r.new} new of ${r.jobs.toLocaleString()} open jobs` + (failed ? ` · ${failed} failed` : "") +
      (warned ? ` · ${warned} to look at` : "");
    status.title = [...Object.entries(r.errors), ...Object.entries(r.warnings || {})].map(([b, e]) => `${b}: ${e}`).join("\n");
    tab = "today"; lastTab = null; await render();
    if (r.new) { toast(`✨ ${r.new} new job${r.new === 1 ? "" : "s"} to look at`, null, "win"); confetti(btn, { count: 40, power: .6 }); }
    else toast("No new jobs since the last check. Fresh ones land every day.", null, "onward");
  } catch (e) { status.textContent = e.message; }
  btn.disabled = false; btn.classList.remove("spin");
};

(async () => {
  try { settings = await api("/api/settings"); }
  catch (e) { return showError(main, e); }
  applyDisplay(settings.display);
  const start = pageOfHash(location.hash, TABS);
  tab = start?.tab || "today";
  if (tab === "company" && start.sub) companyView.q = start.sub;
  render();
  watchNotices();
})();
</script>
</body>
</html>
