<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobwatch</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5a5cf2">
<style>
:root {
  --bg: #f3f4fa; --glow-1: rgba(99, 102, 241, .16); --glow-2: rgba(236, 72, 153, .09);
  --panel: rgba(255, 255, 255, .88); --panel-solid: #fff; --text: #141a2e; --muted: #626a84; --line: #e2e5f0;
  --accent: #5457f0; --accent-2: #a14cf2; --accent-text: #fff; --accent-soft: rgba(84, 87, 240, .1);
  --good: #0c9468; --warn: #c26d00; --bad: #d83450; --chip: #eef0f8; --chip-text: #3a4160;
  --shadow: 0 1px 2px rgba(20, 26, 46, .04), 0 10px 28px -16px rgba(20, 26, 46, .16);
  --shadow-hover: 0 2px 4px rgba(20, 26, 46, .05), 0 22px 44px -20px rgba(70, 60, 190, .34);
  --radius: 16px;
  --grad: linear-gradient(135deg, #5a5cf2, #a24af0);  /* filled surfaces carry white text in both themes */
  --s-applied: #3b82f6; --s-screening: #8b5cf6; --s-interviewing: #f59e0b; --s-offer: #10b981;
  --s-rejected: #94a3b8; --s-withdrawn: #a8a29e;
  color-scheme: light;
}
/* dark: set by the Theme setting, or by the computer's when that is System (applyDisplay) */
:root[data-theme="dark"] {
    --bg: #0a0d16; --glow-1: rgba(99, 102, 241, .2); --glow-2: rgba(192, 80, 240, .1);
    --panel: rgba(21, 25, 38, .86); --panel-solid: #151926; --text: #e9ebf5; --muted: #8f97b2; --line: #252a3b;
    --accent: #8d8fff; --accent-2: #c77dff; --accent-text: #0a0d16; --accent-soft: rgba(141, 143, 255, .14);
    --good: #3ddc97; --warn: #fbbf24; --bad: #ff7a93; --chip: #1e2333; --chip-text: #c3c9e0;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 32px -20px rgba(0, 0, 0, .9);
    --shadow-hover: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 22px 48px -20px rgba(110, 100, 255, .5);
    color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1100px 560px at 8% -12%, var(--glow-1), transparent 62%),
    radial-gradient(900px 520px at 102% -6%, var(--glow-2), transparent 60%), var(--bg);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.ico { flex: none; vertical-align: -2px; }

/* header */
header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-solid) 74%, transparent); backdrop-filter: saturate(1.5) blur(16px);
  -webkit-backdrop-filter: saturate(1.5) blur(16px); }
.bar { max-width: 1680px; margin: 0 auto; padding: 12px 32px; display: flex; gap: 16px; align-items: center; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  margin-right: 10px; }
.brand b { background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
nav { display: flex; gap: 2px; padding: 4px; background: var(--chip); border-radius: 12px; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 14px; border-radius: 9px;
  font: inherit; font-weight: 550; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: color .15s, background .15s; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--text); background: var(--panel-solid); box-shadow: 0 1px 3px rgba(20, 26, 46, .12); }
/* the open tab gets a gradient underline that sweeps in */
nav button { position: relative; }
nav button.on::before { content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px; height: 2.5px;
  border-radius: 2px; background: var(--grad); transform-origin: left; animation: grow .35s cubic-bezier(.2, .7, .2, 1); }
/* a tab still loading: a small ring on its button, and the page it's replacing dims */
nav button.loading::after { content: ""; width: 9px; height: 9px; border: 2px solid currentColor;
  border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
main[aria-busy="true"] { opacity: .5; pointer-events: none; transition: opacity .2s; }
.count { font-size: 11.5px; font-weight: 700; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px;
  display: inline-grid; place-items: center; color: #fff;
  background: var(--grad); }
#duecount .count { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.spacer { flex: 1; }
.status { color: var(--muted); font-size: 13.5px; }

main { max-width: 1680px; margin: 0 auto; padding: 28px 32px 80px; }
:root[data-width="wide"] main, :root[data-width="wide"] .bar { max-width: 2400px; }
:root[data-width="full"] main, :root[data-width="full"] .bar { max-width: none; }
.pagehead { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.pagehead > div:first-child { flex: 1; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.025em; margin: 0; font-weight: 800; }
.sub { color: var(--muted); margin: 6px 0 0; }
h2 { font-size: 20px; letter-spacing: -.01em; margin: 8px 0 4px; }
h3 { font-size: 15.5px; margin: 0; letter-spacing: -.005em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* stats */
.hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 22px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
.stat .num { font-size: 28px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  line-height: 1.1; }
.stat .lbl { color: var(--muted); font-size: 13px; margin-top: 2px; }
.stat.lead { color: #fff; border-color: transparent; background: var(--grad); }
.stat.lead .lbl { color: rgba(255, 255, 255, .82); }
.stat.warn .num { color: var(--warn); }
.stat.good .num { color: var(--good); }
.stat:nth-child(2) { animation-delay: 50ms; } .stat:nth-child(3) { animation-delay: 100ms; }
.stat:nth-child(4) { animation-delay: 150ms; }
.filtered { color: var(--muted); font-size: 13px; margin: -10px 0 14px; }

/* the filter bar on Today: the filters in force, each edited in place, and what they hide */
.fbar { position: relative; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px;
  box-shadow: var(--shadow); margin: 0 0 18px; font-size: 14px; }
.fbar > .ico { color: var(--accent); margin: 0 4px 0 4px; }
.fpart { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid transparent; background: none;
  font: inherit; color: var(--text); padding: 4px 9px; border-radius: 9px; cursor: pointer; max-width: 100%;
  text-align: left; transition: background .15s, border-color .15s; }
.fpart:hover { background: var(--chip); }
.fpart.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.fpart .k { color: var(--muted); }
.fpart .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
.fpart.off .v { color: var(--muted); font-weight: 500; }
.fbar .sep { color: var(--muted); opacity: .45; }
.fbar .edit { margin-left: auto; }
.fline { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--muted);
  font-size: 13px; border-top: 1px dashed var(--line); margin-top: 3px; padding: 7px 6px 1px; }
.fline b { color: var(--text); font-weight: 650; }
.fline.bad, .fline.bad b { color: var(--bad); }
.fline a { color: inherit; }
.hchip { border: 0; font: inherit; font-size: 12.5px; font-weight: 550; background: var(--chip); color: var(--chip-text);
  border-radius: 999px; padding: 1px 10px; cursor: pointer; transition: background .15s, color .15s; }
.hchip:hover { background: var(--accent-soft); color: var(--accent); }
.hchip .n { font-variant-numeric: tabular-nums; font-weight: 750; margin-right: 4px; }
.fpop { position: absolute; top: calc(100% + 6px); left: 0; width: min(420px, calc(100vw - 32px));
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 2px 16px 14px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .45); animation: pop .2s cubic-bezier(.2, .8, .2, 1) both; }
.fpop.all { width: min(680px, calc(100vw - 32px)); }
.fpop textarea { min-height: 88px; }
.fpop .foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.fpop .foot .msg { flex: 1; font-size: 13px; }
.hidden-list .list-item { align-items: flex-start; }
.hidden-list a.title { color: var(--text); font-weight: 650; text-decoration: none; }
.hidden-list a.title:hover { color: var(--accent); text-decoration: underline; }
.hidden-list .meta { margin: 1px 0 0; }
.chip.why { background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn); white-space: nowrap; }
.company.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.company.bad .x { opacity: 1; }
.company .who .err { color: var(--bad); white-space: normal; font-weight: 550; }

/* pipeline */
.pipeline { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); margin: -8px 0 22px; }
.pipeline .bar-track { display: flex; gap: 4px; height: 12px; }
.pipeline .seg { background: var(--sc); border-radius: 6px; min-width: 12px; transform-origin: left;
  animation: grow .7s cubic-bezier(.2, .7, .2, 1) both; }
.pipeline .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.pipeline .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--sc);
  margin-right: 6px; }
.pipeline .legend b { color: var(--text); margin-left: 3px; }

/* buttons */
button.btn { font: inherit; font-size: 14px; font-weight: 550; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--text); border-radius: 10px; padding: 6px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .12s, box-shadow .15s, border-color .15s; }
button.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
button.btn:active { transform: translateY(1px); }
button.primary { color: #fff; border-color: transparent; background: var(--grad);
  box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
button.primary:hover { border-color: transparent; filter: brightness(1.07);
  box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--accent) 90%, transparent); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 5px 10px; }
button.ghost:hover { color: var(--text); background: var(--chip); border-color: transparent; }
button.btn:disabled { opacity: .55; cursor: default; }
.spin .ico { animation: spin 1s linear infinite; }

/* cards */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px 16px 22px; margin: 12px 0; box-shadow: var(--shadow); overflow: hidden;
  transition: transform .2s cubic-bezier(.2, .7, .2, 1), box-shadow .2s, border-color .2s;
  animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, transparent); }
.card.job:hover, .card.app:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover);
  border-color: color-mix(in srgb, var(--stripe, var(--accent)) 35%, var(--line)); }
.card.job { display: grid; grid-template-columns: 46px 1fr auto; gap: 0 16px; }
.card.fit-hi { --stripe: var(--good); } .card.fit-mid { --stripe: var(--warn); } .card.fit-lo { --stripe: var(--bad); }
.card.fit-none { --stripe: color-mix(in srgb, var(--accent) 35%, transparent); }
.card a.title { color: var(--text); font-weight: 700; font-size: 17px; letter-spacing: -.01em; text-decoration: none; }
.card a.title:hover { color: var(--accent); }
.mono { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-weight: 800;
  font-size: 16px; letter-spacing: -.02em; background: hsl(var(--h) 80% 93%); color: hsl(var(--h) 60% 36%);
  box-shadow: inset 0 0 0 1px hsl(var(--h) 60% 50% / .12); }
:root[data-theme="dark"] .mono { background: hsl(var(--h) 45% 20%); color: hsl(var(--h) 90% 80%); }
.mono { position: relative; overflow: hidden; flex: none; }
.mono img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 18%;
  box-sizing: border-box; background: #fff; opacity: 0; }
.mono.logo img { opacity: 1; }
.meta { color: var(--muted); font-size: 13.5px; margin: 3px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 8px;
  align-items: center; }
.meta b { color: var(--text); font-weight: 600; }
.meta .sep { opacity: .45; }
.pay { color: var(--good); font-weight: 650; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions { margin-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.chip { display: inline-block; background: var(--chip); color: var(--chip-text); border-radius: 999px;
  padding: 1px 10px; font-size: 12.5px; font-weight: 500; }
.chip.hit { background: var(--accent-soft); color: var(--accent); }
.chip.gap { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.chip.gap.must { border-style: solid; border-color: var(--warn); color: var(--warn); }
.badge { font-size: 11px; font-weight: 800; letter-spacing: .06em; border-radius: 6px; padding: 2px 7px;
  text-transform: uppercase; }
.badge.new { color: #fff; background: var(--grad);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: pulse 2.4s ease-out infinite; }
.badge.closed { background: var(--bad); color: #fff; }
.badge.round { background: var(--grad); color: #fff; text-transform: none; letter-spacing: 0; margin-left: 8px;
  vertical-align: 2px; }
.badge.dupe { background: var(--warn); color: #fff; text-transform: none; letter-spacing: 0; }
.badge.dupe.maybe { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
.fitbox { text-align: center; padding-left: 4px; }
.ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto;
  background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--chip) 0); animation: fade .6s both; }
.ring span { width: 52px; height: 52px; border-radius: 50%; background: var(--panel-solid); display: grid;
  place-items: center; font-weight: 800; font-size: 18px; letter-spacing: -.03em; color: var(--rc); }
.ring.hi { --rc: var(--good); } .ring.mid { --rc: var(--warn); } .ring.lo { --rc: var(--bad); }
.fitbox.stale { opacity: .6; }
.fitbox small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 5px; white-space: nowrap; }
.scorer { display: inline-block; margin-top: 4px; padding: 1px 7px; border-radius: 999px; font-size: 10.5px;
  white-space: nowrap; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.scorer.local { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.advice { font-size: 13px; margin-top: 6px; display: flex; gap: 6px; align-items: baseline; }
.advice svg { flex: none; align-self: center; }
.advice.queue b, .advice.queue svg { color: var(--good); } .advice.skip b, .advice.skip svg { color: var(--bad); }
.advice b { white-space: nowrap; }
.know { color: var(--good); font-size: 13.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.know a { color: var(--muted); text-decoration: none; }
.know a:hover { color: var(--accent); text-decoration: underline; }
.know .dont { font-size: 12px; padding: 0 6px; margin-left: 4px; background: none; border: 1px solid var(--line);
  border-radius: 999px; color: var(--muted); cursor: pointer; }
.know .dont:hover { color: var(--bad); border-color: var(--bad); }
.know .pnote { color: var(--muted); font-style: italic; }
.card.ref { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; }
.card.ref .rate { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 230px; }
.card.ref .rate input { width: 100%; box-sizing: border-box; }
@media (max-width: 700px) { .card.ref { grid-template-columns: 1fr; } }
/* comps: the opportunities as columns on a wide screen, as stacked cards on a phone */
table.comps { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; }
table.comps th, table.comps td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left;
  min-width: 190px; max-width: 280px; }
table.comps th.lbl { position: sticky; left: 0; z-index: 1; min-width: 110px; max-width: 130px; background: var(--panel-solid);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
table.comps thead th { border-top: 3px solid var(--sc); padding-top: 12px; }
table.comps thead .co-cell { display: flex; align-items: center; gap: 10px; }
table.comps thead .co-cell .mono { width: 30px; height: 30px; border-radius: 9px; font-size: 12px; }
table.comps thead a { color: var(--text); font-weight: 600; text-decoration: none; }
table.comps tbody tr:last-child th, table.comps tbody tr:last-child td { border-bottom: 0; }
.comps .best { color: var(--good); font-weight: 700; }
.comps .best::after { content: " \2605"; font-size: 12px; }
.comps .none { color: var(--muted); }
.comps .stagechip { display: inline-block; margin-top: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 650;
  text-transform: capitalize; background: color-mix(in srgb, var(--sc) 16%, transparent);
  color: color-mix(in srgb, var(--sc) 75%, var(--text)); }
.comps .gapline { font-size: 13px; color: var(--muted); }
.comps .stale, .comp-cards .stale { color: var(--warn); font-weight: 650; }
ol.suggest { margin: 8px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.comp-cards { display: none; flex-direction: column; gap: 14px; }
.comp-cards .panel { border-left: 4px solid var(--sc); }
.comp-cards dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; margin: 10px 0 0; font-size: 14px; }
.comp-cards dt { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; padding-top: 2px; }
.comp-cards dd { margin: 0; overflow-wrap: anywhere; }
.comp-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; margin-top: 10px; }
.comp-form .wide { grid-column: 1 / -1; }
@media (max-width: 760px) { .comp-table { display: none; } .comp-cards { display: flex; } }
.note { font-size: 13.5px; color: var(--muted); margin-top: 6px; padding-left: 10px;
  border-left: 2px solid var(--line); }
/* An application's note grows a dated entry at every step: three lines on the card, the whole note in Details. */
.app .note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.warns { font-size: 13.5px; color: var(--warn); margin: 2px 0 4px; }
.warns b { font-weight: 600; }
.gaps { font-size: 13.5px; color: var(--muted); margin: 2px 0 4px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.gaps.open { -webkit-line-clamp: unset; }
.gaps b { color: var(--text); font-weight: 600; }
.whyfit { font-size: 13.5px; margin: 2px 0 6px; } .whyfit summary { cursor: pointer; color: var(--muted); }
.whyfit ul { list-style: none; padding: 0; margin: 6px 0 0; } .whyfit li { margin: 4px 0; }
.whyfit .v { display: inline-block; min-width: 62px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; }
.whyfit .v.met { color: var(--good); } .whyfit .v.partial { color: var(--warn); }
.whyfit .v.not_met { color: var(--bad); }
.whyfit q { display: block; color: var(--muted); margin-left: 66px; font-style: italic; }
.fitrange { display: flex; align-items: center; gap: 10px; } .fitrange input { flex: 1; }
.fitrange output { min-width: 34px; font-weight: 600; text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 56px 16px; border: 1.5px dashed var(--line);
  border-radius: var(--radius); background: color-mix(in srgb, var(--panel) 50%, transparent); }
.empty .ico { display: block; margin: 0 auto 10px; color: var(--accent); opacity: .7; }
/* an empty page still feels alive: a soft glow, and its icon drifts */
.empty { background: radial-gradient(circle at 50% 0%, var(--accent-soft), transparent 70%),
  color-mix(in srgb, var(--panel) 50%, transparent); }
.empty .ico { color: var(--accent-2); opacity: .85; animation: float 4s ease-in-out infinite; }

/* find a company: the box in the header, on every tab */
.jump { position: relative; width: 210px; flex: none; }
.jump input[type=search] { padding-right: 30px; }
.jump kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; font: inherit;
  font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.jump input:focus + kbd, .jump input:not(:placeholder-shown) + kbd { display: none; }
.jump-list { position: absolute; top: calc(100% + 6px); left: 0; width: 340px; max-width: 90vw; display: none; z-index: 6;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
  box-shadow: 0 18px 50px -16px rgba(0, 0, 0, .45); }
.jump-list button { display: block; width: 100%; text-align: left; background: none; border: 0; font: inherit;
  color: var(--text); padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.jump-list button.on, .jump-list button:hover { background: var(--accent-soft); }
.jump-list .small { display: block; }
.jump-list .none { padding: 8px 10px; color: var(--muted); font-size: 13.5px; }
.cjob { border-top: 1px solid var(--line); padding: 10px 0; }
/* a company's page: nothing behind it is being read, so it spreads across the screen, its jobs in columns */
.dialog.co-page { max-width: 2400px; }
.cjobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 0 32px; }
.cjob .row { align-items: center; gap: 8px; }
.cjob .row b { flex: 1; }
.elsewhere { margin-top: 10px; font-size: 14px; }

/* applications */
.section { display: flex; align-items: center; gap: 10px; margin: 26px 0 4px; }
.section h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.section .n { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 999px;
  padding: 0 8px; }
.section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.section.hot h3 { color: var(--warn); }
.card.app { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 16px; --stripe: var(--sc); }
.app-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.app-head select.stage { width: auto; min-width: 150px; flex: none; }
.app-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px;
  padding-top: 8px; border-top: 1px dashed var(--line); }
.app-foot .acts { display: flex; gap: 4px; align-items: center; }
.sent-chip { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--muted); border: 0;
  background: none; cursor: pointer; padding: 3px 8px; border-radius: 8px; font-family: inherit; }
.sent-chip:hover { background: var(--chip); color: var(--text); }
.sent-chip.empty-pkg { color: var(--accent); }
.quiet-bar { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--chip); font-size: 13.5px; }
.quiet-bar .why { color: var(--muted); }
.quiet-bar .acts { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.quiet-bar input { flex: 1; min-width: 180px; }
.section.quiet h3 { color: var(--muted); }

/* what you sent: the job page's record of an application */
.sent { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  background: linear-gradient(135deg, rgba(90, 92, 242, .05), rgba(162, 74, 240, .035)); transition: border-color .15s, background .15s; }
.sent.drag { border-color: var(--accent); background: var(--accent-soft); }
.sent-head { display: flex; align-items: center; gap: 8px; }
.sent-head h4 { font-size: 14.5px; font-weight: 650; flex: 1; display: flex; gap: 7px; align-items: center; }
.sent-head .ico { color: var(--accent); }
.files { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
.file { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-solid);
  border-radius: 11px; padding: 6px 6px 6px 10px; max-width: 100%; animation: rise .25s both; }
.file button.open { border: 0; background: none; font: inherit; color: var(--text); cursor: pointer; display: flex;
  gap: 7px; align-items: center; min-width: 0; padding: 0; text-align: left; }
.file button.open:hover b { color: var(--accent); text-decoration: underline; }
.file b { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.file small { color: var(--muted); font-size: 11.5px; }
.file .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 6px;
  padding: 1px 6px; background: var(--chip); color: var(--chip-text); }
.file .tag.resume { background: color-mix(in srgb, var(--s-applied) 15%, transparent); color: var(--s-applied); }
.file .tag.letter { background: color-mix(in srgb, var(--s-screening) 15%, transparent); color: var(--s-screening); }
.file .x { border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 7px; padding: 3px; display: grid; }
.file .x:hover { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.drop { display: inline-flex; align-items: center; gap: 7px; border: 1.5px dashed var(--line); border-radius: 11px;
  padding: 7px 12px; color: var(--muted); font-size: 13px; cursor: pointer; background: none; font-family: inherit; }
.drop:hover { border-color: var(--accent); color: var(--accent); }
.qa { margin: 12px 0 0; display: grid; gap: 10px; }
.qa dt { font-weight: 600; font-size: 13.5px; }
.qa dd { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; }
.qa-edit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 6px; margin: 6px 0; align-items: start; }
.qa-edit textarea { min-height: 40px; }
.sent .saved-posting { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.sent .saved-posting button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
.card.app.ended { opacity: .62; }
.card.app.ended:hover { opacity: 1; }
.card.interview { cursor: pointer; }
.card.interview:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.iv-when { text-align: right; flex: none; display: grid; gap: 2px; }
.iv-when b { font-size: 17px; }
.iv-when span { font-size: 12.5px; color: var(--muted); }
.iv-when.now b { color: var(--accent); }
.sheets { gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.iv-banner { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px;
  margin: 8px 0; display: grid; gap: 4px; }
.note-full { white-space: pre-wrap; font-size: 13.5px; line-height: 1.5; margin: 8px 0; max-height: 320px; overflow: auto;
  border-left: 3px solid var(--line, #ddd); padding: 2px 10px; }
/* a note as its dated lines, newest first (noteTimeline) */
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { display: grid; grid-template-columns: 88px 1fr; gap: 12px; margin: 0; padding: 6px 0;
  border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline .day { font-size: 12.5px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums;
  padding-top: 1px; }
.prep .hero { margin: 16px 0 6px; }
.prep .hero .num { font-size: 22px; }
.app .side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.app .when { color: var(--muted); font-size: 12.5px; }
select.stage { font-weight: 650; border-radius: 999px; color: var(--sc); padding: 5px 12px;
  background-color: color-mix(in srgb, var(--sc) 12%, var(--panel-solid));
  border-color: color-mix(in srgb, var(--sc) 35%, transparent); cursor: pointer; }
select.stage option { color: var(--text); background: var(--panel-solid); }
.next { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; margin: 2px 0; }
.next .what { font-weight: 550; }
.when-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 650;
  border-radius: 999px; padding: 2px 10px; background: var(--chip); color: var(--muted); }
.next.soon .when-chip { background: var(--accent-soft); color: var(--accent); }
.next.now .when-chip { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.next.late .when-chip { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.app .full { grid-column: 1 / -1; }
/* status filter chips, the cards/table switch, and the table */
.status-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.sf { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel-solid);
  color: var(--text); font: inherit; font-size: 13.5px; font-weight: 550; border-radius: 999px; padding: 5px 12px;
  cursor: pointer; transition: border-color .15s, background .15s; }
.sf:hover { border-color: color-mix(in srgb, var(--sc, var(--accent)) 50%, var(--line)); }
.sf .dot { width: 8px; height: 8px; border-radius: 3px; background: var(--sc); }
.sf .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.sf.on { border-color: var(--sc, var(--accent)); background: color-mix(in srgb, var(--sc, var(--accent)) 13%, var(--panel-solid));
  color: color-mix(in srgb, var(--sc, var(--accent)) 70%, var(--text)); }
.sf.on .c { color: inherit; }
.showing .seg-ctl { width: 170px; flex: none; }
.pager { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 18px 0 4px; font-size: 13.5px; }
.pager .pg { min-width: 34px; height: 34px; border: 1px solid transparent; background: none; border-radius: 9px; font: inherit;
  font-weight: 600; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.pager .pg:hover { background: var(--chip); color: var(--text); }
.pager .pg.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.pager .gap { color: var(--muted); padding: 0 4px; }
.pager .per { display: flex; align-items: center; gap: 8px; color: var(--muted); margin: 0 0 0 auto; font-weight: 500;
  font-size: 13.5px; }
.pager .per select { width: auto; padding: 4px 8px; font-size: 13px; }
.pipeline button.seg { border: 0; padding: 0; cursor: pointer; font: inherit; }
.pipeline button.seg:hover { filter: brightness(1.12); outline: 2px solid color-mix(in srgb, var(--sc) 40%, transparent); outline-offset: 1px; }
.table-wrap { container-type: inline-size; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); animation: rise .4s cubic-bezier(.2, .7, .2, 1) both; }
table.apps { width: 100%; border-collapse: collapse; font-size: 14px; }
table.apps th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
  position: sticky; top: 0; background: var(--panel-solid); }
table.apps th button.sort { border: 0; background: none; font: inherit; color: inherit; letter-spacing: inherit;
  text-transform: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 4px; }
table.apps th button.sort:hover, table.apps th button.sort.on { color: var(--text); }
table.apps td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.apps tbody tr:last-child td { border-bottom: 0; }
table.apps tbody tr { box-shadow: inset 3px 0 0 var(--sc); transition: background .12s; }
table.apps tbody tr:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
table.apps tr.ended { opacity: .62; } table.apps tr.ended:hover { opacity: 1; }
table.apps tr.due td.next-cell .what { color: var(--warn); }
table.apps .co-cell { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
table.apps .co-cell .mono { width: 30px; height: 30px; border-radius: 9px; font-size: 12px; }
table.apps .role a { color: var(--text); font-weight: 600; text-decoration: none; }
table.apps .role a:hover { color: var(--accent); text-decoration: underline; }
table.apps .role { min-width: 200px; }
table.apps select.stage { width: auto; min-width: 130px; font-size: 13px; padding: 4px 10px; }
table.apps .next-cell { min-width: 190px; }
table.apps .next { font-size: 13.5px; }
table.apps .nowrap { white-space: nowrap; }
table.apps .acts .btn { padding: 4px 8px; }
table.apps .sent-chip { white-space: nowrap; }
@container (max-width: 1150px) { table.apps .col-sent { display: none; } table.apps .acts .label { display: none; }
  table.apps .role { min-width: 160px; } table.apps .next-cell { min-width: 160px; } }
table.apps td.editing { padding: 14px 18px; }

/* overlay, toast, forms */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text);
  color: var(--bg); border-radius: 12px; padding: 10px 16px; display: none; gap: 14px; align-items: center;
  z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .45);
  animation: rise .3s cubic-bezier(.2, .7, .2, 1); font-weight: 550; }
.toast button { background: none; border: 0; color: inherit; font: inherit; font-weight: 800; cursor: pointer;
  text-decoration: underline; }
/* a colored edge says what kind of news it is: good news is green, a no gets a sunrise (it's not the end) */
.toast { overflow: hidden; padding-left: 20px; }
.toast::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--grad); }
.toast[data-tone="win"]::before { background: linear-gradient(180deg, #34d399, #10b981); }
.toast[data-tone="onward"]::before { background: linear-gradient(180deg, #fbbf24, #f472b6); }
.toast { animation: toast-in .3s cubic-bezier(.2, .7, .2, 1); }
.toast[data-tone="win"] { animation: toast-pop .5s cubic-bezier(.2, .7, .2, 1); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes toast-pop { from { opacity: 0; transform: translate(-50%, 14px) scale(.92); }
  60% { transform: translate(-50%, -3px) scale(1.03); } }
.overlay { position: fixed; inset: 0; background: rgba(8, 10, 20, .5); backdrop-filter: blur(4px);
  display: none; z-index: 10; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.dialog { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; max-width: 780px;
  width: 100%; padding: 22px 24px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); animation: rise .3s both; }
.posting { white-space: pre-wrap; font-size: 14px; max-height: 60vh; overflow-y: auto; border-top: 1px solid
  var(--line); margin-top: 14px; padding-top: 14px; line-height: 1.6; }
label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 5px; }
.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], input[type=date], textarea, select { font: inherit; color: var(--text);
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; width: 100%;
  transition: border-color .15s, box-shadow .15s; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 70px; resize: vertical; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.list-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.kw { display: grid; grid-template-columns: 1fr 160px auto; gap: 6px; margin: 5px 0; }
.error { color: var(--bad); }
.done-ok { color: var(--good); }
/* where the AI runs: a tile per choice (pick the main one), then the fallback chain */
/* three across where there's room (Settings), stacked in a narrow card (onboarding) */
.ai-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0 14px; }
.ai-tile { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px;
  border: 1.5px solid var(--line); background: var(--panel-solid); cursor: pointer;
  transition: transform .14s, box-shadow .14s, border-color .14s; }
.ai-tile:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(84, 87, 240, .12); }
.ai-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ai-tile.on { border-color: transparent; cursor: default; box-shadow: 0 12px 30px rgba(84, 87, 240, .2);
  background: linear-gradient(var(--panel-solid), var(--panel-solid)) padding-box, var(--grad) border-box; }
.ai-tile .main-tag { position: absolute; top: -10px; left: 16px; background: var(--grad); color: #fff; font-size: 10.5px;
  font-weight: 800; letter-spacing: .07em; text-transform: uppercase; padding: 2px 9px; border-radius: 6px; }
.ai-tile .top { display: flex; align-items: center; gap: 10px; }
.ai-tile .orb { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); }
.ai-tile.on .orb { background: var(--grad); color: #fff; }
.ai-tile .name { font-weight: 700; font-size: 15px; }
.ai-tile .state { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.ai-tile .state.ready { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.ai-tile .state.setup { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.ai-tile .state.wait { background: var(--chip); color: var(--muted); }
.ai-tile .about { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.meters { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: center; font-size: 12px; color: var(--muted); }
.meters .bars { display: flex; gap: 4px; }
.meters .bars i { width: 22px; height: 7px; border-radius: 4px; background: var(--line); }
.meters .bars i.f { background: var(--grad); }
.ai-steps { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 10px;
  counter-reset: step; font-size: 12.5px; }
.ai-steps li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.ai-steps li::before { content: counter(step); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 11.5px; }
.ai-steps a { font-weight: 600; }
.cmd { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.cmd code { flex: 1; min-width: 0; font-size: 12px; padding: 6px 9px; border-radius: 9px; background: var(--chip); overflow-wrap: anywhere; }
.ai-key { display: grid; gap: 6px; }
.ai-key .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.ai-tile .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
.ai-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 16px; border-radius: 14px;
  background: var(--accent-soft); margin: 0 0 12px; }
.ai-chain .title { flex-basis: 100%; font-weight: 700; font-size: 13.5px; }
.ai-chain .cap { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.ai-chain .link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px; font: inherit;
  font-weight: 600; font-size: 13px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--panel-solid);
  cursor: pointer; transition: transform .12s; }
.ai-chain .link:hover { transform: translateY(-1px); }
.ai-chain .link.main { background: var(--grad); color: #fff; border-color: transparent; cursor: default; transform: none; }
.ai-chain .link.off { border-style: dashed; border-color: var(--muted); color: var(--muted); opacity: .7; }
.ai-chain .link.off .ico { display: none; }
.ai-chain .then { color: var(--accent); display: inline-flex; }
.ai-chain .link .n { font-size: 11px; font-weight: 800; opacity: .8; }
.onboard > .card { max-width: 760px; margin-bottom: 16px; }
.onboard details { margin: 12px 0; }
.onboard summary { cursor: pointer; font-weight: 600; }
.welcome { padding: 32px; border: 0; color: #fff; background: var(--grad); }
.welcome h2 { font-size: 26px; }
.welcome button.primary { background: #fff; color: #5a5cf2; }
.companies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.company { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel-solid); transition: border-color .15s, transform .15s; }
.company:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-1px); }
.company .mono { width: 32px; height: 32px; border-radius: 9px; font-size: 12.5px; }
.company .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.company .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.company .who span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.company .x { border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 7px; padding: 3px 7px;
  opacity: 0; transition: opacity .15s; }
.company:hover .x { opacity: 1; }
.company .x:hover { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }

.count.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
.stat.lead { position: relative; overflow: hidden; }

/* wide layout: sidebar + content */

.showing:empty { display: none; }

/* the pace, board check, scoring and "Showing" lines share one row above the cards, wrapping when it's narrow */

/* activity: what jobwatch did in the background, newest first, a day at a time */
.acts-day { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.act { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; background: var(--panel);

.card.skill { --stripe: color-mix(in srgb, var(--accent) 35%, transparent); }

.settings-grid h3 { margin: 0 0 4px; }

.fields .wide { grid-column: 1 / -1; }

.companies { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.company .x { display: grid; place-items: center; }

.company.editing { grid-column: span 2; align-items: flex-start; }

.unsaved { color: var(--warn); font-weight: 600; }
.snav { position: sticky; top: var(--head, 64px); z-index: 4; display: flex; align-items: center; gap: 12px;

/* Settings flair. Generic, reusable on any card: .set-orb (icon tile), .set-head/.set-sub (header), .qm (a "?" that

.set-head { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.set-orb { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff;
  background: var(--grad); filter: hue-rotate(var(--hue, 0deg)); box-shadow: 0 8px 18px -8px rgba(90, 92, 242, .75); }

  vertical-align: 1px; user-select: none; }
.settings-grid .qm:hover, .settings-grid .qm.on { color: #fff; background: var(--accent); }
.settings-grid .field .help, .settings-grid .field.has-help .help { display: none; }
.settings-grid .field.open .help { display: block; padding: 6px 9px; border-radius: 9px; background: var(--panel-solid);
  border: 1px solid var(--line); }
.settings-grid .lead { padding: 9px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--text); }
.switch, .settings-grid label.check input[type=checkbox] { appearance: none; -webkit-appearance: none; position: relative;

.settings-grid .prompt { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 8px;

@media (max-width: 640px) { .settings-grid .fields, .set-panel { padding: 2px 10px 10px; } .set-orb { width: 34px; height: 34px; } }
/* Settings: prompts, one per fold, closed until opened */
.prompt { border-top: 1px solid var(--line); padding: 9px 0; }
.prompt:last-child { padding-bottom: 0; }
.prompt summary { cursor: pointer; }
.prompt summary code { font-weight: 650; margin-right: 6px; }
.prompt summary .hint { margin-left: 4px; }
details.fold { margin-top: 6px; }
details.fold > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; padding: 4px 0; }
.prompt textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
  line-height: 1.5; margin-top: 8px; }
.prompt .row { justify-content: space-between; margin-top: 6px; }
/* chat: a floating panel on Today, a column beside the posting in a job's details */
.chat { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--panel-solid);
  border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px; border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg, rgba(90, 92, 242, .1), rgba(162, 74, 240, .07)); }
.spark { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff;

.chat-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }

.where { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); }

.icon-btn { border: 0; background: none; color: var(--muted); border-radius: 9px; padding: 7px; cursor: pointer;

.msg.bot ul, .msg.bot ol { margin: 3px 0 7px; padding-left: 20px; } .msg.bot li { margin: 3px 0; }

@media print {

}

.dialog.with-chat .posting { max-height: calc(100vh - 330px); }

}
@keyframes bump { 40% { transform: scale(1.45); } }
@keyframes sheen { to { transform: translateX(100%); } }
@keyframes float { 50% { transform: translateY(-6px); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
@keyframes caret { to { visibility: hidden; } }
@keyframes twinkle { 50% { transform: rotate(16deg) scale(1.18); } }

  70%, 100% { box-shadow: 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media (max-width: 760px) {
  .bar { flex-wrap: wrap; padding: 10px 16px; } main { padding: 20px 16px 60px; }

<body>
<header>

          <stop offset="0" stop-color="#5a5cf2"/><stop offset="1" stop-color="#a24af0"/></linearGradient></defs>
        <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#lg)"/>
        <circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/>
        <circle cx="16" cy="16" r="4" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.6"/>
        <path d="M16 16 L23.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="1.8" fill="#fff"/>
      </svg><span>job<b>watch</b></span></span>
    <nav id="tabs">
      <button data-tab="today">Today</button>
      <button data-tab="interviews">Interviews<span id="ivcount"></span></button>

    </nav>

      <input type="search" id="jump" placeholder="Find a company" aria-label="Find a company" autocomplete="off"
        title="Look a company up under any status: press / from anywhere">

<main id="main"></main>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script>
"use strict";
const TOKEN = "__JOBWATCH_TOKEN__";

// Theme and page width from the watchlist's display settings. The last ones used are kept in this browser too,
// so the page opens in the right colors before the settings arrive.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function applyDisplay(d) {
  const theme = (d && d.theme) || "system", width = (d && d.width) || "standard";
  document.documentElement.dataset.theme = theme === "system" ? (darkQuery.matches ? "dark" : "light") : theme;
  document.documentElement.dataset.width = width;
  remember("display", JSON.stringify({ theme, width }));
}
function lastDisplay() { try { return JSON.parse(remembered("display", "{}")); } catch { return {}; } }
darkQuery.addEventListener("change", () => applyDisplay((settings && settings.display) || lastDisplay()));
applyDisplay(lastDisplay());
const main = document.getElementById("main");
let tab = "today";
let settings = null;

// -- tiny helpers: build DOM with textContent only, so posting text can't inject markup
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "href") el.href = safeUrl(v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
// replaceChildren doesn't flatten arrays of cards
function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false)); }
function put(...kids) { fill(main, ...kids); }
// A link's address: http(s) anywhere, or this page's own origin (a prep sheet's path, a blob download); a bare #fragment stays.
function safeUrl(u) {
  try { const x = new URL(u, location.href);
    return String(u).startsWith("#") ? u : /^https?:$/.test(x.protocol) || (x.origin !== "null" && x.origin === location.origin) ? x.href : "#";
  } catch { return "#"; }
}
// No link without a URL: an empty href opens jobwatch itself in a new tab (a job added by hand with no posting link).
function link(url, text, cls) {
  if (!url || url === "#") return h("span", { class: cls }, text);
  return h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: cls }, text);
}

const ICONS = {
  refresh: "M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5",
  calendar: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
  users: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  plus: "M12 5v14M5 12h14",
  pencil: "M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z",
  check: "M20 6 9 17l-5-5",
  arrow: "M5 12h14M13 5l7 7-7 7",
  inbox: "M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z",
  sparkle: "M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15v5M16.5 17.5h5M5 3v4M3 5h4",
  lock: "M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4",
  cloud: "M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z",
  send: "M12 19V5M5 12l7-7 7 7",
  stop: "M7 7h10v10H7z",
  x: "M18 6 6 18M6 6l12 12",
  clip: "M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48",
  file: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6",
  copy: "M9 9h11v11H9zM5 15H4V4h11v1",
  download: "M12 3v12M7 10l5 5 5-5M5 21h14",
  dollar: "M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
};
function icon(name, size = 15) {
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: size, height: size, fill: "none", stroke: "currentColor",
    "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", class: "ico", "aria-hidden": "true" })) svg.setAttribute(k, v);
  const path = document.createElementNS(ns, "path"); path.setAttribute("d", ICONS[name]); svg.append(path);
  return svg;
}

// A company's logo from its own site once jobwatch has found it (see logos.py), else its initials on a color
// picked from its name: the same company always looks the same.
function monogram(name) {
  const words = (name || "?").replace(/[^A-Za-z0-9 ]+/g, " ").trim().split(/\s+/).filter(Boolean);
  const letters = (words.length > 1 ? words[0][0] + words[1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
  let hash = 7;
  for (const c of (name || "").toLowerCase()) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  const el = h("div", { class: "mono", style: `--h:${hash % 360}`, "aria-hidden": "true" }, letters);
  if (name) {
    const img = h("img", { src: `/logo/${TOKEN}/${encodeURIComponent(name)}`, alt: "", loading: "lazy", decoding: "async",
      onload: () => el.classList.add("logo"), onerror: () => img.remove() });
    el.append(img);
  }
  return el;
}

function pagehead(title, sub, ...right) {
  return h("div", { class: "pagehead" }, h("div", {}, h("h1", {}, title), sub ? h("p", { class: "sub" }, sub) : null), right);
}
// Big numbers across the top: [value, label, class].
function hero(tiles) {
  return h("div", { class: "hero" }, tiles.map(([n, label, cls]) =>
    h("div", { class: "stat " + (cls || "") }, (() => { const el = h("div", { class: "num" }, "0"); countUp(el, n); return el; })(),
      h("div", { class: "lbl" }, label))));
}
function section(title, n, cls) {
  return h("div", { class: "section " + (cls || "") }, h("h3", {}, title), h("span", { class: "n" }, n));
}
function emptyState(text, extra) { return h("div", { class: "empty" }, icon("inbox", 30), text, extra); }

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDay(day, today) {
  if (!day) return "";
  const [y, m, d] = day.split("-").map(Number);
  return `${MONTHS[m - 1]} ${d}` + (today && today.slice(0, 4) !== String(y) ? `, ${y}` : "");
}
function dayDiff(day, today) { return Math.round((Date.parse(day) - Date.parse(today)) / 86400000); }
function relDay(day, today) {
  const n = dayDiff(day, today);
  return n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n > 0 ? `in ${n} days` : `${-n} days ago`;
}
function addDays(day, n) { return new Date(Date.parse(day) + n * 86400000).toISOString().slice(0, 10); }

async function api(path, body, raw) {
  const opts = { method: body === undefined && !raw ? "GET" : "POST", headers: { "X-Jobwatch-Token": TOKEN } };
  if (raw) { opts.body = raw; }
  else if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

let toastTimer;
// tone: "win" for good news, "onward" for a no or a skip, nothing for the rest (see .toast[data-tone]).
function toast(text, undo, tone, label = "Undo") {
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  t.dataset.tone = tone || "";
  const b = document.getElementById("toastUndo");
  b.textContent = label;
  b.style.display = undo ? "" : "none";
  b.onclick = async () => { t.style.display = "none"; await undo(); };
  t.style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 6000);
}

// -- delight: small celebrations for real progress. All of it stays still under "reduce motion".

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CONFETTI = ["#5a5cf2", "#a24af0", "#10b981", "#f59e0b", "#3b82f6", "#ec4899", "#22d3ee"];

// Paper confetti from an element (or the top of the screen), drawn on a throwaway canvas.
function confetti(from, { count = 90, power = 1 } = {}) {
  if (REDUCED) return;
  const canvas = h("canvas", { style: "position:fixed;inset:0;pointer-events:none;z-index:30" });
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px";
  document.body.append(canvas);
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const r = from && from.getBoundingClientRect ? from.getBoundingClientRect() : { left: W / 2, top: H * .25, width: 0, height: 0 };
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const bits = Array.from({ length: count }, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1, v = (6 + Math.random() * 9) * power;
    return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, color: CONFETTI[Math.floor(Math.random() * CONFETTI.length)],
      round: Math.random() < .3 };
  });
  const start = performance.now(), life = 1800 + 400 * power;
  (function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - life * .6) / (life * .4));
    for (const b of bits) {
      b.vx *= .985; b.vy = b.vy * .985 + .32; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.color;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot * 2)) + 2);
      ctx.restore();
    }
    if (t < life) requestAnimationFrame(frame); else canvas.remove();
  })(start);
}

// Slide a card out and close the gap it leaves.
async function leave(el, dir = 1) {
  if (!el) return;
  if (REDUCED) return el.remove();
  const hgt = el.offsetHeight;
  await el.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${dir * 48}px) scale(.98)` }],
    { duration: 260, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).finished;
  await el.animate([{ height: hgt + "px", marginTop: "12px", marginBottom: "12px", paddingTop: "18px", paddingBottom: "16px" },
    { height: "0px", marginTop: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px" }],
    { duration: 220, easing: "ease-out", fill: "forwards" }).finished;
  el.remove();
}

// Numbers roll up from zero when a page opens.
function countUp(el, n) {
  if (REDUCED || !n || main.classList.contains("quiet")) { el.textContent = Number(n).toLocaleString(); return; }
  const start = performance.now(), dur = 700 + Math.min(600, n * 4);
  (function frame(now) {
    const k = Math.min(1, (now - start) / dur), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(n * eased).toLocaleString();
    if (k < 1) requestAnimationFrame(frame);
  })(start);
}

function bump(el) { if (!el || REDUCED) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

// A job search is mostly waiting and hearing no, so the page stays on the person's side: every step they take gets
// a kind word, and every no gets put in its place. One picked at random, so it doesn't read like a form letter.
const pick = list => list[Math.floor(Math.random() * list.length)];
const CHEERS = ["Nice work!", "Another one out the door.", "That's momentum. Keep going!", "Shot taken. Good luck!",
  "One step closer.", "You showed up. That's the hard part."];
const cheer = () => pick(CHEERS);
const QUEUED = ["Good pick.", "Worth a shot.", "This one could be it.", "Nice find."];
const SKIPPED = ["Onward.", "Not the one. Next!", "Saving room for a better fit.", "Good filter."];
const PASSED = ["Their loss. Onward.", "Their loss: someone else will say yes.", "Not your fit, not your fault. Next!",
  "Every no clears the way for the right yes.", "It stings, and it says nothing about what you're worth."];
// The toast for an application moved to a stage, from its card, its table row or its gone-quiet bar.
function stageWords(company, to) {
  return {
    screening: `📞 ${company} wants to talk. Nice!`, interviewing: `🎯 Interviewing at ${company}. You've got this.`,
    offer: `🥂 An offer from ${company}! Congratulations!`, rejected: `🌱 ${company} passed. ${pick(PASSED)}`,
    withdrawn: `Withdrawn from ${company}. Good call: your time is worth protecting.`,
    applied: `${company}: back to applied.` }[to] || `${company}: marked ${to}.`;
}
const TONES = { applied: "win", queued: "win", screening: "win", interviewing: "win", offer: "win",
  rejected: "onward", withdrawn: "onward", skipped: "onward" };

// The day's hello on Today, by the local hour.
// The greeting ends in an emoji, so a dash joins it to the line, not a full stop.
function todayLine(hello, companies) { return `${hello} — new roles at the ${companies} companies you watch, best fit first.`; }
function greeting(hour) {
  return hour < 5 ? "Burning the midnight oil 🌙" : hour < 12 ? "Good morning ☀️" : hour < 17 ? "Good afternoon 🌤️"
    : "Good evening 🌆";
}

function showError(where, err) {
  where.replaceChildren(h("div", { class: "card error" }, String(err.message || err)));
}

function age(days) {
  if (days === null || days === undefined) return "";
  return days === 0 ? "posted today" : `posted ${days}d ago`;
}

// "just now", "12 min ago", "2 h ago", "3 days ago", from an ISO time.
function ago(iso) {
  const min = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${Math.round(min)} min ago`;
  if (min < 48 * 60) return `${Math.round(min / 60)} h ago`;
  return `${Math.round(min / 1440)} days ago`;
}

// "8 AM", "2:30 PM": the time of day of an ISO time, on the hour without the minutes.
function clock(iso) {
  const t = new Date(iso);
  return t.toLocaleTimeString(undefined, { hour: "numeric", ...(t.getMinutes() ? { minute: "2-digit" } : {}) });
}
// "a", "a and b", "a, b and c".
function listed(items) { return items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} and ${items.at(-1)}`; }

// A job whose board's hosted job pages are offline: where to apply instead (the server's link_note).
function linkNote(job) {
  return job.link_note ? h("div", { class: "warns linknote" }, h("b", {}, "Link: "), job.link_note) : null;
}

function people(list, most = 3) {
  const names = list.slice(0, most).map(p => (p.position ? `${p.name} (${p.position})` : p.name) +
    (p.why ? ` — ${p.why}` : ""));
  return names.join("; ") + (list.length > most ? ` and ${list.length - most} more` : "");
}

// Whom to ask for a referral, or not to: use/skip/clear, with a few words about the person (the Referrals tab, and
// "Don't use" on a job card). `who` is the person's key.
async function rateContact(who, verdict, note) {
  return api("/api/referrals/rate", { who, verdict, note: note || "" });
}

// Who you know there, people you chose to ask first and then the strongest ties, and a way to find an introduction
// when you know nobody.
function knowLine(job, most = 3) {
  const bit = p => {
    const el = h("span", {}, (p.position ? `${p.name} (${p.position})` : p.name) + (p.why ? ` — ${p.why}` : ""),
      p.note ? h("span", { class: "pnote" }, ` “${p.note}”`) : null,
      h("button", { class: "dont", title: "Never suggest this person (undo in the Referrals tab)", onclick: async () => {
        try {
          await rateContact(p.key, "skip", p.note);
          el.remove();
          toast(`${p.name} won't be suggested`, async () => { await rateContact(p.key, "clear"); render(); }, "onward");
        } catch (e) { toast(e.message); }
      } }, "Don't use"));
    return el;
  };
  const shown = job.contacts.slice(0, most), rest = job.contacts.length - shown.length;
  return h("div", { class: "know" }, icon("users", 14),
    shown.length ? h("span", {}, "You know ", shown.flatMap((p, i) => i ? ["; ", bit(p)] : [bit(p)]),
      rest > 0 ? ` and ${rest} more` : null) : null,
    link(job.find_referral, job.contacts.length ? "more on LinkedIn ↗" : "Find someone who can refer you ↗"));
}

function fitClass(score) { return score >= 75 ? "hi" : score >= 50 ? "mid" : "lo"; }

// Who made a score (score.scorer_label): "claude-sonnet-5-5", or "Qwen3.5-9B-MLX-4bit (local)".
function scorerLabel(by) {
  const [backend, ...rest] = by.split(":"), model = rest.join(":");
  return backend === "local" ? `${model.split("/").pop()} (local)` : model || backend;
}
function fitBox(fit) {
  if (!fit) return null;
  const s = Math.round(fit.score);
  return h("div", { class: "fitbox" + (fit.stale ? " stale" : ""),
                    title: `Fit ${s}/100` + (fit.stale ? " (old score, rescoring)" : "") +
                      (fit.scored_by ? `, scored by ${scorerLabel(fit.scored_by)}` : "") },
    h("div", { class: `ring ${fitClass(s)}`, style: `--p:${s}` }, h("span", {}, s)),
    h("small", {}, fit.stale ? "old score, rescoring" : `must-haves ${fit.must_haves_met}/${fit.must_haves_total}`),
    scorerTag(fit));
}
// Under the ring: whether Claude's API or the model on this computer made the score ("local, for now" when it
// stands in for Claude, which scores it again).
function scorerTag(fit) {
  if (!fit.scored_by) return null;
  const local = fit.scored_by.startsWith("local:"), agy = fit.scored_by.startsWith("agy:");
  return h("span", { class: "scorer" + (local || agy ? " local" : "") },
    local ? (fit.fallback ? "local, for now" : "local model")
      : agy ? (fit.fallback ? "agy, for now" : "agy") : "Claude API");
}

// Queue it or skip it, and why (advice.py). A queued job only shows a reason to hold off.
function adviceLine(job) {
  const a = job.advice;
  if (!a || (job.status === "queued" && a.action === "queue")) return null;
  const word = a.action === "queue" ? "Queue" : job.status === "queued" ? "Hold off" : "Skip";
  return h("div", { class: `advice ${a.action}`, "data-advice": job.key }, icon(a.action === "queue" ? "check" : "x", 14),
    h("b", {}, `Suggest ${word}: `), a.reasons.join("; "), a.though.length ? ` (though ${a.though[0]})` : "");
}
// In a job's details, where the ring would be: why there's no score yet (no posting text, still in line, ...).
function noFitBox(job) {
  const why = job.unscored?.code === "no_text" ? "no posting text" : "not scored yet";
  return h("div", { class: "fitbox", title: job.unscored?.text || "Not scored yet" },
    h("div", { class: "ring", style: "--p:0" }, h("span", {}, "–")), h("small", {}, why));
}

function gapsLine(fit) {
  if (!fit || !fit.gaps || !fit.gaps.length) return null;
  const el = h("div", { class: "gaps", title: "Click to see every gap" }, h("b", {}, "Gaps: "), fit.gaps.join(" · "));
  el.onclick = () => el.classList.toggle("open");
  return el;
}

// Each requirement the fit score judged: its verdict and the resume's words behind it.
const VERDICT = { met: "met", partial: "partly", not_met: "missing" };
function whyScore(fit) {
  if (!fit || !fit.requirements || !fit.requirements.length) return null;
  return h("details", { class: "whyfit" }, h("summary", {}, "Why this score"),
    h("ul", {}, fit.requirements.map(r => h("li", {},
      h("span", { class: `v ${r.verdict}` }, VERDICT[r.verdict] || r.verdict),
      r.requirement, r.kind === "must_have" ? h("span", { class: "muted small" }, " · must-have") : null,
      (r.evidence || []).slice(0, 2).map(q => h("q", {}, q))))));
}

// Expected pay from Levels.fyi (only when the watchlist turns it on), and how it was worked out.
function payLine(job) {
  const p = job.expected_pay;
  if (!p) return null;
  if (p.pending) return h("div", { class: "small muted", "data-pay": job.key }, "Expected pay: looking it up on Levels.fyi…");
  if (p.refused) return h("div", { class: "small muted", "data-pay": job.key },
    "Expected pay: Levels.fyi is refusing jobwatch's requests for now; it's asked again tomorrow.");
  return h("details", { class: "whyfit", "data-pay": job.key }, h("summary", {}, "Expected pay: " + p.line),
    h("ul", {}, p.why.map(w => h("li", {}, w)), h("li", {}, link(p.url, p.credit + " ↗"))));
}

// Fills in expected pay that's still being looked up in the background, until none is left. One poll per
// `scope`, so the Details dialog doesn't stop the page's.
const payTimers = {};
function watchPay(jobs, scope = "page") {
  clearTimeout(payTimers[scope]);
  let tries = 0;
  const poll = async () => {
    const waiting = jobs.filter(j => j.expected_pay && j.expected_pay.pending);
    if (!waiting.length || ++tries > 60) return;
    try {
      const r = await api("/api/pay", { keys: waiting.map(j => j.key) });
      for (const j of waiting) {
        if (!(j.key in r.pay) || (r.pay[j.key] && r.pay[j.key].pending)) continue;
        j.expected_pay = r.pay[j.key];
        document.querySelectorAll(`[data-pay="${CSS.escape(j.key)}"]`).forEach(el => {
          const line = payLine(j);
          line ? el.replaceWith(line) : el.remove();
        });
        if (r.advice && j.key in r.advice) {  // the advice again, now that the pay is known
          j.advice = r.advice[j.key];
          document.querySelectorAll(`[data-advice="${CSS.escape(j.key)}"]`).forEach(el =>
            el.replaceWith(adviceLine(j) || h("span", { "data-advice": j.key, hidden: true })));
        }
      }
      if (r.running) payTimers[scope] = setTimeout(poll, 5000);
    } catch { /* the page may be restarting: the next render tries again */ }
  };
  payTimers[scope] = setTimeout(poll, 3000);
}

// The same opening (or maybe) as a job already applied to, queued or skipped: flagged, never hidden.
function dupeBadge(d) {
  if (!d) return null;
  return h("span", { class: "badge dupe" + (d.strong ? "" : " maybe"), title: d.text },
    d.strong ? d.label : "Possible duplicate");
}

async function mark(job, status, note, label, undoStatus) {
  const origin = document.activeElement;
  const r = await api("/api/mark", { keys: job.keys || [job.key], status, note });
  if (r.warning) label = `${label}. ${r.warning}`;
  const card = document.getElementById("job-" + job.key);
  if (status === "applied") { confetti(origin); label = `🎉 Applied: ${job.title}. ${cheer()}`; drawPace(); }
  await leave(card, status === "skipped" ? -1 : 1);
  if (tab === "today") {
    todayJobs = todayJobs.filter(j => j.key !== job.key);
    if (todayJobs.length && !main.querySelector(".card.job")) drawToday();
  }
  if (tab === "queue") {
    queueJobs = queueJobs.filter(j => j.key !== job.key);
    if (queueJobs.length && !main.querySelector(".card.job")) drawQueue();
  }
  refreshQueueCount();
  toast(label, undoStatus ? async () => {
    await api("/api/mark", { keys: job.keys || [job.key], status: undoStatus });
    render();
  } : null, TONES[status]);
  if (!main.querySelector(".card.job") && (tab === "today" || tab === "queue")) {
    const [title, text] = tab === "today"
      ? ["All caught up", "You've been through every match. New roles show up here when you check again."]
      : ["Queue cleared", "Every job you picked has been handled. Nicely done."];
    fill(main.querySelector(".cards") || main, h("div", { class: "empty done" }, h("div", { class: "big" }, "✨"),
      h("h2", {}, title), text));
    confetti(null, { count: 60, power: .8 });
  }
}

function detailsButton(job) {
  return h("button", { class: "btn ghost", onclick: () => openDetails(job.key) }, "Details", icon("arrow", 13));
}

// Why a job has no fit score yet (the server's `unscored`: in line, no posting text, failed...).
// No Score fit button while it's being scored, or for a post listing several roles (never scored).
const NO_SCORE_BUTTON = ["scoring", "many_roles"];
function unscoredNote(job) {
  return job.unscored ? h("span", { class: "muted small", title: job.unscored.text }, job.unscored.text) : null;
}
// A job with only a title (from an alert email) gets its posting here: a link jobwatch reads, or the text.
function postingButton(job, done) {
  const b = h("button", { class: "btn", title: "Add a link to the company's posting, or paste its text, so it can be scored" },
    "Add the posting");
  b.onclick = () => {
    const url = h("input", { type: "url", placeholder: "Link to the company's posting" });
    const text = h("textarea", { rows: 4, placeholder: "…or paste the posting's text" });
    const save = h("button", { class: "btn primary" }, "Save");
    save.onclick = async () => {
      save.disabled = true;
      try {
        const r = await api("/api/posting", { key: job.key, url: url.value, text: text.value });
        toast(r.said);
        done(r);
      } catch (e) { save.disabled = false; toast(e.message); }
    };
    b.replaceWith(h("div", { style: "flex-basis:100%; display:grid; gap:8px" }, url, text, h("div", {}, save)));
  };
  return b;
}

function scoreButton(job, canScore, card = j => todayCard(j, canScore, 0)) {
  if (job.fit && !job.fit.stale) return null;
  const redraw = j => document.getElementById("job-" + j.key).replaceWith(card(j));
  if (job.unscored?.code === "no_text")
    return [postingButton(job, r => {
      if (r.has_text) job.unscored = { code: "queued", text: "Posting added: in line to score" };
      redraw(job);
    }), unscoredNote(job)];
  if (!canScore || NO_SCORE_BUTTON.includes(job.unscored?.code)) return unscoredNote(job);
  const b = h("button", { class: "btn", title: "Compare this posting with your resume (can take a while)" }, "Score fit");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Scoring…";
    try {
      job.fit = await api("/api/score", { key: job.key });
      redraw(job);
    } catch (e) { b.disabled = false; b.textContent = "Score fit"; toast(e.message); }
  };
  return [b, unscoredNote(job)];
}

function todayCard(job, canScore, i) {
  return jobCard(job, [
    h("button", { class: "btn primary",
      onclick: () => mark(job, "queued", null, `📌 Queued: ${job.title}. ${pick(QUEUED)}`, job.status) }, "Queue"),
    h("button", { class: "btn",
      onclick: () => mark(job, "skipped", null, `Skipped: ${job.title}. ${pick(SKIPPED)}`, job.status) }, "Skip"),
    detailsButton(job), scoreButton(job, canScore),
  ], i);
}

      h("div", {},
        h("div", { class: "row", style: "align-items:flex-start" }, h("h2", { style: "flex:1" }, j.title), fitBox(j.fit) || noFitBox(j),
          h("button", { class: "btn", onclick: closeDetails }, "Close")),
        h("div", { class: "meta" }, [j.company, j.locations.join("; "), j.pay].filter(Boolean).join(" · ")),

        payLine(j),
        gapsLine(j.fit),
        whyScore(j.fit),
        knowLine(j, 10),
        h("div", { class: "row actions" }, link(j.url, "Open the posting ↗"), detailsScore(j),
          j.candidate_home ? h("span", { title: "This company's own Workday account: sign in to see where your application stands" },
            link(j.candidate_home, "Your applications there ↗")) : null,
          APPLIED.includes(j.status) ? [j.sheets?.length && j.sheets_base
            ? h("a", { class: "btn", href: j.sheets_base + encodeURIComponent(j.sheets[0]), target: "_blank", rel: "noopener",
              title: `Your prep sheet, ${j.sheets[0]}, in a new tab` }, "Prep sheet ↗")
            : h("button", { class: "btn", onclick: () => openPrepPage(j.key),
              title: "Their asks next to your resume, gaps, what you sent, questions to expect, in a new tab" }, "Prep sheet ↗"),
            h("button", { class: "btn", onclick: () => openPrep(j.key),
              title: "Find a story, a mock interview and drafted answers for this job" }, "Practise")] : null,
          h("span", { class: "muted small" }, "· key "), h("code", { class: "small" }, j.key)),
        APPLIED.includes(j.status) || hasPackage(j.package) ? sentSection(j) : null,
        gapChips(j.skills),
        h("div", { class: "posting" }, j.text)),
      h("div", { class: "job-chat" }, chatBox({
        key: j.key, title: `Ask about ${j.company}`, intro: `Ask anything about ${j.title}: how you fit, what to lead with, how to prepare.`,
        suggestions: APPLIED.includes(j.status)
          ? ["Prep me for a recruiter call about this role", "What did I tell them? Sum up what I sent",
            "What are they likely to ask in interviews?", "Draft a short follow-up note to the recruiter"]
          : ["How well do I fit this role, honestly?", "What should my resume lead with for this one?",
            "What are they likely to ask in interviews?", "Draft a short note to a recruiter here"],
