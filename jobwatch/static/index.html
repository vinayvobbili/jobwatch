  const run = async () => {
    if (!job.can_tailor) { job.tailor_help = job.tailor_setup; draw(); return ["skip", "Resume: set up resume-kit", job.tailor_help]; }
    try {
      const r = await api("/api/tailor", { key: job.key });
      job.resume = r.pdf; job.tailor_help = null;
      draw(r);
      return [r.ok ? "ok" : "warn", `Resume ${r.new ? "drafted" : "rebuilt"}`, r.problems.join(" ")];
    } catch (e) { job.tailor_help = e.message; draw(); return ["err", "Resume failed", e.message]; }
  };
  draw();
  return { el: out, run };
}

// The ATS step: which of the posting's keywords this job's resume doesn't show, read from the PDF's text the way a
// parser reads it (see ats.py), and what would trip the parser. Local; nothing is changed.
function atsPanel(job) {
  const out = h("div", { class: "tailor ats", hidden: true, "data-step": "ats" });
  const draw = r => {
    out.hidden = false;
    out.dataset.tone = r.error || (r.checks && (r.checks.length || r.score < 70)) ? "warn" : "ok";
    fill(out,
      r.older ? h("div", { class: "small muted" }, `Checked ${String(r.at || "").slice(0, 10)}. The posting or the resume has ` +
        "changed since: press Prepare again to check it again.") : null,
      r.error ? h("span", { class: "problems" }, r.error) : [
        h("span", { class: "badge" + (out.dataset.tone === "warn" ? " warn" : "") },
          r.score == null ? "no keywords" : `ATS ${r.score}% · ${r.found.length} of ${r.found.length + r.missing.length}`),
        h("span", { class: "small" }, `${r.file}${r.tailored ? "" : " (general resume, not tailored)"}`),
        r.missing.length ? h("div", { class: "review small" }, "Missing from its text: ",
          r.missing.map(m => h("span", { class: "ats-miss", title: `${m.count}× in the posting` }, m.term + (m.kind === "must" ? " *" : ""))),
          h("span", { class: "muted" }, " (* asked for). Add one only where it's true of you.")) : null,
        r.checks.length ? h("div", { class: "problems" }, r.checks.join("\n")) : null]);
  };
  const run = async () => {
    try {
      const r = await api("/api/ats?key=" + encodeURIComponent(job.key));
      draw(r);
      return [out.dataset.tone, r.score == null ? "ATS: no keywords" : `ATS ${r.score}%`, r.checks.join(" ")];
    } catch (e) { draw({ error: e.message }); return ["err", "ATS check failed", e.message]; }
  };
  // The last check saved with the job (job.prepare.ats), drawn again after a reload: no check is run. [state, text,
  // detail, older] for its chip, or null when none is saved. `older`: the posting or the resume changed after it.
  const restore = () => {
    const r = job.prepare && job.prepare.ats;
    if (!r) return null;
    draw(r);
    const day = String(r.at || "").slice(0, 10);
    return [out.dataset.tone, (r.score == null ? "ATS: no keywords" : `ATS ${r.score}%`) + (r.older ? " · older" : ""),
      r.older ? `Checked ${day}; the posting or the resume has changed since.` : `Checked ${day}.`, !!r.older];
  };
  return { el: out, run, restore };
}

// The cover letter step: a draft in a tone you pick, leaning on what you say, from the posting, resume and
// stories by the local model (see cover.py). Each draft is kept as a version; with two or more, the last two show
// side by side. A draft to edit and copy: nothing is sent. "Draft another" in the panel writes a new version.
function coverPanel(job) {
  const out = h("div", { class: "tailor cover", hidden: true, "data-step": "cover" });
  const tone = h("select", { "aria-label": "Tone" });
  const emphasis = h("input", { type: "text", placeholder: "Lean on… (optional, e.g. my incident-response work)",
    "aria-label": "Emphasis", maxlength: 300 });
  const draw = (state, busy) => {
    const v = (state.versions || []).at(-1), warn = state.warnings || [];
    out.dataset.tone = state.error || warn.length ? "warn" : "ok";
    const body = h("textarea", { rows: 12, "aria-label": "Cover letter" }); body.value = v ? v.letter : "";
    fill(out,
      h("div", { class: "fu-head" }, tone, emphasis,
        h("button", { class: "btn primary", disabled: busy, onclick: draft }, v ? "Draft another" : "Draft"),
        v ? h("span", { class: "small muted" }, `v${v.version} · ${v.tone} · ${v.words} words`) : null),
      state.error ? h("div", { class: "problems" }, state.error) : null,
      v ? [body, h("div", { class: "row" },
        h("button", { class: "btn", onclick: async () => {
          try { await navigator.clipboard.writeText(body.value); toast("Copied the letter"); } catch { body.select(); }
        } }, "Copy"),
        h("span", { class: "small muted" }, "A draft: edit it and send it yourself. Edits here aren't saved.")) ] : null,
      warn.length ? h("div", { class: "problems" }, warn.join("\n")) : null,
      state.compare ? coverCompare(state.compare) : null);
  };
  const load = async (extra = {}) => {
    const s = await api("/api/cover?key=" + encodeURIComponent(job.key));
    if (!tone.options.length) {
      for (const t of s.tones) tone.append(h("option", { value: t }, t[0].toUpperCase() + t.slice(1)));
      tone.value = "direct";
    }
    const compare = s.versions.length > 1 ? await api("/api/cover/compare?key=" + encodeURIComponent(job.key)) : null;
    draw({ ...s, compare, ...extra });
  };
  async function draft() {
    out.hidden = false; unread = false;
    draw({ versions: [], warnings: [] }, true);
    const [t, e] = [tone.value || "direct", emphasis.value];
    let result;
    try {
      const r = await api("/api/cover", { key: job.key, tone: t, emphasis: e });
      await load({ warnings: r.warnings });
      result = r.drafted ? [r.warnings.length ? "warn" : "ok", `Cover letter v${r.version}`, r.warnings.join(" ")]
        : ["warn", "Cover letter: no draft", r.warnings.join(" ")];
    } catch (err) {
      try { await load({ error: err.message }); } catch { draw({ versions: [], error: err.message }); }
      result = ["err", "Cover letter failed", err.message];
    }
    tone.value = t; emphasis.value = e;
    return result;
  }
  // Versions saved with the job (job.prepare.cover) show after a reload: the chip is there at once, and the letters
  // are read from disk (GET, no model) the first time its panel opens.
  let unread = false;
  const restore = () => {
    const c = job.prepare && job.prepare.cover;
    if (!c) return null;
    out.hidden = false; unread = true;
    out.dataset.tone = "ok";
    fill(out, h("span", { class: "small muted" }, busyNote("Loading the letter…")));
    return ["ok", `Cover letter v${c.version}`, `${c.tone || "letter"}, ${c.words} words, drafted ${c.at}`];
  };
  const opened = async () => {
    if (!unread) return;
    unread = false;
    try { await load(); } catch (e) { draw({ versions: [], error: e.message }); }
  };
  return { el: out, run: draft, restore, opened };
}

// "Prepare": the three steps above, one after the other, for one job. Each step's result stays with the card but
// folded away: the card shows only a row of chips that say which step is running and how each ended, and each chip is
// a toggle that opens its result in a panel under the row (one at a time, scrolling inside itself, so a long error
// or a whole cover letter never stretches the card). A step that can't run (resume-kit isn't set up, no model, no
// posting text) says why in its own panel, and the steps after it still run. Returns [button, panel].
// The same job object gets the same button and panel back when its card is drawn again (a re-sort, a score arriving),
// so an open panel, and a letter being edited in it, survive the redraw.
const prepared = new WeakMap();
const firstSentence = t => {
  const s = String(t || "").replace(/\s+/g, " ").trim(), m = s.match(/^.*?[.!?](?=\s|$)/);
  const one = m ? m[0] : s;
  return one.length > 140 ? one.slice(0, 137).trimEnd() + "…" : one;
};
function prepareButton(job) {
  if (prepared.has(job)) return prepared.get(job);
  const steps = [["tailor", "Resume", tailorPanel(job)], ["ats", "ATS check", atsPanel(job)],
    ["cover", "Cover letter", coverPanel(job)]];
  const uid = Math.random().toString(36).slice(2, 8), details = {};
  const chips = h("div", { class: "prep-steps", role: "group", "aria-label": "Prepare results" },
    steps.map(([id, name, p]) => {
      p.el.id = `prep-${uid}-${id}`;
      p.el.setAttribute("role", "region");
      p.el.setAttribute("aria-label", `${name} result`);
      return h("button", { type: "button", class: "prep-chip", "data-step": id, "data-state": "wait",
        "aria-expanded": "false", "aria-controls": p.el.id, onclick: () => toggle(id) }, name);
    }));
  const status = h("span", { class: "sr-only", role: "status", "aria-live": "polite" });
  const saved = job.prepare || {};  // what Prepare saved with the job: chips after a reload (the resume is job.resume)
  const anySaved = !!(job.resume || saved.resume || saved.ats || saved.cover);
  const out = h("div", { class: "prepare", hidden: !(anySaved || job.tailor_help) }, chips, status, steps.map(([, , p]) => p.el));
  const chipOf = id => chips.querySelector(`[data-step="${id}"]`);
  let open = null;
  // A chip with nothing behind it yet (its panel is hidden) can't open; the others toggle.
  const sync = () => {
    for (const [id, , p] of steps) {
      const c = chipOf(id), shown = open === id && !p.el.hidden;
      c.disabled = p.el.hidden;
      c.hidden = c.disabled && c.dataset.state === "wait";  // a step that hasn't run has nothing to show or fold
      c.setAttribute("aria-expanded", String(shown));
      p.el.classList.toggle("open", shown);
      const d = firstSentence(details[id] || (id === "tailor" ? job.tailor_help : ""));
      c.title = (d ? `${d}\n` : "") + (c.disabled ? "Nothing to show yet." : shown ? "Click to fold it away." : "Click to open it.");
    }
  };
  const toggle = id => {
    open = open === id ? null : id; sync();
    const panel = steps.find(([sid]) => sid === id)[2];
    if (open === id && panel.opened) panel.opened();
  };
  const b = actButton("prepare", { class: "prepare-go", title: "Tailor a resume for this job, check it against the " +
    "posting's keywords (ATS), and draft a cover letter, in that order. All three are kept with the job; you review them " +
    "before you apply. Local model; nothing is sent." }, anySaved ? "Prepare again" : "Prepare");
  const chip = (id, state, text, detail = "", older = false) => {
    const c = chipOf(id);
    c.dataset.state = state; c.textContent = text; details[id] = detail;
    c.toggleAttribute("data-older", older);
  };
  b.onclick = async () => {
    b.disabled = true; b.classList.add("spin"); out.hidden = false; open = null;
    for (const [id, name] of steps) chip(id, "wait", name);
    sync();
    const done = [];
    const tick = h("span", {});  // one clock for the whole run, moved to each step's label
    const stop = spinnerClock(tick, { say: "Preparing", owner: b, usual: "prepare" });
    for (const [id, name, panel] of steps) {
      chip(id, "run", `${name}…`); sync();
      b.replaceChildren(icon("refresh", 14), `Preparing: ${name.toLowerCase()}… `, tick);
      let state, text, detail;
      try { [state, text, detail] = await panel.run(); } catch (e) { [state, text, detail] = ["err", `${name} failed`, e.message]; }
      chip(id, state, text, detail);
      sync();
      done.push(text);
    }
    stop(steps.every(([id]) => chipOf(id).dataset.state === "ok"));  // a failed step's time isn't a usual one
    b.classList.remove("spin"); b.disabled = false;
    b.replaceChildren(icon("sparkle", 14), "Prepare again");
    status.textContent = `Prepared: ${done.join(", ")}.`;
    toast(`✨ Prepared ${job.company}: ${done.join(", ")}. Review them, then apply.`,
      null, steps.every(([id]) => chipOf(id).dataset.state === "ok") ? "win" : "");
  };
  // Saved results come back as chips, each opening the same panel a live run fills; none of this runs a step.
  if (job.resume || saved.resume) chip("tailor", "ok", "Resume", job.resume || saved.resume.name);
  for (const [id, , panel] of steps) {
    const r = panel.restore && panel.restore();
    if (r) chip(id, ...r);
  }
  sync();
  prepared.set(job, [b, out]);
  return [b, out];
}

// Two letter versions side by side, a row per sentence: changed ones are marked, added and removed ones too.
function coverCompare(c) {
  const cell = (text, tag, side) => h("div", { class: "cc " + (text ? tag : "empty") + " " + side }, text);
  return h("div", { class: "cover-compare" },
    h("div", { class: "small muted" }, `Side by side: v${c.a} and v${c.b}`),
    h("div", { class: "cc-grid" }, h("b", {}, `v${c.a}`), h("b", {}, `v${c.b}`),
      c.rows.map(r => r.left || r.right ? [cell(r.left, r.tag, "l"), cell(r.right, r.tag, "r")] : [h("div"), h("div")])));
}

// "Draft follow-up" on an application: the email to send a week after applying, or (for a stage with a call
// behind it) a thank-you, written by Claude from a few allowed fields of the tracker, or by the local model when Claude
// can't answer (see followup.py). A draft to edit and copy:
// nothing is sent or saved. Returns [button, panel].
function followupButton(a) {
  const out = h("div", { class: "tailor followup", hidden: true });
  const b = h("button", { class: "btn ghost", title: "Draft a follow-up or thank-you email from what's tracked " +
    "(written by Claude from the company, title, stage, day applied, a first name and safe note lines; pay, " +
    "employer, visa, health and contact lines stay on this computer; no email is sent)" }, icon("pencil", 13), "Draft follow-up");
  const kind = h("select", { "aria-label": "Kind of email" },
    h("option", { value: "followup" }, "Follow-up"), h("option", { value: "thanks" }, "Thank-you"));
  kind.value = ["screening", "interviewing"].includes(a.status) ? "thanks" : "followup";
  const draft = async () => {
    b.disabled = true; kind.disabled = true;
    const stop = buttonBusy(b, "Drafting…", { usual: "followup" });
    out.hidden = false;
    try {
      const r = await api("/api/followup", { key: a.key, thanks: kind.value === "thanks" });
      stop(r.drafted);
      const body = h("textarea", { rows: 8, "aria-label": "Email body" }); body.value = r.body;
      const subject = h("input", { type: "text", "aria-label": "Subject" }); subject.value = r.subject;
      out.dataset.tone = r.drafted && !r.warnings.length ? "ok" : "warn";
      fill(out,
        h("div", { class: "fu-head" }, kind,
          r.to.length ? h("span", { class: "small" }, "To: " + r.to.join(", ")) : null,
          r.written_by ? h("span", { class: "small muted", title: r.local ? "Written on this computer" :
            `Written by ${r.model} from an allowlist of fields` }, "Written by " + r.written_by) : null),
        r.drafted ? [subject, body,
          h("div", { class: "row" },
            h("button", { class: "btn", onclick: async () => {
              try { await navigator.clipboard.writeText(`Subject: ${subject.value}\n\n${body.value}`); toast("Copied the draft"); }
              catch { body.select(); }
            } }, "Copy"),
            h("button", { class: "btn ghost", onclick: draft }, "Redraft"),
            h("span", { class: "small muted" }, "A draft: read it and send it yourself."))] : null,
        r.warnings.length ? h("div", { class: "problems" }, r.warnings.join("\n")) : null);
    } catch (e) {
      fill(out, h("div", { class: "fu-head" }, kind), h("div", { class: "problems" }, e.message));
      out.dataset.tone = "warn";
    }
    stop();
    fill(b, icon("pencil", 13), "Draft follow-up");
    b.disabled = false; kind.disabled = false;
  };
  kind.onchange = draft;
  b.onclick = draft;
  return [b, out];
}

function todayCard(job, canScore, i) {

    actButton("queue", {
      onclick: () => mark(job, "queued", null, `📌 Queued: ${job.title}. ${pick(QUEUED)}`, job.status) }),

    detailsButton(job), scoreButton(job, canScore),
  ], i);
}

// -- interview rounds: one application's rounds as a timeline (timeline.py). The server says each round's state: done,

Object.assign(ICONS, {
  phone: "M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z",

  coffee: "M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3",
  gift: "M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z",
  chat: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  trash: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6",
  expand: "M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7",
});
// The icon and colour of each kind of round.
const ROUND_LOOK = {
  recruiter_screen: ["phone", "#06b6d4"], hiring_manager: ["user", "#8b5cf6"], technical: ["code", "#f59e0b"],
  system_design: ["layers", "#ec4899"], panel: ["users", "#5a5cf2"], executive: ["star", "#f43f5e"],
  hr: ["heart", "#10b981"], informal: ["coffee", "#14b8a6"], offer_call: ["gift", "#22c55e"], "": ["chat", "#64748b"] };
const roundLook = kind => ROUND_LOOK[kind] || ROUND_LOOK[""];
const ROUND_MODES = ["Teams", "Zoom", "Google Meet", "Phone", "Onsite", "Video"];
const ROUND_OUTCOMES = ["Went well", "Mixed", "Went badly", "Moved forward", "Not moving forward"];
const ROUND_NEEDS_STEP = "This round comes from the next step: change the next step to move it";
function hhmm12(t) {
  if (!t) return "";
  const [hh, mm] = t.split(":").map(Number);
  return `${hh % 12 || 12}${mm ? ":" + String(mm).padStart(2, "0") : ""} ${hh < 12 ? "AM" : "PM"}`;
}
// "12 PM–1 PM" from a start and a length in minutes, just the start with no length, "" with no time.
function roundTimes(r) {
  if (!r.time) return "";
  if (!r.length) return hhmm12(r.time);
  const [hh, mm] = r.time.split(":").map(Number), end = hh * 60 + mm + r.length, p = n => String(n).padStart(2, "0");
  return `${hhmm12(r.time)}–${hhmm12(`${p(Math.floor(end / 60) % 24)}:${p(end % 60)}`)}`;
}
function roundDayName(day, today) {
  return new Date(day + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" }) + " " + fmtDay(day, today);
}
// "Mon Nov 30 · 12 PM–1 PM · in 3 days": when a round is or was, `rel` adding how far off.
function roundWhen(r, today, rel = true) {
  if (!r.day) return "Date not set yet";
  return [roundDayName(r.day, today), roundTimes(r), rel ? relDay(r.day, today) : ""].filter(Boolean).join(" · ");
}
const roundClass = state => state === "next" ? "upnext" : state;  // .next is the Applications row's next-step line
const roundWord = r => r.state === "done" ? "Done" : r.state === "held" ? "Held" : r.state === "next" ? "Next" : "Later";
// The strip of dots: one for each round by its state, then the dashed one for what isn't scheduled.
function roundDots(states) {
  return h("span", { class: "rdots", "aria-hidden": "true" }, states.map(s => h("i", { class: "rd " + roundClass(s) })), h("i", { class: "rd later" }));
}
// The one-line summary on the lists: "Round 3 of ? · next: Panel Mon Nov 30" and the dots. Null with no rounds.
function roundsChip(rs) {
  if (!rs || !rs.chip) return null;
  return h("span", { class: "rchip", title: `Interview rounds: ${rs.chip}. Later rounds aren't scheduled yet.` },
    roundDots(rs.dots || (rs.items || []).map(i => i.state)), h("span", {}, rs.chip));
}

// A dialog on top of the Details dialog (or the page): the app's dialog stack. One Esc closes the top one only.
const roundShades = [];
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !roundShades.length) return;
  e.stopImmediatePropagation(); e.preventDefault();
  roundShades[roundShades.length - 1].close();
}, true);
function roundShade(label, extra = "") {
  const shade = h("div", { class: "overlay rescore-shade rounds-shade", style: "display:flex" });
  const box = h("div", { class: "dialog rounds-dialog " + extra, role: "dialog", "aria-modal": "true", "aria-label": label });
  const was = document.activeElement;
  const entry = { close: () => { roundShades.splice(roundShades.indexOf(entry), 1); shade.remove(); was?.focus?.(); } };
  shade.onclick = e => { if (e.target === shade) entry.close(); };
  shade.append(box);
  document.body.append(shade);
  roundShades.push(entry);
  return { box, close: entry.close };
}

// The form to add a round or change one: kind (with what each kind is), date, time, how long, who, where, outcome and
// a note. Enter saves, Esc cancels. A round the next step names can't be moved here: its day and time stay as the step says.
function roundForm(rs, r, { label, submit, cancel }) {
  const kind = h("select", { "aria-label": "Kind of round" }, rs.kinds.map(k => h("option", { value: k.id, title: k.help }, k.label)));
  kind.value = r.kind || "";
  const help = h("div", { class: "rhelp muted small" });
  const showHelp = () => { help.textContent = (rs.kinds.find(k => k.id === kind.value) || {}).help || ""; };
  kind.onchange = showHelp; showHelp();
  const locked = r.source === "next_step" && r.state !== "done";
  const day = h("input", { type: "date", "aria-label": "Date", title: locked ? ROUND_NEEDS_STEP : "The day it is or was", disabled: locked }),
    time = h("input", { type: "time", "aria-label": "Time", title: locked ? ROUND_NEEDS_STEP : "When it starts", disabled: locked }),
    length = h("input", { type: "text", placeholder: "45m", "aria-label": "How long", title: "How long it lasts: 30m, 1h" }),
    who = h("input", { type: "text", placeholder: "Dana Lee, Sam Ortiz", "aria-label": "Who you met or will meet" }),
    mode = h("select", { "aria-label": "Where" }, ["", ...ROUND_MODES, ...(r.mode && !ROUND_MODES.includes(r.mode) ? [r.mode] : [])]
      .map(m => h("option", { value: m }, m || "Where: not set"))),

// The built prep sheet as its own page, in a new tab, for a job with no sheet you wrote. The tab opens on the click,
// since one opened after waiting for the sheet would be blocked, and shows the sheet once it's built.
async function openPrepPage(key) {
  const tab = window.open("", "_blank");
  if (!tab) return toast("Couldn't open a new tab: your browser blocked it");
  tab.document.title = "Prep sheet…";
  try {
    const p = await api("/api/prep?key=" + encodeURIComponent(key));
    const url = URL.createObjectURL(new Blob([p.html], { type: "text/html" }));
    tab.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { tab.close(); toast(e.message); }
}

        const r = await fetch("/api/mock/feedback", { method: "POST", signal: busy.signal,
          body: JSON.stringify({ key, question: q.question, answer }),
          headers: { "X-Jobwatch-Token": TOKEN, "Content-Type": "application/json" } });

const chats = new Map();  // "home" or a job key -> [{role, content}], kept while the page is open
let chatInfo = null;
function getChatInfo() { return chatInfo ??= api("/api/chat").catch(e => ({ error: e.message })); }

// A safe subset of Markdown (paragraphs, lists, headings, bold, code, links), built as DOM nodes.
function inline(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:[^)\s]+\))/).filter(Boolean).map(part => {
    let m;
    if (/^\*\*[^*]+\*\*$/.test(part)) return h("strong", {}, part.slice(2, -2));
    if (/^`[^`]+`$/.test(part)) return h("code", {}, part.slice(1, -1));
    if ((m = part.match(/^\[([^\]]+)\]\((https?:[^)\s]+)\)$/))) return link(m[2], m[1]);
    return part;
  });
}
function md(text) {
  const out = [];
  let list = null;
  for (const line of text.split("\n")) {
    let m;
    if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/))) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (!list || list.tagName.toLowerCase() !== tag) out.push(list = h(tag, {}));
      list.append(h("li", {}, inline(m[2])));
    } else {
      list = null;
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) out.push(h("p", {}, h("strong", {}, inline(m[1]))));
      else if (line.trim()) out.push(h("p", {}, inline(line)));
    }
  }
  return out;
}

// "⚡ 14.2s (1.9s to first word) | 3,210→412 tokens | 28 tokens/s", from the reply's stats.
function statsText(s) {
  if (!s) return "";
  const paren = parts => parts.some(Boolean) ? ` (${parts.filter(Boolean).join(", ")})` : "";
  const n = x => Number(x).toLocaleString();
  return "⚡ " + [
    s.seconds != null ? `${s.seconds}s` + paren([s.waited_seconds ? `${s.waited_seconds}s waiting for a fit score` : "",
      s.first_seconds ? `${Math.max(0, s.first_seconds - (s.waited_seconds || 0)).toFixed(1)}s to first word` : ""]) : "",
    s.output_tokens ? (s.input_tokens ? `${n(s.input_tokens)}→` : "") + `${n(s.output_tokens)} tokens` : "",
    s.tokens_per_sec ? `${s.tokens_per_sec} tokens/s` : "",
    s.peak_memory_gb ? `${s.peak_memory_gb} GB peak` : "",
  ].filter(Boolean).join(" | ");
}
function copyButton(text) {
  const b = h("button", { class: "icon-btn", title: "Copy", "aria-label": "Copy the reply" }, icon("copy", 13));
  b.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text());
      fill(b, icon("check", 13)); b.classList.add("copied");
      setTimeout(() => { fill(b, icon("copy", 13)); b.classList.remove("copied"); }, 1500);
    } catch { toast("Couldn't copy: your browser blocked it"); }
  };
  return b;
}
function replyMeta(m) {
  return h("div", { class: "msg-meta" }, copyButton(() => m.content),
    m.stats ? h("span", { title: m.stats.model || "" }, statsText(m.stats)) : null);
}
// How long replies took lately (kept in this browser), for "~20s expected" while the next one is written.
// The same record every spinner keeps (usualSeconds, the spinner clock), under the kind "chat".
const expectedSeconds = () => usualSeconds("chat");
const rememberSeconds = s => rememberUsual("chat", s);

function chatBox({ key = null, title, intro, suggestions, onclose }) {
  const id = key || "home";
  if (!chats.has(id)) chats.set(id, []);
  const history = chats.get(id);
  const log = h("div", { class: "chat-log", "aria-live": "polite" });
  const where = h("span", { class: "where" }, "…");
  getChatInfo().then(i => {
    if (i.error) return fill(where, i.error);
    where.classList.toggle("private", i.local);
    where.title = i.local ? `${i.model} runs on this computer. Nothing you ask leaves it.`
      : `Sent to Anthropic's ${i.model}, with your resume and the job data shown here.`;
    fill(where, icon(i.local ? "lock" : "cloud", 12), i.local ? "Private · runs on this computer" : `${i.label} · cloud`);
  });
  const input = h("textarea", { rows: 1, placeholder: "Ask anything…", "aria-label": "Your question" });
  const send = h("button", { class: "send", type: "submit", title: "Send (Enter)", "aria-label": "Send" }, icon("send", 17));
  const save = h("button", { class: "icon-btn", title: "Download the conversation", "aria-label": "Download the conversation",
    onclick: () => {
      const text = `# ${title}\n\n` + history.map(m => (m.role === "user" ? "**You:** " : "**jobwatch:** ") + m.content +
        (m.stats ? `\n\n_${statsText(m.stats)}_` : "")).join("\n\n---\n\n") + "\n";
      const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/markdown" })),
        download: title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".md" });
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } }, icon("download", 15));
  const fresh = h("button", { class: "icon-btn", title: "Start over", "aria-label": "Start over",
    onclick: () => { if (busy) busy.abort(); history.length = 0; draw(); input.focus(); } }, icon("refresh", 15));
  let busy = null;  // an AbortController while a reply streams

  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, 160) + "px"; };
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const setBusy = on => {
    fill(send, icon(on ? "stop" : "send", on ? 14 : 17));
    send.classList.toggle("stop", on);
    send.title = on ? "Stop" : "Send (Enter)";
    send.disabled = !on && !input.value.trim();
    fresh.style.visibility = save.style.visibility = history.length ? "" : "hidden";
  };
  const draw = () => {
    fill(log, history.length ? history.map(m => m.role === "user" ? h("div", { class: "msg user" }, m.content)
      : h("div", { class: "turn" }, h("div", { class: "msg bot" }, md(m.content)), replyMeta(m)))
      : h("div", { class: "chat-hello" }, h("div", { class: "spark" }, icon("sparkle", 24)), h("div", {}, intro),
        h("div", { class: "suggest" }, suggestions.map(s => h("button", { onclick: () => ask(s) }, s)))));
    scroll();
    setBusy(!!busy);
  };

  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;
    history.push({ role: "user", content: text });
    input.value = ""; grow();
    busy = new AbortController();
    draw();
    const expect = expectedSeconds(), clock = h("span", {});
    const status = h("span", {}, expect ? `~${expect}s expected` : "");
    const out = h("div", { class: "msg bot" }, h("div", { class: "thinking" },
      h("span", { class: "dots", "aria-label": "Thinking" }, h("i"), h("i"), h("i")), clock, status));
    const turn = h("div", { class: "turn" }, out);
    let told = false;  // the server said what it waits for
    // The shared spinner clock counts; the estimate is worded here, with what the shared local model is likely doing.
    const stopClock = spinnerClock(clock, { say: "Thinking", onTick: s => {
      // Well past the estimate with no word from the server: the shared local model is likely on another job.
      if (expect && !told && s > 2 * expect) status.textContent = "taking longer than expected; the local model may be busy with another job, so your question is queued";
    } });
    log.append(turn); scroll();
    let reply = "", failed = null, queued = false, stats = null, finished = false;
    const paint = () => {  // the reply so far, with a caret while it's still being written
      queued = false;
      fill(out, md(reply));
      let last = out.lastElementChild;
      if (last && /^(UL|OL)$/.test(last.tagName)) last = last.lastElementChild;
      if (!finished) (last || out).append(h("span", { class: "caret" }, "▋"));
      scroll();
    };
    try {
      const r = await fetch("/api/chat", { method: "POST", signal: busy.signal,
        body: JSON.stringify({ key, messages: history.map(({ role, content }) => ({ role, content })) }),
        headers: { "X-Jobwatch-Token": TOKEN, "Content-Type": "application/json" } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const msg = JSON.parse(buf.slice(0, nl));
          buf = buf.slice(nl + 1);
          if (msg.text) { stopClock(); reply += msg.text; if (!queued) { queued = true; requestAnimationFrame(paint); } }
          if (msg.stats) stats = msg.stats;
          if (msg.status) { told = true; status.textContent = msg.status + "…"; }
          if (msg.error) failed = msg.error;
        }
      }
    } catch (e) { failed = e.name === "AbortError" ? "stopped" : e.message; }
    busy = null;
    stopClock();
    if (reply) {
      const entry = { role: "assistant", content: reply, stats };
      history.push(entry);
      finished = true;
      paint();
      if (failed) out.append(h("p", { class: "stopped" }, failed === "stopped" ? "Stopped." : `Cut off: ${failed}`));
      turn.append(replyMeta(entry));
      if (stats?.seconds && !failed) rememberSeconds(Math.round(stats.seconds - (stats.waited_seconds || 0)));  // the reply alone
    } else {
      history.pop();  // nothing came back: give the question back to edit or resend
      if (failed !== "stopped") { input.value = text; grow(); }
      draw();
      if (failed && failed !== "stopped") log.append(h("div", { class: "msg bot err" }, failed));
      scroll();
    }
    setBusy(false);
  }

  input.oninput = () => { grow(); setBusy(!!busy); };
  input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } };
  const form = h("form", { class: "chat-input", onsubmit: e => { e.preventDefault(); busy ? busy.abort() : ask(input.value); } },
    input, send);
  const box = h("div", { class: "chat" },
    h("div", { class: "chat-head" }, h("div", { class: "spark" }, icon("sparkle", 17)),
      h("div", { class: "t" }, h("b", {}, title), where), save, fresh,
      onclose ? h("button", { class: "icon-btn", title: "Close", "aria-label": "Close", onclick: onclose }, icon("x", 16)) : null),
    log, form);
  draw();
  return box;
}

// `toggle`, when given ({hidden: name -> count, onhide, onshow}): a checkbox on each row, ticked while its jobs
// show. Unticking leaves that name out (a company from Today); the ones left out stay listed at the end, unticked
// with the jobs they'd bring back, so ticking one again is a click away.
// With `toggle.onhideall` and `toggle.onshowall` (each given the names), a search box narrows the list and All / None
// tick or untick every name it shows at once.
function facetList(counts, active, onpick, most = 12, toggle = null) {
  const list = h("div", {});
  let open = false, q = "";
  const matches = name => !q || name.toLowerCase().includes(q);
  const bulk = toggle && toggle.onhideall ? (() => {
    const search = h("input", { type: "search", class: "facet-search", placeholder: "Filter companies", "aria-label": "Filter companies" });
    search.oninput = () => { q = search.value.trim().toLowerCase(); draw(); };
    const names = on => Object.keys(on ? counts : toggle.hidden()).filter(matches);
    const btn = (label, title, on) => h("button", { class: "btn ghost", title, onclick: e => {
      const pick = names(on);
      if (!pick.length) return;
      e.currentTarget.disabled = true;
      (on ? toggle.onhideall : toggle.onshowall)(pick);
    } }, label);
    return h("div", { class: "facet-tools" }, search,
      btn("All", "Tick every company listed (the filter's matches when you've typed one)", false),
      btn("None", "Hide every company listed from Today (the filter's matches when you've typed one): saved, like " +
        "unticking each, until you tick them again", true));
  })() : null;
  const el = h("div", {}, bulk, list);
  const fill_ = (...kids) => fill(list, ...kids);
  const box = (name, on) => {
    const c = h("input", { type: "checkbox", title: on ? `Untick to hide ${name}'s jobs` : `Tick to show ${name}'s jobs again`,
      "aria-label": `Show ${name}'s jobs` });
    c.checked = on;
    c.onchange = () => { c.disabled = true; (on ? toggle.onhide : toggle.onshow)(name); };
    return c;
  };
  const draw = () => {
    const rows = Object.entries(counts).filter(([name]) => matches(name)).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const off = toggle ? Object.entries(toggle.hidden()).filter(([name]) => matches(name)).sort((a, b) => a[0].localeCompare(b[0])) : [];
    fill_((open || q ? rows : rows.slice(0, most)).map(([name, n]) => !toggle
      ? h("button", { class: "facet" + (name === active() ? " on" : ""), onclick: () => { onpick(name === active() ? "" : name); draw(); } },
        h("span", {}, name), h("span", { class: "c" }, n))
      : h("div", { class: "facet row" + (name === active() ? " on" : "") }, box(name, true),
        h("button", { class: "fname", title: `Only ${name}'s jobs`, onclick: () => { onpick(name === active() ? "" : name); draw(); } }, name),
        h("span", { class: "c" }, n))),
      rows.length > most && !q ? h("button", { class: "facet more", onclick: () => { open = !open; draw(); } },
        open ? "Show fewer" : `Show all ${rows.length}`) : null,
      q && !rows.length && !off.length ? h("div", { class: "small muted", style: "padding:4px 8px" }, "No company matches") : null,
      off.length ? h("div", { class: "facet-sep" }, `Hidden · ${off.length}`) : null,
      off.map(([name, n]) => h("label", { class: "facet row off", title: `Tick to show ${name}'s jobs again` }, box(name, false),
        h("span", { class: "fname" }, name), h("span", { class: "c" }, n || ""))));
  };
  draw();
  el.redraw = draw;
  return el;
}

// Fit scores are worked out in the background after each check for new jobs: say how far along, and offer to
// show the new ones (redrawing on its own would move cards while you read).
let scoringTimer = null;
function watchScoring(first, el) {
  clearTimeout(scoringTimer);
  const seen = first.done;
  const draw = s => {
    const fresh = s.done - seen;
    const show = fresh > 0 ? h("button", { class: "btn ghost", onclick: () => renderToday() },
      `Show ${fresh} new score${fresh === 1 ? "" : "s"}`) : null;
    el.classList.toggle("spin", s.running);
    if (s.running) fill(el, icon("refresh", 14), `Scoring fit in the background: ${s.left} to go`,
      s.current ? h("span", { class: "hint", title: s.current }, ` · now ${s.current}`) : null, show);
    else if (s.error) fill(el, h("span", { title: s.error }, "Background scoring stopped: " + s.error), show);
    else fill(el, show);
  };
  const poll = async () => {
    if (!el.isConnected) return;
    try { const s = await api("/api/scoring"); draw(s); if (s.running) scoringTimer = setTimeout(poll, 15000); }
    catch { /* the page may be restarting: the next render tries again */ }
  };
  draw(first);
  if (first.running) scoringTimer = setTimeout(poll, 15000);

// The resume against the scores (scorestate.py). A new resume leaves every score as it is, flagged stale, and nothing is
// scored again: what the change means for them is decided here. Mark stale puts the scores picked in line to be scored
// again (the background scorer, the Score button, `jobwatch score --rescore`); Keep scores makes the current resume

function scoresLine(s) {

  return (s.older ? `${s.older} of ${s.scored} fit scores were made under an older resume` : `All ${s.scored} fit scores match the resume`) +
    (s.marked ? `; ${s.marked} marked stale, waiting to be scored again` : "") + ".";
}
async function openScoreDecision(done = () => {}) {

  const box = h("div", { class: "dialog rescore-dialog", role: "dialog", "aria-modal": "true",
    "aria-label": "Scores and your resume" }, h("p", { class: "muted" }, busyNote("Loading…")));
  const close = () => { shade.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  shade.onclick = e => { if (e.target === shade) close(); };
  document.addEventListener("keydown", esc);
  shade.append(box);
  document.body.append(shade);
  let s;
  try { s = await api("/api/scores"); }
  catch (e) { fill(box, h("p", { class: "small error" }, e.message)); return; }
  const cut = s.min_fit || 60;
  const scopes = [["all", `Every score (${s.scored})`], ["min", `Scoring ${cut}+`], ["queued", "Queued jobs"],
    ["both", `Scoring ${cut}+, and queued jobs`]];
  const which = h("select", { "aria-label": "Which scores" }, scopes.map(([v, t]) => h("option", { value: v }, t)));
  which.value = "both";
  const reason = h("input", { type: "text", maxlength: 200, placeholder: "What changed? (kept in the log)", "aria-label": "Reason" });
  const msg = h("span", { class: "small muted", role: "status" });

    for (const b of box.querySelectorAll("button")) b.disabled = true;

    try {
      const r = await api(path, { reason: reason.value, ...body });
      close(); toast(said(r.count)); done(r);
    } catch (e) {
      for (const b of box.querySelectorAll("button")) b.disabled = false;
      msg.className = "small error"; msg.textContent = e.message;
    }
  };
  const mark = () => decide("/api/scores/stale", { min_score: ["min", "both"].includes(which.value) ? cut : null,
    queued: ["queued", "both"].includes(which.value) },
    n => `${n} score${n === 1 ? "" : "s"} marked stale: ${n === 1 ? "it is" : "they are"} scored again`);
  const keep = () => decide("/api/scores/keep", {}, n => `${n} score${n === 1 ? "" : "s"} kept as made: nothing was scored`);
  const take = () => decide("/api/scores/unmark", {}, n => `${n} mark${n === 1 ? "" : "s"} taken back: those scores stand`);
  fill(box,
    h("div", { class: "row", style: "align-items:center" }, h("h2", { style: "flex:1;margin:0" }, "Scores and your resume"),
      closeButton(close, true)),
    h("p", { class: "small", "data-scores-line": "1" }, scoresLine(s)),
    h("p", { class: "small muted" }, "A new resume doesn't change a score or ask for a new one: each job keeps the score it has, marked " +
      "stale. You decide what the change means. Keep scores when it was small; Mark stale to have them scored again (that costs " +
      "scoring, so pick the scores that matter)."),
    s.by_resume && s.by_resume.length ? h("ul", { class: "small muted scores-by" }, s.by_resume.map(r =>
      h("li", {}, `${r.jobs} made under ${r.resume} (newest ${r.last})`))) : null,
    h("div", { class: "scores-decide" },
      reason,
      h("div", { class: "row", style: "align-items:center;gap:8px;flex-wrap:wrap" },
        h("button", { class: "btn", type: "button", "data-keep": "1", disabled: !s.older,
          title: "The scores stand as made: the current resume is their baseline", onclick: keep }, "Keep scores"),
        h("span", { class: "muted small" }, "or"),
        which,
        h("button", { class: "btn primary", type: "button", "data-mark": "1", disabled: !s.scored,
          title: "Put these scores in line to be scored again", onclick: mark }, icon("refresh", 13), "Mark stale"),
        s.marked ? h("button", { class: "btn ghost", type: "button", onclick: take,
          title: "Leave the marked scores as they are" }, `Take back ${s.marked} mark${s.marked === 1 ? "" : "s"}`) : null),
      msg),

// The daily backup runs where nobody's looking and a failure only reaches its log, so Today says when it has stopped.
function backupLate(b) {
  return !b ? null : b.last ? `Last backup ${b.last}` : "No backup found";
}

// When the boards were last checked. The page checks them by itself every few hours (fetch_every in the
// watchlist) and the button checks now; a check that finishes while you read offers to show what it found.
let checkedTimer = null;
function watchChecked(first, el) {
  clearTimeout(checkedTimer);
  const seen = first.at;
  const hours = n => n === 24 ? "day" : n % 24 === 0 ? `${n / 24} days` : n === 1 ? "hour" : `${+n.toFixed(1)} hours`;
  const draw = c => {
    const failed = Object.keys(c.errors || {}), warned = Object.keys(c.warnings || {});
    const fresh = c.at !== seen && !c.running && c.new ? h("button", { class: "btn ghost", onclick: () => renderToday() },
      `Show ${c.new} new job${c.new === 1 ? "" : "s"}`) : null;
    el.classList.toggle("spin", c.running);
    fill(el, c.running ? icon("refresh", 14) : null,
      c.at ? `Boards checked ${ago(c.at)}` : "Boards not checked yet", c.running ? " · checking now…" : null,
      c.every_hours ? h("span", { class: "hint" }, ` · every ${hours(c.every_hours)}`) : null,
      c.times && c.times.length ? h("span", { class: "hint", title: c.next ? `Next check ${clock(c.next)}` : null },
        ` · at ${listed(c.times.map(t => clock("2000-01-01T" + t)))}`) : null,
      failed.length ? h("span", { class: "hint", title: failed.map(b => `${b}: ${c.errors[b]}`).join("\n") },
        ` · ${failed.length} failed`) : null,
      warned.length ? h("span", { class: "hint", title: warned.map(b => `${b}: ${c.warnings[b]}`).join("\n") },
        ` · ${warned.length} to look at`) : null,
      c.error ? h("span", { class: "hint", title: c.error }, " · the last scheduled check failed") : null,
      c.backup ? h("span", { style: "color:var(--bad);font-weight:600", title: `Folder: ${c.backup.dest}\nLog: ${c.backup.log}` },
        ` · ${backupLate(c.backup)}`) : null, fresh);
  };
  const poll = async () => {
    if (!el.isConnected) return;
    try { const c = await api("/api/checked"); draw(c); checkedTimer = setTimeout(poll, c.running ? 5000 : 60000); }
    catch { /* the page may be restarting: the next render tries again */ }
  };
  draw(first);
  checkedTimer = setTimeout(poll, first.running ? 5000 : 60000);
}

// whole `filters` setting through /api/settings, so the watchlist file stays the one place they live.

function filterInputs(f) {

  const inp = {
    titles: area(f.titles, "engineer\ndeveloper"), exclude: area(f.exclude_titles, "intern\nmanager"),
    excludeText: area(f.exclude_text, "red team\nGPU kernels?"),

      h("option", { value: "any" }, "Remote jobs anywhere")),
    home: h("input", { type: "text", placeholder: "e.g. NC", maxlength: 30 }),
    minPay: h("input", { type: "number", min: 0, step: 5000, placeholder: "e.g. 150000" }),
    requirePay: h("input", { type: "checkbox" }),

    fitOut: h("output", {}),

function filterValues(inp) {
  return { titles: unlines(inp.titles.value), exclude_titles: unlines(inp.exclude.value),
    exclude_text: unlines(inp.excludeText.value), exclude_companies: placeLines(inp.excludeCompanies.value),
    locations: placeLines(inp.locations.value), remote_country: inp.country.value,
    home_state: inp.home.value.trim() || null, nearby_offices: placeLines(inp.nearOffices.value),
    min_salary: inp.minPay.value ? Number(inp.minPay.value) : null, require_salary: inp.requirePay.checked || null,
    max_age_days: inp.maxAge.value ? Number(inp.maxAge.value) : null,

}
// The saved filters with these keys replaced; others (exclude_departments, flags...) are kept as they are.
function mergeFilters(f, values, keys = Object.keys(values)) {
  const out = { ...f };
  for (const k of keys) out[k] = values[k];
  for (const [k, v] of Object.entries(out)) if (v === null || v === undefined || (Array.isArray(v) && !v.length)) delete out[k];
  if (String(out.remote_country || "").toUpperCase() === "US") delete out.remote_country;

}

function money(n) { return n >= 1e6 ? `$${+(n / 1e6).toFixed(2)}M` : `$${Math.round(n / 1000)}K`; }
// A title pattern as words, for the bar: "\b(intern|new grad)\b" reads "intern, new grad". The tooltip keeps it as is.
function readable(patterns) {

  hiddenLine(hidden), brokenLine());

}

// Reading postings by itself (the extension's auto-reader, with "Read postings automatically" on in Settings): the status
// the extension sends through its page bridge, in a line, with Pause / Resume / Off. The words are the extension's own
// (chrome-extension/auto-read.js statusLine); tests/test_auto_read.py holds the two to the same text.
function autoReadCountdown(ms) { const s = Math.max(1, Math.ceil(ms / 1000)); return s < 60 ? `${s}s` : `${Math.ceil(s / 60)}m`; }
function autoReadLine(st, now = Date.now()) {
  if (st.state === "off") return "Auto-read is off in this browser.";
  if (st.state === "paused") return "Reading postings is paused. Press Resume to continue.";
  if (st.state === "disabled") return "Reading postings is off in jobwatch's Settings.";
  if (st.state === "stopped") return st.reason;
  const head = `Reading postings: ${st.planned > st.done ? `${st.done} of ${st.planned} today` : `${st.done} today`}`;
  const tail = { capped: "done for today, back tomorrow", reading: "reading one now", deferred: "waiting until you leave LinkedIn or Indeed",
    empty: "nothing waiting" }[st.state] || `next in ${autoReadCountdown(Math.max(0, st.nextAt - now))}`;
  return `${head} · ${tail}`;
}
const AUTO_READ_BUTTONS = { pause: ["Pause", "Pause reading for now"], resume: ["Resume", "Read again, after a new pause"],
  off: ["Off", "Turn automatic reading off in this browser (jobwatch's Settings still has it on)"], on: ["Turn on", "Read postings automatically again"] };
const autoReadHearers = new Set();
window.addEventListener("message", e => {
  if (e.source === window && e.data?.type === "jobwatch:auto-read-status") autoReadHearers.forEach(f => f(e.data.status));
});
function autoReadChip() {
  const line = h("span", { role: "status" }), buttons = h("span", { class: "ar-buttons" });
  const el = h("div", { class: "autoread", id: "autoread", hidden: true, title: "The jobwatch extension reads LinkedIn and Indeed postings by itself, " +
    "one at a time, a few a day. Settings > Browser extension has the limits." }, h("span", { class: "ar-dot" }), line, buttons);
  let st = null;
  const draw = () => {
    el.hidden = !st || st.state === "disabled";  // jobwatch's own setting is off: nothing to show
    if (el.hidden) return;
    el.dataset.state = st.state;
    line.textContent = autoReadLine(st);
    buttons.replaceChildren(...st.buttons.map(cmd => h("button", { class: "btn", title: AUTO_READ_BUTTONS[cmd][1], onclick: () => ask(cmd) }, AUTO_READ_BUTTONS[cmd][0])));
  };
  const ask = (command = "status") => window.postMessage({ type: "jobwatch:auto-read", command }, location.origin);
  const hear = s => { st = s; draw(); };
  autoReadHearers.add(hear);
  let ticks = 0;
  const timer = setInterval(() => {
    if (!el.isConnected) { clearInterval(timer); autoReadHearers.delete(hear); return; }
    if (++ticks % 15 === 0) ask();  // the extension changes it as it reads: asked again every 15 seconds
    draw();
  }, 1000);
  if (document.documentElement.dataset.jobwatchBridge === "1") ask(); else setTimeout(() => document.documentElement.dataset.jobwatchBridge === "1" && ask(), 1500);
  return el;
}

const roleShown = (j, v) => !(v.rolesOff && v.rolesOff.size) || !(j.roles || []).length ||
  j.roles.some(r => !v.rolesOff.has(r));

// Today's quick narrowing, on top of the saved filters: how the job is worked, a lowest fit score, a lowest top of

// Today's Roles list: a checkbox per kind of work ([key, label] from the server), with how many of Today's jobs

// Today opens on its head, its filters and placeholders, and fills in as three calls come back, none waiting for another:
// the matching jobs themselves (the quick one), what takes longer to work out for each (pay, advice, worth it, why it
// has no score) and what the filters hide (a hint, not the page). A part that can't come says so where it goes.
async function renderToday() {
  if (!settings.companies.length) return renderWelcome();
  const ctx = loadCtx();
  const listPath = "/api/digest?part=list", extraPath = "/api/digest?part=extra";
  let built = null, extra = null, hidden = null;  // built: what the page drawn from the list answers to (see drawTodayPage)
  const head = () => heroHead("Today", "Your best-fit roles, ", "ranked and ready", todayLine(greeting(new Date().getHours()), settings.companies.length));
  const barHost = h("div", {}, filterBar(null));
  const listHost = h("div", {}, h("div", { class: "status-row" }), skelCards(6)), extraNote = h("div");
  const place = ctx.shell(head(), barHost, layout([skelHero(5), skelPanel(), skelPanel(), skelPanel()], [extraNote, listHost]));
  const onList = d => { place(); built = drawTodayPage(d, { extra, hidden, bar: barHost, note: extraNote }); };
  const loadExtra = () => {
    fill(extraNote, null);
    return ctx.swr(extraPath, x => { extra = x.jobs; built?.setExtra(extra); }).catch(e => {  // ({jobs: {key: its extra}})
      if (!isAbort(e)) fill(extraNote, partError(e, loadExtra, "each job's pay and advice"));

  await Promise.all([
    ctx.swr(listPath, onList).catch(e => {

}

    }

  const load = async lookup => (await api("/api/suggestions" + (lookup ? "?lookup=1" : ""))).companies;
  (async () => {
    try {
      const list = await load(false);
      draw(list);
      if (list.some(s => !s.looked_up)) draw(await load(true));
    } catch { /* a suggestion, not the page: Today works without it */ }
  })();
  return el;
}

// -- first run: "Tell me about yourself", then the jobs you want, the companies to watch and the optional rest.
// Each step saves as you go and can be skipped; the last one ends on Today. A watchlist with no companies opens
// here (renderWelcome); once finished or skipped, Today only offers a way back to the companies step.

const ONBOARD_STEPS = ["About you", "Jobs you want", "Companies", "The rest"];
const onboarding = { step: 0 };

function renderWelcome() {
  if (remembered("onboarded", "")) {
    return put(h("div", { class: "card welcome" },
      h("h2", {}, "Nothing to watch yet"),
      h("p", {}, "jobwatch looks at the careers pages of companies you choose. Add a few and it starts looking."),
      h("div", { class: "row" },
        h("button", { class: "btn primary", onclick: () => { onboarding.step = 2; renderOnboarding(); } }, "Add companies", icon("arrow", 14)),
        h("button", { class: "btn", onclick: () => go("settings") }, "Open Settings"))));
  }
  renderOnboarding();
}

function renderOnboarding() {
  const steps = [onboardAbout, onboardJobs, onboardCompanies, onboardRest], n = onboarding.step, last = steps.length - 1;
  const move = to => { onboarding.step = Math.max(0, Math.min(last, to)); renderOnboarding(); };
  const finish = async () => {
    remember("onboarded", "1");
    try { settings = await api("/api/settings"); } catch { /* the tabs read it again */ }
    go("today");
  };
  const ctx = { step: n, last: n === last, back: () => move(n - 1), next: () => n === last ? finish() : move(n + 1) };
  put(h("div", { class: "onboard" },
    h("div", { class: "card welcome" },
      h("h2", {}, n === 0 ? "Welcome to jobwatch" : ONBOARD_STEPS[n]),
      h("p", {}, n === 0 ? "jobwatch checks the careers pages of companies you choose and shows you the new jobs that match " +
        "what you're looking for. It runs on your computer, and it never applies for you. A few questions first; " +
        "every one can wait." : `Step ${n + 1} of ${steps.length}. Everything is saved as you go, and you can change it later in Settings.`)),
    steps[n](ctx)));
}

// Back, Save and continue, and Skip for now under a step. save() writes what the step asked; a failure shows
// beside the buttons and stays on the step.
function onboardActions(ctx, save) {
  const msg = h("span", { class: "small muted", role: "status" });
  const next = h("button", { class: "btn primary" }, ctx.last ? "Save and go to Today" : "Save and continue", icon("arrow", 14));
  next.onclick = async () => {
    next.disabled = true; fill(msg, busyNote("Saving…")); msg.className = "small muted";
    try { await save(); settings = await api("/api/settings"); ctx.next(); }
    catch (e) { msg.textContent = e.message; msg.className = "small error"; next.disabled = false; }
  };
  return h("div", { class: "row actions" }, ctx.step ? h("button", { class: "btn", onclick: ctx.back }, "Back") : null, next,
    h("button", { class: "btn", onclick: ctx.next }, ctx.last ? "Later" : "Skip for now"), msg);
}

// Step 2: the jobs you want: titles, places, remote, and a pay target. "Suggest titles from my resume" is offered
// only when a model can run (/api/onboarding); the suggestions are clearly marked and nothing is added until clicked.
function onboardJobs(ctx) {

  const titles = areaInput(f.titles, "Product Manager\nData Engineer");
  const places = areaInput(places0.filter(l => l.toLowerCase() !== "remote"), "New York\nDenver");
  const country = choice([["US", "Remote jobs open in the US"], ["any", "Remote jobs anywhere"]],
    (f.remote_country || "US").toLowerCase() === "any" ? "any" : "US");
  let how = workStyle(places0);

  const sync = () => {

      try {

      placesField,
      field("Pay target (per year)", target, "What you'd like to be offered: a number, or a range like 170000-190000.")),
    ideas,
    onboardActions(ctx, async () => {
      const locations = workLocations(how, placeLines(places.value));
      const body = { filters: mergeFilters(f, { titles: unlines(titles.value), locations, remote_country: country.value }),
        pay: merged(s.pay, targetValues(target.value)) };
      if (keywords.size) body.keywords = { ...(s.keywords || {}), ...Object.fromEntries([...keywords].map(k => [k, 1])) };

}

// "How do you want to work?" and filters.locations, both ways: remote only is ["remote"]; hybrid or on-site is the
// places alone (it needs one: no places would let every place through); either is the places and remote.
const WORK_STYLES = [["remote", "Remote only"], ["near", "Hybrid or on-site near me"], ["either", "Either"]];
function workStyle(locations) {
  const remote = locations.some(l => l.toLowerCase() === "remote"), places = locations.length - (remote ? 1 : 0);
  return remote && !places ? "remote" : !remote && places ? "near" : "either";
}
function workLocations(how, places) {
  if (how === "near" && !places.length) throw new Error("Name a city or state for hybrid or on-site jobs.");
  return [...(how === "remote" ? [] : places), ...(how === "near" ? [] : ["remote"])];
}

// Where the AI runs (fit scores; the chat and title suggestions too, except on agy): each choice with what it
// still needs on this computer (from /api/ai), a test call, and for Claude an API key kept in the macOS keychain.
// Below the tiles, the scoring chain: the steps tried in order, each a backend and its model (one backend can be in
// it twice, on two models: agy's Sonnet, then agy's Gemini). The first scores; the rest are tried when the one
// before can't. ← and → move a step (moving one to the front makes it the one that scores first), × takes it out,
// and "Add a step" puts one at the end. values() gives scoring's backend, model and fallback.
const AI_ORDER = ["claude", "agy", "local"];
// when a paused step or pool is tried again: "Tue, Dec 1, 9:50 PM", or "when resumed" (the credit's total cap)
const backAt = until => new Date(until).getUTCFullYear() >= 9999 ? "when resumed"
  : new Date(until).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function aiSetup(s) {
  const scoring = s.scoring || {};
  // a step is {b, m}: m "" is the backend's default model; agy_model (agy as a bare fallback) becomes its step's model
  const steps = [{ b: scoring.backend || s.defaults.scoring.backend, m: scoring.model || "" },
    ...[].concat(scoring.fallback || []).map(e => {
      const [b, ...m] = e.split(":");
      return { b, m: m.join(":") || (b === "agy" ? scoring.agy_model || "" : "") };
    })];
  // A dated step (claude:MODEL until DAY: an API credit that ends, see credit.py) scores first while it lasts, wherever
  // the watchlist lists it (in fallback, after scoring.backend), so it's shown first and pinned there: the chain reads
  // in the order a job meets it, as `jobwatch scorers` lists it. scoring.backend is the first step that isn't dated.
  const dated = st => / until \d{4}-\d{2}-\d{2}$/.test(st.m);
  steps.sort((x, y) => Number(dated(y)) - Number(dated(x)));
  const pinned = () => steps.filter(dated).length;
  const primary = () => steps.find(st => !dated(st)) || steps[0];
  // the first step's backend lives in a select that isn't shown, so Settings can read and watch it like any other input
  // an API from scoring.providers has no tile: it can be in the chain (set in the watchlist file), not added here
  const look = b => AI_LOOK[b] || { name: b };
  const backend = choice([...AI_ORDER, ...(AI_ORDER.includes(primary().b) ? [] : [primary().b])]
    .map(b => [b, look(b).name]), primary().b);
  const sync = () => {
    if (backend.value !== primary().b) { backend.value = primary().b; backend.dispatchEvent(new Event("change")); }
    else draw();
  };
  const same = (x, y) => x.b === y.b && (x.m || def(x.b)) === (y.m || def(y.b));
  // a tile picked: its backend's first step goes to the front (behind a dated one), or a new step on its default model
  const pick = b => {
    const at = steps.findIndex(st => st.b === b);
    if (at >= 0 && dated(steps[at])) { toast(`${look(b).name} scores first while its credit lasts`); return; }
    steps.splice(pinned(), 0, ...(at >= 0 ? steps.splice(at, 1) : [{ b, m: "" }]));
    sync();
  };
  const tiles = h("div", { class: "ai-tiles", role: "radiogroup", "aria-label": "Where fit scores run" });
  const chain = h("div", { class: "ai-chain" });
  const strip = h("div", { class: "use-strip", hidden: true, "aria-label": "Scoring status" });
  let info = null, usage = null;  // usage: /api/scoring/usage (scorestats.py), loaded by Settings only
  const listeners = [];  // called whenever the chain is drawn again (its first step may have changed)
  const ready = b => !info || !info[b] || info[b].ready;
  const def = b => (info && info[b] && info[b].default_model) || "";
  const models = b => (info && info[b] && info[b].models) || [];

  const modelMenu = st => {
    const known = models(st.b);
    const opts = [["", `default${def(st.b) ? ` (${shortModel(def(st.b))})` : ""}`],
      ...known.map(m => [m.id, m.name === m.id ? shortModel(m.id) : m.name])];
    if (st.m && !known.some(m => m.id === st.m)) opts.push([st.m, shortModel(st.m)]);
    const sel = h("select", { class: "step-model", "aria-label": `${look(st.b).name} model` },
      opts.map(([v, label]) => h("option", { value: v }, label)));
    sel.value = st.m;
    sel.onchange = () => {
      const was = st.m;
      st.m = sel.value;
      if (steps.filter(x => same(x, st)).length > 1) { st.m = was; sel.value = was; toast("That one's in the chain already"); }
      else drawChain();
    };
    return sel;
  };
  const drawChain = () => {
    const step = (st, i) => {
      const move = (to, label, glyph) => {
        const b = h("button", { type: "button", class: "step-btn", title: label, "aria-label": label }, glyph);
        b.disabled = dated(st) || to < pinned() || to >= steps.length;  // a dated step stays first
        b.onclick = () => { steps.splice(to, 0, steps.splice(i, 1)[0]); sync(); };
        return b;
      };
      const drop = h("button", { type: "button", class: "step-btn", title: "Take it out", "aria-label": "Take it out" },
        icon("x", 11));
      drop.disabled = steps.length === 1 || (!dated(st) && steps.filter(x => !dated(x)).length === 1);  // one is scoring.backend
      drop.onclick = () => { steps.splice(i, 1); sync(); };
      // paused (out of credit or quota): kept in its place, dimmed, skipped until the time it's tried again
      const p = info && info.paused && info.paused[`${st.b}:${st.m.split(" until ")[0]}`];
      const back = p && backAt(p.until);
      return h("div", { class: "link step" + (i ? "" : " main") + (p ? " paused" : ""),
        title: p ? `Skipped: ${p.reason} since ${new Date(p.since).toLocaleString()}; tried again ${back}`
          : dated(st) ? `Scores first while its credit lasts (until ${st.m.slice(-10)}); then the next one`
            : i ? "Tried when the one before can't score" : "Scores first" },
        h("span", { class: "n" }, String(i + 1)), look(st.b).name, modelMenu(st),
        !ready(st.b) ? h("span", { class: "n" }, "· not set up") : null,
        p ? h("span", { class: "pause-tag" }, icon("clock", 11), `${p.reason} · back ${back}`) : null,
        h("span", { class: "step-tools" }, move(i - 1, "Try it earlier", "←"), move(i + 1, "Try it later", "→"), drop));
    };
    // what can be added: each backend on its default, and agy's other models
    const addable = [...AI_ORDER.map(b => ({ b, m: "" })), ...models("agy").map(m => ({ b: "agy", m: m.id }))]
      .filter(c => !steps.some(st => same(st, c)));
    const add = addable.length ? h("select", { class: "step-add", "aria-label": "Add a step" },
      h("option", { value: "" }, "+ Add a step…"),
      addable.map((c, k) => h("option", { value: String(k) },
        `${AI_LOOK[c.b].name}${c.m ? ` · ${shortModel(c.m)}` : def(c.b) ? ` · ${shortModel(def(c.b))}` : ""}`))) : null;
    if (add) add.onchange = () => { if (add.value !== "") { steps.push(addable[Number(add.value)]); drawChain(); } };
    // each quota pool as a flag: green while it can score, amber while paused, with when it's back
    const flags = ((info && info.pools) || []).map(p => h("span", {
      class: "pool-flag" + (p.available ? "" : " off"),
      title: p.available ? "Available" : `Paused: ${p.reason}; back ${backAt(p.until)}` },
      h("i", { class: "dot" }), p.name, p.available ? null : ` · back ${backAt(p.until)}`));
    fill(chain, h("div", { class: "title" }, "Scores with the first; if it can't, tries the next"),
      flags.length ? h("div", { class: "pool-flags" }, flags) : null,
      steps.map((st, i) => [i ? h("span", { class: "then" }, icon("arrow", 14)) : null, step(st, i)]),
      add,
      h("div", { class: "cap" }, "When one has no key, no credit or no quota left, the next one scores. ← → change the " +
        "order (the first one scores first); one backend can be in it twice on two models. Each score says which " +
        "model made it, and none is made again on its own (the ↻ on a score, or `jobwatch score --rescore`). The " +
        "chat and title suggestions use Claude or this Mac (Settings › Chat)."));
    drawStrip();  // the order line follows an edit to the chain
    listeners.forEach(f => f());
  };

  const keyForm = st => {
    const key = h("input", { type: "password", placeholder: "Paste your API key (sk-ant-…)", autocomplete: "off",
      "aria-label": "Anthropic API key" });
    const msg = h("span", { class: "small muted", role: "status" });
    const save = h("button", { class: "btn primary", type: "button" }, icon("lock", 13), "Save");
    save.onclick = async () => {
      save.disabled = true; msg.className = "small muted"; fill(msg, busyNote("Saving to your keychain…"));
      try {
        const r = await api("/api/ai/key", { key: key.value, keychain: st.keychain });
        key.value = ""; scoring.keychain = r.keychain;
        settings.scoring = { ...(settings.scoring || {}), keychain: r.keychain };
        await refresh();
      } catch (e) { msg.className = "small error"; msg.textContent = e.message; save.disabled = false; }
    };
    return h("div", { class: "ai-key" }, h("div", { class: "pair" }, key, save), msg,
      h("div", { class: "help" }, `Kept in your macOS keychain (${st.keychain}), never in the settings file.`));
  };
  const setupSteps = (b, st) => {
    const items = st.steps.map(p => h("li", {}, h("div", {}, p.text,
      p.link ? [" ", h("a", { href: p.link, target: "_blank", rel: "noopener" }, "Open ↗")] : null,
      p.command ? h("div", { class: "cmd" }, h("code", {}, p.command), copyButton(() => p.command)) : null)));
    if (b === "claude" && st.can_save_key && !st.key) items.push(h("li", {}, keyForm(st)));
    return items.length ? h("ol", { class: "ai-steps" }, items) : null;
  };
  const meters = b => h("div", { class: "meters" }, AI_METERS.map(([label, k]) => [h("span", {}, label),
    h("span", { class: "bars", title: `${AI_LOOK[b][k]} of 3` }, [1, 2, 3].map(i => h("i", { class: i <= AI_LOOK[b][k] ? "f" : "" })))]));

  // What a backend has scored and cost, on its card: counts, the cost line and its place in the chain (the chain
  // editor's order, so a dated step reads "main" as it runs). Claude's card also holds its cost since the month began.
  const roleOf = b => { const i = steps.findIndex(st => st.b === b); return i < 0 ? "not used" : i ? "fallback" : "main"; };
  const stepName = st => look(st.b).name + ((st.m || def(st.b)) ? ` · ${shortModel((st.m || def(st.b)).split(" until ")[0])}` : "");
  const useBlock = b => {
    const u = usage && usage.backends.find(x => x.backend === b);
    if (!u) return null;
    const role = roleOf(b), cost = b === "claude" ? claudeCostText(usage.claude) : null;
    const price = u.cost || (cost ? `${cost.main} this month` : "cost not tracked here");
    return h("div", { class: "use", "data-backend": b },
      h("div", { class: "use-head" }, "Scored by it", h("span", { class: "chip" + (role === "main" ? " on" : "") }, role)),
      h("div", { class: "use-counts" }, [["Today", u.today], ["Last 7 days", u.week], ["This month", u.month]]
        .map(([label, n]) => h("div", {}, h("b", {}, String(n)), h("span", {}, label)))),
      h("div", { class: "use-price" }, price),
      cost ? h("div", { class: "use-notes" }, h("span", {}, `Since ${usage.claude.since}`), cost.notes.map(n => h("span", {}, n)),
        h("span", {}, "Batch runs are priced at half.")) : null);
  };
  // the slim strip above the cards: the order a job meets them, the daily cap and the background scorer
  const drawStrip = () => {
    strip.hidden = !usage;
    if (!usage) return;
    const sc = usage.scoring || {}, cap = usage.daily;
    const on = (yes, label) => h("span", { class: "chip" + (yes ? " on" : "") }, label + (yes ? ": on" : ": off"));
    fill(strip,
      h("div", { class: "use-order" }, h("span", { class: "lbl" }, "Scores in this order"),
        h("span", { class: "val" }, steps.map(stepName).join(" → "))),
      h("div", {}, h("span", { class: "lbl" }, cap ? `Daily cap with ${look(usage.backend.backend).name}` : "Scored today"),
        h("span", { class: "val" }, cap ? `${usage.used_today} of ${cap}` : `${usage.used_today} today, no daily cap`),

// -- applications: everything applied to, how it's going, and what to do next

const STAGE_NAMES = { applied: "Applied", screening: "Screening", interviewing: "Interviewing", offer: "Offer",
  rejected: "Rejected", withdrawn: "Withdrawn", closed: "Closed by company" };
// Kept in step with rounds.ROUNDS (a test checks).
const ROUND_NAMES = { recruiter_screen: "Recruiter screen", hiring_manager: "Hiring manager", technical: "Tech interview",
  system_design: "System design", panel: "Panel / onsite loop", executive: "VP / exec round", hr: "HR round",
  informal: "Informal chat", offer_call: "Offer call" };

function daysAgo(day, today) {
  if (!day) return "";
  const n = Math.round((Date.parse(today) - Date.parse(day)) / 86400000);
  return n <= 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago`;
}

// A follow-up due that isn't from an application quiet for so long that it only clutters the list (see quiet.py).
const freshDue = a => a.due && !(a.quiet && a.quiet.long);

// The status filter ("due" is Follow up now, "quiet" is Gone quiet), the search, cards or a table, and the table's sort.
const appView = { stage: "", q: "", view: remembered("apps.view", "cards"), sort: "next", dir: 1, page: 1,
  live: ["all", "live", "waiting"].includes(remembered("apps.live", "all")) ? remembered("apps.live", "all") : "all",
  open: {} };  // live: the All / Live / Waiting choice, kept per browser; open: which folds the person opened

// Where an application sits, live first: due (follow up now), live (screening, interviewing, offer), quiet, waiting
// (applied), snoozed (asleep until its day, see quiet.snoozed_until) and closed (rejected, withdrawn).
function appGroup(a) {
  return isEndedStatus(a.status) ? "closed" : a.snoozed_until ? "snoozed" : freshDue(a) ? "due"
    : ["screening", "interviewing", "offer"].includes(a.status) ? "live" : a.quiet ? "quiet" : "waiting";
}

// The All / Live / Waiting choice: Live is screening, interviewing and offer; Waiting is applied with a follow-up ahead.
function appLiveMatch(a, choice, today) {
  return choice === "live" ? ["screening", "interviewing", "offer"].includes(a.status)
    : choice === "waiting" ? a.status === "applied" && !!a.follow_up && a.follow_up > today : true;
}

// A per-browser preference; storage can be blocked (private windows), so it's never required.
function remembered(key, fallback) {
  try { return localStorage.getItem("jobwatch." + key) || fallback; } catch { return fallback; }
}
function remember(key, value) {
  try { localStorage.setItem("jobwatch." + key, value); } catch { /* not kept: fine */ }
}

// Settings is split into sub tabs; every card stays in the page (hidden, not removed) so Save reads them all.
const SET_GROUPS = [
  { id: "search", label: "Your search", cards: ["goals", "companies", "filters", "keywords"] },
  { id: "today", label: "Today & display", cards: ["today", "display"] },
  { id: "ai", label: "AI & fit scores", cards: ["resume", "stale", "providers", "prompts", "chat"] },
  { id: "people", label: "People & pay", cards: ["people", "pay"] },
  { id: "alerts", label: "Alerts & skills", cards: ["alerts", "incoming", "suggestions", "skills"] },
  { id: "apply", label: "Applying", cards: ["applicant", "tailor", "extension", "autoread"] },
];
// The sub tab a name points at: a tab id ("ai"), a card id ("pay") or a card's anchor ("set-pay"); null if none.
function settingsGroupOf(name) {
  const key = String(name || "").replace(/^set-/, "");
  const g = SET_GROUPS.find(g => g.id === key || g.cards.includes(key));
  return g ? g.id : null;
}
// Where a URL hash goes: "#settings/ai" is Settings on its AI tab, and an old card anchor ("#set-pay") opens the tab holding it.
function pageOfHash(hash, tabs) {
  const [base, sub] = String(hash || "").replace(/^#/, "").split("/");
  if (base === "company" && tabs.includes(base)) {  // "#company/Globex%20Inc" is that company's page
    try { return { tab: base, sub: sub ? decodeURIComponent(sub) : null }; } catch { return { tab: base, sub: null }; }
  }
  if (tabs.includes(base)) return { tab: base, sub: base === "settings" ? settingsGroupOf(sub) : null };
  if (base.startsWith("set-") && settingsGroupOf(base)) return { tab: "settings", sub: settingsGroupOf(base), card: base };
  return null;
}

// One page of a long list, and the controls to move between pages. `state.page` survives redraws; a new
// `filterKey` (the search, filters and sort in use) starts again at page 1. How many per page is kept per browser.
const PER_PAGE = [12, 24, 48, 96];
function paged(items, state, filterKey, redraw) {
  const per = PER_PAGE.includes(Number(remembered("perPage", ""))) ? Number(remembered("perPage", "")) : PER_PAGE[0];
  if (state.filterKey !== filterKey) { state.filterKey = filterKey; state.page = 1; }
  const pages = Math.max(1, Math.ceil(items.length / per));
  state.page = Math.min(Math.max(1, state.page || 1), pages);
  const start = (state.page - 1) * per, end = Math.min(start + per, items.length);
  const go = n => { state.page = n; redraw(); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); };
  const nums = [];
  for (let n = 1; n <= pages; n++) {
    if (n === 1 || n === pages || Math.abs(n - state.page) <= 2) nums.push(n);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  const perSelect = h("select", { "aria-label": "Per page" }, PER_PAGE.map(n => h("option", { value: n }, n)));
  perSelect.value = per;
  perSelect.onchange = () => { remember("perPage", perSelect.value); state.page = Math.floor(start / Number(perSelect.value)) + 1; redraw(); };
  return {
    items: items.slice(start, end),
    range: items.length > per ? `${start + 1}–${end} of ${items.length}` : null,
    nav: items.length <= PER_PAGE[0] ? null : h("div", { class: "pager", role: "navigation", "aria-label": "Pages" },
      pages > 1 ? [
        h("button", { class: "btn ghost", disabled: state.page === 1, onclick: () => go(state.page - 1) }, "← Previous"),
        nums.map(n => n === "…" ? h("span", { class: "gap" }, "…")
          : h("button", { class: "pg" + (n === state.page ? " on" : ""), "aria-current": n === state.page ? "page" : null,
            onclick: () => go(n) }, n)),
        h("button", { class: "btn ghost", disabled: state.page === pages, onclick: () => go(state.page + 1) }, "Next →"),
      ] : null,
      h("label", { class: "per" }, "Per page", perSelect)),
  };
}

// -- Interviews: the interviews and calls your open applications' next steps name, today's first, then the next two
// weeks (see interviews.py). A card opens the job's details: the whole note, what you sent, and the prep sheets.
function todayIso() { const t = new Date(); return new Date(t - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function meetingTime(m) { return m.start ? `${clock(m.start)}–${clock(m.end)}` : "time not set"; }

async function renderInterviews() {

function drawInterviews(d) {
  const timed = d.interviews.filter(i => i.scheduled);
  const today = timed.filter(i => i.day === d.today), later = timed.filter(i => i.day !== d.today);
  const unset = d.interviews.filter(i => !i.scheduled);

  put(pagehead("Interviews", [today.length ? `${today.length} today` : "Nothing today",
    later.length ? `${later.length} more in the next two weeks` : null].filter(Boolean).join(" · ")),
    d.interviews.length ? null : emptyState("No interviews or calls coming up. Put one in an application's next step, " +
      "like “Interview with Sam Tue 3/10 2:00 PM ET”, and it shows here."),
    group("Today", today), group("Coming up", later),
    group("Not scheduled yet", unset, "muted"),
    d.sheets_folder ? null : h("p", { class: "small muted", style: "margin-top:16px" },
      "To link the prep sheets you write, set prep.sheets in the watchlist to their folder: a sheet named " +
      "acme-onsite.html shows on Acme's interviews."));
}

function interviewCard(iv, d, i = 0) {
  const now = new Date(), done = iv.scheduled && new Date(iv.end) < now;
  const live = iv.scheduled && new Date(iv.start) <= now && !done;
  const card = h("div", { class: "card app interview" + (done ? " ended" : ""), tabindex: "0", role: "button",
    style: `--sc:var(--s-${iv.status});--i:${Math.min(i, 12)}`, title: "Open everything about it" });
  card.onclick = e => { if (!e.target.closest("button, a")) openDetails(iv.key); };
  card.onkeydown = e => { if (e.key === "Enter" && e.target === card) openDetails(iv.key); };
  const when = iv.day === d.today ? (live ? "now" : done ? "done" : "today") : `${fmtDay(iv.day, d.today)} · ${relDay(iv.day, d.today)}`;
  fill(card, monogram(iv.company, true),
    h("div", {},
      h("div", { class: "app-head" },
        h("div", {},
          h("span", { class: "title", style: "font-weight:700;font-size:17px" }, iv.title),
          iv.round_label ? h("span", { class: "badge round", title: "The interview round set on this application" }, iv.round_label) : null,
          h("div", { class: "meta" }, h("b", {}, iv.company), h("span", { class: "sep" }, "·"), STAGE_NAMES[iv.status] || iv.status,
            iv.pay ? [h("span", { class: "sep" }, "·"), h("span", { class: payClass("pay", iv.pay) }, iv.pay)] : null)),
        h("div", { class: "iv-when" + (live ? " now" : "") }, h("b", {}, meetingTime(iv)), h("span", {}, `${iv.label} · ${when}`))),
      h("div", { class: "next" }, h("span", { class: "what" }, iv.next_step)),
      sheetChip(iv, d.sheets_base)));
  return card;
}

// The one prep sheet an interview links (its main sheet; the playlist, practice page and clips are reached from
// inside it) opens in a new tab from the sheets folder the server shares at `base` (a secret address, sandboxed),
// so the stylesheet and drill video next to it load too.
function sheetChip(item, base) {
  if (!item.sheet || !base) return null;
  const title = item.sheet_title || item.sheet.replace(/\.html?$/i, "");
  return h("div", { class: "row sheets" },

      h("span", { class: "start" }, "Start here")));
}

async function renderApplied() {
  const ctx = loadCtx();
  await dataTab(ctx, "/api/applications", {
