// Where the advice goes once the pay is known (see the pay poll), a dash until then.
const noAdvice = job => h("span", { class: "kv-none", "data-advice": job.key }, "—");
// The card's bottom line, in plain words (advice.verdict): apply, apply as a stretch, hold off, or skip it.
const VERDICT_ICON = { apply: "check", stretch: "zap", hold: "pause", skip: "x" };
function verdictLine(job) {
  const v = job.verdict;
  if (!v || job.status === "snoozed") return h("span", { "data-verdict": job.key, hidden: true });  // already decided
  return h("div", { class: `verdict ${v.call}`, "data-verdict": job.key, title: v.text },
    h("span", { class: "vic" }, icon(VERDICT_ICON[v.call] || "check", 14)), h("span", { class: "vtext" }, v.text));
}
// Who you know there, one contact to a line (a few, then "+N more"), or the way to find an introduction.
function peopleRow(job, most = 2) {
  const shown = job.contacts.slice(0, most), rest = job.contacts.length - shown.length;
  return [shown.map(p => contactBit(p, "div")),
    h("div", { class: "pmore" }, rest > 0 ? `+${rest} more · ` : null, referralLink(job))];
}

// Every job card has this skeleton: the header (logo, title, company · place · age; the ring top right), the labeled
// rows, `above` (the queue's note box) and the actions at the bottom. `stage` is a chip before the title, on the
// company page, where a job can be at any status. The company's name opens that page.
function jobCard(job, actions, i = 0, above = null, stage = null) {
  const sep = () => h("span", { class: "sep" }, "·");
  const meta = [h("b", { class: "co", title: `See everything at ${job.company}`, role: "link", tabindex: 0,
    onclick: () => openCompany(job.company),
    onkeydown: e => { if (e.key === "Enter") openCompany(job.company); } }, job.company), placeItem(job.locations),
    age(job.age_days) ? h("span", { class: "posted", title: age(job.age_days) }, age(job.age_days).replace(/^posted /, "")) : null]
    .filter(Boolean);
  const parts = {
    pay: paySources(job),
    why: adviceLine(job) || noAdvice(job),
    check: [linkNote(job), job.warnings && job.warnings.length ? h("div", { class: "warns" }, job.warnings.join(" · ")) : null],
    gaps: gapsLine(job.fit, true),
    skills: job.keywords.length ? h("div", { class: "chips", title: job.keywords.join(", ") },
      job.keywords.map(k => h("span", { class: "chip hit" }, k))) : null,
    people: peopleRow(job),
    note: job.note && job.status !== "queued" ? h("div", { class: "note clamp", title: job.note }, job.note) : null,
  };
  return h("div", { class: `card job fit-${job.fit ? fitClass(job.fit.score) : "none"}`, id: "job-" + job.key,
    style: `--i:${Math.min(i, 12)}` },
    monogram(job.company),
    h("div", { class: "jc-id" },
      h("div", { class: "jc-title" },
        stage,
        job.status === "new" ? h("span", { class: "badge new" }, "new") : null,
        job.closed ? h("span", { class: "badge closed" }, "closed") : null,
        dupeBadge(job.duplicate_of), worthChip(job),
        job.same_title ? h("span", { class: "chip", title: `${job.same_title} more posting${job.same_title > 1 ? "s" : ""} with this title` },
          `+${job.same_title}`) : null,
        Object.assign(link(job.url, job.title, "title"), { title: job.title })),
      h("div", { class: "meta jc-meta" }, meta.flatMap((m, n) => n ? [sep(), m] : [m]))),
    h("div", { class: "jc-rows" }, cardRows(parts)),
    verdictLine(job),
    above ? h("div", { class: "jc-note" }, above) : null,
    h("div", { class: "row jc-foot" }, actions),
    fitBox(job.fit, job.key) || noFitBox(job));
}

// The same opening (or maybe) as a job already applied to, queued or skipped: flagged, never hidden.
function dupeBadge(d) {
  if (!d) return null;
  return h("span", { class: "badge dupe" + (d.strong ? "" : " maybe"), title: d.text },
    d.strong ? d.label : "Possible duplicate");
}

async function mark(job, status, note, label, undoStatus) {
  const origin = document.activeElement;
  const r = await api("/api/mark", { keys: job.keys || [job.key], status, note });
  if (r.warning) label = `${label}. ${r.warning}`;
  const card = document.getElementById("job-" + job.key);
  if (status === "applied") { confetti(origin); label = `🎉 Applied: ${job.title}. ${cheer()}`; drawPace(); }
  await leave(card, status === "skipped" ? -1 : 1);
  if (tab === "today") {
    todayJobs = todayJobs.filter(j => j.key !== job.key);
    if (todayJobs.length && !main.querySelector(".card.job")) drawToday();
  }
  if (tab === "queue") {
    queueJobs = queueJobs.filter(j => j.key !== job.key);
    if (queueJobs.length && !main.querySelector(".card.job")) drawQueue();
  }
  refreshQueueCount();
  toast(label, undoStatus ? async () => {
    await api("/api/mark", { keys: job.keys || [job.key], status: undoStatus });
    render();
  } : null, TONES[status]);
  if (!main.querySelector(".card.job") && (tab === "today" || tab === "queue")) {
    const [title, text] = tab === "today"
      ? ["All caught up", "You've been through every match. New roles show up here when you check again."]
      : ["Queue cleared", "Every job you picked has been handled. Nicely done."];
    fill(main.querySelector(".cards") || main, h("div", { class: "empty done" }, h("div", { class: "big" }, "✨"),
      h("h2", {}, title), text));
    confetti(null, { count: 60, power: .8 });
  }
}

function detailsButton(job) {
  return h("button", { class: "btn ghost", onclick: () => openDetails(job.key) }, "Details", icon("arrow", 13));
}

// Why a job has no fit score yet (the server's `unscored`: in line, no posting text, failed...).
// No Score fit button while it's being scored, or for a post listing several roles (never scored).
const NO_SCORE_BUTTON = ["scoring", "many_roles"];
function unscoredNote(job) {
  return job.unscored ? h("span", { class: "muted small", title: job.unscored.text }, job.unscored.text) : null;
}
// A job with only a title (from an alert email) gets its posting here: a link jobwatch reads, or the text.
function postingButton(job, done) {
  const b = h("button", { class: "btn", title: "Add a link to the company's posting, or paste its text, so it can be scored" },
    "Add the posting");
  b.onclick = () => {
    const url = h("input", { type: "url", placeholder: "Link to the company's posting" });
    const text = h("textarea", { rows: 4, placeholder: "…or paste the posting's text" });
    const save = h("button", { class: "btn primary" }, "Save");
    save.onclick = async () => {
      save.disabled = true;
      try {
        const r = await api("/api/posting", { key: job.key, url: url.value, text: text.value });
        toast(r.said);
        done(r);
      } catch (e) { save.disabled = false; toast(e.message); }
    };
    b.replaceWith(h("div", { style: "flex-basis:100%; display:grid; gap:8px" }, url, text, h("div", {}, save)));
  };
  return b;
}

// A job from a LinkedIn alert: opens its LinkedIn page in a new tab (jobwatch never reads linkedin.com itself). There,
// the extension's "Open the company's posting" presses LinkedIn's Apply button, and the company's page fills the job in.
function linkedinButton(job) {
  if (!/^https?:\/\/([\w-]+\.)?linkedin\.com\/jobs\//i.test(job.url || "")) return null;
  return h("a", { class: "btn", href: job.url, target: "_blank", rel: "noopener",
    title: "Open the job on LinkedIn. With the jobwatch browser extension, click its icon there and choose \"Open the " +
      "company's posting\" to get to the company's own page for it." }, "Open on LinkedIn ↗");
}

function scoreButton(job, canScore, card = j => todayCard(j, canScore, 0)) {
  if (job.fit && !job.fit.stale) return null;
  const redraw = j => document.getElementById("job-" + j.key).replaceWith(card(j));
  if (job.unscored?.code === "no_text")
    return [postingButton(job, r => {
      if (r.has_text) job.unscored = { code: "queued", text: "Posting added: in line to score" };
      redraw(job);
    }), linkedinButton(job), unscoredNote(job)];
  if (!canScore || NO_SCORE_BUTTON.includes(job.unscored?.code)) return unscoredNote(job);
  const b = h("button", { class: "btn", title: "Compare this posting with your resume (can take a while)" }, "Score fit");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Scoring…";
    try {
      job.fit = await api("/api/score", { key: job.key });
      redraw(job);
    } catch (e) { b.disabled = false; b.textContent = "Score fit"; toast(e.message); }
  };
  return [b, unscoredNote(job)];
}

// "Snooze": not a no, only not while an application is in progress at the same company. The job comes back to the
// queue when that application ends, or after store.SNOOZE_DAYS (many companies never say no). `act(status, label)`
// marks it. No button when there's nothing to wait for.
const SNOOZE_LIMIT = "3 weeks";
function snoozeButton(job, act) {
  const on = job.waiting_on || [];
  if (!on.length || job.closed || job.status === "snoozed") return null;
  const what = on.length === 1 ? `your ${on[0].title} application` : `your ${on.length} applications there`;
  return h("button", { class: "btn", title: `Set it aside while ${what} is in progress. It comes back to your queue ` +
      `when ${on.length === 1 ? "that ends" : "they end"}, or in ${SNOOZE_LIMIT} if there's no news.`,
    onclick: () => act("snoozed", `😴 Snoozed: ${job.title}. Back in your queue when ${what} ends, or in ${SNOOZE_LIMIT}.`) },
    icon("pause", 14), "Snooze");
}

// Opens the application form in a new tab (a link, so the browser lets it open); `then` runs alongside, e.g.
// queueing the job. The jobwatch browser extension fills the form there and records it when it's submitted.
function applyButton(job, primary, then) {
  if (job.closed || !(job.apply_url || job.url)) return null;
  return h("a", { class: "btn" + (primary ? " primary" : ""), href: job.apply_url || job.url, target: "_blank",
    rel: "noopener", title: "Open the application form. With the jobwatch browser extension, click its icon there to fill " +
      "the form; it marks the job applied when you submit.", onclick: () => then && then() }, "Apply ↗");
}

// "Tailor resume": resume-kit drafts a version from the posting and builds its PDF (seconds), kept as this job's
// resume, which the extension attaches. Updates in place, and says to review the PDF before applying. When
// resume-kit isn't set up, the button says how to (job.tailor_setup). `job.resume` is the name kept so far.
function tailorResultLine(r) {
  const pages = r.pages == null ? "" : `${r.pages} page${r.pages === 1 ? "" : "s"}`;
  return [r.new ? "new" : "rebuilt", pages, r.ok ? "ok" : "needs a look"].filter(Boolean).join(" · ");
}
function tailorButton(job) {
  const out = h("div", { class: "tailor" });
  const b = h("button", { class: "btn", title: "Build a resume for this job with resume-kit from the posting, and keep it " +
    "with the application. You review it before you apply." });
  const label = () => job.resume ? "Rebuild resume" : "Tailor resume";
  const draw = r => {
    out.hidden = !(job.resume || r || job.tailor_help);
    out.dataset.tone = r ? (r.ok ? "ok" : "warn") : job.tailor_help ? "warn" : "";
    fill(out,
      job.tailor_help ? h("span", { class: "problems" }, job.tailor_help) : null,
      job.resume ? [h("span", {}, "Resume: "), h("button", { class: "open", title: `Open ${job.resume} to review it`,
        onclick: () => openStored(job.key, job.resume) }, icon("file", 14), job.resume, " ↗")] : null,
      r ? h("span", { class: "badge" + (r.ok ? "" : " warn") }, tailorResultLine(r)) : null,
      r ? h("span", { class: "small" }, `version ${r.version}`) : null,
      r && r.problems.length ? h("div", { class: "problems" }, r.problems.join("\n")) : null,
      r ? h("div", { class: "review small" }, "Review this PDF before you apply: the page picks your confirmed facts " +
        "by what the posting asks for, but the headline and summary are the ones your version already had.") : null);
  };
  b.textContent = label();
  b.onclick = async () => {
    if (!job.can_tailor) { job.tailor_help = job.tailor_setup; draw(); return; }
    b.disabled = true; b.replaceChildren(icon("refresh", 14), "Building… (a few seconds)");
    b.classList.add("spin");
    try {
      const r = await api("/api/tailor", { key: job.key });
      job.resume = r.pdf; job.tailor_help = null;
      draw(r);
      toast(`📄 ${r.new ? "Drafted" : "Rebuilt"} a resume for ${job.company}: review it, then apply.`, null, r.ok ? "win" : "");
    } catch (e) { job.tailor_help = e.message; draw(); toast("Couldn't build the resume: see the card"); }
    b.classList.remove("spin"); b.disabled = false; b.textContent = label();
  };
  draw();
  return [b, out];
}

function todayCard(job, canScore, i) {
  return jobCard(job, [
    h("button", { class: "btn primary",
      onclick: () => mark(job, "queued", null, `📌 Queued: ${job.title}. ${pick(QUEUED)}`, job.status) }, "Queue"),
    applyButton(job, false, () => mark(job, "queued", null, `📌 Queued and opened: ${job.title}. Submit it there.`,
      job.status)),
    snoozeButton(job, (status, label) => mark(job, status, null, label, job.status)),
    h("button", { class: "btn",
      onclick: () => mark(job, "skipped", null, `Skipped: ${job.title}. ${pick(SKIPPED)}`, job.status) }, "Skip"),
    detailsButton(job), scoreButton(job, canScore),
  ], i);
}

async function openDetails(key) {
  const overlay = document.getElementById("overlay"), dialog = document.getElementById("dialog");
  dialog.classList.remove("with-chat");
  dialog.replaceChildren(h("div", { class: "muted" }, "Loading…"));
  overlay.style.display = "flex";
  try {
    const j = await api("/api/job?key=" + encodeURIComponent(key));
    dialog.classList.add("with-chat");
    fill(dialog,
      h("div", {},
        h("div", { class: "row", style: "align-items:flex-start" }, h("h2", { style: "flex:1" }, j.title), fitBox(j.fit, j.key) || noFitBox(j),
          h("button", { class: "btn", onclick: closeDetails }, "Close")),
        h("div", { class: "meta" }, [j.company, j.locations.join("; "), j.pay].filter(Boolean).join(" · ")),
        detailsFacts(j),
        j.meeting ? h("div", { class: "iv-banner" },
          h("b", {}, `${j.meeting.round_label || j.meeting.label} · ${fmtDay(j.meeting.day)} · ${meetingTime(j.meeting)} · ${relDay(j.meeting.day, todayIso())}`),
          j.next_step) : j.next_step || j.follow_up ? nextLine(j, todayIso()) : null,

        linkNote(j),
        j.duplicate_of ? h("div", { class: "warns" }, dupeBadge(j.duplicate_of), " ", j.duplicate_of.text) : null,
        paySources(j),
        payWhy(j),
        gapsLine(j.fit),
        whyScore(j.fit),
        knowLine(j, 10),
        h("div", { class: "row actions" }, link(j.url, "Open the posting ↗"), detailsScore(j),
          j.candidate_home ? h("span", { title: "This company's own Workday account: sign in to see where your application stands" },
            link(j.candidate_home, "Your applications there ↗")) : null,
          APPLIED.includes(j.status) ? [j.sheets?.length && j.sheets_base
            ? h("a", { class: "btn", href: j.sheets_base + encodeURIComponent(j.sheets[0]), target: "_blank", rel: "noopener",
              title: `Your prep sheet, ${j.sheets[0]}, in a new tab` }, "Prep sheet ↗")
            : h("button", { class: "btn", onclick: () => openPrepPage(j.key),
              title: "Their asks next to your resume, gaps, what you sent, questions to expect, in a new tab" }, "Prep sheet ↗"),
            h("button", { class: "btn", onclick: () => openPrep(j.key),
              title: "Find a story, a mock interview and drafted answers for this job" }, "Practise")] : null,
          h("span", { class: "muted small" }, "· key "), h("code", { class: "small" }, j.key)),
        APPLIED.includes(j.status) || hasPackage(j.package) ? sentSection(j) : null,
        gapChips(j.skills),
        j.text ? [h("div", { class: "d-head" }, icon("file", 14), "The posting"), h("div", { class: "posting" }, j.text)] : null),
      h("div", { class: "job-chat" }, chatBox({
        key: j.key, title: `Ask about ${j.company}`, intro: `Ask anything about ${j.title}: how you fit, what to lead with, how to prepare.`,
        suggestions: APPLIED.includes(j.status)
          ? ["Prep me for a recruiter call about this role", "What did I tell them? Sum up what I sent",
            "What are they likely to ask in interviews?", "Draft a short follow-up note to the recruiter"]
          : ["How well do I fit this role, honestly?", "What should my resume lead with for this one?",
            "What are they likely to ask in interviews?", "Draft a short note to a recruiter here"],
      })));
    watchPay([j], "details");
  } catch (e) { dialog.classList.remove("with-chat"); showError(dialog, e); }
}
// Every stage a job can be put at from its details, in the order a search goes.
const DETAIL_STAGES = ["queued", "applied", "screening", "interviewing", "offer", "rejected", "withdrawn", "skipped", "snoozed"];
// The details' top strip: the stage, as a picker (the one place to mark a job rejected, withdrawn...), then the days.
function detailsFacts(j) {
  const names = { ...STAGE_NAMES, queued: "Queued", skipped: "Skipped", snoozed: "Snoozed", new: "Not acted on", shown: "Not acted on" };
  const stages = DETAIL_STAGES.includes(j.status) ? DETAIL_STAGES : [j.status, ...DETAIL_STAGES];
  const sel = h("select", { class: "stage", "aria-label": "Stage", title: "Move this job to another stage" },
    stages.map(s => h("option", { value: s }, names[s] || s)));
  sel.value = j.status;
  sel.onchange = async () => {
    const to = sel.value, before = j.status;
    try {
      await api("/api/track", { key: j.key, status: to });
      detailsDirty = true;
      toast(stageWords(j.company, to), async () => {
        await api("/api/track", { key: j.key, status: before }); openDetails(j.key); render();
      }, TONES[to]);
      openDetails(j.key);
    } catch (e) { toast(e.message); sel.value = before; }
  };
  const day = s => s ? fmtDay(s.slice(0, 10)) : null;
  const tile = (lbl, val) => val ? h("div", { class: "d-fact" }, h("div", { class: "lbl" }, lbl), h("div", { class: "val" }, val)) : null;
  return h("div", { class: "d-facts" },
    h("div", { class: "d-fact stage", style: `--sc:var(--s-${j.status}, var(--accent))` }, h("div", { class: "lbl" }, "Stage"), sel),
    tile("Applied", day(j.applied_at)), tile("Posting closed", day(j.closed)), tile("First seen", day(j.first_seen)));
}
function detailsScore(j) {
  if (j.fit && !j.fit.stale) return null;
  if (j.unscored?.code === "no_text" && j.manual) return [postingButton(j, () => openDetails(j.key)), unscoredNote(j)];
  if (!j.can_score || NO_SCORE_BUTTON.includes(j.unscored?.code)) return unscoredNote(j);
  const b = h("button", { class: "btn", title: "Compare this posting with your resume (can take a while)" }, "Score fit");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Scoring…";
    try { await api("/api/score", { key: j.key }); openDetails(j.key); }
    catch (e) { b.disabled = false; b.textContent = "Score fit"; toast(e.message); }
  };
  return [b, unscoredNote(j)];
}
// A note's dated lines, newest first, as [day, text]: notes grow a dated line at a time (prep.note_entries does
// the same for the standalone page). Text before the first dated line has no day.
function noteEntries(note) {
  return String(note || "").trim().split(/\s+/).join(" ").split(/\s(?=\d{4}-\d{2}-\d{2}: )/)
    .map(p => { const m = p.match(/^(\d{4}-\d{2}-\d{2}): (.*)$/); return m ? [m[1], m[2]] : ["", p]; })
    .filter(e => e[1]).reverse();
}
function noteTimeline(note) {
  return h("ul", { class: "timeline" }, ...noteEntries(note).map(([day, text]) =>
    h("li", {}, h("span", { class: "day" }, day), h("span", {}, text))));
}
// The prep sheet at a glance: fit, must-haves and the days that matter, as the stat tiles Today uses.
function prepTiles(p) {
  const tiles = [p.fit && [Math.round(p.fit.score || 0), "Fit score", "lead"],
    p.fit && [`${p.fit.must_haves_met || 0}/${p.fit.must_haves_total || 0}`, "Must-haves met", ""],
    p.applied_at && [p.applied_at, "Applied", ""], p.follow_up && [p.follow_up, "Follow up", ""]].filter(Boolean);
  return tiles.length ? h("div", { class: "hero" }, ...tiles.map(([num, lbl, cls]) =>
    h("div", { class: "stat " + cls }, h("div", { class: "num" }, String(num)), h("div", { class: "lbl" }, lbl)))) : null;
}
// The built prep sheet as its own page, in a new tab, for a job with no sheet you wrote. The tab opens on the click,
// since one opened after waiting for the sheet would be blocked, and shows the sheet once it's built.
async function openPrepPage(key) {
  const tab = window.open("", "_blank");
  if (!tab) return toast("Couldn't open a new tab: your browser blocked it");
  tab.document.title = "Prep sheet…";
  try {
    const p = await api("/api/prep?key=" + encodeURIComponent(key));
    const url = URL.createObjectURL(new Blob([p.html], { type: "text/html" }));
    tab.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { tab.close(); toast(e.message); }
}
// A prep sheet for a call: the posting's asks next to the closest resume line, gaps, what was sent, questions.
// draft: the chat's model drafts likely questions with answers from the story file (slow the first time, then kept).
async function openPrep(key, draft = false, questions = false) {
  const dialog = document.getElementById("dialog");
  dialog.classList.remove("with-chat");
  dialog.replaceChildren(h("div", { class: "muted" }, draft ? "Drafting questions and answers from your stories… "
    + "(the first time can take a minute or two)" : "Loading…"));
  try {
    const p = await api("/api/prep?key=" + encodeURIComponent(key) + (draft ? "&draft=1" : "") + (questions ? "&questions=1" : ""));
    const list = items => h("ul", {}, ...items.map(i => h("li", {}, i)));
    const KIND = { need: "They ask for", do: "You'd be doing", nice: "Nice to have" };
    const which = { sent: "the resume you sent", base: "your resume" }[p.resume_used];
    const gaps = [...(p.fit?.gaps || []), ...p.gaps.filter(g => g.must_have).map(g => g.name + " (a must-have)"),
      ...p.gaps.filter(g => !g.must_have).map(g => g.name)];
    const sent = p.sent.files.length || p.sent.answers.length || p.sent.note;
    const copy = h("button", { class: "btn" }, "Copy as text");
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(p.markdown); toast("Copied the prep sheet"); }
      catch { toast("Couldn't copy: your browser blocked it"); }
    };
    // The standalone page, in a new tab: it prints cleanly and can be saved or sent as it is.
    const page = h("button", { class: "btn", title: "The same sheet as its own page, to print or save" }, "Open as page");
    page.onclick = () => {
      const url = URL.createObjectURL(new Blob([p.html], { type: "text/html" }));
      if (!window.open(url, "_blank")) toast("Couldn't open a new tab: your browser blocked it");

// A safe subset of Markdown (paragraphs, lists, headings, bold, code, links), built as DOM nodes.
function inline(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:[^)\s]+\))/).filter(Boolean).map(part => {
    let m;
    if (/^\*\*[^*]+\*\*$/.test(part)) return h("strong", {}, part.slice(2, -2));
    if (/^`[^`]+`$/.test(part)) return h("code", {}, part.slice(1, -1));
    if ((m = part.match(/^\[([^\]]+)\]\((https?:[^)\s]+)\)$/))) return link(m[2], m[1]);
    return part;
  });
}
function md(text) {
  const out = [];
  let list = null;
  for (const line of text.split("\n")) {
    let m;
    if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/))) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (!list || list.tagName.toLowerCase() !== tag) out.push(list = h(tag, {}));
      list.append(h("li", {}, inline(m[2])));
    } else {
      list = null;
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) out.push(h("p", {}, h("strong", {}, inline(m[1]))));
      else if (line.trim()) out.push(h("p", {}, inline(line)));
    }
  }
  return out;
}

    s.tokens_per_sec ? `${s.tokens_per_sec} tokens/s` : "",

  const history = chats.get(id);
  const log = h("div", { class: "chat-log", "aria-live": "polite" });
  const where = h("span", { class: "where" }, "…");
  getChatInfo().then(i => {
    if (i.error) return fill(where, i.error);
    where.classList.toggle("private", i.local);
    where.title = i.local ? `${i.model} runs on this computer. Nothing you ask leaves it.`
      : `Sent to Anthropic's ${i.model}, with your resume and the job data shown here.`;
    fill(where, icon(i.local ? "lock" : "cloud", 12), i.local ? "Private · runs on this computer" : `${i.label} · cloud`);
  });
  const input = h("textarea", { rows: 1, placeholder: "Ask anything…", "aria-label": "Your question" });
  const send = h("button", { class: "send", type: "submit", title: "Send (Enter)", "aria-label": "Send" }, icon("send", 17));
  const save = h("button", { class: "icon-btn", title: "Download the conversation", "aria-label": "Download the conversation",
    onclick: () => {
      const text = `# ${title}\n\n` + history.map(m => (m.role === "user" ? "**You:** " : "**jobwatch:** ") + m.content +
        (m.stats ? `\n\n_${statsText(m.stats)}_` : "")).join("\n\n---\n\n") + "\n";
      const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/markdown" })),
        download: title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".md" });
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } }, icon("download", 15));
  const fresh = h("button", { class: "icon-btn", title: "Start over", "aria-label": "Start over",
    onclick: () => { if (busy) busy.abort(); history.length = 0; draw(); input.focus(); } }, icon("refresh", 15));
  let busy = null;  // an AbortController while a reply streams

  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, 160) + "px"; };
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const setBusy = on => {
    fill(send, icon(on ? "stop" : "send", on ? 14 : 17));
    send.classList.toggle("stop", on);
    send.title = on ? "Stop" : "Send (Enter)";
    send.disabled = !on && !input.value.trim();
    fresh.style.visibility = save.style.visibility = history.length ? "" : "hidden";
  };
  const draw = () => {
    fill(log, history.length ? history.map(m => m.role === "user" ? h("div", { class: "msg user" }, m.content)
      : h("div", { class: "turn" }, h("div", { class: "msg bot" }, md(m.content)), replyMeta(m)))
      : h("div", { class: "chat-hello" }, h("div", { class: "spark" }, icon("sparkle", 24)), h("div", {}, intro),
        h("div", { class: "suggest" }, suggestions.map(s => h("button", { onclick: () => ask(s) }, s)))));
    scroll();
    setBusy(!!busy);
  };

  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;
    history.push({ role: "user", content: text });
    input.value = ""; grow();
    busy = new AbortController();
    draw();
    const expect = expectedSeconds(), started = Date.now(), clock = h("span", {}, "0s");
    const status = h("span", {}, expect ? `~${expect}s expected` : "");
    const out = h("div", { class: "msg bot" }, h("div", { class: "thinking" },
      h("span", { class: "dots", "aria-label": "Thinking" }, h("i"), h("i"), h("i")), clock, status));
    const turn = h("div", { class: "turn" }, out);
    const tick = setInterval(() => { clock.textContent = Math.round((Date.now() - started) / 1000) + "s"; }, 1000);
    log.append(turn); scroll();
    let reply = "", failed = null, queued = false, stats = null, finished = false;
    const paint = () => {  // the reply so far, with a caret while it's still being written
      queued = false;
      fill(out, md(reply));
      let last = out.lastElementChild;
      if (last && /^(UL|OL)$/.test(last.tagName)) last = last.lastElementChild;
      if (!finished) (last || out).append(h("span", { class: "caret" }, "▋"));
      scroll();
    };
    try {
      const r = await fetch("/api/chat", { method: "POST", signal: busy.signal,
        body: JSON.stringify({ key, messages: history.map(({ role, content }) => ({ role, content })) }),
        headers: { "X-Jobwatch-Token": TOKEN, "Content-Type": "application/json" } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const msg = JSON.parse(buf.slice(0, nl));
          buf = buf.slice(nl + 1);
          if (msg.text) { clearInterval(tick); reply += msg.text; if (!queued) { queued = true; requestAnimationFrame(paint); } }
          if (msg.stats) stats = msg.stats;
          if (msg.status) status.textContent = msg.status + "…";
          if (msg.error) failed = msg.error;
        }
      }
    } catch (e) { failed = e.name === "AbortError" ? "stopped" : e.message; }
    busy = null;
    clearInterval(tick);
    if (reply) {
      const entry = { role: "assistant", content: reply, stats };
      history.push(entry);
      finished = true;
      paint();
      if (failed) out.append(h("p", { class: "stopped" }, failed === "stopped" ? "Stopped." : `Cut off: ${failed}`));
      turn.append(replyMeta(entry));
      if (stats?.seconds && !failed) rememberSeconds(Math.round(stats.seconds - (stats.waited_seconds || 0)));  // the reply alone
    } else {
      history.pop();  // nothing came back: give the question back to edit or resend
      if (failed !== "stopped") { input.value = text; grow(); }
      draw();
      if (failed && failed !== "stopped") log.append(h("div", { class: "msg bot err" }, failed));
      scroll();
    }
    setBusy(false);
  }

  input.oninput = () => { grow(); setBusy(!!busy); };
  input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } };
  const form = h("form", { class: "chat-input", onsubmit: e => { e.preventDefault(); busy ? busy.abort() : ask(input.value); } },
    input, send);
  const box = h("div", { class: "chat" },
    h("div", { class: "chat-head" }, h("div", { class: "spark" }, icon("sparkle", 17)),
      h("div", { class: "t" }, h("b", {}, title), where), save, fresh,
      onclose ? h("button", { class: "icon-btn", title: "Close", "aria-label": "Close", onclick: onclose }, icon("x", 16)) : null),
    log, form);
  draw();
  return box;
}

// On a wide screen, a sticky sidebar (stats, search, facets) beside the list; on a narrow one, stacked.
function layout(side, content) {

function panel(title, ...kids) { return h("div", { class: "panel" }, title ? h("h4", {}, title) : null, kids); }
function segmented(options, value, onpick) {

// `toggle`, when given ({hidden: name -> count, onhide, onshow}): a checkbox on each row, ticked while its jobs
// show. Unticking leaves that name out (a company from Today); the ones left out stay listed at the end, unticked
// with the jobs they'd bring back, so ticking one again is a click away.
// With `toggle.onhideall` and `toggle.onshowall` (each given the names), a search box narrows the list and All / None
// tick or untick every name it shows at once.
function facetList(counts, active, onpick, most = 12, toggle = null) {
  const list = h("div", {});
  let open = false, q = "";
  const matches = name => !q || name.toLowerCase().includes(q);
  const bulk = toggle && toggle.onhideall ? (() => {
    const search = h("input", { type: "search", class: "facet-search", placeholder: "Filter companies", "aria-label": "Filter companies" });
    search.oninput = () => { q = search.value.trim().toLowerCase(); draw(); };
    const names = on => Object.keys(on ? counts : toggle.hidden()).filter(matches);
    const btn = (label, title, on) => h("button", { class: "btn ghost", title, onclick: e => {
      const pick = names(on);
      if (!pick.length) return;
      e.currentTarget.disabled = true;
      (on ? toggle.onhideall : toggle.onshowall)(pick);
    } }, label);
    return h("div", { class: "facet-tools" }, search,
      btn("All", "Tick every company listed (the filter's matches when you've typed one)", false),
      btn("None", "Hide every company listed from Today (the filter's matches when you've typed one): saved, like " +
        "unticking each, until you tick them again", true));
  })() : null;
  const el = h("div", {}, bulk, list);
  const fill_ = (...kids) => fill(list, ...kids);
  const box = (name, on) => {
    const c = h("input", { type: "checkbox", title: on ? `Untick to hide ${name}'s jobs` : `Tick to show ${name}'s jobs again`,
      "aria-label": `Show ${name}'s jobs` });
    c.checked = on;
    c.onchange = () => { c.disabled = true; (on ? toggle.onhide : toggle.onshow)(name); };
    return c;
  };
  const draw = () => {
    const rows = Object.entries(counts).filter(([name]) => matches(name)).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const off = toggle ? Object.entries(toggle.hidden()).filter(([name]) => matches(name)).sort((a, b) => a[0].localeCompare(b[0])) : [];
    fill_((open || q ? rows : rows.slice(0, most)).map(([name, n]) => !toggle
      ? h("button", { class: "facet" + (name === active() ? " on" : ""), onclick: () => { onpick(name === active() ? "" : name); draw(); } },
        h("span", {}, name), h("span", { class: "c" }, n))
      : h("div", { class: "facet row" + (name === active() ? " on" : "") }, box(name, true),
        h("button", { class: "fname", title: `Only ${name}'s jobs`, onclick: () => { onpick(name === active() ? "" : name); draw(); } }, name),
        h("span", { class: "c" }, n))),
      rows.length > most && !q ? h("button", { class: "facet more", onclick: () => { open = !open; draw(); } },
        open ? "Show fewer" : `Show all ${rows.length}`) : null,
      q && !rows.length && !off.length ? h("div", { class: "small muted", style: "padding:4px 8px" }, "No company matches") : null,
      off.length ? h("div", { class: "facet-sep" }, `Hidden · ${off.length}`) : null,
      off.map(([name, n]) => h("label", { class: "facet row off", title: `Tick to show ${name}'s jobs again` }, box(name, false),
        h("span", { class: "fname" }, name), h("span", { class: "c" }, n || ""))));
  };
  draw();
  el.redraw = draw;
  return el;
}

// Fit scores are worked out in the background after each check for new jobs: say how far along, and offer to
// show the new ones (redrawing on its own would move cards while you read).
let scoringTimer = null;
function watchScoring(first, el) {
  clearTimeout(scoringTimer);
  const seen = first.done;
  const draw = s => {
    const fresh = s.done - seen;
    const show = fresh > 0 ? h("button", { class: "btn ghost", onclick: () => renderToday() },
      `Show ${fresh} new score${fresh === 1 ? "" : "s"}`) : null;
    el.classList.toggle("spin", s.running);
    if (s.running) fill(el, icon("refresh", 14), `Scoring fit in the background: ${s.left} to go`,
      s.current ? h("span", { class: "hint", title: s.current }, ` · now ${s.current}`) : null, show);
    else if (s.error) fill(el, h("span", { title: s.error }, "Background scoring stopped: " + s.error), show);
    else fill(el, show);
  };
  const poll = async () => {
    if (!el.isConnected) return;
    try { const s = await api("/api/scoring"); draw(s); if (s.running) scoringTimer = setTimeout(poll, 15000); }
    catch { /* the page may be restarting: the next render tries again */ }
  };
  draw(first);
  if (first.running) scoringTimer = setTimeout(poll, 15000);
}

// The daily backup runs where nobody's looking and a failure only reaches its log, so Today says when it has stopped.
function backupLate(b) {
  return !b ? null : b.last ? `Last backup ${b.last}` : "No backup found";
}

// When the boards were last checked. The page checks them by itself every few hours (fetch_every in the
// watchlist) and the button checks now; a check that finishes while you read offers to show what it found.
let checkedTimer = null;
function watchChecked(first, el) {
  clearTimeout(checkedTimer);
  const seen = first.at;
  const hours = n => n === 24 ? "day" : n % 24 === 0 ? `${n / 24} days` : n === 1 ? "hour" : `${+n.toFixed(1)} hours`;
  const draw = c => {
    const failed = Object.keys(c.errors || {}), warned = Object.keys(c.warnings || {});
    const fresh = c.at !== seen && !c.running && c.new ? h("button", { class: "btn ghost", onclick: () => renderToday() },
      `Show ${c.new} new job${c.new === 1 ? "" : "s"}`) : null;
    el.classList.toggle("spin", c.running);
    fill(el, c.running ? icon("refresh", 14) : null,
      c.at ? `Boards checked ${ago(c.at)}` : "Boards not checked yet", c.running ? " · checking now…" : null,
      c.every_hours ? h("span", { class: "hint" }, ` · every ${hours(c.every_hours)}`) : null,
      c.times && c.times.length ? h("span", { class: "hint", title: c.next ? `Next check ${clock(c.next)}` : null },
        ` · at ${listed(c.times.map(t => clock("2000-01-01T" + t)))}`) : null,
      failed.length ? h("span", { class: "hint", title: failed.map(b => `${b}: ${c.errors[b]}`).join("\n") },
        ` · ${failed.length} failed`) : null,
      warned.length ? h("span", { class: "hint", title: warned.map(b => `${b}: ${c.warnings[b]}`).join("\n") },
        ` · ${warned.length} to look at`) : null,
      c.error ? h("span", { class: "hint", title: c.error }, " · the last scheduled check failed") : null,
      c.backup ? h("span", { style: "color:var(--bad);font-weight:600", title: `Folder: ${c.backup.dest}\nLog: ${c.backup.log}` },
        ` · ${backupLate(c.backup)}`) : null, fresh);
  };
  const poll = async () => {
    if (!el.isConnected) return;
    try { const c = await api("/api/checked"); draw(c); checkedTimer = setTimeout(poll, c.running ? 5000 : 60000); }
    catch { /* the page may be restarting: the next render tries again */ }
  };
  draw(first);
  checkedTimer = setTimeout(poll, first.running ? 5000 : 60000);
}

function filterValues(inp) {

function money(n) { return n >= 1e6 ? `$${+(n / 1e6).toFixed(2)}M` : `$${Math.round(n / 1000)}K`; }
// A title pattern as words, for the bar: "\b(intern|new grad)\b" reads "intern, new grad". The tooltip keeps it as is.
function readable(patterns) {
  return patterns.flatMap(p => p.replace(/\\b/g, "").replace(/\\w[*+]/g, "…").replace(/\[[^\]]*\][?*+]?/g, "")
    .replace(/(^|[^\\])[()^$]/g, "$1").replace(/\\(.)/g, "$1").split("|")).map(s => s.trim()).filter(Boolean);
}
function some(list, most = 3) {
  return list.slice(0, most).join(", ") + (list.length > most ? ` +${list.length - most} more` : "");
}

// Today's filter bar: "Titles: engineer, architect · Places: Remote (US), Denver · Pay ≥ $180K · Posted within
// 45 days · Edit", each part opening a small editor in place. Saving redraws Today with the new filters.
function filterBar(hidden) {
  const f = settings.filters || {};
  const bar = h("div", { class: "fbar", role: "group", "aria-label": "Filters" });
  const remote = ((f.remote_country || "US").toLowerCase() === "any" ? "Remote (anywhere" : "Remote (US") +
    (f.home_state ? `, open to ${f.home_state})` : ")");
  const places = (f.locations || []).map(p => p.toLowerCase() === "remote" ? remote : p);
  const pay = [f.min_salary ? `≥ ${money(f.min_salary)}` : f.require_salary ? "" : "any",
    f.require_salary ? "listed only" : ""].filter(Boolean).join(", ");
  const parts = [

// all: every matching job, paged, rather than today's picks (the top display.today in the order picked).
// where, fit, pay: the quick narrowing (see quickNarrow); "any" and 0 mean off.
const todayView = { q: "", sort: remembered("today.sort", "fit"), company: "", kws: new Set(), where: "any", fit: 0, pay: 0, posted: 0, page: 1, all: false,
  rolesOff: rolesOffKept() };
// Today's Roles checkboxes: the kinds of work unticked, kept in this browser (a view, not a filter in the watchlist).
function rolesOffKept() {
  try { return new Set(JSON.parse(remembered("today.roles-off", "[]"))); } catch { return new Set(); }
}
// A job stays while any kind of work its title names is ticked (a server from before `roles` sends none: it stays).
const roleShown = (j, v) => !(v.rolesOff && v.rolesOff.size) || !(j.roles || []).length ||
  j.roles.some(r => !v.rolesOff.has(r));
const SORTED = { fit: "best fit first", new: "newest first", pay: "top pay first", worth: "most worth it first" };
// Today's picks: the top `n` in order, but each company's best job before a second one from anywhere, so the
// applications go to many companies rather than again and again to one.
function spreadPicks(jobs, n) {
  const seen = new Set(), first = [], rest = [];
  for (const j of jobs) (seen.has(j.company) ? rest : (seen.add(j.company), first)).push(j);
  return [...first, ...rest].slice(0, n);
}
// The work wanted most (the watchlist's focus) leads whichever sort is picked; each part keeps that sort's order.
function focusFirst(jobs) {
  return [...jobs.filter(j => j.focus), ...jobs.filter(j => !j.focus)];
}
// "Worth it": the Comps tab's weighted score (career, pay, fit, company health); cards show it while that order is on.
let worthShown = false;
const byWorth = (a, b) => (b.worth?.score ?? -1) - (a.worth?.score ?? -1);
// A part with nothing to go on shows "?", not its neutral 50, so an unknown doesn't read as middling.
const partText = ([k, p]) => p.known === false ? `${k} ? (${p.input}, counts as ${p.score})` : `${k} ${p.score} (${p.input})`;
function worthChip(job) {
  if (!worthShown || !job.worth) return null;
  const parts = Object.entries(job.worth.parts).map(partText).join("\n");
  return h("span", { class: "chip hit", title: "Worth it, by the Comps tab's rules:\n" + parts }, `worth ${job.worth.score}`);
}

// Today's quick narrowing, on top of the saved filters: how the job is worked, a lowest fit score, a lowest top of
// the posted pay. A job with no location, no score yet or no listed pay isn't hidden by that part, the same as the
// saved filters treat them.
function quickNarrow(j, v) {
  const where = j.where || [];  // a server from before `where` sends none
  return roleShown(j, v) && (v.where === "any" || !where.length || where.includes(v.where)) &&
    (!v.fit || (j.fit && j.fit.score >= v.fit)) &&  // a fit filter shows scored jobs only
    (!v.pay || j.salary_max == null || j.salary_max >= v.pay) &&
    (!v.posted || j.age_days == null || j.age_days <= v.posted);  // no posting date: still shows
}
// Jobs per company among the ones the other filters (search, keywords, quick narrowing) let through: a company's
// count is what picking it shows. `into` is refilled in place, since the Companies list keeps reading it.
function companyCounts(jobs, v, into = {}) {
  const q = v.q.trim().toLowerCase();
  for (const k of Object.keys(into)) delete into[k];
  for (const j of jobs)
    if ((!q || `${j.title} ${j.company}`.toLowerCase().includes(q)) && [...v.kws].every(k => j.keywords.includes(k)) &&
        quickNarrow(j, v)) into[j.company] = (into[j.company] || 0) + 1;
  if (v.company && !(v.company in into)) into[v.company] = 0;  // the picked one stays listed, to unpick
  return into;
}
let todayJobs = [], drawToday = () => {};

// Today's Roles list: a checkbox per kind of work ([key, label] from the server), with how many of Today's jobs
// name it. Unticking one hides the jobs that are only that kind (see roleShown); the name shows that kind alone,
// and again brings every kind back. Kept in this browser.
function rolesList(kinds, jobs, v, changed) {
  const list = h("div", {});
  const keep = () => { remember("today.roles-off", JSON.stringify([...v.rolesOff])); changed(); };
  // All ticks every kind; None unticks them all (an empty wall), to tick just the ones wanted.
  const tools = h("div", { class: "facet-tools" },
    h("button", { class: "btn ghost", title: "Tick every kind of role", onclick: () => { v.rolesOff = new Set(); keep(); } }, "All"),
    h("button", { class: "btn ghost", title: "Untick every kind of role, then tick the ones you want",
      onclick: () => { v.rolesOff = new Set(kinds.map(([k]) => k)); keep(); } }, "None"));
  const el = h("div", {}, tools, list);
  const draw = () => {
    const n = Object.fromEntries(kinds.map(([k]) => [k, jobs.filter(j => (j.roles || []).includes(k)).length]));
    const only = k => v.rolesOff.size === kinds.length - 1 && !v.rolesOff.has(k);
    fill(list, kinds.filter(([k]) => n[k]).map(([k, label]) => {
      const box = h("input", { type: "checkbox", "aria-label": `Show ${label} jobs`,
        title: v.rolesOff.has(k) ? `Tick to show ${label} jobs` : `Untick to hide jobs that are only ${label}` });
      box.checked = !v.rolesOff.has(k);
      box.onchange = () => { box.checked ? v.rolesOff.delete(k) : v.rolesOff.add(k); keep(); };
      return h("div", { class: "facet row" + (only(k) ? " on" : "") + (v.rolesOff.has(k) ? " off" : "") }, box,
        h("button", { class: "fname", title: only(k) ? "Show every kind again" : `Only ${label} jobs`, onclick: () => {
          v.rolesOff = only(k) ? new Set() : new Set(kinds.map(([x]) => x).filter(x => x !== k)); keep();
        } }, label),
        h("span", { class: "c" }, n[k]));
    }));
  };

}

// The checkboxes in Today's Companies list: unticking one leaves its jobs out from now on

async function renderToday() {
  if (!settings.companies.length) return renderWelcome();
  // What the filters hide is a hint, not the page: Today still opens if it can't be counted.
  const [d, hidden] = await Promise.all([api("/api/digest"), api("/api/hidden").catch(() => null)]);
  todayJobs = d.jobs;
  const out = Object.values(d.rejected).reduce((a, b) => a + b, 0);
  const fresh = d.jobs.filter(j => j.status === "new").length, strong = d.jobs.filter(j => j.fit && j.fit.score >= 75).length;
  const picks = d.picks && d.jobs.length > d.picks ? d.picks : 0;  // Today's picks lead when there are more matches
  const byCompany = companyCounts(d.jobs, todayView), byKw = {};
  for (const j of d.jobs) for (const k of j.keywords) byKw[k] = (byKw[k] || 0) + 1;

  const scoring = h("div", { class: "scoring" }), checked = h("div", { class: "scoring checked" });

    h("button", { class: "chip toggle" + (v.kws.has(k) ? " on" : ""), title: `${n} jobs`,
      onclick: () => { v.kws.has(k) ? v.kws.delete(k) : v.kws.add(k); drawKws(); drawToday(); } }, k)));
  drawKws();
  const companies = facetList(byCompany, () => v.company, name => { v.company = name; drawToday(); }, 12, {
    onhide: hideCompany, onshow: showCompany, onhideall: hideCompanies, onshowall: showCompanies,
    hidden: () => (hidden && hidden.companies) || Object.fromEntries(leftOut().map(n => [n, 0])) });
  const narrow = h("div", {});
  const drawNarrow = () => fill(narrow,
    h("div", { class: "hint" }, "Where"),
    segmented([["any", "Any"], ["remote", "Remote"], ["onsite", "On-site or hybrid"]], v.where, k => { v.where = k; drawToday(); }),
    h("div", { class: "hint", style: "margin-top:8px", title: "Only jobs with a fit score: ones not scored yet are left out" }, "Fit score"),
    segmented([[0, "Any"], [60, "60+"], [70, "70+"], [80, "80+"]], v.fit, k => { v.fit = k; drawToday(); }),
    h("div", { class: "hint", style: "margin-top:8px", title: "The top of the posted range; jobs that don't list pay still show" }, "Top of posted pay"),
    segmented([[0, "Any"], [150000, "$150K+"], [200000, "$200K+"], [250000, "$250K+"], [300000, "$300K+"]], v.pay,
      k => { v.pay = k; drawToday(); }),
    h("div", { class: "hint", style: "margin-top:8px", title: "Jobs with no posting date still show" }, "Posted within"),
    segmented([[0, "Any"], [1, "24h"], [3, "3d"], [7, "7d"], [14, "14d"]], v.posted,
      k => { v.posted = k; drawToday(); }));
  drawNarrow();
  const roles = rolesList(d.role_kinds || [], todayJobs, v, () => drawToday());
  const clear = () => {
    Object.assign(v, { q: "", company: "", where: "any", fit: 0, pay: 0, posted: 0 });
    v.kws.clear(); search.value = ""; drawKws(); drawNarrow(); companies.redraw(); drawToday();
  };

  drawToday = () => {
    companyCounts(todayJobs, v, byCompany);
    companies.redraw();
    roles.redraw();
    const q = v.q.trim().toLowerCase();
    let jobs = todayJobs.filter(j => (!q || `${j.title} ${j.company}`.toLowerCase().includes(q)) &&
      (!v.company || j.company === v.company) && [...v.kws].every(k => j.keywords.includes(k)) && quickNarrow(j, v));
    if (v.sort === "new") jobs = [...jobs].sort((a, b) => (a.age_days ?? 1e4) - (b.age_days ?? 1e4));
    if (v.sort === "pay") jobs = [...jobs].sort((a, b) => (b.salary_max ?? -1) - (a.salary_max ?? -1));
    if (v.sort === "worth") jobs = [...jobs].sort(byWorth);
    jobs = focusFirst(jobs);
    worthShown = v.sort === "worth";
    const narrowed = v.q || v.company || v.kws.size || v.where !== "any" || v.fit || v.pay || v.posted;
    // Today's picks: the top few in this order. A search, company, keyword or quick narrowing looks through every match.
    const top = d.picks && jobs.length > d.picks;
    if (top && !narrowed && !v.all) {
      fill(showing, `Today's ${d.picks} picks, ${SORTED[v.sort]}, of ${jobs.length} matching jobs`);
      fill(list, spreadPicks(jobs, d.picks).map((j, i) => todayCard(j, d.can_score, i)));
      fill(pager, h("div", { class: "more-all" }, h("button", { class: "btn", onclick: () => { v.all = true; drawToday(); } },

      v.all = false; drawToday(); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); } }, `Back to today's ${d.picks} picks`) : null;
    fill(showing, pg.range ? `Showing ${pg.range}` + (narrowed ? ` (${todayJobs.length} in all)` : "")
      : `Showing ${jobs.length} of ${todayJobs.length}`, narrowed ? h("button", { class: "btn ghost", onclick: clear }, "Clear filters") : back);
    fill(list, jobs.length ? pg.items.map((j, i) => todayCard(j, d.can_score, i))

        v.q.trim() ? elsewhere(v.q) : null));
    fill(pager, pg.nav);
  };

  put(
    pagehead("Today", todayLine(greeting(new Date().getHours()), settings.companies.length)),
    filterBar(hidden),
    layout([
      hero([picks ? [picks, "picks for today", "lead wide"] : null, [d.jobs.length, picks ? "matching" : "matching jobs", picks ? "" : "lead"],
        [fresh, "new since last look"], [strong, "strong fits (75+)", strong ? "good" : ""], [out, "hidden by filters"]].filter(Boolean)),
      panel(null, search, h("div", { style: "margin-top:10px" },
        segmented([["fit", "Best fit"], ["new", "Newest"], ["pay", "Top pay"], ["worth", "Worth it"]], v.sort,
          k => { v.sort = k; remember("today.sort", k); drawToday(); }))),
      panel("Narrow down", narrow),
      (d.role_kinds || []).length ? panel("Roles", roles) : null,
      panel("Companies", companies),
      Object.keys(byKw).length ? panel("Keywords", kwChips) : null,
      toWatchPanel(),
    ], [h("div", { class: "status-row" }, paceLine(h("div", { class: "pace" }), d.pace), checked, scoring, showing), list, pager]));
  drawToday();
  if (d.checked) watchChecked(d.checked, checked);
  if (d.scoring) watchScoring(d.scoring, scoring);
  watchPay(todayJobs);
}

  el.style.display = "none";
  const draw = list => {
    el.style.display = list.length ? "" : "none";
    fill(body, list.map(s => {
      const row = h("div", { class: "to-watch" },
        h("div", { class: "top" }, h("b", {}, s.company),
          h("span", { class: "c", title: `last one ${s.last_seen}` }, `${s.matching_jobs} job${s.matching_jobs === 1 ? "" : "s"}`)),
        h("div", { class: "hint" }, "e.g. " + s.sample_titles.slice(0, 2).join(" · ")),
        h("div", { class: "hint" }, s.board
          ? [link(s.careers, s.board), s.board_found === "name" ? " (found by name: check it's theirs)" : null]
          : s.looked_up ? "No board found by name: try a link to its careers page in Settings." : "Looking for its board…"),
        h("div", { class: "acts" },
          s.board ? h("button", { class: "btn primary", title: `Watch ${s.board}`, onclick: () => act("add", s, row) }, "Add") : null,
          h("button", { class: "btn ghost", title: "Don't suggest it again", onclick: () => act("dismiss", s, row) }, "Dismiss")));
      return row;
    }));
  };
  const act = async (what, s, row) => {
    for (const b of row.querySelectorAll("button")) b.disabled = true;
    try {
      await api("/api/suggestions/" + what, { company: s.company });
      if (what === "add") {
        settings = await api("/api/settings");
        toast(`Watching ${s.company}. Press “Check for new jobs” to see its roles.`);
      } else toast(`${s.company} won't be suggested again.`);
      draw(await load(false));
    } catch (e) {
      toast(e.message);
      for (const b of row.querySelectorAll("button")) b.disabled = false;
    }
  };
  const load = async lookup => (await api("/api/suggestions" + (lookup ? "?lookup=1" : ""))).companies;
  (async () => {
    try {
      const list = await load(false);
      draw(list);
      if (list.some(s => !s.looked_up)) draw(await load(true));
    } catch { /* a suggestion, not the page: Today works without it */ }
  })();
  return el;
}

// -- first run: "Tell me about yourself", then the jobs you want, the companies to watch and the optional rest.
// Each step saves as you go and can be skipped; the last one ends on Today. A watchlist with no companies opens
// here (renderWelcome); once finished or skipped, Today only offers a way back to the companies step.

const ONBOARD_STEPS = ["About you", "Jobs you want", "Companies", "The rest"];
const onboarding = { step: 0 };

function renderWelcome() {
  if (remembered("onboarded", "")) {
    return put(h("div", { class: "card welcome" },
      h("h2", {}, "Nothing to watch yet"),
      h("p", {}, "jobwatch looks at the careers pages of companies you choose. Add a few and it starts looking."),
      h("div", { class: "row" },
        h("button", { class: "btn primary", onclick: () => { onboarding.step = 2; renderOnboarding(); } }, "Add companies", icon("arrow", 14)),
        h("button", { class: "btn", onclick: () => go("settings") }, "Open Settings"))));
  }
  renderOnboarding();
}

function renderOnboarding() {
  const steps = [onboardAbout, onboardJobs, onboardCompanies, onboardRest], n = onboarding.step, last = steps.length - 1;
  const move = to => { onboarding.step = Math.max(0, Math.min(last, to)); renderOnboarding(); };
  const finish = async () => {
    remember("onboarded", "1");
    try { settings = await api("/api/settings"); } catch { /* the tabs read it again */ }
    go("today");
  };
  const ctx = { step: n, last: n === last, back: () => move(n - 1), next: () => n === last ? finish() : move(n + 1) };
  put(h("div", { class: "onboard" },
    h("div", { class: "card welcome" },
      h("h2", {}, n === 0 ? "Welcome to jobwatch" : ONBOARD_STEPS[n]),
      h("p", {}, n === 0 ? "jobwatch checks the careers pages of companies you choose and shows you the new jobs that match " +
        "what you're looking for. It runs on your computer, and it never applies for you. A few questions first; " +
        "every one can wait." : `Step ${n + 1} of ${steps.length}. Everything is saved as you go, and you can change it later in Settings.`)),
    steps[n](ctx)));
}

// Back, Save and continue, and Skip for now under a step. save() writes what the step asked; a failure shows
// beside the buttons and stays on the step.
function onboardActions(ctx, save) {
  const msg = h("span", { class: "small muted", role: "status" });
  const next = h("button", { class: "btn primary" }, ctx.last ? "Save and go to Today" : "Save and continue", icon("arrow", 14));
  next.onclick = async () => {
    next.disabled = true; msg.textContent = "Saving…"; msg.className = "small muted";
    try { await save(); settings = await api("/api/settings"); ctx.next(); }
    catch (e) { msg.textContent = e.message; msg.className = "small error"; next.disabled = false; }
  };
  return h("div", { class: "row actions" }, ctx.step ? h("button", { class: "btn", onclick: ctx.back }, "Back") : null, next,
    h("button", { class: "btn", onclick: ctx.next }, ctx.last ? "Later" : "Skip for now"), msg);
}

// Step 1: Tell me about yourself: in your own words, your resume, and what you want next.
function onboardAbout(ctx) {
  const s = settings, form = goalsForm(s), matters = mattersField(s);
  const pasted = h("textarea", { rows: 4, placeholder: "…or paste the text of your resume here" });
  const pasteMsg = h("span", { class: "small muted" });
  const paste = h("button", { class: "btn", onclick: async () => {
    if (!pasted.value.trim()) return;
    pasteMsg.textContent = "Saving…"; pasteMsg.className = "small muted";
    try {
      const r = await api("/api/upload?kind=resume&name=resume.txt", undefined, new Blob([pasted.value], { type: "text/plain" }));
      settings.resume = r.resume; settings.exists = true;
      pasteMsg.textContent = `Saved as ${r.resume}`;
    } catch (e) { pasteMsg.textContent = e.message; pasteMsg.className = "small error"; }
  } }, "Use this text");
  return h("div", { class: "card" },
    form.aboutField,
    h("div", { class: "field" }, h("label", {}, "Your resume ", h("span", { class: "hint" }, "optional")),
      uploadField("resume", ".pdf,.docx,.txt,.md", s.resume, "It stays on this computer. Fit scores and title suggestions read it " +
        "(PDF and Word files need: pip install 'jobwatch[score]')."),
      pasted, h("div", { class: "row" }, paste, pasteMsg)),
    form.questions, matters.el,
    onboardActions(ctx, async () => {
      const weights = matters.weights();
      await api("/api/settings", { goals: form.values(), ...(weights ? { comps: merged(s.comps, { weights }) } : {}) });
    }));
}

// Step 2: the jobs you want: titles, places, remote, and a pay target. "Suggest titles from my resume" is offered
// only when a model can run (/api/onboarding); the suggestions are clearly marked and nothing is added until clicked.
function onboardJobs(ctx) {
  const s = settings, f = s.filters || {}, places0 = f.locations || [];
  const titles = areaInput(f.titles, "Product Manager\nData Engineer");
  const places = areaInput(places0.filter(l => l.toLowerCase() !== "remote"), "New York\nDenver");
  const country = choice([["US", "Remote jobs open in the US"], ["any", "Remote jobs anywhere"]],
    (f.remote_country || "US").toLowerCase() === "any" ? "any" : "US");
  let how = workStyle(places0);
  const placesField = field("Where", places, "A city or state, one per line. Hybrid jobs count as jobs in their city: " +
    "most boards don't say which are hybrid.");
  const sync = () => {
    placesField.style.display = how === "remote" ? "none" : "";
    country.style.display = how === "near" ? "none" : "";
  };
  const howCtl = segmented(WORK_STYLES, how, v => { how = v; sync(); });
  sync();
  const target = textInput(targetText(s.pay || {}), "e.g. 180000, or 170000-200000");
  const keywords = new Set();
  const ideas = h("div", {});
  const chips = (title, list, add) => h("div", { class: "small", style: "margin-top:8px" }, title, " ",
    list.map(t => h("button", { class: "chip toggle", onclick: e => { add(t); e.currentTarget.classList.add("on"); } }, t)));
  const addTitle = t => { if (!unlines(titles.value).includes(t)) titles.value = lines([...unlines(titles.value), t]); };
  const draw = o => {
    if (!o.ready) return fill(ideas, h("div", { class: "help" }, o.why ? `Title suggestions need a model: ${o.why}` : ""));
    const ask = h("button", { class: "btn" }, "Suggest titles from my resume");
    const note = h("div", { class: "help" }, `Optional. Your resume and what you told me go to ${o.where.label}` +
      `${o.where.local ? "" : " (not this computer)"} only when you press this.`);
    const out = h("div", {});
    ask.onclick = async () => {
      ask.disabled = true; fill(out, h("div", { class: "muted small" }, "Thinking…"));
      try {
        const r = await api("/api/onboarding/titles", {});
        fill(out, h("div", { class: "help" }, `Suggestions from ${r.where.label}, not facts about you. Click the ones you want.`),
          chips("Titles:", r.titles, addTitle),
          r.keywords.length ? chips("Keywords:", r.keywords, k => keywords.add(k)) : null);
      } catch (e) { fill(out, h("div", { class: "error small" }, e.message)); }
      ask.disabled = false;
    };
    fill(ideas, ask, note, out);
  };
  api("/api/onboarding").then(draw).catch(() => fill(ideas));
  return h("div", { class: "card" },
    h("div", { class: "fields" },
      field("Job titles you want", titles, "One per line; a title must contain one."),
      field("How do you want to work?", h("div", { class: "stack" }, howCtl, country), null, "wide"),
      placesField,
      field("Pay target (per year)", target, "What you'd like to be offered: a number, or a range like 170000-200000.")),
    ideas,
    onboardActions(ctx, async () => {
      const locations = workLocations(how, placeLines(places.value));
      const body = { filters: mergeFilters(f, { titles: unlines(titles.value), locations, remote_country: country.value }),
        pay: merged(s.pay, targetValues(target.value)) };
      if (keywords.size) body.keywords = { ...(s.keywords || {}), ...Object.fromEntries([...keywords].map(k => [k, 1])) };
      await api("/api/settings", body);
    }));
}

// "How do you want to work?" and filters.locations, both ways: remote only is ["remote"]; hybrid or on-site is the
// places alone (it needs one: no places would let every place through); either is the places and remote.
const WORK_STYLES = [["remote", "Remote only"], ["near", "Hybrid or on-site near me"], ["either", "Either"]];
function workStyle(locations) {
  const remote = locations.some(l => l.toLowerCase() === "remote"), places = locations.length - (remote ? 1 : 0);
  return remote && !places ? "remote" : !remote && places ? "near" : "either";
}
function workLocations(how, places) {
  if (how === "near" && !places.length) throw new Error("Name a city or state for hybrid or on-site jobs.");
  return [...(how === "remote" ? [] : places), ...(how === "near" ? [] : ["remote"])];
}

// Step 3: the companies to watch: the same find-and-add as Settings, each added at once, plus any companies
// jobwatch already suggests.
function onboardCompanies(ctx) {
  const watching = h("div", { class: "small muted" }), also = h("div", {});
  const drawWatching = () => fill(watching, settings.companies.length
    ? `Watching ${settings.companies.length}: ${settings.companies.map(c => c.name || c.board).join(", ")}` : "Not watching any company yet.");
  drawWatching();
  const finder = companyFinder(hit => settings.companies.some(c => c.source === hit.source && c.board === hit.board),
    async (hit, typed) => {
      await api("/api/settings", { companies: [...settings.companies.map(c => ({ ...c })),
        { source: hit.source, board: hit.board, name: hit.name || typed }] });
      settings = await api("/api/settings");
      drawWatching();
    });
  (async () => {
    try {
      const list = (await api("/api/suggestions")).companies.filter(c => c.entry);
      if (!list.length) return;
      fill(also, h("div", { class: "help" }, "Companies jobwatch has seen in your job alerts:"), list.slice(0, 5).map(c =>
        h("div", { class: "list-item" }, h("div", { style: "flex:1" }, h("b", {}, c.name)),
          h("button", { class: "btn", onclick: async e => {
            e.target.disabled = true;
            try { await api("/api/suggestions/add", { company: c.company }); settings = await api("/api/settings");
              drawWatching(); e.target.replaceWith(h("span", { class: "muted small" }, "added")); }
            catch (err) { e.target.disabled = false; toast(err.message); }
          } }, "Add"))));
    } catch { /* a suggestion, not the step */ }
  })();
  const actions = onboardActions(ctx, async () => {});  // nothing left to save: each company was saved when added
  return h("div", { class: "card" },
    h("p", { class: "small muted lead" }, "Type a company's name, or paste a link to one of their jobs. Add as many as you like."),
    h("div", { class: "row find" }, h("div", { style: "flex:1" }, finder.input), finder.button), finder.out, watching, also, actions);
}

// Where the AI runs (fit scores; the chat and title suggestions too, except on agy): each choice with what it
// still needs on this computer (from /api/ai), a test call, and for Claude an API key kept in the macOS keychain.
// Below the tiles, the scoring chain: the steps tried in order, each a backend and its model (one backend can be in
// it twice, on two models: agy's Sonnet, then agy's Gemini). The first scores; the rest are tried when the one
// before can't. ← and → move a step (moving one to the front makes it the one that scores first), × takes it out,
// and "Add a step" puts one at the end. values() gives scoring's backend, model and fallback.
const AI_ORDER = ["claude", "agy", "local"];
function aiSetup(s) {
  const scoring = s.scoring || {};
  // a step is {b, m}: m "" is the backend's default model; agy_model (agy as a bare fallback) becomes its step's model
  const steps = [{ b: scoring.backend || s.defaults.scoring.backend, m: scoring.model || "" },
    ...[].concat(scoring.fallback || []).map(e => {
      const [b, ...m] = e.split(":");
      return { b, m: m.join(":") || (b === "agy" ? scoring.agy_model || "" : "") };
    })];
  // the first step's backend lives in a select that isn't shown, so Settings can read and watch it like any other input
  const backend = choice(AI_ORDER.map(b => [b, AI_LOOK[b].name]), steps[0].b);
  const sync = () => {
    if (backend.value !== steps[0].b) { backend.value = steps[0].b; backend.dispatchEvent(new Event("change")); }
    else draw();
  };
  const same = (x, y) => x.b === y.b && (x.m || def(x.b)) === (y.m || def(y.b));
  // a tile picked: its backend's first step goes to the front, or a new step on its default model
  const pick = b => {
    const at = steps.findIndex(st => st.b === b);
    steps.unshift(at >= 0 ? steps.splice(at, 1)[0] : { b, m: "" });
    sync();
  };
  const tiles = h("div", { class: "ai-tiles", role: "radiogroup", "aria-label": "Where fit scores run" });
  const chain = h("div", { class: "ai-chain" });
  let info = null;
  const ready = b => !info || info[b].ready;
  const def = b => (info && info[b] && info[b].default_model) || "";
  const models = b => (info && info[b] && info[b].models) || [];

  const modelMenu = st => {
    const known = models(st.b);
    const opts = [["", `default${def(st.b) ? ` (${shortModel(def(st.b))})` : ""}`],
      ...known.map(m => [m.id, m.name === m.id ? shortModel(m.id) : m.name])];
    if (st.m && !known.some(m => m.id === st.m)) opts.push([st.m, shortModel(st.m)]);
    const sel = h("select", { class: "step-model", "aria-label": `${AI_LOOK[st.b].name} model` },
      opts.map(([v, label]) => h("option", { value: v }, label)));
    sel.value = st.m;
    sel.onchange = () => {
      const was = st.m;
      st.m = sel.value;
      if (steps.filter(x => same(x, st)).length > 1) { st.m = was; sel.value = was; toast("That one's in the chain already"); }
      else drawChain();
    };
    return sel;
  };
  const drawChain = () => {
    const step = (st, i) => {
      const move = (to, label, glyph) => {
        const b = h("button", { type: "button", class: "step-btn", title: label, "aria-label": label }, glyph);
        b.disabled = to < 0 || to >= steps.length;
        b.onclick = () => { steps.splice(to, 0, steps.splice(i, 1)[0]); sync(); };
        return b;
      };
      const drop = h("button", { type: "button", class: "step-btn", title: "Take it out", "aria-label": "Take it out" },
        icon("x", 11));
      drop.disabled = steps.length === 1;
      drop.onclick = () => { steps.splice(i, 1); sync(); };
      // paused (out of credit or quota): kept in its place, dimmed, skipped until the time it's tried again
      const p = info && info.paused && info.paused[`${st.b}:${st.m}`];
      const back = p && new Date(p.until).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
      return h("div", { class: "link step" + (i ? "" : " main") + (p ? " paused" : ""),
        title: p ? `Skipped: ${p.reason} since ${new Date(p.since).toLocaleString()}; tried again ${back}`
          : i ? "Tried when the one before can't score" : "Scores first" },
        h("span", { class: "n" }, String(i + 1)), AI_LOOK[st.b].name, modelMenu(st),
        !ready(st.b) ? h("span", { class: "n" }, "· not set up") : null,
        p ? h("span", { class: "pause-tag" }, icon("clock", 11), `${p.reason} · back ${back}`) : null,
        h("span", { class: "step-tools" }, move(i - 1, "Try it earlier", "←"), move(i + 1, "Try it later", "→"), drop));
    };
    // what can be added: each backend on its default, and agy's other models
    const addable = [...AI_ORDER.map(b => ({ b, m: "" })), ...models("agy").map(m => ({ b: "agy", m: m.id }))]
      .filter(c => !steps.some(st => same(st, c)));
    const add = addable.length ? h("select", { class: "step-add", "aria-label": "Add a step" },
      h("option", { value: "" }, "+ Add a step…"),
      addable.map((c, k) => h("option", { value: String(k) },
        `${AI_LOOK[c.b].name}${c.m ? ` · ${shortModel(c.m)}` : def(c.b) ? ` · ${shortModel(def(c.b))}` : ""}`))) : null;
    if (add) add.onchange = () => { if (add.value !== "") { steps.push(addable[Number(add.value)]); drawChain(); } };
    fill(chain, h("div", { class: "title" }, "Scores with the first; if it can't, tries the next"),
      steps.map((st, i) => [i ? h("span", { class: "then" }, icon("arrow", 14)) : null, step(st, i)]),
      add,
      h("div", { class: "cap" }, "When one has no key, no credit or no quota left, the next one scores. ← → change the " +
        "order (the first one scores first); one backend can be in it twice on two models. Each score says which " +
        "model made it, and none is made again on its own (the ↻ on a score, or `jobwatch score --rescore`). The " +
        "chat and title suggestions use Claude or this Mac (Settings › Chat)."));
  };

  const keyForm = st => {
    const key = h("input", { type: "password", placeholder: "Paste your API key (sk-ant-…)", autocomplete: "off",
      "aria-label": "Anthropic API key" });
    const msg = h("span", { class: "small muted", role: "status" });
    const save = h("button", { class: "btn primary", type: "button" }, icon("lock", 13), "Save");
    save.onclick = async () => {
      save.disabled = true; msg.className = "small muted"; msg.textContent = "Saving to your keychain…";
      try {
        const r = await api("/api/ai/key", { key: key.value, keychain: st.keychain });
        key.value = ""; scoring.keychain = r.keychain;
        settings.scoring = { ...(settings.scoring || {}), keychain: r.keychain };
        await refresh();
      } catch (e) { msg.className = "small error"; msg.textContent = e.message; save.disabled = false; }
    };
    return h("div", { class: "ai-key" }, h("div", { class: "pair" }, key, save), msg,
      h("div", { class: "help" }, `Kept in your macOS keychain (${st.keychain}), never in the settings file.`));
  };
  const setupSteps = (b, st) => {
    const items = st.steps.map(p => h("li", {}, h("div", {}, p.text,
      p.link ? [" ", h("a", { href: p.link, target: "_blank", rel: "noopener" }, "Open ↗")] : null,
      p.command ? h("div", { class: "cmd" }, h("code", {}, p.command), copyButton(() => p.command)) : null)));
    if (b === "claude" && st.can_save_key && !st.key) items.push(h("li", {}, keyForm(st)));
    return items.length ? h("ol", { class: "ai-steps" }, items) : null;
  };
  const meters = b => h("div", { class: "meters" }, AI_METERS.map(([label, k]) => [h("span", {}, label),
    h("span", { class: "bars", title: `${AI_LOOK[b][k]} of 3` }, [1, 2, 3].map(i => h("i", { class: i <= AI_LOOK[b][k] ? "f" : "" })))]));

  const tile = b => {
    const st = info && info[b], chosen = backend.value === b;
    const state = !st ? h("span", { class: "state wait" }, "Checking…")
      : st.ready ? h("span", { class: "state ready" }, icon("check", 12), "Ready")
        : h("span", { class: "state setup" }, "Set up");
    const result = h("span", { class: "muted", role: "status" });
    const test = h("button", { class: "btn", type: "button" }, icon("sparkle", 13), "Test");
    test.disabled = !st || !st.ready;
    test.onclick = async () => {
      test.disabled = true; result.className = "muted";
      result.textContent = b === "local" ? "Loading the model (a minute or more the first time)…" : "Asking the model…";
      try {
        const r = await api("/api/ai/test", { backend: b, model: (steps.find(st => st.b === b) || {}).m || "" });
        result.className = r.ok ? "done-ok" : "error";
        result.textContent = r.ok ? `Answered in ${r.seconds}s · ${r.model.split("/").pop()}` : r.error;
      } catch (e) { result.className = "error"; result.textContent = e.message; }
      test.disabled = false;
    };
    let key = null;
    if (st && b === "claude" && st.key) {
      const holder = h("div", {});
      const replace = h("button", { class: "btn ghost", type: "button" }, "Replace");
      replace.onclick = () => { fill(holder, keyForm(st)); replace.remove(); };
      key = h("div", {}, h("div", { class: "foot" }, icon("lock", 13), h("span", { class: "muted" },
        st.key === "keychain" ? `Key in your keychain (${st.keychain})`
          : st.key === "command" ? "Key from scoring.key_command" : "Key from ANTHROPIC_API_KEY"),
        st.can_save_key ? replace : null), holder);
    }
    const el = h("div", { class: "ai-tile" + (chosen ? " on" : ""), role: "radio", tabindex: "0",
      "aria-checked": String(chosen) },
      chosen ? h("span", { class: "main-tag" }, "Scores first") : null,
      h("div", { class: "top" }, h("span", { class: "orb" }, icon(AI_LOOK[b].icon, 20)),
        h("div", {}, h("div", { class: "name" }, AI_LOOK[b].name), h("div", { class: "muted small" }, AI_LOOK[b].tag)), state),
      meters(b),
      h("div", { class: "about" }, st ? st.about : ""),
      st ? setupSteps(b, st) : null,
      key,
      h("div", { class: "foot" }, test, result));
    // a click on the tile picks it; one on its buttons, links or the key box doesn't
    el.onclick = e => { if (!e.target.closest("button, a, input, code")) pick(b); };
    el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); pick(b); } };
    return el;
  };
  const draw = () => { fill(tiles, AI_ORDER.map(tile)); drawChain(); };
  const refresh = async () => {
    try { info = await api("/api/ai"); }
    catch (e) { fill(tiles, h("p", { class: "small error" }, e.message)); return; }
    draw();
  };

function daysAgo(day, today) {
  if (!day) return "";
  const n = Math.round((Date.parse(today) - Date.parse(day)) / 86400000);
  return n <= 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago`;
}

// A per-browser preference; storage can be blocked (private windows), so it's never required.
function remembered(key, fallback) {
  try { return localStorage.getItem("jobwatch." + key) || fallback; } catch { return fallback; }
}
function remember(key, value) {
  try { localStorage.setItem("jobwatch." + key, value); } catch { /* not kept: fine */ }
}

// Settings is split into sub tabs; every card stays in the page (hidden, not removed) so Save reads them all.
const SET_GROUPS = [
  { id: "search", label: "Your search", cards: ["goals", "companies", "filters", "keywords"] },
  { id: "today", label: "Today & display", cards: ["today", "display"] },
  { id: "ai", label: "AI & fit scores", cards: ["resume", "usage", "prompts", "chat"] },

];
// The sub tab a name points at: a tab id ("ai"), a card id ("pay") or a card's anchor ("set-pay"); null if none.
function settingsGroupOf(name) {
  const key = String(name || "").replace(/^set-/, "");
  const g = SET_GROUPS.find(g => g.id === key || g.cards.includes(key));
  return g ? g.id : null;
}
// Where a URL hash goes: "#settings/ai" is Settings on its AI tab, and an old card anchor ("#set-pay") opens the tab holding it.
function pageOfHash(hash, tabs) {
  const [base, sub] = String(hash || "").replace(/^#/, "").split("/");
  if (base === "company" && tabs.includes(base)) {  // "#company/Globex%20Inc" is that company's page
    try { return { tab: base, sub: sub ? decodeURIComponent(sub) : null }; } catch { return { tab: base, sub: null }; }
  }
  if (tabs.includes(base)) return { tab: base, sub: base === "settings" ? settingsGroupOf(sub) : null };
  if (base.startsWith("set-") && settingsGroupOf(base)) return { tab: "settings", sub: settingsGroupOf(base), card: base };
  return null;
}

// One page of a long list, and the controls to move between pages. `state.page` survives redraws; a new
// `filterKey` (the search, filters and sort in use) starts again at page 1. How many per page is kept per browser.
const PER_PAGE = [12, 24, 48, 96];
function paged(items, state, filterKey, redraw) {
  const per = PER_PAGE.includes(Number(remembered("perPage", ""))) ? Number(remembered("perPage", "")) : PER_PAGE[0];
  if (state.filterKey !== filterKey) { state.filterKey = filterKey; state.page = 1; }
  const pages = Math.max(1, Math.ceil(items.length / per));
  state.page = Math.min(Math.max(1, state.page || 1), pages);
  const start = (state.page - 1) * per, end = Math.min(start + per, items.length);
  const go = n => { state.page = n; redraw(); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); };
  const nums = [];
  for (let n = 1; n <= pages; n++) {
    if (n === 1 || n === pages || Math.abs(n - state.page) <= 2) nums.push(n);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  const perSelect = h("select", { "aria-label": "Per page" }, PER_PAGE.map(n => h("option", { value: n }, n)));
  perSelect.value = per;
  perSelect.onchange = () => { remember("perPage", perSelect.value); state.page = Math.floor(start / Number(perSelect.value)) + 1; redraw(); };
  return {
    items: items.slice(start, end),
    range: items.length > per ? `${start + 1}–${end} of ${items.length}` : null,
    nav: items.length <= PER_PAGE[0] ? null : h("div", { class: "pager", role: "navigation", "aria-label": "Pages" },
      pages > 1 ? [
        h("button", { class: "btn ghost", disabled: state.page === 1, onclick: () => go(state.page - 1) }, "← Previous"),
        nums.map(n => n === "…" ? h("span", { class: "gap" }, "…")
          : h("button", { class: "pg" + (n === state.page ? " on" : ""), "aria-current": n === state.page ? "page" : null,
            onclick: () => go(n) }, n)),
        h("button", { class: "btn ghost", disabled: state.page === pages, onclick: () => go(state.page + 1) }, "Next →"),
      ] : null,
      h("label", { class: "per" }, "Per page", perSelect)),
  };
}
