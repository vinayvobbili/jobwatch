<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobwatch</title>
<style>
:root {
  --bg: #f3f4fa; --glow-1: rgba(99, 102, 241, .16); --glow-2: rgba(236, 72, 153, .09);
  --panel: rgba(255, 255, 255, .88); --panel-solid: #fff; --text: #141a2e; --muted: #626a84; --line: #e2e5f0;
  --accent: #5457f0; --accent-2: #a14cf2; --accent-text: #fff; --accent-soft: rgba(84, 87, 240, .1);
  --good: #0c9468; --warn: #c26d00; --bad: #d83450; --chip: #eef0f8; --chip-text: #3a4160;
  --shadow: 0 1px 2px rgba(20, 26, 46, .04), 0 10px 28px -16px rgba(20, 26, 46, .16);
  --shadow-hover: 0 2px 4px rgba(20, 26, 46, .05), 0 22px 44px -20px rgba(70, 60, 190, .34);
  --radius: 16px;
  --grad: linear-gradient(135deg, #5a5cf2, #a24af0);  /* filled surfaces carry white text in both themes */
  --s-applied: #3b82f6; --s-screening: #8b5cf6; --s-interviewing: #f59e0b; --s-offer: #10b981;
  --s-rejected: #94a3b8; --s-withdrawn: #a8a29e;
  color-scheme: light;
}
/* dark: set by the Theme setting, or by the computer's when that is System (applyDisplay) */
:root[data-theme="dark"] {
    --bg: #0a0d16; --glow-1: rgba(99, 102, 241, .2); --glow-2: rgba(192, 80, 240, .1);
    --panel: rgba(21, 25, 38, .86); --panel-solid: #151926; --text: #e9ebf5; --muted: #8f97b2; --line: #252a3b;
    --accent: #8d8fff; --accent-2: #c77dff; --accent-text: #0a0d16; --accent-soft: rgba(141, 143, 255, .14);
    --good: #3ddc97; --warn: #fbbf24; --bad: #ff7a93; --chip: #1e2333; --chip-text: #c3c9e0;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 32px -20px rgba(0, 0, 0, .9);
    --shadow-hover: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 22px 48px -20px rgba(110, 100, 255, .5);
    color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1100px 560px at 8% -12%, var(--glow-1), transparent 62%),
    radial-gradient(900px 520px at 102% -6%, var(--glow-2), transparent 60%), var(--bg);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.ico { flex: none; vertical-align: -2px; }

/* header */
header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-solid) 74%, transparent); backdrop-filter: saturate(1.5) blur(16px);
  -webkit-backdrop-filter: saturate(1.5) blur(16px); }
.bar { max-width: 1680px; margin: 0 auto; padding: 12px 32px; display: flex; gap: 16px; align-items: center; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  margin-right: 10px; }
.brand b { background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
nav { display: flex; gap: 2px; padding: 4px; background: var(--chip); border-radius: 12px; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 14px; border-radius: 9px;
  font: inherit; font-weight: 550; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: color .15s, background .15s; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--text); background: var(--panel-solid); box-shadow: 0 1px 3px rgba(20, 26, 46, .12); }
.count { font-size: 11.5px; font-weight: 700; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px;
  display: inline-grid; place-items: center; color: #fff;
  background: var(--grad); }
#duecount .count { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.spacer { flex: 1; }
.status { color: var(--muted); font-size: 13.5px; }

main { max-width: 1680px; margin: 0 auto; padding: 28px 32px 80px; }
:root[data-width="wide"] main, :root[data-width="wide"] .bar { max-width: 2400px; }
:root[data-width="full"] main, :root[data-width="full"] .bar { max-width: none; }
.pagehead { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.pagehead > div:first-child { flex: 1; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.025em; margin: 0; font-weight: 800; }
.sub { color: var(--muted); margin: 6px 0 0; }
h2 { font-size: 20px; letter-spacing: -.01em; margin: 8px 0 4px; }
h3 { font-size: 15.5px; margin: 0; letter-spacing: -.005em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* stats */
.hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 22px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
.stat .num { font-size: 28px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  line-height: 1.1; }
.stat .lbl { color: var(--muted); font-size: 13px; margin-top: 2px; }
.stat.lead { color: #fff; border-color: transparent; background: var(--grad); }
.stat.lead .lbl { color: rgba(255, 255, 255, .82); }
.stat.warn .num { color: var(--warn); }
.stat.good .num { color: var(--good); }
.stat:nth-child(2) { animation-delay: 50ms; } .stat:nth-child(3) { animation-delay: 100ms; }
.stat:nth-child(4) { animation-delay: 150ms; }
.filtered { color: var(--muted); font-size: 13px; margin: -10px 0 14px; }

/* pipeline */
.pipeline { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); margin: -8px 0 22px; }
.pipeline .bar-track { display: flex; gap: 4px; height: 12px; }
.pipeline .seg { background: var(--sc); border-radius: 6px; min-width: 12px; transform-origin: left;
  animation: grow .7s cubic-bezier(.2, .7, .2, 1) both; }
.pipeline .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.pipeline .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--sc);
  margin-right: 6px; }
.pipeline .legend b { color: var(--text); margin-left: 3px; }

/* buttons */
button.btn { font: inherit; font-size: 14px; font-weight: 550; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--text); border-radius: 10px; padding: 6px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .12s, box-shadow .15s, border-color .15s; }
button.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
button.btn:active { transform: translateY(1px); }
button.primary { color: #fff; border-color: transparent; background: var(--grad);
  box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
button.primary:hover { border-color: transparent; filter: brightness(1.07);
  box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--accent) 90%, transparent); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 5px 10px; }
button.ghost:hover { color: var(--text); background: var(--chip); border-color: transparent; }
button.btn:disabled { opacity: .55; cursor: default; }
.spin .ico { animation: spin 1s linear infinite; }

/* cards */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px 16px 22px; margin: 12px 0; box-shadow: var(--shadow); overflow: hidden;
  transition: transform .2s cubic-bezier(.2, .7, .2, 1), box-shadow .2s, border-color .2s;
  animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, transparent); }
.card.job:hover, .card.app:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover);
  border-color: color-mix(in srgb, var(--stripe, var(--accent)) 35%, var(--line)); }
.card.job { display: grid; grid-template-columns: 46px 1fr auto; gap: 0 16px; }
.card.fit-hi { --stripe: var(--good); } .card.fit-mid { --stripe: var(--warn); } .card.fit-lo { --stripe: var(--bad); }
.card.fit-none { --stripe: color-mix(in srgb, var(--accent) 35%, transparent); }
.card a.title { color: var(--text); font-weight: 700; font-size: 17px; letter-spacing: -.01em; text-decoration: none; }
.card a.title:hover { color: var(--accent); }
.mono { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-weight: 800;
  font-size: 16px; letter-spacing: -.02em; background: hsl(var(--h) 80% 93%); color: hsl(var(--h) 60% 36%);
  box-shadow: inset 0 0 0 1px hsl(var(--h) 60% 50% / .12); }
:root[data-theme="dark"] .mono { background: hsl(var(--h) 45% 20%); color: hsl(var(--h) 90% 80%); }
.meta { color: var(--muted); font-size: 13.5px; margin: 3px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 8px;
  align-items: center; }
.meta b { color: var(--text); font-weight: 600; }
.meta .sep { opacity: .45; }
.pay { color: var(--good); font-weight: 650; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions { margin-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.chip { display: inline-block; background: var(--chip); color: var(--chip-text); border-radius: 999px;
  padding: 1px 10px; font-size: 12.5px; font-weight: 500; }
.chip.hit { background: var(--accent-soft); color: var(--accent); }
.chip.gap { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.chip.gap.must { border-style: solid; border-color: var(--warn); color: var(--warn); }
.badge { font-size: 11px; font-weight: 800; letter-spacing: .06em; border-radius: 6px; padding: 2px 7px;
  text-transform: uppercase; }
.badge.new { color: #fff; background: var(--grad);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: pulse 2.4s ease-out infinite; }
.badge.closed { background: var(--bad); color: #fff; }
.fitbox { text-align: center; padding-left: 4px; }
.ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto;
  background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--chip) 0); animation: fade .6s both; }
.ring span { width: 52px; height: 52px; border-radius: 50%; background: var(--panel-solid); display: grid;
  place-items: center; font-weight: 800; font-size: 18px; letter-spacing: -.03em; color: var(--rc); }
.ring.hi { --rc: var(--good); } .ring.mid { --rc: var(--warn); } .ring.lo { --rc: var(--bad); }
.fitbox small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 5px; white-space: nowrap; }
.know { color: var(--good); font-size: 13.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.know a { color: var(--muted); text-decoration: none; }
.know a:hover { color: var(--accent); text-decoration: underline; }
.note { font-size: 13.5px; color: var(--muted); margin-top: 6px; padding-left: 10px;
  border-left: 2px solid var(--line); }
.gaps { font-size: 13.5px; color: var(--muted); margin: 2px 0 4px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.gaps.open { -webkit-line-clamp: unset; }
.gaps b { color: var(--text); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 56px 16px; border: 1.5px dashed var(--line);
  border-radius: var(--radius); background: color-mix(in srgb, var(--panel) 50%, transparent); }
.empty .ico { display: block; margin: 0 auto 10px; color: var(--accent); opacity: .7; }

/* applications */
.section { display: flex; align-items: center; gap: 10px; margin: 26px 0 4px; }
.section h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.section .n { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 999px;
  padding: 0 8px; }
.section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.section.hot h3 { color: var(--warn); }
.card.app { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 16px; --stripe: var(--sc); }
.app-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.app-head select.stage { width: auto; min-width: 150px; flex: none; }
.app-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px;
  padding-top: 8px; border-top: 1px dashed var(--line); }
.app-foot .acts { display: flex; gap: 4px; align-items: center; }
.sent-chip { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--muted); border: 0;
  background: none; cursor: pointer; padding: 3px 8px; border-radius: 8px; font-family: inherit; }
.sent-chip:hover { background: var(--chip); color: var(--text); }
.sent-chip.empty-pkg { color: var(--accent); }

/* what you sent: the job page's record of an application */
.sent { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  background: linear-gradient(135deg, rgba(90, 92, 242, .05), rgba(162, 74, 240, .035)); transition: border-color .15s, background .15s; }
.sent.drag { border-color: var(--accent); background: var(--accent-soft); }
.sent-head { display: flex; align-items: center; gap: 8px; }
.sent-head h4 { font-size: 14.5px; font-weight: 650; flex: 1; display: flex; gap: 7px; align-items: center; }
.sent-head .ico { color: var(--accent); }
.files { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
.file { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-solid);
  border-radius: 11px; padding: 6px 6px 6px 10px; max-width: 100%; animation: rise .25s both; }
.file button.open { border: 0; background: none; font: inherit; color: var(--text); cursor: pointer; display: flex;
  gap: 7px; align-items: center; min-width: 0; padding: 0; text-align: left; }
.file button.open:hover b { color: var(--accent); text-decoration: underline; }
.file b { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.file small { color: var(--muted); font-size: 11.5px; }
.file .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 6px;
  padding: 1px 6px; background: var(--chip); color: var(--chip-text); }
.file .tag.resume { background: color-mix(in srgb, var(--s-applied) 15%, transparent); color: var(--s-applied); }
.file .tag.letter { background: color-mix(in srgb, var(--s-screening) 15%, transparent); color: var(--s-screening); }
.file .x { border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 7px; padding: 3px; display: grid; }
.file .x:hover { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.drop { display: inline-flex; align-items: center; gap: 7px; border: 1.5px dashed var(--line); border-radius: 11px;
  padding: 7px 12px; color: var(--muted); font-size: 13px; cursor: pointer; background: none; font-family: inherit; }
.drop:hover { border-color: var(--accent); color: var(--accent); }
.qa { margin: 12px 0 0; display: grid; gap: 10px; }
.qa dt { font-weight: 600; font-size: 13.5px; }
.qa dd { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; }
.qa-edit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 6px; margin: 6px 0; align-items: start; }
.qa-edit textarea { min-height: 40px; }
.sent .saved-posting { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.sent .saved-posting button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
.card.app.ended { opacity: .62; }
.card.app.ended:hover { opacity: 1; }
.app .side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.app .when { color: var(--muted); font-size: 12.5px; }
select.stage { font-weight: 650; border-radius: 999px; color: var(--sc); padding: 5px 12px;
  background-color: color-mix(in srgb, var(--sc) 12%, var(--panel-solid));
  border-color: color-mix(in srgb, var(--sc) 35%, transparent); cursor: pointer; }
select.stage option { color: var(--text); background: var(--panel-solid); }
.next { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; margin: 2px 0; }
.next .what { font-weight: 550; }
.when-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 650;
  border-radius: 999px; padding: 2px 10px; background: var(--chip); color: var(--muted); }
.next.soon .when-chip { background: var(--accent-soft); color: var(--accent); }
.next.now .when-chip { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.next.late .when-chip { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.app .full { grid-column: 1 / -1; }
/* status filter chips, the cards/table switch, and the table */
.status-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.sf { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel-solid);
  color: var(--text); font: inherit; font-size: 13.5px; font-weight: 550; border-radius: 999px; padding: 5px 12px;
  cursor: pointer; transition: border-color .15s, background .15s; }
.sf:hover { border-color: color-mix(in srgb, var(--sc, var(--accent)) 50%, var(--line)); }
.sf .dot { width: 8px; height: 8px; border-radius: 3px; background: var(--sc); }
.sf .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.sf.on { border-color: var(--sc, var(--accent)); background: color-mix(in srgb, var(--sc, var(--accent)) 13%, var(--panel-solid));
  color: color-mix(in srgb, var(--sc, var(--accent)) 70%, var(--text)); }
.sf.on .c { color: inherit; }
.showing .seg-ctl { width: 170px; flex: none; }
.pager { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 18px 0 4px; font-size: 13.5px; }
.pager .pg { min-width: 34px; height: 34px; border: 1px solid transparent; background: none; border-radius: 9px; font: inherit;
  font-weight: 600; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.pager .pg:hover { background: var(--chip); color: var(--text); }
.pager .pg.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.pager .gap { color: var(--muted); padding: 0 4px; }
.pager .per { display: flex; align-items: center; gap: 8px; color: var(--muted); margin: 0 0 0 auto; font-weight: 500;
  font-size: 13.5px; }
.pager .per select { width: auto; padding: 4px 8px; font-size: 13px; }
.pipeline button.seg { border: 0; padding: 0; cursor: pointer; font: inherit; }
.pipeline button.seg:hover { filter: brightness(1.12); outline: 2px solid color-mix(in srgb, var(--sc) 40%, transparent); outline-offset: 1px; }
.table-wrap { container-type: inline-size; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); animation: rise .4s cubic-bezier(.2, .7, .2, 1) both; }
table.apps { width: 100%; border-collapse: collapse; font-size: 14px; }
table.apps th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
  position: sticky; top: 0; background: var(--panel-solid); }
table.apps th button.sort { border: 0; background: none; font: inherit; color: inherit; letter-spacing: inherit;
  text-transform: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 4px; }
table.apps th button.sort:hover, table.apps th button.sort.on { color: var(--text); }
table.apps td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.apps tbody tr:last-child td { border-bottom: 0; }
table.apps tbody tr { box-shadow: inset 3px 0 0 var(--sc); transition: background .12s; }
table.apps tbody tr:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
table.apps tr.ended { opacity: .62; } table.apps tr.ended:hover { opacity: 1; }
table.apps tr.due td.next-cell .what { color: var(--warn); }
table.apps .co-cell { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
table.apps .co-cell .mono { width: 30px; height: 30px; border-radius: 9px; font-size: 12px; }
table.apps .role a { color: var(--text); font-weight: 600; text-decoration: none; }
table.apps .role a:hover { color: var(--accent); text-decoration: underline; }
table.apps .role { min-width: 200px; }
table.apps select.stage { width: auto; min-width: 130px; font-size: 13px; padding: 4px 10px; }
table.apps .next-cell { min-width: 190px; }
table.apps .next { font-size: 13.5px; }
table.apps .nowrap { white-space: nowrap; }
table.apps .acts .btn { padding: 4px 8px; }
table.apps .sent-chip { white-space: nowrap; }
@container (max-width: 1150px) { table.apps .col-sent { display: none; } table.apps .acts .label { display: none; }
  table.apps .role { min-width: 160px; } table.apps .next-cell { min-width: 160px; } }
table.apps td.editing { padding: 14px 18px; }

function monogram(name) {

  const letters = (words.length > 1 ? words[0][0] + words[1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
  let hash = 7;
  for (const c of (name || "").toLowerCase()) hash = (hash * 31 + c.charCodeAt(0)) >>> 0;
  return h("div", { class: "mono", style: `--h:${hash % 360}`, "aria-hidden": "true" }, letters);
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDay(day, today) {
  if (!day) return "";
  const [y, m, d] = day.split("-").map(Number);
  return `${MONTHS[m - 1]} ${d}` + (today && today.slice(0, 4) !== String(y) ? `, ${y}` : "");
}
function dayDiff(day, today) { return Math.round((Date.parse(day) - Date.parse(today)) / 86400000); }
function relDay(day, today) {
  const n = dayDiff(day, today);
  return n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n > 0 ? `in ${n} days` : `${-n} days ago`;
}
function addDays(day, n) { return new Date(Date.parse(day) + n * 86400000).toISOString().slice(0, 10); }

async function api(path, body, raw) {
  const opts = { method: body === undefined && !raw ? "GET" : "POST", headers: { "X-Jobwatch-Token": TOKEN } };
  if (raw) { opts.body = raw; }
  else if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CONFETTI = ["#5a5cf2", "#a24af0", "#10b981", "#f59e0b", "#3b82f6", "#ec4899", "#22d3ee"];

// Paper confetti from an element (or the top of the screen), drawn on a throwaway canvas.
function confetti(from, { count = 90, power = 1 } = {}) {
  if (REDUCED) return;
  const canvas = h("canvas", { style: "position:fixed;inset:0;pointer-events:none;z-index:30" });
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px";
  document.body.append(canvas);
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const r = from && from.getBoundingClientRect ? from.getBoundingClientRect() : { left: W / 2, top: H * .25, width: 0, height: 0 };
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const bits = Array.from({ length: count }, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1, v = (6 + Math.random() * 9) * power;
    return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, color: CONFETTI[Math.floor(Math.random() * CONFETTI.length)],
      round: Math.random() < .3 };
  });
  const start = performance.now(), life = 1800 + 400 * power;
  (function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - life * .6) / (life * .4));
    for (const b of bits) {
      b.vx *= .985; b.vy = b.vy * .985 + .32; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.color;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot * 2)) + 2);
      ctx.restore();
    }
    if (t < life) requestAnimationFrame(frame); else canvas.remove();
  })(start);
}

// Slide a card out and close the gap it leaves.
async function leave(el, dir = 1) {
  if (!el) return;
  if (REDUCED) return el.remove();
  const hgt = el.offsetHeight;
  await el.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${dir * 48}px) scale(.98)` }],
    { duration: 260, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).finished;
  await el.animate([{ height: hgt + "px", marginTop: "12px", marginBottom: "12px", paddingTop: "18px", paddingBottom: "16px" },
    { height: "0px", marginTop: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px" }],
    { duration: 220, easing: "ease-out", fill: "forwards" }).finished;
  el.remove();
}

// Numbers roll up from zero when a page opens.
function countUp(el, n) {
  if (REDUCED || !n || main.classList.contains("quiet")) { el.textContent = Number(n).toLocaleString(); return; }
  const start = performance.now(), dur = 700 + Math.min(600, n * 4);
  (function frame(now) {
    const k = Math.min(1, (now - start) / dur), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(n * eased).toLocaleString();
    if (k < 1) requestAnimationFrame(frame);
  })(start);
}

// Stored files come back with the token header, so open them from a blob: PDFs and images in a tab, the rest saved.
async function openStored(key, name) {
  try {
    const r = await fetch(`/api/package/file?key=${encodeURIComponent(key)}&name=${encodeURIComponent(name)}`,
      { headers: { "X-Jobwatch-Token": TOKEN } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const blob = await r.blob(), url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    if (/^(application\/pdf|image\/|text\/plain)/.test(blob.type)) { a.target = "_blank"; a.rel = "noopener"; }
    else a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast(e.message); }
}

const chats = new Map();  // "home" or a job key -> [{role, content}], kept while the page is open
let chatInfo = null;
function getChatInfo() { return chatInfo ??= api("/api/chat").catch(e => ({ error: e.message })); }

// A safe subset of Markdown (paragraphs, lists, headings, bold, code, links), built as DOM nodes.
function inline(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:[^)\s]+\))/).filter(Boolean).map(part => {
    let m;
    if (/^\*\*[^*]+\*\*$/.test(part)) return h("strong", {}, part.slice(2, -2));
    if (/^`[^`]+`$/.test(part)) return h("code", {}, part.slice(1, -1));
    if ((m = part.match(/^\[([^\]]+)\]\((https?:[^)\s]+)\)$/))) return link(m[2], m[1]);
    return part;
  });
}
function md(text) {
  const out = [];
  let list = null;
  for (const line of text.split("\n")) {
    let m;
    if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/))) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (!list || list.tagName.toLowerCase() !== tag) out.push(list = h(tag, {}));
      list.append(h("li", {}, inline(m[2])));
    } else {
      list = null;
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) out.push(h("p", {}, h("strong", {}, inline(m[1]))));
      else if (line.trim()) out.push(h("p", {}, inline(line)));
    }
  }
  return out;
}

function chatBox({ key = null, title, intro, suggestions, onclose }) {
  const id = key || "home";
  if (!chats.has(id)) chats.set(id, []);
  const history = chats.get(id);
  const log = h("div", { class: "chat-log", "aria-live": "polite" });
  const where = h("span", { class: "where" }, "…");
  getChatInfo().then(i => {
    if (i.error) return fill(where, i.error);
    where.classList.toggle("private", i.local);
    where.title = i.local ? `${i.model} runs on this computer. Nothing you ask leaves it.`
      : `Sent to Anthropic's ${i.model}, with your resume and the job data shown here.`;
    fill(where, icon(i.local ? "lock" : "cloud", 12), i.local ? "Private · runs on this computer" : `${i.label} · cloud`);
  });
  const input = h("textarea", { rows: 1, placeholder: "Ask anything…", "aria-label": "Your question" });
  const send = h("button", { class: "send", type: "submit", title: "Send (Enter)", "aria-label": "Send" }, icon("send", 17));
  const fresh = h("button", { class: "icon-btn", title: "Start over", "aria-label": "Start over",
    onclick: () => { if (busy) busy.abort(); history.length = 0; draw(); input.focus(); } }, icon("refresh", 15));
  let busy = null;  // an AbortController while a reply streams

  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, 160) + "px"; };
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const setBusy = on => {
    fill(send, icon(on ? "stop" : "send", on ? 14 : 17));
    send.classList.toggle("stop", on);
    send.title = on ? "Stop" : "Send (Enter)";
    send.disabled = !on && !input.value.trim();
    fresh.style.visibility = history.length ? "" : "hidden";
  };
  const draw = () => {
    fill(log, history.length ? history.map(m => h("div", { class: "msg " + (m.role === "user" ? "user" : "bot") },
      m.role === "user" ? m.content : md(m.content)))
      : h("div", { class: "chat-hello" }, h("div", { class: "spark" }, icon("sparkle", 24)), h("div", {}, intro),
        h("div", { class: "suggest" }, suggestions.map(s => h("button", { onclick: () => ask(s) }, s)))));
    scroll();
    setBusy(!!busy);
  };

  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;
    history.push({ role: "user", content: text });
    input.value = ""; grow();
    busy = new AbortController();
    draw();
    const out = h("div", { class: "msg bot" }, h("span", { class: "dots", "aria-label": "Thinking" }, h("i"), h("i"), h("i")));
    log.append(out); scroll();
    let reply = "", failed = null, queued = false;
    const paint = () => { queued = false; fill(out, md(reply)); scroll(); };
    try {
      const r = await fetch("/api/chat", { method: "POST", signal: busy.signal, body: JSON.stringify({ key, messages: history }),
        headers: { "X-Jobwatch-Token": TOKEN, "Content-Type": "application/json" } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const msg = JSON.parse(buf.slice(0, nl));
          buf = buf.slice(nl + 1);
          if (msg.text) { reply += msg.text; if (!queued) { queued = true; requestAnimationFrame(paint); } }
          if (msg.error) failed = msg.error;
        }
      }
    } catch (e) { failed = e.name === "AbortError" ? "stopped" : e.message; }
    busy = null;
    if (reply) {
      history.push({ role: "assistant", content: reply });
      paint();
      if (failed) out.append(h("p", { class: "stopped" }, failed === "stopped" ? "Stopped." : `Cut off: ${failed}`));
    } else {
      history.pop();  // nothing came back: give the question back to edit or resend
      if (failed !== "stopped") { input.value = text; grow(); }
      draw();
      if (failed && failed !== "stopped") log.append(h("div", { class: "msg bot err" }, failed));
      scroll();
    }
    setBusy(false);
  }

  input.oninput = () => { grow(); setBusy(!!busy); };
  input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } };
  const form = h("form", { class: "chat-input", onsubmit: e => { e.preventDefault(); busy ? busy.abort() : ask(input.value); } },
    input, send);
  const box = h("div", { class: "chat" },
    h("div", { class: "chat-head" }, h("div", { class: "spark" }, icon("sparkle", 17)),
      h("div", { class: "t" }, h("b", {}, title), where), fresh,
      onclose ? h("button", { class: "icon-btn", title: "Close", "aria-label": "Close", onclick: onclose }, icon("x", 16)) : null),
    log, form);
  draw();
  return box;
}

      `Show ${fresh} new score${fresh === 1 ? "" : "s"}`) : null;

      s.current ? h("span", { class: "hint", title: s.current }, ` · now ${s.current}`) : null, show);
    else if (s.error) fill(el, h("span", { title: s.error }, "Background scoring stopped: " + s.error), show);
    else fill(el, show);

    catch { /* the page may be restarting: the next render tries again */ }

function daysAgo(day, today) {

// A per-browser preference; storage can be blocked (private windows), so it's never required.
function remembered(key, fallback) {
  try { return localStorage.getItem("jobwatch." + key) || fallback; } catch { return fallback; }
}

// One page of a long list, and the controls to move between pages. `state.page` survives redraws; a new
// `filterKey` (the search, filters and sort in use) starts again at page 1. How many per page is kept per browser.
const PER_PAGE = [12, 24, 48, 96];
function paged(items, state, filterKey, redraw) {
  const per = PER_PAGE.includes(Number(remembered("perPage", ""))) ? Number(remembered("perPage", "")) : PER_PAGE[0];
  if (state.filterKey !== filterKey) { state.filterKey = filterKey; state.page = 1; }
  const pages = Math.max(1, Math.ceil(items.length / per));
  state.page = Math.min(Math.max(1, state.page || 1), pages);
  const start = (state.page - 1) * per, end = Math.min(start + per, items.length);
  const go = n => { state.page = n; redraw(); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); };
  const nums = [];
  for (let n = 1; n <= pages; n++) {
    if (n === 1 || n === pages || Math.abs(n - state.page) <= 2) nums.push(n);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  const perSelect = h("select", { "aria-label": "Per page" }, PER_PAGE.map(n => h("option", { value: n }, n)));
  perSelect.value = per;
  perSelect.onchange = () => { remember("perPage", perSelect.value); state.page = Math.floor(start / Number(perSelect.value)) + 1; redraw(); };
  return {
    items: items.slice(start, end),
    range: items.length > per ? `${start + 1}–${end} of ${items.length}` : null,
    nav: items.length <= PER_PAGE[0] ? null : h("div", { class: "pager", role: "navigation", "aria-label": "Pages" },
      pages > 1 ? [
        h("button", { class: "btn ghost", disabled: state.page === 1, onclick: () => go(state.page - 1) }, "← Previous"),
        nums.map(n => n === "…" ? h("span", { class: "gap" }, "…")
          : h("button", { class: "pg" + (n === state.page ? " on" : ""), "aria-current": n === state.page ? "page" : null,
            onclick: () => go(n) }, n)),
        h("button", { class: "btn ghost", disabled: state.page === pages, onclick: () => go(state.page + 1) }, "Next →"),
      ] : null,
      h("label", { class: "per" }, "Per page", perSelect)),
  };
}

  const stages = h("div", {});
  const drawStages = () => fill(stages, d.stages.filter(s => counts[s]).map(s =>
    h("button", { class: "facet" + (appView.stage === s ? " on" : ""), style: `--sc:var(--s-${s})`, onclick: () => pick(s) },
      h("span", {}, h("i", { class: "dot" }), STAGE_NAMES[s]), h("span", { class: "c" }, counts[s]))));
  // The same filter as a row of chips over the list: All, Follow up now, then each stage in use.
  const drawFilters = () => fill(filters,
    [["", "All", all.length, null], dueCount ? ["due", "Follow up now", dueCount, "var(--warn)"] : null,
      ...d.stages.filter(s => counts[s]).map(s => [s, STAGE_NAMES[s], counts[s], `var(--s-${s})`])].filter(Boolean)
      .map(([s, label, n, color]) => h("button", { class: "sf" + (appView.stage === s ? " on" : ""),
        style: color ? `--sc:${color}` : null, "aria-pressed": appView.stage === s ? "true" : "false",
        onclick: () => { appView.stage = s; redraw(); } },
        color ? h("i", { class: "dot" }) : null, label, h("span", { class: "c" }, n))));
  const redraw = () => { drawStages(); drawFilters(); draw(); };

  const draw = () => {
    const q = appView.q.trim().toLowerCase();
    const apps = all.filter(a => (!appView.stage || (appView.stage === "due" ? a.due : a.status === appView.stage)) &&
      (!q || `${a.company} ${a.title} ${a.note || ""} ${a.next_step || ""}`.toLowerCase().includes(q)));
    const table = appView.view === "table";
    // Cards come grouped (due, in progress, ended) and the table sorted; a page is a slice of that order.
    const ordered = table ? sortApps(apps, d) : [...apps.filter(a => a.due), ...apps.filter(a => !a.due && !isEnded(a)),
      ...apps.filter(isEnded)];
    const pg = paged(ordered, appView, JSON.stringify([appView.stage, q, appView.view, appView.sort, appView.dir]), draw);
    const page = pg.items;
    const due = page.filter(a => a.due), ended = page.filter(isEnded), open = page.filter(a => !a.due && !isEnded(a));
    const whole = { due: apps.filter(a => a.due).length, open: apps.filter(a => !a.due && !isEnded(a)).length,
      ended: apps.filter(isEnded).length };
    let i = 0;
    const group = (title, list, cls, n) => list.length
      ? [section(title, n, cls), h("div", { class: "grid-cards" }, list.map(a => appCard(a, d, i++)))] : null;
    fill(showing, (apps.length === all.length ? `${all.length} applications` : `Showing ${apps.length} of ${all.length}`) +
      (pg.range ? ` · ${pg.range}` : ""),
      apps.length !== all.length ? h("button", { class: "btn ghost", onclick: () => {
        appView.stage = ""; appView.q = ""; search.value = ""; redraw(); } }, "Clear filters") : null,
      h("span", { class: "spacer" }),
      segmented([["cards", "Cards"], ["table", "Table"]], appView.view, v => { appView.view = v; remember("apps.view", v); draw(); }));
    fill(body, all.length ? null : emptyState("No applications yet. Mark a queued job “I applied”, or add one you applied to somewhere else."),
      all.length && !apps.length ? emptyState("No applications match.") : null,
      !apps.length ? null : table ? appTable(page, d, draw)
        : [group("Follow up now", due, "hot", whole.due), group("In progress", open, null, whole.open),
          group("Ended", ended, null, whole.ended)]);
    fill(pager, pg.nav);
  };

  put(
    pagehead("Applications", "Where each one stands and what to do next. Follow-ups come to the top on their day.",
      h("button", { class: "btn primary", onclick: () => fill(addArea, addForm(d)) }, icon("plus", 14), "Add an application")),
    layout([
      hero([[all.length, "applications", "lead"], [talking, "in conversation"],
        [dueCount, "follow-ups due", dueCount ? "warn" : ""], [week, "follow-ups this week"]]),
      all.length ? h("div", { class: "pipeline panel" }, h("h4", {}, "Pipeline"),
        h("div", { class: "bar-track" }, d.stages.filter(s => counts[s]).map((s, n) =>
          h("button", { class: "seg", style: `flex:${counts[s]};--sc:var(--s-${s});animation-delay:${n * 90}ms`,
            title: `${STAGE_NAMES[s]}: ${counts[s]}`, "aria-label": `Show ${STAGE_NAMES[s]} (${counts[s]})`,
            onclick: () => pick(s) }))),
        h("div", { style: "margin-top:10px" }, stages)) : null,
      panel(null, search),
    ], [addArea, all.length ? filters : null, showing, body, pager]));
  drawFilters();
  draw();
}

// Every application as one row: sort by a column's header, change a stage in place, open the details.
const APP_COLUMNS = [
  ["company", "Company"], ["title", "Role"], ["status", "Stage"], ["applied_at", "Applied"],
  ["next", "Next step"], [null, "Sent", "col-sent"], [null, ""]];

// The table's order: the column picked (appView.sort), either way (appView.dir).
function sortApps(apps, d) {
  const byNext = a => [a.due ? 0 : isEndedStatus(a.status) ? 2 : 1, a.follow_up || "9999", a.applied_at ? -Date.parse(a.applied_at) : 0];
  const key = {
    company: a => [a.company.toLowerCase()], title: a => [a.title.toLowerCase()],
    status: a => [d.stages.indexOf(a.status)], applied_at: a => [a.applied_at || ""], next: byNext }[appView.sort];
  const cmp = (x, y) => { for (let n = 0; n < x.length; n++) if (x[n] !== y[n]) return x[n] < y[n] ? -1 : 1; return 0; };
  return [...apps].sort((a, b) => cmp(key(a), key(b)) * appView.dir);
}

function appTable(rows, d, redraw) {
  const head = h("tr", {}, APP_COLUMNS.map(([k, label, cls]) => k
    ? h("th", { "aria-sort": appView.sort === k ? (appView.dir > 0 ? "ascending" : "descending") : null },
      h("button", { class: "sort" + (appView.sort === k ? " on" : ""), onclick: () => {
        appView.dir = appView.sort === k ? -appView.dir : 1; appView.sort = k; redraw(); } },
        label, h("span", { class: "arrow" }, appView.sort === k ? (appView.dir > 0 ? "↑" : "↓") : "")))
    : h("th", { class: cls }, label)));
  return h("div", { class: "table-wrap" }, h("table", { class: "apps" },
    h("thead", {}, head), h("tbody", {}, rows.map(a => appRow(a, d)))));
}

function appRow(a, d) {
  const tr = h("tr", { class: (isEndedStatus(a.status) ? "ended" : "") + (a.due ? " due" : ""), style: `--sc:var(--s-${a.status})` });
  const stage = stageSelect(a.status, d.stages);
  stage.className = "stage";
  stage.onchange = () => changeStage(a, d, stage);
  const view = () => fill(tr,
    h("td", { class: "co" }, h("div", { class: "co-cell" }, monogram(a.company), h("b", {}, a.company))),
    h("td", { class: "role" }, a.url ? link(a.url, a.title) : a.title, a.pay ? h("div", { class: "pay small" }, a.pay) : null),
    h("td", {}, stage),
    h("td", { class: "nowrap" }, a.applied_at ? [fmtDay(a.applied_at, d.today), h("div", { class: "muted small" }, relDay(a.applied_at, d.today))] : ""),
    h("td", { class: "next-cell" }, nextLine(a, d.today) || h("span", { class: "muted" }, "—")),
    h("td", { class: "col-sent" }, sentChip(a)),
    h("td", { class: "acts nowrap" },
      h("button", { class: "btn ghost", onclick: edit, title: "Edit next step, follow-up and notes" }, icon("pencil", 13)),
      h("button", { class: "btn ghost", onclick: () => openDetails(a.key), title: "Details" },
        h("span", { class: "label" }, "Details"), icon("arrow", 13))));
  const edit = () => {
    const f = trackFields(a);
    fill(tr, h("td", { colspan: APP_COLUMNS.length, class: "editing" },
      h("h3", {}, `${a.company}: ${a.title}`), f.el,
      h("div", { class: "row actions" },
        h("button", { class: "btn primary", onclick: async () => {
          try { await api("/api/track", { key: a.key, ...f.values() }); render(); } catch (e) { toast(e.message); }
        } }, "Save"),
        h("button", { class: "btn", onclick: view }, "Cancel"))));
  };
  view();
  return tr;
}

function isEndedStatus(s) { return s === "rejected" || s === "withdrawn"; }

// A stage picked on a card or a table row: save it, cheer the good news, offer an undo.
async function changeStage(a, d, stage) {
  const before = a.status;
  try {
    const to = stage.value;
    await api("/api/track", { key: a.key, status: to });
    const forward = d.stages.indexOf(to) > d.stages.indexOf(before) && !isEndedStatus(to);
    const words = {
      screening: `📞 ${a.company} wants to talk. Nice!`, interviewing: `🎯 Interviewing at ${a.company}. You've got this.`,
      offer: `🥂 An offer from ${a.company}! Congratulations!`, rejected: `${a.company} passed. Their loss. Onward.`,
      withdrawn: `Withdrawn from ${a.company}. One less thing to track.`, applied: `${a.company}: back to applied.` };
    toast(words[to], async () => { await api("/api/track", { key: a.key, status: before }); render(); });
    if (to === "offer") { confetti(null, { count: 220, power: 1.4 }); setTimeout(() => confetti(stage, { count: 80 }), 350); }
    else if (forward) confetti(stage, { count: 70, power: .8 });
    render();
  } catch (e) { toast(e.message); stage.value = before; }
}

function stageSelect(value, stages) {
  const sel = h("select", {}, stages.map(s => h("option", { value: s }, STAGE_NAMES[s])));
  sel.value = value;
  return sel;
}

function nextLine(a, today) {
  if (!a.next_step && !a.follow_up) return null;
  const n = a.follow_up ? dayDiff(a.follow_up, today) : null;
  const urgency = n === null ? "" : n < 0 ? "late" : n === 0 ? "now" : n <= 3 ? "soon" : "";
  return h("div", { class: "next " + urgency },
    h("span", { class: "what" }, a.next_step || "Follow up"),
    a.follow_up ? h("span", { class: "when-chip" }, icon("calendar", 12), `${fmtDay(a.follow_up, today)} · ${relDay(a.follow_up, today)}`) : null);
}

function appCard(a, d, i = 0) {
  const card = h("div", { class: "card app" + (isEndedStatus(a.status) ? " ended" : ""),
    style: `--sc:var(--s-${a.status});--i:${Math.min(i, 12)}` });
  const stage = stageSelect(a.status, d.stages);
  stage.className = "stage";
  stage.onchange = () => changeStage(a, d, stage);
  const facts = [a.pay ? h("span", { class: "pay" }, a.pay) : null, a.closed ? "posting closed" : null].filter(Boolean);
  const view = () => fill(card,
    monogram(a.company),
    h("div", {},
      h("div", { class: "app-head" },
        h("div", {},
          a.url ? link(a.url, a.title, "title") : h("span", { class: "title", style: "font-weight:700;font-size:17px" }, a.title),
          h("div", { class: "meta" }, h("b", {}, a.company), facts.map(f => [h("span", { class: "sep" }, "·"), f]))),
        stage),
      nextLine(a, d.today), a.note ? h("div", { class: "note" }, a.note) : null,
      h("div", { class: "app-foot" },
        h("span", { class: "when" }, a.applied_at ? `Applied ${fmtDay(a.applied_at, d.today)} · ${relDay(a.applied_at, d.today)}` : ""),
        h("div", { class: "acts" }, sentChip(a),
          h("button", { class: "btn ghost", onclick: edit }, icon("pencil", 13), "Edit"),
          h("button", { class: "btn ghost", onclick: () => openDetails(a.key) }, "Details", icon("arrow", 13))))));
  const edit = () => {
    const f = trackFields(a);
    fill(card, h("div", { class: "full" },
      h("h3", {}, `${a.company}: ${a.title}`), f.el,
      h("div", { class: "row actions" },
        h("button", { class: "btn primary", onclick: async () => {
          try { await api("/api/track", { key: a.key, ...f.values() }); render(); } catch (e) { toast(e.message); }
        } }, "Save"),
        h("button", { class: "btn", onclick: view }, "Cancel"))));
  };
  view();
  return card;
}

// "2 files · 3 answers", or a nudge to keep what was sent while it's fresh.
function sentChip(a) {
  const p = a.package || { files: 0, answers: 0, note: false };
  const parts = [p.files && `${p.files} file${p.files === 1 ? "" : "s"}`, p.answers && `${p.answers} answer${p.answers === 1 ? "" : "s"}`,
    p.note && "letter"].filter(Boolean);
  return h("button", { class: "sent-chip" + (parts.length ? "" : " empty-pkg"), onclick: () => openDetails(a.key),
    title: parts.length ? "What you sent with this application" : "Keep the resume and answers you sent, for when they call" },
    icon("clip", 13), parts.length ? parts.join(" · ") : "Add what you sent");
}

// Next step, follow-up day, day applied and note: shared by the edit and add forms.
function trackFields(a) {
  const nextStep = h("input", { type: "text", placeholder: "e.g. check in with the recruiter" }); nextStep.value = a.next_step || "";
  const followUp = h("input", { type: "date" }); followUp.value = a.follow_up || "";
  const applied = h("input", { type: "date" }); applied.value = a.applied_at || "";
  const note = h("textarea", { placeholder: "Recruiter, referral, pay range, what you answered…" }); note.value = a.note || "";
  return {
    el: h("div", {}, h("div", { class: "grid" },
      h("div", {}, h("label", {}, "Next step"), nextStep),
      h("div", {}, h("label", {}, "Follow up by ", h("span", { class: "hint" }, "shows under Follow up now on that day")), followUp),
      h("div", {}, h("label", {}, "Applied on"), applied)),
      h("label", {}, "Notes"), note),
    values: () => ({ next_step: nextStep.value, follow_up: followUp.value, applied_at: applied.value, note: note.value }),
  };
}

// A job found somewhere else. A link to one job on a board jobwatch reads fills in the rest; for anything else
// (LinkedIn, a company's own site) give the company and title, and paste the posting so it can be scored.
// d: the Applications data (stages, today), or null to add a job to the queue, to consider.
function addForm(d) {
  const queued = !d;
  const url = h("input", { type: "text", placeholder: "https://…" });
  const company = h("input", { type: "text", placeholder: "Company" });
  const title = h("input", { type: "text", placeholder: "Job title" });
  const text = h("textarea", { rows: 5, placeholder: "Paste the posting here to score it and prep for it (not needed for a Greenhouse, Lever, Ashby, Workable or Workday link)" });
  const stage = queued ? null : stageSelect("applied", d.stages);
  const f = queued ? null : trackFields({ applied_at: d.today });
  const msg = h("span", { class: "small error" });
  const add = h("button", { class: "btn primary" }, queued ? "Add to the queue" : "Add");
  add.onclick = async () => {
    add.disabled = true; msg.textContent = "";
    try {
      const r = await api("/api/add", { url: url.value, company: company.value, title: title.value, text: text.value,
        status: queued ? "queued" : stage.value, ...(f ? f.values() : {}) });
      confetti(add, { count: 60, power: .8 });
      toast(`${queued ? "📌 Queued" : "🎉 Added"} ${r.company}: ${r.title}${r.read ? " (read from the link)" : ""}`); render();
    } catch (e) { msg.textContent = e.message; add.disabled = false; }
  };
  const card = h("div", { class: "card" },
    h("h3", {}, queued ? "Add a job " : "Add an application ", h("span", { class: "hint" },
      queued ? "you found somewhere else, to look at before applying: LinkedIn, a referral, a recruiter"
        : "for a job you found somewhere else: a referral, a recruiter, LinkedIn")),
    h("label", {}, "Link to the posting ", h("span", { class: "hint" }, "on its own is enough for a board jobwatch reads")), url,
    h("div", { class: "grid" },
      h("div", {}, h("label", {}, "Company"), company), h("div", {}, h("label", {}, "Job title"), title),
      stage ? h("div", {}, h("label", {}, "Stage"), stage) : null),
    h("label", {}, "The posting ", h("span", { class: "hint" }, "(optional)")), text,
    f ? f.el : null,
    h("div", { class: "row actions" }, add, h("button", { class: "btn", onclick: () => card.remove() }, "Cancel"), msg));
  setTimeout(() => url.focus(), 0);
  return card;
}

// -- settings

function lines(v) { return (v || []).join("\n"); }
function unlines(v) { return v.split(/[\n,]/).map(s => s.trim()).filter(Boolean); }

// Theme and page width: they change the page at once and are saved right away, apart from "Save settings".
function displayCard() {
  const d = { theme: "system", width: "standard", ...(settings.display || {}) };
  const msg = h("span", { class: "small muted" });
  const set = async (k, v) => {
    d[k] = v;
    applyDisplay(d);
    try {
      await api("/api/settings", { display: { ...d } });
      settings.display = { ...d };
      msg.textContent = "Saved."; msg.className = "small muted";
    } catch (e) { msg.textContent = e.message; msg.className = "small error"; }
  };
  return h("div", { class: "card" }, h("h3", {}, "Display ", msg),
    h("div", { class: "grid" },
      h("div", {}, h("label", {}, "Theme"),
        segmented([["system", "System"], ["light", "Light"], ["dark", "Dark"]], d.theme, v => set("theme", v))),
      h("div", {}, h("label", {}, "Page width ", h("span", { class: "hint" }, "wider fits more on a big monitor")),
        segmented([["standard", "Standard"], ["wide", "Wide"], ["full", "Full"]], d.width, v => set("width", v)))));
}

function renderSettings() {
  const s = settings, f = s.filters || {};
  const companies = [...s.companies];
  const companyList = h("div", { class: "companies" });
  const watching = h("div", { class: "muted small", style: "margin:14px 0 8px" });
  const drawCompanies = () => (watching.textContent = `Watching ${companies.length} ${companies.length === 1 ? "company" : "companies"}`,
    companyList.replaceChildren(...(companies.length ? companies.map((c, i) =>
    h("div", { class: "company" }, monogram(c.name || c.board),
      h("div", { class: "who" }, h("b", {}, c.name || c.board), h("span", {}, `${c.source}:${c.board}`)),
      h("button", { class: "x", title: `Stop watching ${c.name || c.board}`, "aria-label": "Remove",
        onclick: () => { companies.splice(i, 1); drawCompanies(); } }, "✕")))
    : [h("div", { class: "muted small" }, "No companies yet.")])));
  drawCompanies();

  const findInput = h("input", { type: "text", placeholder: "Company name, or paste a link to one of their jobs" });
  const findOut = h("div", {});
  const findBtn = h("button", { class: "btn" }, "Find");
  const find = async () => {
    findBtn.disabled = true; findOut.replaceChildren(h("div", { class: "muted small" }, "Looking…"));
    try {
      const hits = await api("/api/find", { company: findInput.value });
      findOut.replaceChildren(...(hits.length ? hits.map(hit => h("div", { class: "list-item" },
        h("div", { style: "flex:1" },
          h("div", {}, h("b", {}, hit.name || hit.board), ` · ${hit.open_roles} open jobs · `, link(hit.careers, "careers page")),
          h("div", { class: "muted small" }, "e.g. " + hit.sample_titles.slice(0, 3).join(" · "))),
        companies.some(c => c.source === hit.source && c.board === hit.board) ? h("span", { class: "muted small" }, "added")
          : h("button", { class: "btn primary", onclick: e => {
              companies.push({ source: hit.source, board: hit.board, name: hit.name || findInput.value.trim() });
              drawCompanies(); e.target.replaceWith(h("span", { class: "muted small" }, "added"));
            } }, "Add")))
        : [h("div", { class: "muted small" }, "No Greenhouse, Lever, Ashby, Workday or Eightfold board found. Try pasting a link to one " +
            "of their job postings. Some companies use other systems that jobwatch can't read yet.")]));
    } catch (e) { findOut.replaceChildren(h("div", { class: "error small" }, e.message)); }
    findBtn.disabled = false;
  };
  findBtn.onclick = find;
  findInput.addEventListener("keydown", e => { if (e.key === "Enter") find(); });

  const titles = h("textarea", { placeholder: "engineer\ndeveloper" }); titles.value = lines(f.titles);
  const exclude = h("textarea", { placeholder: "intern\nmanager" }); exclude.value = lines(f.exclude_titles);
  const locations = h("textarea", { placeholder: "remote\nNew York" }); locations.value = lines(f.locations);
  const country = h("select", {}, h("option", { value: "US" }, "Remote jobs open in the US"),
    h("option", { value: "any" }, "Remote jobs anywhere"));
  country.value = (f.remote_country || "US").toLowerCase() === "any" ? "any" : "US";
  const minPay = h("input", { type: "number", min: 0, step: 5000, placeholder: "e.g. 150000" });
  minPay.value = f.min_salary ?? "";
  const requirePay = h("input", { type: "checkbox" }); requirePay.checked = !!f.require_salary;
  const maxAge = h("input", { type: "number", min: 1, placeholder: "e.g. 30" }); maxAge.value = f.max_age_days ?? "";

  const kwRows = h("div", {});
  const addKw = (k = "", w = 1) => {
    const word = h("input", { type: "text", placeholder: "e.g. Python" }); word.value = k;
    const weight = h("select", {}, [1, 2, 3].map(n => h("option", { value: n }, ["", "matters", "matters more", "matters most"][n])));
    weight.value = String(Math.min(3, Math.max(1, Math.round(w))));
    const row = h("div", { class: "kw" }, word, weight, h("button", { class: "btn", onclick: () => row.remove() }, "✕"));
    kwRows.append(row);
  };
  Object.entries(s.keywords || {}).forEach(([k, w]) => addKw(k, w));
  if (!Object.keys(s.keywords || {}).length) addKw();

  const scoring = s.scoring || {};
  const backend = h("select", {}, h("option", { value: "claude" }, "Claude API (needs ANTHROPIC_API_KEY)"),
    h("option", { value: "local" }, "On this Mac (Apple Silicon, slower)"));
  backend.value = scoring.backend || "claude";

  const upload = (kind, accept, current, help) => {
    const input = h("input", { type: "file", accept });
    const status = h("span", { class: "muted small" }, current ? `Using ${current}` : "Not set");
    input.onchange = async () => {
      const file = input.files[0]; if (!file) return;
      status.textContent = "Uploading…";
      try {
        const r = await api(`/api/upload?kind=${kind}&name=${encodeURIComponent(file.name)}`, undefined, file);
        settings[kind] = r[kind];
        status.textContent = `Saved as ${r[kind]}` + (r.people !== undefined ? ` (${r.people} people` +
          (r.known !== undefined ? `, ${r.known} you've been in touch with` : "") + ")" : "");
      } catch (e) { status.textContent = e.message; status.className = "error small"; }
    };
    return h("div", {}, h("div", { class: "row" }, input, status), h("div", { class: "hint" }, help));
  };

  const saveMsg = h("span", { class: "small" });
  const save = async () => {
    const keywords = {};
    for (const row of kwRows.children) {
      const [word, weight] = row.querySelectorAll("input, select");
      if (word.value.trim()) keywords[word.value.trim()] = Number(weight.value);
    }
    const filters = {
      titles: unlines(titles.value), exclude_titles: unlines(exclude.value), locations: unlines(locations.value),
      remote_country: country.value, min_salary: minPay.value ? Number(minPay.value) : null,
      require_salary: requirePay.checked || null, max_age_days: maxAge.value ? Number(maxAge.value) : null,
    };
    for (const k of Object.keys(filters)) {
      const v = filters[k];
      if (v === null || (Array.isArray(v) && !v.length)) delete filters[k];
    }
    if (filters.remote_country === "US") delete filters.remote_country;
    for (const k of ["exclude_departments"]) if (f[k]) filters[k] = f[k];  // kept, not edited here
    saveMsg.textContent = "Saving…"; saveMsg.className = "small muted";
    try {
      await api("/api/settings", { companies, filters, keywords, scoring: { ...scoring, backend: backend.value } });
      settings = await api("/api/settings");
      saveMsg.textContent = "Saved."; saveMsg.className = "small";
      if (companies.length) toast("Saved. Press “Check for new jobs” to look now.");
    } catch (e) { saveMsg.textContent = e.message; saveMsg.className = "small error"; }
  };

  put(
    pagehead("Settings", h("span", {}, "Your watchlist, saved to ", h("code", {}, s.path)),
      h("div", { class: "row" }, saveMsg, h("button", { class: "btn primary", onclick: save }, icon("check", 14), "Save settings"))),
    h("div", { class: "settings-grid" }, h("div", {}, h("div", { class: "card" }, h("h3", {}, "Companies to watch"),
      h("div", { class: "row", style: "margin-top:8px" }, h("div", { style: "flex:1" }, findInput), findBtn),
      findOut, watching, companyList), displayCard()),
    h("div", {}, h("div", { class: "card" }, h("h3", {}, "What you're looking for"),
      h("div", { class: "grid" },
        h("div", {}, h("label", {}, "Job titles ", h("span", { class: "hint" }, "one per line; a title must contain one")), titles),
        h("div", {}, h("label", {}, "Leave out titles with ", h("span", { class: "hint" }, "one per line")), exclude),
        h("div", {}, h("label", {}, "Locations ", h("span", { class: "hint" }, "“remote”, or a city or state")), locations,
          h("div", { style: "margin-top:6px" }, country)),
        h("div", {},
          h("label", {}, "Minimum pay per year ", h("span", { class: "hint" }, "jobs that don't list pay still show")), minPay,
          h("label", { class: "row" }, requirePay, h("span", { class: "hint" }, "Only show jobs that list pay")),
          h("label", {}, "Posted within (days)"), maxAge)),
      h("label", {}, "Keywords ", h("span", { class: "hint" }, "jobs mentioning these rank higher; a title match counts double")),
      kwRows, h("button", { class: "btn", onclick: () => addKw() }, "Add keyword")),
    h("div", { class: "card" }, h("h3", {}, "Your resume ", h("span", { class: "hint" }, "optional: for fit scores")),
      upload("resume", ".pdf,.docx,.txt,.md", s.resume, "Fit scores compare a posting's requirements with your resume. " +
        "They need the scoring add-on: pip install 'jobwatch[score]'."),
      h("label", {}, "Score with"), backend),
    h("div", { class: "card" }, h("h3", {}, "People you know ", h("span", { class: "hint" }, "optional")),
      upload("connections", ".zip,.csv", s.connections, "On LinkedIn: Settings → Data privacy → Get a copy of your " +
        "data. Upload the archive (.zip) LinkedIn emails you, and each job shows who you know there, the people you " +
        "actually talk to first (from how often you've messaged, recommended or endorsed each other). Only those " +
        "counts are kept, never your messages. Connections.csv on its own works too. Everything stays on this " +
        "computer.")))),
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: save }, icon("check", 14), "Save settings")));
}

// -- shell

async function refreshQueueCount() {
  try {
    const ready = settings && settings.exists;
    const n = ready ? (await api("/api/queue")).length : 0;
    const q = document.getElementById("qcount");
    q.replaceChildren(n ? h("span", { class: "count" }, n) : "");
    if (n > (refreshQueueCount.last ?? n)) bump(q.firstChild);
    refreshQueueCount.last = n;
    const due = ready ? (await api("/api/applications")).applications.filter(a => a.due).length : 0;
    document.getElementById("duecount").replaceChildren(due ? h("span", { class: "count", title: "follow-ups due" }, due) : "");
  } catch { /* the page still works without the counts */ }
}

let lastTab = null;
async function render() {
  main.classList.toggle("quiet", tab === lastTab);  // entrance animations only when a tab opens
  lastTab = tab;
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  document.getElementById("fetchBtn").style.display = settings.companies.length ? "" : "none";
  const home = tab === "today" && settings.exists && settings.companies.length > 0;
  chatFab.style.display = home ? "" : "none";
  if (!home) homeChat(false);
  try {
    if (tab === "settings") renderSettings();
    else if (!settings.exists || (!settings.companies.length && tab !== "applied")) renderWelcome();
    else await { today: renderToday, queue: renderQueue, applied: renderApplied }[tab]();
  } catch (e) { showError(main, e); }
  refreshQueueCount();
}

function go(name) { tab = name; history.replaceState(null, "", "#" + name); render(); }
for (const b of document.querySelectorAll("#tabs button")) b.onclick = () => go(b.dataset.tab);
const TABS = ["today", "queue", "applied", "settings"];
window.addEventListener("hashchange", () => {
  const want = location.hash.slice(1);
  if (TABS.includes(want) && want !== tab && settings) { tab = want; render(); }
});

fill(document.getElementById("fetchBtn"), icon("refresh", 14), "Check for new jobs");
document.getElementById("fetchBtn").onclick = async () => {
  const btn = document.getElementById("fetchBtn"), status = document.getElementById("fetchStatus");
  btn.disabled = true; btn.classList.add("spin"); status.textContent = "Checking every company…";
  try {
    const r = await api("/api/fetch", {});
    const failed = Object.keys(r.errors).length;
    status.textContent = `${r.new} new of ${r.jobs.toLocaleString()} open jobs` + (failed ? ` · ${failed} failed` : "");
    if (failed) status.title = Object.entries(r.errors).map(([b, e]) => `${b}: ${e}`).join("\n");
    tab = "today"; lastTab = null; await render();
    if (r.new) { toast(`✨ ${r.new} new job${r.new === 1 ? "" : "s"} to look at`); confetti(btn, { count: 40, power: .6 }); }
  } catch (e) { status.textContent = e.message; }
  btn.disabled = false; btn.classList.remove("spin");
};

(async () => {
  try { settings = await api("/api/settings"); }
  catch (e) { return showError(main, e); }
  applyDisplay(settings.display);
  const want = location.hash.slice(1);
  tab = TABS.includes(want) ? want : "today";
  render();
})();
</script>
