    watchPay([j], "details");
  } catch (e) { dialog.classList.remove("with-chat", "co-page"); showError(dialog, e); }
}
function detailsScore(j) {
  if (j.fit && !j.fit.stale) return null;
  if (j.unscored?.code === "no_text" && j.manual) return [postingButton(j, () => openDetails(j.key)), unscoredNote(j)];
  if (!j.can_score || NO_SCORE_BUTTON.includes(j.unscored?.code)) return unscoredNote(j);
  const b = h("button", { class: "btn", title: "Compare this posting with your resume (can take a while)" }, "Score fit");
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Scoring…";
    try { await api("/api/score", { key: j.key }); openDetails(j.key); }
    catch (e) { b.disabled = false; b.textContent = "Score fit"; toast(e.message); }
  };
  return [b, unscoredNote(j)];
}
// A note's dated lines, newest first, as [day, text]: notes grow a dated line at a time (prep.note_entries does
// the same for the standalone page). Text before the first dated line has no day.
function noteEntries(note) {
  return String(note || "").trim().split(/\s+/).join(" ").split(/\s(?=\d{4}-\d{2}-\d{2}: )/)
    .map(p => { const m = p.match(/^(\d{4}-\d{2}-\d{2}): (.*)$/); return m ? [m[1], m[2]] : ["", p]; })
    .filter(e => e[1]).reverse();
}
function noteTimeline(note) {
  return h("ul", { class: "timeline" }, ...noteEntries(note).map(([day, text]) =>
    h("li", {}, h("span", { class: "day" }, day), h("span", {}, text))));
}
// The prep sheet at a glance: fit, must-haves and the days that matter, as the stat tiles Today uses.
function prepTiles(p) {
  const tiles = [p.fit && [Math.round(p.fit.score || 0), "Fit score", "lead"],
    p.fit && [`${p.fit.must_haves_met || 0}/${p.fit.must_haves_total || 0}`, "Must-haves met", ""],
    p.applied_at && [p.applied_at, "Applied", ""], p.follow_up && [p.follow_up, "Follow up", ""]].filter(Boolean);
  return tiles.length ? h("div", { class: "hero" }, ...tiles.map(([num, lbl, cls]) =>
    h("div", { class: "stat " + cls }, h("div", { class: "num" }, String(num)), h("div", { class: "lbl" }, lbl)))) : null;
}
// The built prep sheet as its own page, in a new tab, for a job with no sheet you wrote. The tab opens on the click,
// since one opened after waiting for the sheet would be blocked, and shows the sheet once it's built.
async function openPrepPage(key) {
  const tab = window.open("", "_blank");
  if (!tab) return toast("Couldn't open a new tab: your browser blocked it");
  tab.document.title = "Prep sheet…";
  try {
    const p = await api("/api/prep?key=" + encodeURIComponent(key));
    const url = URL.createObjectURL(new Blob([p.html], { type: "text/html" }));
    tab.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { tab.close(); toast(e.message); }
}
// A prep sheet for a call: the posting's asks next to the closest resume line, gaps, what was sent, questions.
// draft: the chat's model drafts likely questions with answers from the story file (slow the first time, then kept).
async function openPrep(key, draft = false, questions = false) {
  const dialog = document.getElementById("dialog");
  dialog.classList.remove("with-chat", "co-page");
  dialog.replaceChildren(h("div", { class: "muted" }, draft ? "Drafting questions and answers from your stories… "
    + "(the first time can take a minute or two)" : "Loading…"));
  try {
    const p = await api("/api/prep?key=" + encodeURIComponent(key) + (draft ? "&draft=1" : "") + (questions ? "&questions=1" : ""));
    const list = items => h("ul", {}, ...items.map(i => h("li", {}, i)));
    const KIND = { need: "They ask for", do: "You'd be doing", nice: "Nice to have" };
    const which = { sent: "the resume you sent", base: "your resume" }[p.resume_used];
    const gaps = [...(p.fit?.gaps || []), ...p.gaps.filter(g => g.must_have).map(g => g.name + " (a must-have)"),
      ...p.gaps.filter(g => !g.must_have).map(g => g.name)];
    const sent = p.sent.files.length || p.sent.answers.length || p.sent.note;
    const copy = h("button", { class: "btn" }, "Copy as text");
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(p.markdown); toast("Copied the prep sheet"); }
      catch { toast("Couldn't copy: your browser blocked it"); }
    };
    // The standalone page, in a new tab: it prints cleanly and can be saved or sent as it is.
    const page = h("button", { class: "btn", title: "The same sheet as its own page, to print or save" }, "Open as page");
    page.onclick = () => {
      const url = URL.createObjectURL(new Blob([p.html], { type: "text/html" }));
      if (!window.open(url, "_blank")) toast("Couldn't open a new tab: your browser blocked it");

// -- chat: ask the model from scoring.backend (Claude, or the one on this computer) about the search or one job

const chats = new Map();  // "home" or a job key -> [{role, content}], kept while the page is open
let chatInfo = null;
function getChatInfo() { return chatInfo ??= api("/api/chat").catch(e => ({ error: e.message })); }

// A safe subset of Markdown (paragraphs, lists, headings, bold, code, links), built as DOM nodes.
function inline(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:[^)\s]+\))/).filter(Boolean).map(part => {
    let m;
    if (/^\*\*[^*]+\*\*$/.test(part)) return h("strong", {}, part.slice(2, -2));
    if (/^`[^`]+`$/.test(part)) return h("code", {}, part.slice(1, -1));
    if ((m = part.match(/^\[([^\]]+)\]\((https?:[^)\s]+)\)$/))) return link(m[2], m[1]);
    return part;
  });
}
function md(text) {
  const out = [];
  let list = null;
  for (const line of text.split("\n")) {
    let m;
    if ((m = line.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/))) {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (!list || list.tagName.toLowerCase() !== tag) out.push(list = h(tag, {}));
      list.append(h("li", {}, inline(m[2])));
    } else {
      list = null;
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) out.push(h("p", {}, h("strong", {}, inline(m[1]))));
      else if (line.trim()) out.push(h("p", {}, inline(line)));
    }
  }
  return out;
}

// "⚡ 14.2s (1.9s to first word) | 3,210→412 tokens | 28 tokens/s", from the reply's stats.
function statsText(s) {
  if (!s) return "";
  const paren = parts => parts.some(Boolean) ? ` (${parts.filter(Boolean).join(", ")})` : "";
  const n = x => Number(x).toLocaleString();
  return "⚡ " + [
    s.seconds != null ? `${s.seconds}s` + paren([s.waited_seconds ? `${s.waited_seconds}s waiting for a fit score` : "",
      s.first_seconds ? `${Math.max(0, s.first_seconds - (s.waited_seconds || 0)).toFixed(1)}s to first word` : ""]) : "",
    s.output_tokens ? (s.input_tokens ? `${n(s.input_tokens)}→` : "") + `${n(s.output_tokens)} tokens` : "",
    s.tokens_per_sec ? `${s.tokens_per_sec} tokens/s` : "",
    s.peak_memory_gb ? `${s.peak_memory_gb} GB peak` : "",
  ].filter(Boolean).join(" | ");
}
function copyButton(text) {
  const b = h("button", { class: "icon-btn", title: "Copy", "aria-label": "Copy the reply" }, icon("copy", 13));
  b.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text());
      fill(b, icon("check", 13)); b.classList.add("copied");
      setTimeout(() => { fill(b, icon("copy", 13)); b.classList.remove("copied"); }, 1500);
    } catch { toast("Couldn't copy: your browser blocked it"); }
  };
  return b;
}
function replyMeta(m) {
  return h("div", { class: "msg-meta" }, copyButton(() => m.content),
    m.stats ? h("span", { title: m.stats.model || "" }, statsText(m.stats)) : null);
}
// How long replies took lately (kept in this browser), for "~20s expected" while the next one is written.
function expectedSeconds() {
  try { const t = JSON.parse(remembered("chat-seconds", "[]")); return t.length ? Math.round(t.reduce((a, b) => a + b) / t.length) : null; }
  catch { return null; }
}
function rememberSeconds(s) {
  try { remember("chat-seconds", JSON.stringify([...JSON.parse(remembered("chat-seconds", "[]")), s].slice(-5))); } catch { /* fine */ }
}

function chatBox({ key = null, title, intro, suggestions, onclose }) {
  const id = key || "home";
  if (!chats.has(id)) chats.set(id, []);
  const history = chats.get(id);
  const log = h("div", { class: "chat-log", "aria-live": "polite" });
  const where = h("span", { class: "where" }, "…");
  getChatInfo().then(i => {
    if (i.error) return fill(where, i.error);
    where.classList.toggle("private", i.local);
    where.title = i.local ? `${i.model} runs on this computer. Nothing you ask leaves it.`
      : `Sent to Anthropic's ${i.model}, with your resume and the job data shown here.`;
    fill(where, icon(i.local ? "lock" : "cloud", 12), i.local ? "Private · runs on this computer" : `${i.label} · cloud`);
  });
  const input = h("textarea", { rows: 1, placeholder: "Ask anything…", "aria-label": "Your question" });
  const send = h("button", { class: "send", type: "submit", title: "Send (Enter)", "aria-label": "Send" }, icon("send", 17));
  const save = h("button", { class: "icon-btn", title: "Download the conversation", "aria-label": "Download the conversation",
    onclick: () => {
      const text = `# ${title}\n\n` + history.map(m => (m.role === "user" ? "**You:** " : "**jobwatch:** ") + m.content +
        (m.stats ? `\n\n_${statsText(m.stats)}_` : "")).join("\n\n---\n\n") + "\n";
      const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/markdown" })),
        download: title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".md" });
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } }, icon("download", 15));
  const fresh = h("button", { class: "icon-btn", title: "Start over", "aria-label": "Start over",
    onclick: () => { if (busy) busy.abort(); history.length = 0; draw(); input.focus(); } }, icon("refresh", 15));
  let busy = null;  // an AbortController while a reply streams

  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, 160) + "px"; };
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const setBusy = on => {
    fill(send, icon(on ? "stop" : "send", on ? 14 : 17));
    send.classList.toggle("stop", on);
    send.title = on ? "Stop" : "Send (Enter)";
    send.disabled = !on && !input.value.trim();
    fresh.style.visibility = save.style.visibility = history.length ? "" : "hidden";
  };
  const draw = () => {
    fill(log, history.length ? history.map(m => m.role === "user" ? h("div", { class: "msg user" }, m.content)
      : h("div", { class: "turn" }, h("div", { class: "msg bot" }, md(m.content)), replyMeta(m)))
      : h("div", { class: "chat-hello" }, h("div", { class: "spark" }, icon("sparkle", 24)), h("div", {}, intro),
        h("div", { class: "suggest" }, suggestions.map(s => h("button", { onclick: () => ask(s) }, s)))));
    scroll();
    setBusy(!!busy);
  };

  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;
    history.push({ role: "user", content: text });
    input.value = ""; grow();
    busy = new AbortController();
    draw();
    const expect = expectedSeconds(), started = Date.now(), clock = h("span", {}, "0s");
    const status = h("span", {}, expect ? `~${expect}s expected` : "");
    const out = h("div", { class: "msg bot" }, h("div", { class: "thinking" },
      h("span", { class: "dots", "aria-label": "Thinking" }, h("i"), h("i"), h("i")), clock, status));
    const turn = h("div", { class: "turn" }, out);
    const tick = setInterval(() => { clock.textContent = Math.round((Date.now() - started) / 1000) + "s"; }, 1000);
    log.append(turn); scroll();
    let reply = "", failed = null, queued = false, stats = null, finished = false;
    const paint = () => {  // the reply so far, with a caret while it's still being written
      queued = false;
      fill(out, md(reply));
      let last = out.lastElementChild;
      if (last && /^(UL|OL)$/.test(last.tagName)) last = last.lastElementChild;
      if (!finished) (last || out).append(h("span", { class: "caret" }, "▋"));
      scroll();
    };
    try {
      const r = await fetch("/api/chat", { method: "POST", signal: busy.signal,
        body: JSON.stringify({ key, messages: history.map(({ role, content }) => ({ role, content })) }),
        headers: { "X-Jobwatch-Token": TOKEN, "Content-Type": "application/json" } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const msg = JSON.parse(buf.slice(0, nl));
          buf = buf.slice(nl + 1);
          if (msg.text) { clearInterval(tick); reply += msg.text; if (!queued) { queued = true; requestAnimationFrame(paint); } }
          if (msg.stats) stats = msg.stats;
          if (msg.status) status.textContent = msg.status + "…";
          if (msg.error) failed = msg.error;
        }
      }
    } catch (e) { failed = e.name === "AbortError" ? "stopped" : e.message; }
    busy = null;
    clearInterval(tick);
    if (reply) {
      const entry = { role: "assistant", content: reply, stats };
      history.push(entry);
      finished = true;
      paint();
      if (failed) out.append(h("p", { class: "stopped" }, failed === "stopped" ? "Stopped." : `Cut off: ${failed}`));
      turn.append(replyMeta(entry));
      if (stats?.seconds && !failed) rememberSeconds(Math.round(stats.seconds - (stats.waited_seconds || 0)));  // the reply alone
    } else {
      history.pop();  // nothing came back: give the question back to edit or resend
      if (failed !== "stopped") { input.value = text; grow(); }
      draw();
      if (failed && failed !== "stopped") log.append(h("div", { class: "msg bot err" }, failed));
      scroll();
    }
    setBusy(false);
  }

  input.oninput = () => { grow(); setBusy(!!busy); };
  input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); } };
  const form = h("form", { class: "chat-input", onsubmit: e => { e.preventDefault(); busy ? busy.abort() : ask(input.value); } },
    input, send);
  const box = h("div", { class: "chat" },
    h("div", { class: "chat-head" }, h("div", { class: "spark" }, icon("sparkle", 17)),
      h("div", { class: "t" }, h("b", {}, title), where), save, fresh,
      onclose ? h("button", { class: "icon-btn", title: "Close", "aria-label": "Close", onclick: onclose }, icon("x", 16)) : null),
    log, form);
  draw();
  return box;
}

function facetList(counts, active, onpick, most = 12) {

// Fit scores are worked out in the background after each check for new jobs: say how far along, and offer to
// show the new ones (redrawing on its own would move cards while you read).
let scoringTimer = null;
function watchScoring(first, el) {
  clearTimeout(scoringTimer);
  const seen = first.done;
  const draw = s => {
    const fresh = s.done - seen;
    const show = fresh > 0 ? h("button", { class: "btn ghost", onclick: () => renderToday() },
      `Show ${fresh} new score${fresh === 1 ? "" : "s"}`) : null;
    el.classList.toggle("spin", s.running);
    if (s.running) fill(el, icon("refresh", 14), `Scoring fit in the background: ${s.left} to go`,
      s.current ? h("span", { class: "hint", title: s.current }, ` · now ${s.current}`) : null, show);
    else if (s.error) fill(el, h("span", { title: s.error }, "Background scoring stopped: " + s.error), show);
    else fill(el, show);
  };
  const poll = async () => {
    if (!el.isConnected) return;
    try { const s = await api("/api/scoring"); draw(s); if (s.running) scoringTimer = setTimeout(poll, 15000); }
    catch { /* the page may be restarting: the next render tries again */ }
  };
  draw(first);
  if (first.running) scoringTimer = setTimeout(poll, 15000);
}

// When the boards were last checked. The page checks them by itself every few hours (fetch_every in the
// watchlist) and the button checks now; a check that finishes while you read offers to show what it found.
let checkedTimer = null;
function watchChecked(first, el) {
  clearTimeout(checkedTimer);
  const seen = first.at;
  const hours = n => n === 24 ? "day" : n % 24 === 0 ? `${n / 24} days` : n === 1 ? "hour" : `${+n.toFixed(1)} hours`;
  const draw = c => {
    const failed = Object.keys(c.errors || {}), warned = Object.keys(c.warnings || {});
    const fresh = c.at !== seen && !c.running && c.new ? h("button", { class: "btn ghost", onclick: () => renderToday() },
      `Show ${c.new} new job${c.new === 1 ? "" : "s"}`) : null;
    el.classList.toggle("spin", c.running);
    fill(el, c.running ? icon("refresh", 14) : null,
      c.at ? `Boards checked ${ago(c.at)}` : "Boards not checked yet", c.running ? " · checking now…" : null,
      c.every_hours ? h("span", { class: "hint" }, ` · every ${hours(c.every_hours)}`) : null,
      c.times && c.times.length ? h("span", { class: "hint", title: c.next ? `Next check ${clock(c.next)}` : null },
        ` · at ${listed(c.times.map(t => clock("2000-01-01T" + t)))}`) : null,
      failed.length ? h("span", { class: "hint", title: failed.map(b => `${b}: ${c.errors[b]}`).join("\n") },
        ` · ${failed.length} failed`) : null,
      warned.length ? h("span", { class: "hint", title: warned.map(b => `${b}: ${c.warnings[b]}`).join("\n") },
        ` · ${warned.length} to look at`) : null,
      c.error ? h("span", { class: "hint", title: c.error }, " · the last scheduled check failed") : null, fresh);
  };
  const poll = async () => {
    if (!el.isConnected) return;
    try { const c = await api("/api/checked"); draw(c); checkedTimer = setTimeout(poll, c.running ? 5000 : 60000); }
    catch { /* the page may be restarting: the next render tries again */ }
  };
  draw(first);
  checkedTimer = setTimeout(poll, first.running ? 5000 : 60000);
}

// The inputs for each filter, filled from the saved ones.
function filterInputs(f) {
  const area = (v, placeholder) => { const t = h("textarea", { placeholder }); t.value = lines(v); return t; };
  const inp = {
    titles: area(f.titles, "engineer\ndeveloper"), exclude: area(f.exclude_titles, "intern\nmanager"),
    excludeText: area(f.exclude_text, "red team\nGPU kernels?"),
    locations: area(f.locations, "remote\nNew York"),
    country: h("select", {}, h("option", { value: "US" }, "Remote jobs open in the US"),
      h("option", { value: "any" }, "Remote jobs anywhere")),
    home: h("input", { type: "text", placeholder: "e.g. NC", maxlength: 30 }),
    minPay: h("input", { type: "number", min: 0, step: 5000, placeholder: "e.g. 150000" }),
    requirePay: h("input", { type: "checkbox" }),
    maxAge: h("input", { type: "number", min: 1, placeholder: "e.g. 30" }),
    minFit: h("input", { type: "range", min: 0, max: 100, step: 5, "aria-label": "Minimum fit score" }),
    fitOut: h("output", {}),
  };
  const showFit = () => { inp.fitOut.textContent = Number(inp.minFit.value) ? `≥ ${inp.minFit.value}` : "off"; };
  inp.minFit.addEventListener("input", showFit);
  inp.country.value = (f.remote_country || "US").toLowerCase() === "any" ? "any" : "US";
  inp.home.value = f.home_state || "";
  inp.minPay.value = f.min_salary ?? "";
  inp.requirePay.checked = !!f.require_salary;
  inp.maxAge.value = f.max_age_days ?? "";
  inp.minFit.value = f.min_fit || 0;
  showFit();
  return inp;
}
function filterValues(inp) {
  return { titles: unlines(inp.titles.value), exclude_titles: unlines(inp.exclude.value),
    exclude_text: unlines(inp.excludeText.value),
    locations: placeLines(inp.locations.value), remote_country: inp.country.value,
    home_state: inp.home.value.trim() || null,
    min_salary: inp.minPay.value ? Number(inp.minPay.value) : null, require_salary: inp.requirePay.checked || null,
    max_age_days: inp.maxAge.value ? Number(inp.maxAge.value) : null,
    min_fit: Number(inp.minFit.value) || null };
}
// The saved filters with these keys replaced; others (exclude_departments, flags...) are kept as they are.
function mergeFilters(f, values, keys = Object.keys(values)) {
  const out = { ...f };
  for (const k of keys) out[k] = values[k];
  for (const [k, v] of Object.entries(out)) if (v === null || v === undefined || (Array.isArray(v) && !v.length)) delete out[k];
  if (String(out.remote_country || "").toUpperCase() === "US") delete out.remote_country;
  return out;
}

function money(n) { return n >= 1e6 ? `$${+(n / 1e6).toFixed(2)}M` : `$${Math.round(n / 1000)}K`; }
// A title pattern as words, for the bar: "\b(intern|new grad)\b" reads "intern, new grad". The tooltip keeps it as is.
function readable(patterns) {
  return patterns.flatMap(p => p.replace(/\\b/g, "").replace(/\\w[*+]/g, "…").replace(/\[[^\]]*\][?*+]?/g, "")
    .replace(/(^|[^\\])[()^$]/g, "$1").replace(/\\(.)/g, "$1").split("|")).map(s => s.trim()).filter(Boolean);
}
function some(list, most = 3) {
  return list.slice(0, most).join(", ") + (list.length > most ? ` +${list.length - most} more` : "");
}

// Why a job was hidden, as rejection() in filters.py names it, and which part of the bar changes that filter.
const HIDDEN = {
  title: { label: "title", part: "titles", why: "Their titles contain none of your job titles." },
  excluded: { label: "excluded", part: "exclude",
    why: "Their titles or postings contain something you leave out." },
  department: { label: "department", part: null,
    why: "Their department is one you leave out (exclude_departments in the watchlist file)." },
  place: { label: "place", part: "places",
    why: "Not in one of your places, or remote somewhere else (or only in states other than yours)." },
  pay: { label: "pay", part: "pay",
    why: "Their listed pay tops out below your minimum, or they don't list pay and you want ones that do." },
  age: { label: "age", part: "age", why: "Posted longer ago than you want." },
  fit: { label: "fit", part: "fit", why: "Their fit score is below your minimum. Jobs not scored yet still show." },
};

let openFilter = () => {};  // opens a part of Today's filter bar: set by filterBar

// Today's filter bar: "Titles: engineer, architect · Places: Remote (US), Denver · Pay ≥ $180K · Posted within
// 45 days · Edit", each part opening a small editor in place. Saving redraws Today with the new filters.
function filterBar(hidden) {
  const f = settings.filters || {};
  const bar = h("div", { class: "fbar", role: "group", "aria-label": "Filters" });
  const remote = ((f.remote_country || "US").toLowerCase() === "any" ? "Remote (anywhere" : "Remote (US") +
    (f.home_state ? `, open to ${f.home_state})` : ")");
  const places = (f.locations || []).map(p => p.toLowerCase() === "remote" ? remote : p);
  const pay = [f.min_salary ? `≥ ${money(f.min_salary)}` : f.require_salary ? "" : "any",
    f.require_salary ? "listed only" : ""].filter(Boolean).join(", ");
  const parts = [
    ["titles", "Titles", (f.titles || []).length ? some(readable(f.titles)) : "any title", (f.titles || []).join("\n")],
    (f.exclude_titles || []).length
      ? ["exclude", "Not", some(readable(f.exclude_titles), 4), f.exclude_titles.join("\n")] : null,
    (f.exclude_text || []).length
      ? ["exclude_text", "Not in text", some(readable(f.exclude_text), 3), f.exclude_text.join("\n")] : null,
    ["places", "Places", places.length ? some(places, 4) : "anywhere", places.join("\n")],
    ["pay", "Pay", pay],
    ["age", "Posted", f.max_age_days ? `within ${f.max_age_days} days` : "any time"],
    ["fit", "Fit", f.min_fit ? `≥ ${f.min_fit}` : "any"],
  ].filter(Boolean);
  const buttons = {};
  let pop = null;
  const close = () => {
    if (!pop) return;
    pop.remove(); pop = null;
    for (const b of Object.values(buttons)) b.classList.remove("on");
    document.removeEventListener("pointerdown", outside, true);
  };
  const outside = e => { if (pop && !pop.contains(e.target) && !e.target.closest(".fpart, .fbar .edit")) close(); };
  const open = which => {
    const again = pop && pop.dataset.which === which;
    close();
    if (again) return;
    const group = which === "exclude" || which === "exclude_text" ? "titles" : which;
    const groups = group === "all" ? Object.keys(FILTER_GROUPS) : [group];
    const inp = filterInputs(f), msg = h("span", { class: "msg" });
    const saveBtn = h("button", { class: "btn primary" }, icon("check", 14), "Save");
    const save = async () => {
      const keys = groups.flatMap(g => FILTER_GROUPS[g].keys);
      saveBtn.disabled = true; msg.textContent = "Saving…"; msg.className = "msg muted";
      try {
        await api("/api/settings", { filters: mergeFilters(f, filterValues(inp), keys) });
        settings = await api("/api/settings");
        close();
        toast("Filters saved. Today shows what they match now.");
        await render();
      } catch (e) { saveBtn.disabled = false; msg.textContent = e.message; msg.className = "msg error"; }
    };
    saveBtn.onclick = save;
    const body = group === "all"
      ? h("div", { class: "grid" }, groups.map(g => h("div", {}, FILTER_GROUPS[g].fields(inp))))
      : FILTER_GROUPS[group].fields(inp);
    pop = h("div", { class: "fpop" + (group === "all" ? " all" : ""), role: "dialog", "aria-label": "Edit filters" },
      body, h("div", { class: "foot" }, msg,
        h("button", { class: "btn ghost", onclick: close }, "Cancel"), saveBtn));
    pop.dataset.which = which;
    pop.addEventListener("keydown", e => {
      if (e.key === "Escape") { e.stopPropagation(); close(); buttons[which] && buttons[which].focus(); }
      if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); save(); }
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
    });
    bar.append(pop);
    const anchor = buttons[which];
    if (anchor) {
      anchor.classList.add("on");
      pop.style.left = Math.max(0, Math.min(anchor.offsetLeft, bar.clientWidth - pop.offsetWidth)) + "px";
    } else pop.style.left = Math.max(0, bar.clientWidth - pop.offsetWidth) + "px";
    document.addEventListener("pointerdown", outside, true);
    const first = which === "exclude" ? inp.exclude : which === "exclude_text" ? inp.excludeText : pop.querySelector("textarea, input");
    if (first) first.focus();
  };
  openFilter = which => { bar.scrollIntoView({ block: "nearest" }); open(which); };
  fill(bar, icon("sparkle", 15), parts.map(([which, k, v, full], i) => {
    const b = buttons[which] = h("button", { class: "fpart" + (/^any/.test(v) ? " off" : ""),
      title: full ? `${k}:\n${full}\n\nClick to change` : "Click to change", "aria-haspopup": "dialog",
      onclick: () => open(which) }, h("span", { class: "k" }, k + (k === "Pay" || k === "Posted" || k === "Fit" ? "" : ":")),
      h("span", { class: "v" }, v));
    return [i ? h("span", { class: "sep" }, "·") : null, b];
  }), buttons.all = h("button", { class: "btn ghost edit", onclick: () => open("all") }, icon("pencil", 13), "Edit"),
  hiddenLine(hidden), brokenLine());
  return bar;
}

// "38 roles hidden by your filters: 20 title · 9 place · 5 pay", each a way to peek at those jobs.
function hiddenLine(hidden) {
  if (!hidden) return null;
  if (!hidden.total) return h("div", { class: "fline" }, "Your filters hide nothing right now.");
  return h("div", { class: "fline" }, h("span", {}, h("b", {}, hidden.total.toLocaleString()),
    ` role${hidden.total === 1 ? "" : "s"} hidden by your filters:`),
    Object.entries(hidden.by).map(([kind, n]) => h("button", { class: "hchip", title: `See the ${n} hidden by ${HIDDEN[kind].label}`,
      onclick: () => openHidden(kind) }, h("span", { class: "n" }, n.toLocaleString()), HIDDEN[kind].label)));
}

// Boards the running jobwatch can't read (a newer version's source): they're skipped, and Settings removes them.
function brokenLine() {
  const bad = settings.companies.filter(c => c.error);
  if (!bad.length) return null;
  return h("div", { class: "fline bad", title: bad[0].error }, h("span", {},
    h("b", {}, `${bad.length} board${bad.length === 1 ? "" : "s"} skipped: `),
    bad.map(c => `${c.name || c.board} (${c.source}:${c.board})`).join(", "),
    ` ${bad.length === 1 ? "uses a source" : "use sources"} this version of jobwatch can't read. Update jobwatch, or remove ${bad.length === 1 ? "it" : "them"} in `,
    h("a", { href: "#settings", onclick: e => { e.preventDefault(); go("settings"); } }, "Settings"), "."));
}

// A peek at the jobs one filter hides, with a way to change that filter.
async function openHidden(kind) {
  const overlay = document.getElementById("overlay"), dialog = document.getElementById("dialog");
  const info = HIDDEN[kind];
  dialog.classList.remove("with-chat", "co-page");
  dialog.replaceChildren(h("div", { class: "muted" }, "Loading…"));
  overlay.style.display = "flex";
  try {
    const d = await api("/api/hidden?kind=" + encodeURIComponent(kind));
    const n = d.by[kind] || 0;
    fill(dialog,
      h("div", { class: "row", style: "align-items:flex-start;flex-wrap:nowrap" },
        h("div", { style: "flex:1" }, h("h2", {}, `${n.toLocaleString()} hidden by ${info.label}`),
          h("p", { class: "sub small" }, info.why)),
        info.part ? h("button", { class: "btn", onclick: () => { closeDetails(); openFilter(info.part); } },
          icon("pencil", 13), "Change this filter") : null,
        h("button", { class: "icon-btn", "aria-label": "Close", onclick: closeDetails }, icon("x", 16))),
      h("div", { class: "hidden-list", style: "margin-top:10px" }, d.jobs.map(j => h("div", { class: "list-item" },
        h("div", { style: "flex:1;min-width:0" }, link(j.url, j.title, "title"),
          h("div", { class: "meta" }, h("b", {}, j.company),
            [j.locations.slice(0, 3).join("; "), j.pay ? h("span", { class: "pay" }, j.pay) : null, age(j.age_days)]
              .filter(Boolean).map(x => [h("span", { class: "sep" }, "·"), x]))),
        h("span", { class: "chip why" }, j.why)))),
      d.more ? h("p", { class: "small muted" }, `and ${d.more.toLocaleString()} more, newest shown first`) : null);
  } catch (e) { showError(dialog, e); }
}

// Applications sent today against the watchlist's pace: "Applied today: 1 of 3". Advice only: nothing is held
// back once it's met. Nothing shows when the pace is off (pace.daily 0). "I applied" redraws it.
let drawPace = () => {};
function paceLine(el, p) {
  const draw = p => {
    el.classList.toggle("met", !!(p && p.met));
    fill(el, p ? h("span", { title: `Your pace: ${p.daily} a day, ${p.max} at most (Settings)` }, p.line) : null);
  };
  drawPace = async () => {
    try { if (el.isConnected) draw((await api("/api/pace")).pace); } catch { /* a hint, not the page */ }
  };
  draw(p);
  return el;
}

// all: every matching job, paged, rather than today's picks (the top display.today in the order picked).
// where, fit, pay: the quick narrowing (see quickNarrow); "any" and 0 mean off.
const todayView = { q: "", sort: remembered("today.sort", "fit"), company: "", kws: new Set(), where: "any", fit: 0, pay: 0, page: 1, all: false };
const SORTED = { fit: "best fit first", new: "newest first", pay: "top pay first", worth: "most worth it first" };
// "Worth it": the Comps tab's weighted score (career, pay, fit, company health); cards show it while that order is on.
let worthShown = false;
const byWorth = (a, b) => (b.worth?.score ?? -1) - (a.worth?.score ?? -1);
// A part with nothing to go on shows "?", not its neutral 50, so an unknown doesn't read as middling.
const partText = ([k, p]) => p.known === false ? `${k} ? (${p.input}, counts as ${p.score})` : `${k} ${p.score} (${p.input})`;
function worthChip(job) {
  if (!worthShown || !job.worth) return null;
  const parts = Object.entries(job.worth.parts).map(partText).join("\n");
  return h("span", { class: "chip hit", title: "Worth it, by the Comps tab's rules:\n" + parts }, `worth ${job.worth.score}`);
}

// Today's quick narrowing, on top of the saved filters: how the job is worked, a lowest fit score, a lowest top of
// the posted pay. A job with no location, no score yet or no listed pay isn't hidden by that part, the same as the
// saved filters treat them.
function quickNarrow(j, v) {
  const where = j.where || [];  // a server from before `where` sends none
  return (v.where === "any" || !where.length || where.includes(v.where)) &&
    (!v.fit || !j.fit || j.fit.score >= v.fit) &&
    (!v.pay || j.salary_max == null || j.salary_max >= v.pay);
}
let todayJobs = [], drawToday = () => {};

async function renderToday() {
  if (!settings.companies.length) return renderWelcome();
  // What the filters hide is a hint, not the page: Today still opens if it can't be counted.
  const [d, hidden] = await Promise.all([api("/api/digest"), api("/api/hidden").catch(() => null)]);
  todayJobs = d.jobs;
  const out = Object.values(d.rejected).reduce((a, b) => a + b, 0);
  const fresh = d.jobs.filter(j => j.status === "new").length, strong = d.jobs.filter(j => j.fit && j.fit.score >= 75).length;
  const picks = d.picks && d.jobs.length > d.picks ? d.picks : 0;  // Today's picks lead when there are more matches
  const byCompany = {}, byKw = {};
  for (const j of d.jobs) {
    byCompany[j.company] = (byCompany[j.company] || 0) + 1;
    for (const k of j.keywords) byKw[k] = (byKw[k] || 0) + 1;
  }
  const v = todayView;
  const list = h("div", { class: "cards grid-cards" }), showing = h("div", { class: "showing" }), pager = h("div", {});
  const scoring = h("div", { class: "scoring" }), checked = h("div", { class: "scoring checked" });
  const search = h("input", { type: "search", placeholder: "Search titles and companies" });
  search.value = v.q;
  search.oninput = () => { v.q = search.value; drawToday(); };
  const kwChips = h("div", { class: "chips" });
  const drawKws = () => fill(kwChips, Object.entries(byKw).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
    h("button", { class: "chip toggle" + (v.kws.has(k) ? " on" : ""), title: `${n} jobs`,
      onclick: () => { v.kws.has(k) ? v.kws.delete(k) : v.kws.add(k); drawKws(); drawToday(); } }, k)));
  drawKws();
  const companies = facetList(byCompany, () => v.company, name => { v.company = name; drawToday(); });
  const narrow = h("div", {});
  const drawNarrow = () => fill(narrow,
    h("div", { class: "hint" }, "Where"),
    segmented([["any", "Any"], ["remote", "Remote"], ["onsite", "On-site or hybrid"]], v.where, k => { v.where = k; drawToday(); }),
    h("div", { class: "hint", style: "margin-top:8px", title: "Jobs not scored yet still show" }, "Fit score"),
    segmented([[0, "Any"], [60, "60+"], [70, "70+"], [80, "80+"]], v.fit, k => { v.fit = k; drawToday(); }),
    h("div", { class: "hint", style: "margin-top:8px", title: "The top of the posted range; jobs that don't list pay still show" }, "Top of posted pay"),
    segmented([[0, "Any"], [150000, "$150K+"], [200000, "$200K+"], [250000, "$250K+"], [300000, "$300K+"]], v.pay,
      k => { v.pay = k; drawToday(); }));
  drawNarrow();
  const clear = () => {
    Object.assign(v, { q: "", company: "", where: "any", fit: 0, pay: 0 });
    v.kws.clear(); search.value = ""; drawKws(); drawNarrow(); companies.redraw(); drawToday();
  };

  drawToday = () => {
    const q = v.q.trim().toLowerCase();
    let jobs = todayJobs.filter(j => (!q || `${j.title} ${j.company}`.toLowerCase().includes(q)) &&
      (!v.company || j.company === v.company) && [...v.kws].every(k => j.keywords.includes(k)) && quickNarrow(j, v));
    if (v.sort === "new") jobs = [...jobs].sort((a, b) => (a.age_days ?? 1e4) - (b.age_days ?? 1e4));
    if (v.sort === "pay") jobs = [...jobs].sort((a, b) => (b.salary_max ?? -1) - (a.salary_max ?? -1));
    if (v.sort === "worth") jobs = [...jobs].sort(byWorth);
    worthShown = v.sort === "worth";
    const narrowed = v.q || v.company || v.kws.size || v.where !== "any" || v.fit || v.pay;
    // Today's picks: the top few in this order. A search, company, keyword or quick narrowing looks through every match.
    const top = d.picks && jobs.length > d.picks;
    if (top && !narrowed && !v.all) {
      fill(showing, `Today's ${d.picks} picks, ${SORTED[v.sort]}, of ${jobs.length} matching jobs`);
      fill(list, jobs.slice(0, d.picks).map((j, i) => todayCard(j, d.can_score, i)));
      fill(pager, h("div", { class: "more-all" }, h("button", { class: "btn", onclick: () => { v.all = true; drawToday(); } },
        `Show all ${jobs.length} matching jobs`)));
      return;
    }
    const pg = paged(jobs, v, JSON.stringify([v.q, v.company, [...v.kws], v.where, v.fit, v.pay, v.sort]), drawToday);
    const back = top && !narrowed ? h("button", { class: "btn ghost", onclick: () => {
      v.all = false; drawToday(); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); } }, `Back to today's ${d.picks} picks`) : null;
    fill(showing, pg.range ? `Showing ${pg.range}` + (narrowed ? ` (${todayJobs.length} in all)` : "")
      : `Showing ${jobs.length} of ${todayJobs.length}`, narrowed ? h("button", { class: "btn ghost", onclick: clear }, "Clear filters") : back);
    fill(list, jobs.length ? pg.items.map((j, i) => todayCard(j, d.can_score, i))
      : emptyState(todayJobs.length ? "No jobs match these filters. Loosen one and see what turns up."
        : "Nothing to review right now. Press “Check for new jobs”, or widen the filters above: new roles open every day.",
        v.q.trim() ? elsewhere(v.q) : null));
    fill(pager, pg.nav);
  };

  put(
    pagehead("Today", todayLine(greeting(new Date().getHours()), settings.companies.length)),
    filterBar(hidden),
    layout([
      hero([picks ? [picks, "picks for today", "lead wide"] : null, [d.jobs.length, picks ? "matching" : "matching jobs", picks ? "" : "lead"],
        [fresh, "new since last look"], [strong, "strong fits (75+)", strong ? "good" : ""], [out, "hidden by filters"]].filter(Boolean)),
      panel(null, search, h("div", { style: "margin-top:10px" },
        segmented([["fit", "Best fit"], ["new", "Newest"], ["pay", "Top pay"], ["worth", "Worth it"]], v.sort,
          k => { v.sort = k; remember("today.sort", k); drawToday(); }))),
      panel("Narrow down", narrow),
      panel("Companies", companies),
      Object.keys(byKw).length ? panel("Keywords", kwChips) : null,
      toWatchPanel(),
    ], [h("div", { class: "status-row" }, paceLine(h("div", { class: "pace" }), d.pace), checked, scoring, showing), list, pager]));
  drawToday();
  if (d.checked) watchChecked(d.checked, checked);
  if (d.scoring) watchScoring(d.scoring, scoring);
  watchPay(todayJobs);
}

// Companies whose jobs come in from alerts (or Add a job, or HN posts) while their board isn't watched: watch one, or
// dismiss it.
// It fills in after Today is drawn: what's known first, then again once any boards not looked for yet are.
function toWatchPanel() {
  const body = h("div", {}), el = panel("Companies to watch", body);
  el.style.display = "none";
  const draw = list => {
    el.style.display = list.length ? "" : "none";
    fill(body, list.map(s => {
      const row = h("div", { class: "to-watch" },
        h("div", { class: "top" }, h("b", {}, s.company),
          h("span", { class: "c", title: `last one ${s.last_seen}` }, `${s.matching_jobs} job${s.matching_jobs === 1 ? "" : "s"}`)),
        h("div", { class: "hint" }, "e.g. " + s.sample_titles.slice(0, 2).join(" · ")),
        h("div", { class: "hint" }, s.board
          ? [link(s.careers, s.board), s.board_found === "name" ? " (found by name: check it's theirs)" : null]
          : s.looked_up ? "No board found by name: try a link to its careers page in Settings." : "Looking for its board…"),
        h("div", { class: "acts" },
          s.board ? h("button", { class: "btn primary", title: `Watch ${s.board}`, onclick: () => act("add", s, row) }, "Add") : null,
          h("button", { class: "btn ghost", title: "Don't suggest it again", onclick: () => act("dismiss", s, row) }, "Dismiss")));
      return row;
    }));
  };
  const act = async (what, s, row) => {
    for (const b of row.querySelectorAll("button")) b.disabled = true;
    try {
      await api("/api/suggestions/" + what, { company: s.company });
      if (what === "add") {
        settings = await api("/api/settings");
        toast(`Watching ${s.company}. Press “Check for new jobs” to see its roles.`);
      } else toast(`${s.company} won't be suggested again.`);
      draw(await load(false));
    } catch (e) {
      toast(e.message);
      for (const b of row.querySelectorAll("button")) b.disabled = false;
    }
  };
  const load = async lookup => (await api("/api/suggestions" + (lookup ? "?lookup=1" : ""))).companies;
  (async () => {
    try {
      const list = await load(false);
      draw(list);
      if (list.some(s => !s.looked_up)) draw(await load(true));
    } catch { /* a suggestion, not the page: Today works without it */ }
  })();
  return el;
}

// -- first run: "Tell me about yourself", then the jobs you want, the companies to watch and the optional rest.
// Each step saves as you go and can be skipped; the last one ends on Today. A watchlist with no companies opens
// here (renderWelcome); once finished or skipped, Today only offers a way back to the companies step.

const ONBOARD_STEPS = ["About you", "Jobs you want", "Companies", "The rest"];
const onboarding = { step: 0 };

function renderWelcome() {
  if (remembered("onboarded", "")) {
    return put(h("div", { class: "card welcome" },
      h("h2", {}, "Nothing to watch yet"),
      h("p", {}, "jobwatch looks at the careers pages of companies you choose. Add a few and it starts looking."),
      h("div", { class: "row" },
        h("button", { class: "btn primary", onclick: () => { onboarding.step = 2; renderOnboarding(); } }, "Add companies", icon("arrow", 14)),
        h("button", { class: "btn", onclick: () => go("settings") }, "Open Settings"))));
  }
  renderOnboarding();
}

function renderOnboarding() {
  const steps = [onboardAbout, onboardJobs, onboardCompanies, onboardRest], n = onboarding.step, last = steps.length - 1;
  const move = to => { onboarding.step = Math.max(0, Math.min(last, to)); renderOnboarding(); };
  const finish = async () => {
    remember("onboarded", "1");
    try { settings = await api("/api/settings"); } catch { /* the tabs read it again */ }
    go("today");
  };
  const ctx = { step: n, last: n === last, back: () => move(n - 1), next: () => n === last ? finish() : move(n + 1) };
  put(h("div", { class: "onboard" },
    h("div", { class: "card welcome" },
      h("h2", {}, n === 0 ? "Welcome to jobwatch" : ONBOARD_STEPS[n]),
      h("p", {}, n === 0 ? "jobwatch checks the careers pages of companies you choose and shows you the new jobs that match " +
        "what you're looking for. It runs on your computer, and it never applies for you. A few questions first; " +
        "every one can wait." : `Step ${n + 1} of ${steps.length}. Everything is saved as you go, and you can change it later in Settings.`)),
    steps[n](ctx)));
}

// Back, Save and continue, and Skip for now under a step. save() writes what the step asked; a failure shows
// beside the buttons and stays on the step.
function onboardActions(ctx, save) {
  const msg = h("span", { class: "small muted", role: "status" });
  const next = h("button", { class: "btn primary" }, ctx.last ? "Save and go to Today" : "Save and continue", icon("arrow", 14));
  next.onclick = async () => {
    next.disabled = true; msg.textContent = "Saving…"; msg.className = "small muted";
    try { await save(); settings = await api("/api/settings"); ctx.next(); }
    catch (e) { msg.textContent = e.message; msg.className = "small error"; next.disabled = false; }

// "How do you want to work?" and filters.locations, both ways: remote only is ["remote"]; hybrid or on-site is the

const WORK_STYLES = [["remote", "Remote only"], ["near", "Hybrid or on-site near me"], ["either", "Either"]];
function workStyle(locations) {
  const remote = locations.some(l => l.toLowerCase() === "remote"), places = locations.length - (remote ? 1 : 0);

function workLocations(how, places) {
  if (how === "near" && !places.length) throw new Error("Name a city or state for hybrid or on-site jobs.");
  return [...(how === "remote" ? [] : places), ...(how === "near" ? [] : ["remote"])];
}

// Where the AI runs (fit scores; the chat and title suggestions too, except on agy): each choice with what it
// still needs on this computer (from /api/ai), a test call, and for Claude an API key kept in the macOS keychain.
// The fallbacks are tried in AI_ORDER when the chosen one can't score. values() gives scoring's backend and fallback.
const AI_ORDER = ["claude", "agy", "local"];
function aiSetup(s) {
  const scoring = s.scoring || {}, on = new Set([].concat(scoring.fallback || []));
  // the chosen one lives in a select that isn't shown, so Settings can read and watch it like any other input
  const backend = choice(AI_ORDER.map(b => [b, AI_LOOK[b].name]), scoring.backend || s.defaults.scoring.backend);
  const pick = b => { if (backend.value === b) return; backend.value = b; backend.dispatchEvent(new Event("change")); };
  const tiles = h("div", { class: "ai-tiles", role: "radiogroup", "aria-label": "Where fit scores run" });
  const chain = h("div", { class: "ai-chain" });
  let info = null;
  const ready = b => !info || info[b].ready;

  const drawChain = () => {
    const rest = AI_ORDER.filter(b => b !== backend.value);
    let n = 1;
    const link = (b, main) => {
      const used = main || on.has(b);
      const el = h("button", { type: "button", class: "link" + (main ? " main" : used ? "" : " off"),
        title: main ? "Tried first: pick another tile to change it" : used ? "Click to skip it" : "Click to try it next",
        "aria-pressed": String(used) },
        used ? h("span", { class: "n" }, String(n++)) : null, AI_LOOK[b].name,
        !main && used && !ready(b) ? h("span", { class: "n" }, "· not set up") : null, used ? icon("check", 12) : null);
      if (!main) el.onclick = () => { on.has(b) ? on.delete(b) : on.add(b); drawChain(); };
      return el;
    };
    const used = rest.filter(b => on.has(b)), skipped = rest.filter(b => !on.has(b));
    fill(chain, h("div", { class: "title" }, "If it can't score, try the next one"),
      [backend.value, ...used].map((b, i) => [i ? h("span", { class: "then" }, icon("arrow", 14)) : null, link(b, i === 0)]),
      skipped.length ? [h("span", { class: "muted small" }, "skipped:"), skipped.map(b => link(b, false))] : null,
      h("div", { class: "cap" }, "When the first has no key, no credit or no quota left. Those jobs are scored again by " +
        "the first one later. The chat and title suggestions use Claude or this Mac (Settings › Chat)."));
  };

  const keyForm = st => {
    const key = h("input", { type: "password", placeholder: "Paste your API key (sk-ant-…)", autocomplete: "off",
      "aria-label": "Anthropic API key" });
    const msg = h("span", { class: "small muted", role: "status" });
    const save = h("button", { class: "btn primary", type: "button" }, icon("lock", 13), "Save");
    save.onclick = async () => {
      save.disabled = true; msg.className = "small muted"; msg.textContent = "Saving to your keychain…";
      try {
        const r = await api("/api/ai/key", { key: key.value, keychain: st.keychain });
        key.value = ""; scoring.keychain = r.keychain;
        settings.scoring = { ...(settings.scoring || {}), keychain: r.keychain };
        await refresh();
      } catch (e) { msg.className = "small error"; msg.textContent = e.message; save.disabled = false; }
    };
    return h("div", { class: "ai-key" }, h("div", { class: "pair" }, key, save), msg,
      h("div", { class: "help" }, `Kept in your macOS keychain (${st.keychain}), never in the settings file.`));
  };
  const steps = (b, st) => {
    const items = st.steps.map(p => h("li", {}, h("div", {}, p.text,
      p.link ? [" ", h("a", { href: p.link, target: "_blank", rel: "noopener" }, "Open ↗")] : null,
      p.command ? h("div", { class: "cmd" }, h("code", {}, p.command), copyButton(() => p.command)) : null)));
    if (b === "claude" && st.can_save_key && !st.key) items.push(h("li", {}, keyForm(st)));
    return items.length ? h("ol", { class: "ai-steps" }, items) : null;
  };
  const meters = b => h("div", { class: "meters" }, AI_METERS.map(([label, k]) => [h("span", {}, label),
    h("span", { class: "bars", title: `${AI_LOOK[b][k]} of 3` }, [1, 2, 3].map(i => h("i", { class: i <= AI_LOOK[b][k] ? "f" : "" })))]));

  const tile = b => {
    const st = info && info[b], chosen = backend.value === b;
    const state = !st ? h("span", { class: "state wait" }, "Checking…")
      : st.ready ? h("span", { class: "state ready" }, icon("check", 12), "Ready")
        : h("span", { class: "state setup" }, "Set up");
    const result = h("span", { class: "muted", role: "status" });
    const test = h("button", { class: "btn", type: "button" }, icon("sparkle", 13), "Test");
    test.disabled = !st || !st.ready;
    test.onclick = async () => {
      test.disabled = true; result.className = "muted";
      result.textContent = b === "local" ? "Loading the model (a minute or more the first time)…" : "Asking the model…";
      try {
        const r = await api("/api/ai/test", { backend: b,
          model: b === backend.value ? scoring.model || "" : b === "agy" ? scoring.agy_model || "" : "" });
        result.className = r.ok ? "done-ok" : "error";
        result.textContent = r.ok ? `Answered in ${r.seconds}s · ${r.model.split("/").pop()}` : r.error;
      } catch (e) { result.className = "error"; result.textContent = e.message; }
      test.disabled = false;
    };
    let key = null;
    if (st && b === "claude" && st.key) {
      const holder = h("div", {});
      const replace = h("button", { class: "btn ghost", type: "button" }, "Replace");
      replace.onclick = () => { fill(holder, keyForm(st)); replace.remove(); };
      key = h("div", {}, h("div", { class: "foot" }, icon("lock", 13), h("span", { class: "muted" },
        st.key === "keychain" ? `Key in your keychain (${st.keychain})`
          : st.key === "command" ? "Key from scoring.key_command" : "Key from ANTHROPIC_API_KEY"),
        st.can_save_key ? replace : null), holder);
    }
    const el = h("div", { class: "ai-tile" + (chosen ? " on" : ""), role: "radio", tabindex: "0",
      "aria-checked": String(chosen) },
      chosen ? h("span", { class: "main-tag" }, "Scores first") : null,
      h("div", { class: "top" }, h("span", { class: "orb" }, icon(AI_LOOK[b].icon, 20)),
        h("div", {}, h("div", { class: "name" }, AI_LOOK[b].name), h("div", { class: "muted small" }, AI_LOOK[b].tag)), state),
      meters(b),
      h("div", { class: "about" }, st ? st.about : ""),
      st ? steps(b, st) : null,
      key,
      h("div", { class: "foot" }, test, result));
    // a click on the tile picks it; one on its buttons, links or the key box doesn't
    el.onclick = e => { if (!e.target.closest("button, a, input, code")) pick(b); };
    el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); pick(b); } };
    return el;
  };
  const draw = () => { fill(tiles, AI_ORDER.map(tile)); drawChain(); };
  const refresh = async () => {
    try { info = await api("/api/ai"); }
    catch (e) { fill(tiles, h("p", { class: "small error" }, e.message)); return; }
    draw();
  };
  backend.addEventListener("change", draw);
  draw(); refresh();
  return { el: h("div", {}, tiles, chain), select: backend,
    values: () => ({ backend: backend.value, keychain: scoring.keychain || null,  // a key saved here names its item
      fallback: AI_ORDER.filter(b => b !== backend.value && on.has(b)) }) };
}

  system_design: "System design", panel: "Panel / onsite loop", executive: "VP / exec round", hr: "HR round",
  informal: "Informal chat", offer_call: "Offer call" };

function daysAgo(day, today) {
  if (!day) return "";
  const n = Math.round((Date.parse(today) - Date.parse(day)) / 86400000);
  return n <= 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago`;
}

// A follow-up due that isn't from an application quiet for so long that it only clutters the list (see quiet.py).
const freshDue = a => a.due && !(a.quiet && a.quiet.long);

const appView = { stage: "", q: "", view: remembered("apps.view", "cards"), sort: "next", dir: 1, page: 1 };

// A per-browser preference; storage can be blocked (private windows), so it's never required.
function remembered(key, fallback) {
  try { return localStorage.getItem("jobwatch." + key) || fallback; } catch { return fallback; }
}
function remember(key, value) {
  try { localStorage.setItem("jobwatch." + key, value); } catch { /* not kept: fine */ }
}

// Settings is split into sub tabs; every card stays in the page (hidden, not removed) so Save reads them all.
const SET_GROUPS = [
  { id: "search", label: "Your search", cards: ["goals", "companies", "filters", "keywords"] },
  { id: "today", label: "Today & display", cards: ["today", "display"] },
  { id: "ai", label: "AI & fit scores", cards: ["resume", "prompts", "chat"] },
  { id: "people", label: "People & pay", cards: ["people", "pay"] },
  { id: "alerts", label: "Alerts & skills", cards: ["alerts", "suggestions", "skills"] },
];
// The sub tab a name points at: a tab id ("ai"), a card id ("pay") or a card's anchor ("set-pay"); null if none.
function settingsGroupOf(name) {
  const key = String(name || "").replace(/^set-/, "");
  const g = SET_GROUPS.find(g => g.id === key || g.cards.includes(key));
  return g ? g.id : null;
}
// Where a URL hash goes: "#settings/ai" is Settings on its AI tab, and an old card anchor ("#set-pay") opens the tab holding it.
function pageOfHash(hash, tabs) {
  const [base, sub] = String(hash || "").replace(/^#/, "").split("/");
  if (tabs.includes(base)) return { tab: base, sub: base === "settings" ? settingsGroupOf(sub) : null };
  if (base.startsWith("set-") && settingsGroupOf(base)) return { tab: "settings", sub: settingsGroupOf(base), card: base };
  return null;
}

// One page of a long list, and the controls to move between pages. `state.page` survives redraws; a new
// `filterKey` (the search, filters and sort in use) starts again at page 1. How many per page is kept per browser.
const PER_PAGE = [12, 24, 48, 96];
function paged(items, state, filterKey, redraw) {
  const per = PER_PAGE.includes(Number(remembered("perPage", ""))) ? Number(remembered("perPage", "")) : PER_PAGE[0];
  if (state.filterKey !== filterKey) { state.filterKey = filterKey; state.page = 1; }
  const pages = Math.max(1, Math.ceil(items.length / per));
  state.page = Math.min(Math.max(1, state.page || 1), pages);
  const start = (state.page - 1) * per, end = Math.min(start + per, items.length);
  const go = n => { state.page = n; redraw(); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); };
  const nums = [];
  for (let n = 1; n <= pages; n++) {
    if (n === 1 || n === pages || Math.abs(n - state.page) <= 2) nums.push(n);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  const perSelect = h("select", { "aria-label": "Per page" }, PER_PAGE.map(n => h("option", { value: n }, n)));
  perSelect.value = per;
  perSelect.onchange = () => { remember("perPage", perSelect.value); state.page = Math.floor(start / Number(perSelect.value)) + 1; redraw(); };
  return {
    items: items.slice(start, end),
    range: items.length > per ? `${start + 1}–${end} of ${items.length}` : null,
    nav: items.length <= PER_PAGE[0] ? null : h("div", { class: "pager", role: "navigation", "aria-label": "Pages" },
      pages > 1 ? [
        h("button", { class: "btn ghost", disabled: state.page === 1, onclick: () => go(state.page - 1) }, "← Previous"),
        nums.map(n => n === "…" ? h("span", { class: "gap" }, "…")
          : h("button", { class: "pg" + (n === state.page ? " on" : ""), "aria-current": n === state.page ? "page" : null,
            onclick: () => go(n) }, n)),
        h("button", { class: "btn ghost", disabled: state.page === pages, onclick: () => go(state.page + 1) }, "Next →"),
      ] : null,
      h("label", { class: "per" }, "Per page", perSelect)),
  };
}

// -- Interviews: the interviews and calls your open applications' next steps name, today's first, then the next two
// weeks (see interviews.py). A card opens the job's details: the whole note, what you sent, and the prep sheets.
function todayIso() { const t = new Date(); return new Date(t - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function meetingTime(m) { return m.start ? `${clock(m.start)}–${clock(m.end)}` : "time not set"; }

async function renderInterviews() {
  const d = await api("/api/interviews");
  const timed = d.interviews.filter(i => i.scheduled);
  const today = timed.filter(i => i.day === d.today), later = timed.filter(i => i.day !== d.today);
  const unset = d.interviews.filter(i => !i.scheduled);
  let n = 0;
  const group = (title, list, cls) => list.length
    ? [section(title, list.length, cls), h("div", { class: "grid-cards" }, list.map(iv => interviewCard(iv, d, n++)))] : null;
  put(pagehead("Interviews", [today.length ? `${today.length} today` : "Nothing today",
    later.length ? `${later.length} more in the next two weeks` : null].filter(Boolean).join(" · ")),
    d.interviews.length ? null : emptyState("No interviews or calls coming up. Put one in an application's next step, " +
      "like “Interview with Sam Tue 3/10 2:00 PM ET”, and it shows here."),
    group("Today", today), group("Coming up", later),
    group("Not scheduled yet", unset, "muted"),
    d.sheets_folder ? null : h("p", { class: "small muted", style: "margin-top:16px" },
      "To link the prep sheets you write, set prep.sheets in the watchlist to their folder: a sheet named " +
      "acme-onsite.html shows on Acme's interviews."));
}

function interviewCard(iv, d, i = 0) {
  const now = new Date(), done = iv.scheduled && new Date(iv.end) < now;
  const live = iv.scheduled && new Date(iv.start) <= now && !done;
  const card = h("div", { class: "card app interview" + (done ? " ended" : ""), tabindex: "0", role: "button",
    style: `--sc:var(--s-${iv.status});--i:${Math.min(i, 12)}`, title: "Open everything about it" });
  card.onclick = e => { if (!e.target.closest("button, a")) openDetails(iv.key); };
  card.onkeydown = e => { if (e.key === "Enter" && e.target === card) openDetails(iv.key); };
  const when = iv.day === d.today ? (live ? "now" : done ? "done" : "today") : `${fmtDay(iv.day, d.today)} · ${relDay(iv.day, d.today)}`;
  fill(card, monogram(iv.company),
    h("div", {},
      h("div", { class: "app-head" },
        h("div", {},
          h("span", { class: "title", style: "font-weight:700;font-size:17px" }, iv.title),
          iv.round_label ? h("span", { class: "badge round", title: "The interview round set on this application" }, iv.round_label) : null,
          h("div", { class: "meta" }, h("b", {}, iv.company), h("span", { class: "sep" }, "·"), STAGE_NAMES[iv.status] || iv.status,
            iv.pay ? [h("span", { class: "sep" }, "·"), h("span", { class: "pay" }, iv.pay)] : null)),
        h("div", { class: "iv-when" + (live ? " now" : "") }, h("b", {}, meetingTime(iv)), h("span", {}, `${iv.label} · ${when}`))),
      h("div", { class: "next" }, h("span", { class: "what" }, iv.next_step)),
      sheetButtons(iv.sheets, d.sheets_base)));
  return card;
}

// A prep sheet you wrote opens in a new tab from the sheets folder the server shares at `base` (a secret
// address, sandboxed), so the stylesheet and drill video next to it load too.
function sheetButtons(names, base) {
  if (!names || !names.length || !base) return null;
  return h("div", { class: "row sheets" }, h("span", { class: "small muted" }, icon("file", 13), " Prep sheets:"),
    names.map(name => h("a", { class: "btn", href: base + encodeURIComponent(name), target: "_blank", rel: "noopener",

}

async function renderApplied() {
  const d = await api("/api/applications");
  const all = d.applications;
  const feed = (await api("/api/calendar")).path;  // follow-ups and interviews, for a calendar app on this computer
  const counts = {};
  for (const a of all) counts[a.status] = (counts[a.status] || 0) + 1;
  const isEnded = a => ["rejected", "withdrawn"].includes(a.status);
  const talking = all.filter(a => ["screening", "interviewing", "offer"].includes(a.status)).length;
  const week = all.filter(a => !isEnded(a) && a.follow_up && a.follow_up <= addDays(d.today, 7)).length;
  const dueCount = all.filter(freshDue).length;
  const quietCount = all.filter(a => a.quiet).length;
  const addArea = h("div", {}), body = h("div", {}), showing = h("div", { class: "showing" }), pager = h("div", {});
  const filters = h("div", { class: "status-filter", role: "group", "aria-label": "Filter by status" });
  const search = h("input", { type: "search", placeholder: "Search companies, roles, notes" });

  const pick = s => { appView.stage = appView.stage === s ? "" : s; redraw(); };
  const stages = h("div", {});

    h("button", { class: "facet" + (appView.stage === s ? " on" : ""), style: `--sc:var(--s-${s})`, onclick: () => pick(s) },
      h("span", {}, h("i", { class: "dot" }), STAGE_NAMES[s]), h("span", { class: "c" }, counts[s]))));
  // The same filter as a row of chips over the list: All, Follow up now, then each stage in use.
  const drawFilters = () => fill(filters,
    [["", "All", all.length, null], dueCount ? ["due", "Follow up now", dueCount, "var(--warn)"] : null,
      quietCount ? ["quiet", "Gone quiet", quietCount, "var(--muted)"] : null,
      ...d.stages.filter(s => counts[s]).map(s => [s, STAGE_NAMES[s], counts[s], `var(--s-${s})`])].filter(Boolean)
      .map(([s, label, n, color]) => h("button", { class: "sf" + (appView.stage === s ? " on" : ""),
        style: color ? `--sc:${color}` : null, "aria-pressed": appView.stage === s ? "true" : "false",
        onclick: () => { appView.stage = s; redraw(); } },
        color ? h("i", { class: "dot" }) : null, label, h("span", { class: "c" }, n))));
  const redraw = () => { drawStages(); drawFilters(); draw(); };

  const draw = () => {
    const q = appView.q.trim().toLowerCase();
    const apps = all.filter(a => (!appView.stage || (appView.stage === "due" ? freshDue(a) : appView.stage === "quiet" ? a.quiet
      : a.status === appView.stage)) &&
      (!q || `${a.company} ${a.title} ${a.note || ""} ${a.next_step || ""}`.toLowerCase().includes(q)));
    const table = appView.view === "table";
    // Cards come grouped (due, in progress, ended) and the table sorted; a page is a slice of that order.
    const inQuiet = a => a.quiet && !freshDue(a), inOpen = a => !freshDue(a) && !inQuiet(a) && !isEnded(a);
    const ordered = table ? sortApps(apps, d) : [...apps.filter(freshDue), ...apps.filter(inQuiet),
      ...apps.filter(inOpen), ...apps.filter(isEnded)];
    const pg = paged(ordered, appView, JSON.stringify([appView.stage, q, appView.view, appView.sort, appView.dir]), draw);
    const page = pg.items;
    const due = page.filter(freshDue), quiet = page.filter(inQuiet), ended = page.filter(isEnded), open = page.filter(inOpen);
    const whole = { due: apps.filter(freshDue).length, quiet: apps.filter(inQuiet).length, open: apps.filter(inOpen).length,
      ended: apps.filter(isEnded).length };
    let i = 0;
    const group = (title, list, cls, n) => list.length
      ? [section(title, n, cls), h("div", { class: "grid-cards" }, list.map(a => appCard(a, d, i++)))] : null;
    fill(showing, (apps.length === all.length ? `${all.length} applications` : `Showing ${apps.length} of ${all.length}`) +
      (pg.range ? ` · ${pg.range}` : ""),
      apps.length !== all.length ? h("button", { class: "btn ghost", onclick: () => {
        appView.stage = ""; appView.q = ""; search.value = ""; redraw(); } }, "Clear filters") : null,
      h("span", { class: "spacer" }),
      segmented([["cards", "Cards"], ["table", "Table"]], appView.view, v => { appView.view = v; remember("apps.view", v); draw(); }));
    fill(body, all.length ? null : emptyState("No applications yet. Mark a queued job “I applied”, or add one you " +
        "applied to somewhere else. The first one is the hardest."),
      all.length && !apps.length ? emptyState("No applications match.", appView.q.trim() ? elsewhere(appView.q) : null) : null,
      !apps.length ? null : table ? appTable(page, d, draw)
        : [group("Follow up now", due, "hot", whole.due), group("Gone quiet", quiet, "quiet", whole.quiet),
          group("In progress", open, null, whole.open),
          group("Ended", ended, null, whole.ended)]);
    fill(pager, pg.nav);
  };

  put(
    pagehead("Applications", "Where each one stands and what to do next. Follow-ups come to the top on their day.",
      h("button", { class: "btn ghost", onclick: () => { location.href = `webcal://${location.host}${feed}`; },
        title: "Subscribe your calendar app to your follow-up days and interviews. jobwatch gives your calendar app nothing but this link, which only works on this computer." },
        icon("calendar", 14), "Add to calendar"),
      h("button", { class: "btn primary", onclick: () => fill(addArea, addForm(d)) }, icon("plus", 14), "Add an application")),
    layout([
      hero([[all.length, "applications", "lead"], [talking, "in conversation"],
        [dueCount, "follow-ups due", dueCount ? "warn" : ""], [week, "follow-ups this week"],
        quietCount ? [quietCount, "gone quiet"] : null].filter(Boolean)),
      all.length ? h("div", { class: "pipeline panel" }, h("h4", {}, "Pipeline"),
        h("div", { class: "bar-track" }, d.stages.filter(s => counts[s]).map((s, n) =>
          h("button", { class: "seg", style: `flex:${counts[s]};--sc:var(--s-${s});animation-delay:${n * 90}ms`,
            title: `${STAGE_NAMES[s]}: ${counts[s]}`, "aria-label": `Show ${STAGE_NAMES[s]} (${counts[s]})`,
            onclick: () => pick(s) }))),
        h("div", { style: "margin-top:10px" }, stages)) : null,
      panel(null, search),
    ], [addArea, all.length ? filters : null, showing, body, pager]));
  drawFilters();
  draw();
}

// Every application as one row: sort by a column's header, change a stage in place, open the details.
const APP_COLUMNS = [
  ["company", "Company"], ["title", "Role"], ["status", "Stage"], ["applied_at", "Applied"],
  ["next", "Next step"], [null, "Sent", "col-sent"], [null, ""]];

// The table's order: the column picked (appView.sort), either way (appView.dir).
function sortApps(apps, d) {
  const byNext = a => [freshDue(a) ? 0 : isEndedStatus(a.status) ? 2 : 1, a.follow_up || "9999", a.applied_at ? -Date.parse(a.applied_at) : 0];
  const key = {
    company: a => [a.company.toLowerCase()], title: a => [a.title.toLowerCase()],
    status: a => [d.stages.indexOf(a.status)], applied_at: a => [a.applied_at || ""], next: byNext }[appView.sort];
  const cmp = (x, y) => { for (let n = 0; n < x.length; n++) if (x[n] !== y[n]) return x[n] < y[n] ? -1 : 1; return 0; };
  return [...apps].sort((a, b) => cmp(key(a), key(b)) * appView.dir);
}

function appTable(rows, d, redraw) {
  const head = h("tr", {}, APP_COLUMNS.map(([k, label, cls]) => k
    ? h("th", { "aria-sort": appView.sort === k ? (appView.dir > 0 ? "ascending" : "descending") : null },
      h("button", { class: "sort" + (appView.sort === k ? " on" : ""), onclick: () => {
        appView.dir = appView.sort === k ? -appView.dir : 1; appView.sort = k; redraw(); } },
        label, h("span", { class: "arrow" }, appView.sort === k ? (appView.dir > 0 ? "↑" : "↓") : "")))
    : h("th", { class: cls }, label)));
  return h("div", { class: "table-wrap" }, h("table", { class: "apps" },
    h("thead", {}, head), h("tbody", {}, rows.map(a => appRow(a, d)))));
}

function appRow(a, d) {
  const tr = h("tr", { class: (isEndedStatus(a.status) ? "ended" : "") + (freshDue(a) ? " due" : ""), style: `--sc:var(--s-${a.status})` });
  const stage = stageSelect(a.status, d.stages);
  stage.className = "stage";
  stage.onchange = () => changeStage(a, d, stage);
  const view = () => fill(tr,
    h("td", { class: "co" }, h("div", { class: "co-cell" }, monogram(a.company), h("b", {}, a.company))),
    h("td", { class: "role" }, a.url ? link(a.url, a.title) : a.title, a.pay ? h("div", { class: "pay small" }, a.pay) : null),
    h("td", {}, stage),
    h("td", { class: "nowrap" }, a.applied_at ? [fmtDay(a.applied_at, d.today), h("div", { class: "muted small" }, relDay(a.applied_at, d.today))] : ""),
    h("td", { class: "next-cell" }, nextLine(a, d.today) || h("span", { class: "muted" }, "—"),
      a.quiet ? h("div", { class: "muted small" }, `quiet ${a.quiet.days} days`) : null),
    h("td", { class: "col-sent" }, sentChip(a)),
    h("td", { class: "acts nowrap" },
      h("button", { class: "btn ghost", onclick: edit, title: "Edit next step, follow-up and notes" }, icon("pencil", 13)),
      h("button", { class: "btn ghost", onclick: () => openDetails(a.key), title: "Details" },
        h("span", { class: "label" }, "Details"), icon("arrow", 13))));
  const edit = () => {
    const f = trackFields(a);
    fill(tr, h("td", { colspan: APP_COLUMNS.length, class: "editing" },
      h("h3", {}, `${a.company}: ${a.title}`), f.el,
      h("div", { class: "row actions" },
        h("button", { class: "btn primary", onclick: async () => {
          try { await api("/api/track", { key: a.key, ...f.values() }); render(); } catch (e) { toast(e.message); }
        } }, "Save"),
        h("button", { class: "btn", onclick: view }, "Cancel"))));
  };
  view();
  return tr;
}

function isEndedStatus(s) { return s === "rejected" || s === "withdrawn"; }

// A stage picked on a card or a table row: save it, cheer the good news, offer an undo.
async function changeStage(a, d, stage) {
  const before = a.status;
  try {
    const to = stage.value;
    await api("/api/track", { key: a.key, status: to });
    const forward = d.stages.indexOf(to) > d.stages.indexOf(before) && !isEndedStatus(to);
    toast(stageWords(a.company, to), async () => { await api("/api/track", { key: a.key, status: before }); render(); },
      TONES[to]);
    if (to === "offer") { confetti(null, { count: 220, power: 1.4 }); setTimeout(() => confetti(stage, { count: 80 }), 350); }
    else if (forward) confetti(stage, { count: 70, power: .8 });
    render();
  } catch (e) { toast(e.message); stage.value = before; }
}

function stageSelect(value, stages) {
  const sel = h("select", {}, stages.map(s => h("option", { value: s }, STAGE_NAMES[s])));
  sel.value = value;
  return sel;
}

function nextLine(a, today) {
  if (!a.next_step && !a.follow_up) return null;
  const n = a.follow_up ? dayDiff(a.follow_up, today) : null;
  const urgency = n === null ? "" : n < 0 ? "late" : n === 0 ? "now" : n <= 3 ? "soon" : "";
  return h("div", { class: "next " + urgency },
    h("span", { class: "what" }, a.next_step || "Follow up"),
    a.follow_up ? h("span", { class: "when-chip" }, icon("calendar", 12), `${fmtDay(a.follow_up, today)} · ${relDay(a.follow_up, today)}`) : null);
}

function appCard(a, d, i = 0) {
  const card = h("div", { class: "card app" + (isEndedStatus(a.status) ? " ended" : ""),
    style: `--sc:var(--s-${a.status});--i:${Math.min(i, 12)}` });
  const stage = stageSelect(a.status, d.stages);
  stage.className = "stage";
  stage.onchange = () => changeStage(a, d, stage);
  const facts = [a.pay ? h("span", { class: "pay" }, a.pay) : null, a.closed ? "posting closed" : null].filter(Boolean);
  const view = () => fill(card,
    monogram(a.company),
    h("div", {},
      h("div", { class: "app-head" },
        h("div", {},
          a.url ? link(a.url, a.title, "title") : h("span", { class: "title", style: "font-weight:700;font-size:17px" }, a.title),
          h("div", { class: "meta" }, h("b", {}, a.company), facts.map(f => [h("span", { class: "sep" }, "·"), f]))),
        stage),
      nextLine(a, d.today), a.note ? h("div", { class: "note", title: "Details shows the whole note" }, a.note) : null,
      a.quiet ? quietBar(a, d) : null,
      h("div", { class: "app-foot" },
        h("span", { class: "when" }, a.applied_at ? `Applied ${fmtDay(a.applied_at, d.today)} · ${relDay(a.applied_at, d.today)}` : ""),
        h("div", { class: "acts" }, sentChip(a),
          h("button", { class: "btn ghost", onclick: edit }, icon("pencil", 13), "Edit"),
          h("button", { class: "btn ghost", onclick: () => openDetails(a.key) }, "Details", icon("arrow", 13))))));
  const edit = () => {
    const f = trackFields(a);
    fill(card, h("div", { class: "full" },
      h("h3", {}, `${a.company}: ${a.title}`), f.el,
      h("div", { class: "row actions" },
        h("button", { class: "btn primary", onclick: async () => {
          try { await api("/api/track", { key: a.key, ...f.values() }); render(); } catch (e) { toast(e.message); }
        } }, "Save"),
        h("button", { class: "btn", onclick: view }, "Cancel"))));
  };
  view();
  return card;
}

// Under a quiet application: how long, what to do next (never done for you), and one-click ways to do it.
function quietBar(a, d) {
  const q = a.quiet, bar = h("div", { class: "quiet-bar" });
  const know = q.contacts.length ? ` You know: ${q.contacts.slice(0, 3).map(p => p.name).join(", ")}.` : "";
  const end = status => async () => {
    try {
      await api("/api/track", { key: a.key, status });
      toast(stageWords(a.company, status), async () => { await api("/api/track", { key: a.key, status: a.status }); render(); },
        TONES[status]);
      render();
    } catch (e) { toast(e.message); }
  };
  const snooze = async () => {
    try {
      const r = await api("/api/snooze", { key: a.key, days: 7 });
      toast(`${a.company}: follow up ${fmtDay(r.follow_up, d.today)}. A little patience goes a long way.`,
        async () => { await api("/api/track", { key: a.key, follow_up: a.follow_up || "" }); render(); });
      render();
    } catch (e) { toast(e.message); }
  };
  const view = () => fill(bar,
    h("div", {}, h("b", {}, `Quiet ${q.days} days`), h("span", { class: "why" },
      ` · posting ${q.posting_open ? "open" : "closed"} · ${q.advice}${know}`)),
    h("div", { class: "acts" },
      h("button", { class: "btn ghost", onclick: snooze, title: "Push the follow-up a week out" }, "Snooze 7 days"),
      h("button", { class: "btn ghost", onclick: end("withdrawn") }, "Mark withdrawn"),
      h("button", { class: "btn ghost", onclick: end("rejected") }, "Mark rejected"),
      h("button", { class: "btn ghost", onclick: add }, "Add note")));
  const add = () => {
    const text = h("input", { type: "text", placeholder: "What happened? (dated for you)" });
    const save = async () => {
      try { await api("/api/track", { key: a.key, add_note: text.value }); render(); } catch (e) { toast(e.message); }
    };
    text.onkeydown = e => { if (e.key === "Enter") save(); };
    fill(bar, h("div", { class: "acts" }, text, h("button", { class: "btn primary", onclick: save }, "Save"),
      h("button", { class: "btn", onclick: view }, "Cancel")));
    text.focus();
  };
  view();
  return bar;
}

// "2 files · 3 answers", or a nudge to keep what was sent while it's fresh.
function sentChip(a) {
  const p = a.package || { files: 0, answers: 0, note: false };
  const parts = [p.files && `${p.files} file${p.files === 1 ? "" : "s"}`, p.answers && `${p.answers} answer${p.answers === 1 ? "" : "s"}`,
    p.note && "letter"].filter(Boolean);
  return h("button", { class: "sent-chip" + (parts.length ? "" : " empty-pkg"), onclick: () => openDetails(a.key),
    title: parts.length ? "What you sent with this application" : "Keep the resume and answers you sent, for when they call" },
    icon("clip", 13), parts.length ? parts.join(" · ") : "Add what you sent");
}

// Next step, follow-up day, day applied and note: shared by the edit and add forms.
function trackFields(a) {
  const nextStep = h("input", { type: "text", placeholder: "e.g. check in with the recruiter" }); nextStep.value = a.next_step || "";
  const round = h("select", {}, h("option", { value: "" }, "None"),
    Object.entries(ROUND_NAMES).map(([id, name]) => h("option", { value: id }, name)));
  round.value = a.round || "";
  const followUp = h("input", { type: "date" }); followUp.value = a.follow_up || "";
  const applied = h("input", { type: "date" }); applied.value = a.applied_at || "";
  const note = h("textarea", { placeholder: "Recruiter, referral, pay range, what you answered…" }); note.value = a.note || "";
  return {

// A job found somewhere else. A link to one job on a board jobwatch reads fills in the rest; for anything else
// (LinkedIn, a company's own site) give the company and title, and paste the posting so it can be scored.
// d: the Applications data (stages, today), or null to add a job to the queue, to consider.
function addForm(d) {
  const queued = !d;
  const url = h("input", { type: "text", placeholder: "https://…" });
  const company = h("input", { type: "text", placeholder: "Company" });
  const title = h("input", { type: "text", placeholder: "Job title" });

  const stage = queued ? null : stageSelect("applied", d.stages);
