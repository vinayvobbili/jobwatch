/* Your stories against the fit's gaps (storyfit.py): quiet green chips for a gap a story covers, amber for one it
   partly covers, the must-haves with your stories beside the resume's, and the story itself in a large dialog. */
.storychip { display: inline-flex; align-items: center; gap: 4px; margin: 1px 2px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--good) 38%, transparent); cursor: pointer; font: inherit; font-size: 12px;
  font-weight: 600; color: var(--good); vertical-align: baseline; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; background: var(--gloss-sheen-chip), color-mix(in srgb, var(--good) 11%, transparent);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); transition: transform .12s, box-shadow .15s; }
.storychip:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45),
  0 6px 14px -8px color-mix(in srgb, var(--good) 80%, transparent); }
.storychip:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }
.storychip.partly { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 38%, transparent);
  background: var(--gloss-sheen-chip), color-mix(in srgb, var(--warn) 11%, transparent); }
.storychip.partly:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 14px -8px color-mix(in srgb, var(--warn) 80%, transparent); }
.storyline { font-size: 13.5px; color: var(--muted); margin: 2px 0 4px; line-height: 1.7; }
.storyline > b { color: var(--good); font-weight: 600; }
.storyline .storygap { color: var(--text); }
.storyline .storygap + .storygap::before { content: "·"; color: var(--muted); margin: 0 6px; }
.fitbox small.story-must { display: block; color: var(--good); font-weight: 600; }
.card.job > .fitbox .story-must { grid-column: 2; margin-top: 2px; align-self: start; }
.card.job > .fitbox .story-score { grid-column: 1 / -1; justify-self: start; }
.story-score { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
  color: #fff; background: var(--gloss-sheen), linear-gradient(135deg, #10b981, #0ea5e9); box-shadow: var(--gloss-edge); white-space: nowrap; }
.storyfit-note { margin: 6px 0 8px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px;
  border: 1px solid color-mix(in srgb, var(--good) 26%, var(--line));
  background: linear-gradient(135deg, color-mix(in srgb, var(--good) 9%, transparent), color-mix(in srgb, #0ea5e9 6%, transparent)); }
.storyfit-note .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.storyfit-note .tile { padding: 6px 12px; border-radius: 10px; background: var(--gloss-sheen-chip), var(--panel-solid);
  border: 1px solid var(--line); animation: rise .35s ease both; }
.storyfit-note .tile b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.storyfit-note .tile.with b { background: linear-gradient(135deg, #10b981, #0ea5e9); -webkit-background-clip: text; background-clip: text; color: transparent; }
.whyfit .storychip { margin-left: 6px; }
.dialog.story-dialog { width: 90vw; max-width: 1000px; max-height: 88vh; overflow-y: auto; padding: 0; }
:root[data-width="wide"] .dialog.story-dialog { max-width: 1400px; } :root[data-width="full"] .dialog.story-dialog { max-width: none; }
.story-dialog .sd-head { position: sticky; top: 0; display: flex; align-items: center; gap: 12px; padding: 16px 24px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 90%, transparent); backdrop-filter: blur(10px); }
.story-dialog .sd-head h2 { flex: 1; margin: 0; font-size: 20px; }
.story-dialog .sd-body { padding: 18px 24px 24px; font-size: 15.5px; line-height: 1.65; }
.story-dialog .sd-why { padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--good) 12%, transparent), color-mix(in srgb, #0ea5e9 8%, transparent)); }
.story-dialog .sd-part { margin: 0 0 14px; } .story-dialog .sd-part h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); }
@media (max-width: 700px) { .dialog.story-dialog { width: 96vw; max-height: 94vh; } .story-dialog .sd-body { padding: 14px 16px; } }

/* GLOSS. One layer over the page's own look, last so it wins: a top-edge highlight and a soft diagonal sheen on the
   chrome and containers (buttons, chips, badges, tiles, cards, panels, rings, the open tab, Close, dialogs), a sheen
   that sweeps across buttons and tiles once per hover, layered shadows with an indigo glow, and a coloured shiny
   scrollbar. Table cells stay flat. Text on a filled surface keeps 4.5:1: the white lift is held to --gloss-lift where
   the text sits and --gloss-shade deepens the fill (tests/test_page_gloss.py computes it). Motion off: static gloss only. */
:root {
  --gloss-edge: inset 0 1px 0 rgba(255, 255, 255, .25), inset 0 -1px 0 rgba(10, 10, 60, .16);  /* on a filled surface */
  --gloss-edge-panel: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .35);  /* on a light one */
  --gloss-lift: .06; --gloss-shade: rgba(14, 10, 66, .16);
  --gloss-sheen: linear-gradient(180deg, rgba(255, 255, 255, .22) 0, rgba(255, 255, 255, var(--gloss-lift)) 30%,
    rgba(255, 255, 255, 0) 46%, rgba(255, 255, 255, 0) 54%, rgba(10, 10, 60, .12) 100%);
  --gloss-fill: var(--gloss-sheen), linear-gradient(var(--gloss-shade), var(--gloss-shade));
  --gloss-sheen-panel: linear-gradient(135deg, rgba(255, 255, 255, .7) 0, rgba(255, 255, 255, 0) 240px),
    linear-gradient(315deg, rgba(99, 102, 241, .07) 0, rgba(168, 85, 247, 0) 220px);
  --gloss-sheen-chip: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 90%);
  --gloss-sweep: linear-gradient(105deg, transparent 32%, rgba(255, 255, 255, .34) 50%, transparent 68%);
  --gloss-ms: 700ms;
  --gloss-glow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent);
  --gloss-glow-hover: 0 10px 24px -10px color-mix(in srgb, var(--accent) 95%, transparent),
    0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
  --shadow: var(--gloss-edge-panel), 0 1px 2px rgba(20, 26, 46, .05), 0 10px 28px -16px rgba(20, 26, 46, .2),
    0 20px 44px -34px rgba(84, 87, 240, .4);
  --shadow-hover: var(--gloss-edge-panel), 0 2px 4px rgba(20, 26, 46, .06), 0 22px 44px -20px rgba(70, 60, 190, .38),
    0 0 0 1px rgba(84, 87, 240, .1);
  /* scrollbar: track tint, thumb indigo > violet > teal, brighter on hover (Firefox gets the solid pair) */
  --sb-track: linear-gradient(90deg, rgba(99, 102, 241, .06), rgba(168, 85, 247, .13) 50%, rgba(99, 102, 241, .06));
  --sb-track-h: linear-gradient(180deg, rgba(99, 102, 241, .06), rgba(168, 85, 247, .13) 50%, rgba(99, 102, 241, .06));
  --sb-thumb: linear-gradient(180deg, #6366f1 0%, #a855f7 52%, #14b8a6 100%);
  --sb-thumb-h: linear-gradient(90deg, #6366f1 0%, #a855f7 52%, #14b8a6 100%);
  --sb-thumb-hover: linear-gradient(180deg, #7c7ff8 0%, #c084fc 52%, #2dd4bf 100%);
  --sb-thumb-hover-h: linear-gradient(90deg, #7c7ff8 0%, #c084fc 52%, #2dd4bf 100%);
  --sb-sheen: linear-gradient(90deg, rgba(255, 255, 255, .42) 0, rgba(255, 255, 255, .1) 38%, rgba(255, 255, 255, 0) 56%);
  --sb-sheen-h: linear-gradient(180deg, rgba(255, 255, 255, .42) 0, rgba(255, 255, 255, .1) 38%, rgba(255, 255, 255, 0) 56%);
  --sb-edge: inset 0 0 0 1px rgba(255, 255, 255, .38), inset 0 1px 0 rgba(255, 255, 255, .55);
  --sb-glow: inset 0 0 8px 1px rgba(255, 255, 255, .35), inset 0 0 0 1px rgba(255, 255, 255, .6);
  --sb-solid-thumb: #8b5cf6; --sb-solid-track: rgba(99, 102, 241, .1);
}
:root[data-theme="dark"] {
  --gloss-edge-panel: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 0 0 1px rgba(255, 255, 255, .03);
  --gloss-sheen-panel: linear-gradient(135deg, rgba(255, 255, 255, .07) 0, rgba(255, 255, 255, 0) 240px),
    linear-gradient(315deg, rgba(141, 143, 255, .09) 0, rgba(199, 125, 255, 0) 220px);
  --gloss-sheen-chip: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, 0) 90%);

<script>

const darkQuery = matchMedia("(prefers-color-scheme: dark)");

// -- tiny helpers: build DOM with textContent only, so posting text can't inject markup

// SPINNER-CLOCK-START
const CLOCKS = new Map();         // ticker element -> its state
const CLOCK_STARTS = new Map();   // key -> { at, seen }: the same work redrawn (a card drawn again) keeps counting
const CLOCK_TICK_MS = 500, CLOCK_GAP_MS = 4000, CLOCK_MIN_ESTIMATE = 5;

  if (s < 60) return unit(s, "second");

    const t = JSON.parse(remembered(`${kind}-seconds`, "[]"));

// Short (a ring too small for words): the seconds alone.
function clockWords(s, expected = null, short = false) {

    if (c.short && c.expected) c.el.title = slow ? "Taking longer than usual" : `Usually about ${elapsedWords(c.expected)}`;

    dropClock(c, true);

function busyNote(text, opts = {}) {

  note.stop = spinnerClock(tick, { say: text.replace(/[….]+$/, ""), ...opts });

}

const loadingNote = (text = "Loading…", opts = {}) => h("div", { class: "muted" }, busyNote(text, opts));

    const t = now - start;

    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - life * .6) / (life * .4));
    for (const b of bits) {
      b.vx *= .985; b.vy = b.vy * .985 + .32; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.color;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot * 2)) + 2);
      ctx.restore();
    }
    if (t < life) requestAnimationFrame(frame); else canvas.remove();
  })(start);
}

// Slide a card out and close the gap it leaves.
async function leave(el, dir = 1) {

  const hgt = el.offsetHeight;
  await el.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${dir * 48}px) scale(.98)` }],
    { duration: 260, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).finished;
  await el.animate([{ height: hgt + "px", marginTop: "12px", marginBottom: "12px", paddingTop: "18px", paddingBottom: "16px" },
    { height: "0px", marginTop: "0px", marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px" }],
    { duration: 220, easing: "ease-out", fill: "forwards" }).finished;

// Numbers roll up from zero when a page opens.
function countUp(el, n) {
  if (REDUCED || !n || main.classList.contains("quiet")) { el.textContent = Number(n).toLocaleString(); return; }
  const start = performance.now(), dur = 700 + Math.min(600, n * 4);
  (function frame(now) {
    const k = Math.min(1, (now - start) / dur), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(n * eased).toLocaleString();
    if (k < 1) requestAnimationFrame(frame);
  })(start);
}

function bump(el) { if (!el || REDUCED) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

// "just now", "12 min ago", "2 h ago", "3 days ago", from an ISO time.
function ago(iso) {

}

function fitClass(score) { return score >= 75 ? "hi" : score >= 50 ? "mid" : "lo"; }

// Why a score is stale, for a tooltip: it was made under an older resume (stale_why "older_resume": it stays as made

// key: the job's, for its Rescore button and so a new score from /events can take this one's place

// Rescore: a small button on the ring opens a dialog of the models the score can be made again with (the scoring
// chain first). The job is scored in the background; its new score arrives on /events and takes the ring's place.
const RESCORING = new Set();  // jobs being scored again: their ring spins until the event comes
function rescoreButton(key) {
  const b = h("button", { type: "button", class: "rescore-btn", title: "Score again with a model you pick",
    "aria-label": "Score again" }, icon("refresh", 12));
  b.onclick = e => { e.stopPropagation(); openRescore(key); };
  return b;
}
async function openRescore(key) {

    "aria-label": "Score again" }, h("p", { class: "muted" }, busyNote("Loading the models…")));
  const close = () => { shade.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  shade.onclick = e => { if (e.target === shade) close(); };
  document.addEventListener("keydown", esc);
  shade.append(box);
  document.body.append(shade);

  try { d = await api(`/api/rescore?key=${encodeURIComponent(key)}`); }
  catch (e) { fill(box, h("p", { class: "small error" }, e.message)); return; }
  const where = { claude: "API", agy: "agy", local: "local" };
  let picked = d.choices.find(c => c.ready && `${c.backend}:${c.model}` !== d.scored_by) || d.choices.find(c => c.ready);
  const list = h("div", { class: "rescore-list", role: "radiogroup", "aria-label": "Model" });

    const on = picked === c, now = `${c.backend}:${c.model}` === d.scored_by;
    const row = h("button", { type: "button", class: "rescore-pick" + (on ? " on" : ""), role: "radio",
      "aria-checked": String(on), disabled: !c.ready, title: c.ready ? c.model : `${c.backend} isn't set up here` },
      h("span", { class: "dot" }),
      h("span", { class: "who" }, h("b", {}, shortModel(c.model)), h("span", { class: "muted small" }, ` · ${where[c.backend]}`)),
      h("span", { class: "tags" },
        c.role ? h("span", { class: "chip" }, c.role) : null,
        now ? h("span", { class: "chip on" }, "scored this") : null,
        h("span", { class: "cost " + c.backend }, c.cost)));
    row.onclick = () => { picked = c; draw(); };
    return row;
  }));
  draw();
  const go = h("button", { class: "btn primary", type: "button" }, icon("refresh", 13), "Score again");
  const msg = h("span", { class: "small muted", role: "status" });
  go.disabled = d.running || !picked;
  if (d.running) msg.textContent = "Already being scored again.";
  go.onclick = async () => {
    go.disabled = true; msg.className = "small muted"; fill(msg, busyNote("Starting…"));
    try {
      await api("/api/rescore", { key, backend: picked.backend, model: picked.model });
      RESCORING.add(key);
      document.querySelectorAll(`[data-fit="${CSS.escape(key)}"]`).forEach(el => el.classList.add("rescoring"));
      close();
      toast(`Scoring again with ${shortModel(picked.model)} (${where[picked.backend]}): the score updates when it's done`);
    } catch (e) { msg.className = "small error"; msg.textContent = e.message; go.disabled = false; }
  };
  fill(box,
    h("div", { class: "row", style: "align-items:center" }, h("h2", { style: "flex:1;margin:0" }, "Score again"),
      closeButton(close, true)),
    h("p", { class: "small muted" }, d.scored_by ? `Scored now by ${scorerLabel(d.scored_by)}${d.stale ? ` (stale: ${d.stale_note})` : ""}. ` +
      "Pick the model to score it again with; the new score replaces it." : "Pick the model to score it with."),
    list,
    h("div", { class: "row", style: "margin-top:14px;align-items:center" }, go, msg));

// A line under the job's score on every card showing it: why a rescore failed, or which scorer made the score instead
function cardNote(key, text, bad) {
  document.querySelectorAll(`[data-fit="${CSS.escape(key)}"]`).forEach(el => {
    el.querySelectorAll(":scope > .fit-note").forEach(n => n.remove());
    el.append(h("div", { class: "small fit-note" + (bad ? " error" : ""), role: "status" }, text));
  });
}
// A card with no score yet (a posting just read, being scored) has no rings to swap: the page is drawn again, once
// for a burst of events, where it is.
let redrawTimer = 0;
function redrawUnscored(keys) {
  if (!keys.some(k => document.getElementById("job-" + k) && !document.querySelector(`[data-fit="${CSS.escape(k)}"]`))) return;
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(redrawInPlace, 300);
}
// /events: a rescore's new score (or why it failed) takes the place of the job's rings on the page
function listenForEvents() {
  if (typeof EventSource === "undefined") return;
  const es = new EventSource(`/events?t=${encodeURIComponent(TOKEN)}`);
  es.addEventListener("score", e => {
    const d = JSON.parse(e.data);
    RESCORING.delete(d.key);
    redrawUnscored(d.keys || [d.key]);
    for (const k of d.keys || [d.key])
      document.querySelectorAll(`[data-fit="${CSS.escape(k)}"]`).forEach(el => el.replaceWith(fitBox(d.fit, k)));
    toast(`New score: ${Math.round(d.fit.score)} by ${scorerLabel(d.fit.scored_by || "")}` + (d.note ? `. ${d.note}` : ""),
      null, d.note ? "" : "win");
    if (d.note) for (const k of d.keys || [d.key]) cardNote(k, d.note);
    fetchAdvice(d.keys || [d.key]).then(showAdvice);
  });
  es.addEventListener("score-failed", e => {
    const d = JSON.parse(e.data);
    RESCORING.delete(d.key);
    const again = document.querySelector(`[data-fit="${CSS.escape(d.key)}"]`) !== null;  // else its first score
    document.querySelectorAll(`[data-fit="${CSS.escape(d.key)}"]`).forEach(el => el.classList.remove("rescoring"));
    toast(`Scoring${again ? " again" : ""} failed: ${d.error}`);
    cardNote(d.key, `Scoring${again ? " again" : ""} failed: ${d.error}`, true);  // stays on the card: a toast is easy to miss
    redrawUnscored([d.key]);  // an unscored card now says why, and offers Score
  });

  es.addEventListener("score-skipped", e => {
    const d = JSON.parse(e.data);

    toast(`Not scored: ${d.said}.`);
    cardNote(d.key, d.text);
    redrawUnscored([d.key]);

// Under the ring: the model that made the score and where it ran ("Sonnet 5.5 · agy", "Qwen3.5-9B · local"). A score
// is never made again on its own, a fallback's included: `jobwatch score --rescore` does that when asked.
function scorerTag(fit) {
  if (!fit.scored_by) return null;
  const [backend, ...rest] = fit.scored_by.split(":"), model = rest.join(":");
  const where = backend === "claude" ? "API" : backend;
  return h("span", { class: "scorer" + (backend === "claude" ? "" : " local") },
    model ? `${shortModel(model)} · ${where}` : backend === "claude" ? "Claude API" : backend);
}
// A model id as people say it: claude-sonnet-5-5-medium is "Sonnet 5.5", gemini-3.8-flash-medium "Gemini 3.8 Flash",
// mlx-community/Qwen3.5-9B-MLX-4bit "Qwen3.5-9B"; anything else as it is.
function shortModel(model) {
  const m = model.split("/").pop(), cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  let x;
  if ((x = m.match(/^claude-(opus|sonnet|haiku|fable)-(\d+)(?:-(\d{1,2}))?(?!\d)/))) return `${cap(x[1])} ${x[2]}${x[3] ? "." + x[3] : ""}`;
  if ((x = m.match(/^gemini-([\d.]+)-([a-z]+)/))) return `Gemini ${x[1]} ${cap(x[2])}`;
  return m.replace(/-MLX.*$/i, "");

// Queue it or skip it, and why (advice.py). A queued job only shows a reason to hold off.
// Settings > Scoring: closed postings are never scored on their own, and how many scores that spared (scorestats.closed_skipped)
function closedSavedNote(k) {
  const spared = k && k.total ? ` ${k.month} spared this month, ${k.total} in all${k.saved_usd ? `, about $${k.saved_usd.toFixed(2)} at your Claude cost per score` : ""}.` : "";
  return h("div", { class: "small muted closed-saved", style: "grid-column:1 / -1" },
    `A job whose posting is closed (or found closed once) is never scored on its own; Score on its card still scores it.${spared}`);
}
// A job card's Why row: the reasons for and against, ticked or crossed; the card's bottom line (verdictLine) makes

function showAdvice(said) {

// In a job's details, where the ring would be: why there's no score yet (no posting text, still in line, ...).
// On a job card, `corner` is its Score button (scoreButton's): the button takes the place of the dash, with the

// `bare` is the gap sentence alone, for a job card's Gaps row (the row says what it is; click opens it past two lines).
// A fit with no gaps of its own (a posting with only a "what an ideal candidate has" list has no must-haves) lists

function fitGaps(fit) {
  return fit && fit.gaps && fit.gaps.length ? fit.gaps : (fit && fit.soft_gaps) || [];

function gapsLine(fit, bare = false) {

    bare ? null : h("b", {}, "Gaps: "), storyGapItems(fit, gaps));

// Your stories against the fit's gaps (storyfit.py, from what `jobwatch scores --story-check --apply` kept; the score
// itself is never changed). A gap a story covers leaves the Gaps line for "Covered by your stories"; one a story only
// partly covers keeps its place with an amber "partly" chip. Each chip opens the story in a large dialog.
const normGap = s => String(s || "").toLowerCase().split(/\s+/).filter(Boolean).join(" ");
function storyFor(fit, gap, kind) {
  const g = normGap(gap);  // a soft gap reads "<requirement> (must-have, missing)"
  return (fit?.story?.[kind] || []).find(r => { const q = normGap(r.requirement); return g === q || g.startsWith(q + " ("); }) || null;
}
function openGaps(fit) { return fitGaps(fit).filter(g => !storyFor(fit, g, "covered")); }
const storyHow = s => s.by === "local" ? "checked by the local model" : "checked by tags only";
// bare: the title alone, on the "Covered by your stories" line that already says what it is
function storyChip(r, partly = false, bare = false) {
  const b = h("button", { type: "button", class: "storychip" + (partly ? " partly" : ""), "data-story": r.story,
    title: `${r.requirement}\n${partly ? "Partly shown" : "Shown"} by your story "${r.title}": ${r.reason}. Click to read it.` },
    icon(partly ? "minus" : "check", 11), bare ? r.title : partly ? `partly: ${r.title}` : `Covered by your story: ${r.title}`);
  b.onclick = e => { e.stopPropagation(); openStory(r); };
  return b;
}
function storyGapItems(fit, gaps) {
  if (!fit?.story) return gaps.join(" · ");
  return gaps.map((g, n) => { const p = storyFor(fit, g, "partly"); return [n ? " · " : null, g, p ? [" ", storyChip(p, true)] : null]; });
}
function storyCovered(fit, bare = false) {
  const s = fit?.story;
  if (!s || !s.covered.length) return null;
  return h("div", { class: "storyline", "data-story-covered": "1", title: `Your stories, ${storyHow(s)}; the fit score was not changed` },
    h("b", {}, "Covered by your stories: "),
    bare ? s.covered.map(r => storyChip(r, false, true))
      : s.covered.map(r => h("span", { class: "storygap" }, r.requirement, " ", storyChip(r, false, true))));
}
// The ring's must-haves with your stories beside the resume's, and the fit with them when Settings counts them.
function storyMust(fit) {
  const s = fit?.story;
  if (!s || s.must_met === fit.must_haves_met && !fit.story_score) return null;
  return [s.must_met !== fit.must_haves_met ? h("small", { class: "story-must", "data-story-must": "1",
      title: `${fit.must_haves_met}/${fit.must_haves_total} from the resume · ${s.must_met}/${s.must_total} with your stories (${storyHow(s)})` },
    `${s.must_met}/${s.must_total} with stories`) : null,
    fit.story_score ? h("span", { class: "story-score", "data-story-score": "1",
      title: `Fit ${Math.round(fit.score)} from the resume; ${Math.round(fit.story_score)} with your stories (Settings > Display counts them toward the fit minimum)` },
      `${Math.round(fit.score)} · ${Math.round(fit.story_score)} with stories`) : null];
}
// The Details dialog's summary: must-haves and fit from the resume and with your stories, side by side.
function storyNote(fit) {
  const s = fit?.story;
  if (!s) return null;
  const tile = (num, lbl, cls = "") => h("div", { class: "tile " + cls }, h("b", {}, num), h("span", { class: "small muted" }, lbl));
  return h("div", { class: "storyfit-note", "data-story-note": "1" },
    h("div", { class: "tiles" },
      tile(`${fit.must_haves_met}/${fit.must_haves_total}`, "must-haves from the resume"),
      tile(`${s.must_met}/${s.must_total}`, "with your stories", "with"),
      fit.story_score ? [tile(Math.round(fit.score), "fit from the resume"), tile(Math.round(fit.story_score), "fit with your stories", "with")] : null),
    h("div", { class: "small muted" }, `Must-haves: ${fit.must_haves_met}/${fit.must_haves_total} from the resume · ` +
      `${s.must_met}/${s.must_total} with your stories. ${storyHow(s)[0].toUpperCase() + storyHow(s).slice(1)}` +
      (s.note ? ` (${s.note})` : "") + "; the fit score itself was not changed" +
      (fit.story_score ? ", and the fit minimum compares the one with your stories (Settings > Display)." : ".")));
}
// The fit the Fit chip compares: the one with your stories when Settings counts them (fit.story_score), else the score.
const fitValue = fit => fit.story_score ?? fit.score;
async function openStory(r) {
  const shade = h("div", { class: "overlay story-shade", style: "display:flex", onclick: e => { if (e.target === shade) close(); } });
  const box = h("div", { class: "dialog story-dialog", role: "dialog", "aria-modal": "true", "aria-label": r.title, tabindex: "-1" });
  const close = () => { shade.remove(); document.removeEventListener("keydown", keys, true); };
  const keys = e => { if (e.key === "Escape") { e.stopImmediatePropagation(); close(); } else if (e.key === "Tab") trapTab(box, e); };
  document.addEventListener("keydown", keys, true);
  const head = h("div", { class: "sd-head" }, icon("award", 18), h("h2", {}, r.title), closeButton(close));
  const why = h("div", { class: "sd-why" }, h("b", {}, r.verdict === "partly" ? "Partly shows: " : "Shows: "), r.requirement,
    h("div", { class: "small muted" }, `Why: ${r.reason} (${r.how === "local" ? "the local model" : "by tags"}).`));
  const body = h("div", { class: "sd-body" }, why, h("p", { class: "muted" }, busyNote("Loading the story…")));
  box.append(head, body);
  shade.append(box);
  document.body.append(shade);
  box.focus();
  try {
    const { story } = await api("/api/story?id=" + encodeURIComponent(r.story));
    const part = (t, v) => v ? h("div", { class: "sd-part" }, h("h3", {}, t), h("div", {}, v)) : null;
    fill(body, why, part("What you did", story.did), part("The hard part", story.hard), part("What came of it", story.result),
      story.skills?.length ? part("Skills", h("div", { class: "chips" }, story.skills.map(k => h("span", { class: "chip hit" }, k)))) : null);
  } catch (e) { fill(body, why, h("p", { class: "error" }, e.message)); }
}

// Each requirement the fit score judged: its verdict and the resume's words behind it.
const VERDICT = { met: "met", partial: "partly", not_met: "missing" };
function whyScore(fit) {
  if (!fit || !fit.requirements || !fit.requirements.length) return null;
  return h("details", { class: "whyfit" }, h("summary", {}, "Why this score"),
    fit.reconciled ? h("p", { class: "muted small", "data-reconciled-note": "1" },
      "Reconciled with your profile (the score itself was not made again): " + fit.reconciled.join("; ") + ".") : null,
    h("ul", {}, fit.requirements.map(r => h("li", {},
      h("span", { class: `v ${r.verdict}` }, VERDICT[r.verdict] || r.verdict),
      r.requirement, r.kind === "must_have" ? h("span", { class: "muted small" }, " · must-have") : null,
      r.reconciled ? h("span", { class: "muted small" }, ` · ${r.reconciled}`) : null,
      storyRowChip(fit, r),
      (r.evidence || []).slice(0, 2).map(q => h("q", {}, q))))));
}
// A requirement row's story chip in "Why this score", when a story covers or partly covers it.
function storyRowChip(fit, r) {
  if (r.verdict === "met") return null;
  const c = storyFor(fit, r.requirement, "covered"), p = c ? null : storyFor(fit, r.requirement, "partly");
  return c ? storyChip(c) : p ? storyChip(p, true) : null;
}

// A pay that is a rate worked out as a year's ("$40–$80/hr, about $83K–$166K a year": Job.pay in models.py) is
// an hourly contract wage, not a salary: amber, never the green of a figure that meets a target.
function isRate(s) { return /\/(?:hr|day|wk|mo), about /.test(s || ""); }
function payClass(base, s) { return isRate(s) ? `${base} rate` : base; }

// A job's pay, one small chip per source in a fixed order (Posted, Levels, LCA, Recruiter, Glassdoor, Ask; see
// paysources.py). A source with nothing is a dimmed chip and its reason shows on hover, so a blank is never a mystery.
function paySources(job) {
  const items = job.pay_sources;
  if (!items) return job.pay ? h("span", { class: payClass("paychip", job.pay) }, job.pay) : null;
  return h("div", { class: "psrcs", "data-pay": job.key }, [...items.map(s => s.value
    ? h("span", { class: `psrc psrc-${s.key}${s.rate ? " rate" : ""}`, title: s.detail || s.value }, h("b", {}, s.label), s.short || s.value)
    : h("span", { class: "psrc psrc-none", title: s.reason }, h("b", {}, s.label), s.blank)),
    // A guess for a posting with no pay (estimate.py): always marked Est., with its basis on hover.
    job.est_pay ? h("span", { class: "psrc psrc-est", title: `${job.est_pay.detail} An estimate, not a posted figure.`,
      "data-est": job.key }, h("b", {}, "Est."), job.est_pay.label.replace(/^Est\. /, "")) : null,
    payTop(job) == null && !items.some(s => s.value && !s.market) && !job.est_pay ? h("span", { class: "psrc psrc-unknown",
      title: "No source has a pay figure for this job yet" }, "pay unknown") : null]);
}
// The best pay clue a job carries, as a top figure to compare with Today's pay chip: the posted top (the job's own, or
// the Posted chip's), else the Levels figure, else the H-1B (LCA) one (other employers' filings are no clue to this
// job's pay). null: no clue at all.
function payTop(job) {
  if (job.salary_max != null) return job.salary_max;
  const by = Object.fromEntries((job.pay_sources || []).map(s => [s.key, s]));
  if (by.posted && by.posted.amount != null) return by.posted.amount;
  for (const k of ["levels", "lca"]) if (by[k] && by[k].amount != null && !by[k].market) return by[k].amount;
  return null;
}

// How the Levels.fyi and H-1B (U.S. DOL LCA, base only, not total compensation) figures were worked out, with
// their credit, folded away under the chips in a job's details.
function payWhy(job) {
  const p = job.expected_pay && !job.expected_pay.pending && !job.expected_pay.refused ? job.expected_pay : null;
  const l = job.lca_pay;
  if (!p && !l) return h("span", { "data-paywhy": job.key });
  return h("details", { class: "whyfit", "data-paywhy": job.key }, h("summary", {}, "How the pay was worked out"),
    h("ul", {},
      p ? [p.why.map(w => h("li", {}, w)), h("li", {}, link(p.url, p.credit + " ↗"))] : null,
      l ? [h("li", {}, h("b", {}, l.line)), l.why.map(w => h("li", {}, w)),
        h("li", {}, l.label + ". ", link(l.url, l.credit + " ↗"))] : null));
}

// Fills in expected pay that's still being looked up in the background, until none is left. One poll per
// `scope`, so the Details dialog doesn't stop the page's.
const payTimers = {};
function watchPay(jobs, scope = "page") {
  clearTimeout(payTimers[scope]);
  let tries = 0;
  const poll = async () => {
    const waiting = jobs.filter(j => j.expected_pay && j.expected_pay.pending);
    if (!waiting.length || ++tries > 60) return;
    try {
      const r = await api("/api/pay", { keys: waiting.map(j => j.key) });
      for (const j of waiting) {
        if (!(j.key in r.pay) || (r.pay[j.key] && r.pay[j.key].pending)) continue;
        j.expected_pay = r.pay[j.key];
        if (r.sources && r.sources[j.key]) j.pay_sources = r.sources[j.key];
        document.querySelectorAll(`[data-pay="${CSS.escape(j.key)}"]`).forEach(el => el.replaceWith(paySources(j)));
        document.querySelectorAll(`[data-paywhy="${CSS.escape(j.key)}"]`).forEach(el => el.replaceWith(payWhy(j)));
        // the advice and the bottom line again, now that the pay is known (a job applied to is past advice)
        if (r.advice && j.key in r.advice && !APPLIED.includes(j.status)) {
          Object.assign(j, r.advice[j.key]);
          document.querySelectorAll(`[data-advice="${CSS.escape(j.key)}"]`).forEach(el =>
            el.replaceWith(adviceLine(j) || noAdvice(j)));
          document.querySelectorAll(`[data-verdict="${CSS.escape(j.key)}"]`).forEach(el => el.replaceWith(verdictLine(j)));
        }
      }
      if (r.running) payTimers[scope] = setTimeout(poll, 5000);
    } catch { /* the page may be restarting: the next render tries again */ }
  };
  payTimers[scope] = setTimeout(poll, 3000);
}

// -- job cards

// One short place for the meta line: the first, "+N more" after it, the whole list on hover.
function placeSummary(locations) {
  return { first: locations[0] || "", more: Math.max(0, locations.length - 1), full: locations.join("; ") };
}
function placeItem(locations) {
  const p = placeSummary(locations);
  return p.first ? h("span", { class: "place", title: p.full }, h("span", { class: "pl" }, p.first),
    p.more ? h("span", { class: "more" }, `+${p.more} more`) : null) : null;
}

// The labeled rows of a job card, always in this order, each with its icon. The first five are on every card (a dash
// when there's nothing), so each sits in the same place; Check and Note come last, only when there is one.
const CARD_ROWS = [["pay", "Pay", "dollar"], ["why", "Why", "bulb"], ["gaps", "Gaps", "target"],
  ["skills", "Skills", "zap"], ["people", "People", "users"], ["check", "Check", "alert", true], ["note", "Note", "pencil", true]];
const hasKids = c => [c].flat(Infinity).some(k => k !== null && k !== undefined && k !== false);
const none = () => h("span", { class: "kv-none" }, "—");
function cardRows(parts, left = []) {  // `left`: rows this card leaves out (the Company tab's, for people shown beside it)
  return CARD_ROWS.filter(([key, , , optional]) => !left.includes(key) && (!optional || hasKids(parts[key]))).map(([key, label, ic]) =>
    h("div", { class: "krow", "data-row": key }, h("div", { class: "klabel" }, icon(ic, 13), label),
      h("div", { class: "kv" }, hasKids(parts[key]) ? parts[key] : none())));
}
// Where the advice goes once the pay is known (see the pay poll), a dash until then.
const noAdvice = job => h("span", { class: "kv-none", "data-advice": job.key }, "—");
// The card's bottom line, in plain words (advice.verdict): apply, apply as a stretch, hold off, skip it, or score it
// first (a job never scored, with only its pay to go on).
const VERDICT_ICON = { apply: "check", stretch: "zap", hold: "pause", skip: "x", score: "gauge" };
function verdictLine(job) {
  const v = job.verdict;
  if (!v || job.status === "snoozed") return h("span", { "data-verdict": job.key, hidden: true });  // already decided
  return h("div", { class: `verdict ${v.call}`, "data-verdict": job.key, title: v.text },
    h("span", { class: "vic" }, icon(VERDICT_ICON[v.call] || "check", 14)), h("span", { class: "vtext" }, v.text));
}
// Who you know there, one contact to a line (a few, then "+N more"), or the way to find an introduction.
function peopleRow(job, most = 2) {
  const shown = job.contacts.slice(0, most), rest = job.contacts.length - shown.length;
  const [whoButton, whoPanel] = job.key && job.title ? whoToContact(job) : [null, null];
  return [shown.map(p => contactBit(p, "div")),
    h("div", { class: "pmore" }, rest > 0 ? `+${rest} more · ` : null, referralLink(job), whoButton ? " · " : null, whoButton),
    whoPanel];
}

// "Who to contact": who the posting and your notes name for the job, the people you know there and LinkedIn searches to
// open yourself, then a note to one of them (a LinkedIn note of 300 characters or less, and an email), written when
// asked (see outreach.py). Nothing is sent or saved. Returns [button, panel].
const WHO_LABEL = { manager: "Hiring manager", recruiter: "Recruiter", interviewer: "Interviewer", lead: "Team lead",
  contact: "Contact", connection: "Someone you know there" };
function whoToContact(job) {
  const out = h("div", { class: "who", hidden: true });
  const b = h("button", { class: "btn ghost who-btn", title: "Whom to contact about this job: who its posting and your notes " +
    "name, people you know there and LinkedIn searches to open. A note to one of them is drafted only when you ask; " +
    "nothing is sent." }, icon("users", 13), "Who to contact");
  let found = null;
  const show = async () => {
    out.hidden = !out.hidden;
    if (out.hidden || found) return;
    fill(out, loadingNote("Looking…"));
    try { found = await api(`/api/contact?key=${encodeURIComponent(job.key)}`); render(); }
    catch (e) { fill(out, h("div", { class: "problems" }, e.message)); }
  };
  const write = async index => {
    out.classList.add("spin");
    out.prepend(h("div", { class: "muted small" }, busyNote("Writing the note…")));  // render() replaces it with the note
    try { render(await api("/api/contact", { key: job.key, index }), index); }
    catch (e) { render(null, null, e.message); }
    out.classList.remove("spin");
  };
  const note = (r, index) => {
    const li = h("textarea", { class: "who-linkedin", rows: 4, "aria-label": "LinkedIn note" }); li.value = r.linkedin;
    const count = h("div", { class: "who-count" });
    const tally = () => { count.textContent = `${li.value.length}/300`; count.classList.toggle("over", li.value.length > 300); };
    li.oninput = tally; tally();
    const subject = h("input", { class: "who-subject", type: "text", "aria-label": "Subject" }); subject.value = r.subject;
    const body = h("textarea", { class: "who-body", rows: 7, "aria-label": "Email body" }); body.value = r.body;
    const copy = (text, what) => async () => {
      try { await navigator.clipboard.writeText(text()); toast(`Copied the ${what}`); } catch { /* the text is on the page to select */ }
    };
    return h("div", { class: "who-note" },
      h("div", { class: "small muted" }, r.person ? `To ${r.person.name}` + (r.written_by ? ` · written by ${r.written_by}` : "") : "No one chosen"),
      li, count, h("div", { class: "row" }, h("button", { class: "btn", onclick: copy(() => li.value, "LinkedIn note") }, "Copy note")),
      subject, body,
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: copy(() => `Subject: ${subject.value}\n\n${body.value}`, "email") }, "Copy email"),
        h("button", { class: "btn ghost", onclick: () => write(index) }, "Redraft"),
        h("span", { class: "small muted" }, "A draft: read it and send it yourself.")),
      r.warnings.length ? h("div", { class: "problems" }, r.warnings.join("\n")) : null);
  };
  const render = (r = null, index = null, error = "") => {
    fill(out,
      found.existing ? h("div", { class: "who-existing" }, found.existing) : null,
      found.people.length ? found.people.map((p, n) => h("div", { class: "who-person" },
        h("b", { class: "who-name" }, p.url ? link(p.url, p.name) : p.name),
        h("span", { class: `who-role ${p.source === "connection" ? "connection" : ""}` }, WHO_LABEL[p.role] || "Contact"),
        p.title ? h("span", { class: "small" }, p.title) : null,
        h("span", { class: "who-why" }, p.why),
        h("button", { class: "btn ghost", onclick: () => write(n) }, `Write a note to ${p.name.split(" ")[0]}`)))
        : h("div", { class: "muted" }, "No one is named in the posting or your notes" +
          (found.has_connections ? ", and you know no one there" : "") + ". Search for someone below."),
      h("div", { class: "who-search" }, found.search.map(s => link(s.url, s.label))),
      error ? h("div", { class: "problems" }, error) : null,
      r ? note(r, index) : null);
  };
  b.onclick = show;
  return [b, out];
}

// Every job card has this skeleton: the header (logo, title, company · place · age; the ring top right), the labeled
// rows, `above` (the queue's note box) and the actions at the bottom. `stage` is a chip before the title, on the
// company page, where a job can be at any status. The company's name opens that page.
// A posting's state: "closed" (found closed twice, a second look at least hours later), "checking" (found closed
// once) or "" (open). The server sends closed_state; an older one sends only `closed`.
const closedState = j => j.closed_state !== undefined ? j.closed_state || "" : j.closed ? "closed" : "";
function closedBadge(job) {
  const on = localDay(job.closed), state = closedState(job);
  return state === "closed" ? h("span", { class: "badge closed", title: "The posting was taken down: found closed on two looks." },
      `closed ${fmtDay(on)}`)
    : state === "checking" ? h("span", { class: "badge checking", title: "Found closed once. jobwatch looks again before calling it closed." },
      "checking") : null;
}
// opts.people false: no People row (the Company tab lists the company's people once, in its left panel); opts.after is
// drawn under the rows (the "Who to contact" panel its action row opens).
function jobCard(job, actions, i = 0, above = null, stage = null, opts = {}) {
  const sep = () => h("span", { class: "sep" }, "·");
  const meta = [h("b", { class: "co", title: `See everything at ${job.company}`, role: "link", tabindex: 0,
    onclick: () => openCompany(job.company),
    onkeydown: e => { if (e.key === "Enter") openCompany(job.company); } }, job.company), placeItem(job.locations),
    age(job.age_days) ? h("span", { class: "posted", title: age(job.age_days) }, age(job.age_days).replace(/^posted /, "")) : null]
    .filter(Boolean);
  // An unscored job's "Score" button (scoreButton) has a twin that sits in the score slot, where the dash was.
  const scorer = job.fit ? null : actions.flat(Infinity).find(a => a && a.corner), corner = scorer?.corner;
  const parts = {
    pay: paySources(job),
    why: adviceLine(job) || noAdvice(job),
    check: [linkNote(job), job.warnings && job.warnings.length ? h("div", { class: "warns" }, job.warnings.join(" · ")) : null],
    gaps: gapsLine(job.fit, true),
    skills: job.keywords.length ? h("div", { class: "chips", title: job.keywords.join(", ") },
      job.keywords.map(k => h("span", { class: "chip hit" }, k))) : null,
    people: opts.people === false ? null : peopleRow(job),
    note: job.note && job.status !== "queued" ? h("div", { class: "note clamp", title: job.note }, job.note) : null,
  };
  return h("div", { class: `card job fit-${job.fit ? fitClass(job.fit.score) : "none"}`, id: "job-" + job.key,
    style: `--i:${Math.min(i, 12)}` },
    monogram(job.company, true),
    h("div", { class: "jc-id" },
      h("div", { class: "jc-title" },
        stage,
        job.status === "new" ? h("span", { class: "badge new" }, "new") : null,
        closedBadge(job),
        dupeBadge(job.duplicate_of), worthChip(job),
        job.same_title ? h("span", { class: "chip", title: `${job.same_title} more posting${job.same_title > 1 ? "s" : ""} with this title` },
          `+${job.same_title}`) : null,
        Object.assign(link(job.url, job.title, "title"), { title: job.title })),
      h("div", { class: "meta jc-meta" }, meta.flatMap((m, n) => n ? [sep(), m] : [m]))),
    h("div", { class: "jc-rows" }, cardRows(parts, opts.people === false ? ["people"] : []), opts.after),
    verdictLine(job),
    above ? h("div", { class: "jc-note" }, above) : null,
    h("div", { class: "row jc-foot" }, corner ? actions.flat(Infinity).filter(a => a !== scorer) : actions),
    fitBox(job.fit, job.key) || noFitBox(job, corner));
}

// The same opening (or maybe) as a job already applied to, queued or skipped: flagged, never hidden.
function dupeBadge(d) {
  if (!d) return null;
  return h("span", { class: "badge dupe" + (d.strong ? "" : " maybe"), title: d.text },
    d.strong ? d.label : "Possible duplicate");
}

// The server can take a moment to answer a button on a card (Queue checks for a duplicate, an application keeps its
// posting), so the click shows at once: the card dims and pulses, its buttons are off (no second click) and the one
// pressed turns into a spinner with a word for what's happening. pending() returns the function that undoes it all,
// for when the request fails.
let lastAct = null;  // the button being clicked: handlers don't get the event, but this sees it first
document.addEventListener("click", e => {
  lastAct = e.target.closest?.(".btn") || null;

}, true);

  remove: "Removing…" };
const SLOW_MS = 30000;  // a request that takes this long is called failed, so the card isn't stuck dimmed for good
function pending(card, btn = lastAct, text = "") {
  const buttons = card ? [...card.querySelectorAll("button, a.btn")] : btn ? [btn] : [];
  if (btn && !buttons.includes(btn)) btn = null;
  const was = buttons.map(b => [b, b.disabled]);
  card?.classList.add("pending");
  card?.setAttribute("aria-busy", "true");
  for (const b of buttons) {
    if (b.tagName === "BUTTON") b.disabled = true; else { b.setAttribute("aria-disabled", "true"); b.tabIndex = -1; }
  }

    label = btn.querySelector(".label") || btn;

    label.textContent = (text || BUSY[kind] || "Working…") + " ";  // a space, then the seconds
    spin = h("span", { class: "busy-spin", "aria-hidden": "true" });
    tick = h("span", {});  // the seconds, after the word (spinnerClock)
    btn.classList.add("busy");

    btn.append(tick);

const slowGuard = (call) => Promise.race([call, new Promise((_, no) => setTimeout(() => no(new Error(

async function mark(job, status, note, label, undoStatus) {
  const origin = document.activeElement;
  const done = pending(document.getElementById("job-" + job.key));
  let r;
  try { r = await slowGuard(api("/api/mark", { keys: job.keys || [job.key], status, note })); }
  catch (e) { done(); toast(e.message); return; }
  if (r.warning) label = `${label}. ${r.warning}`;
  const card = document.getElementById("job-" + job.key);
  if (status === "applied") { confetti(origin); label = `🎉 Applied: ${job.title}. ${cheer()}`; drawPace(); }
  await leave(card, status === "skipped" ? -1 : 1);
  if (tab === "today") {
    todayJobs = todayJobs.filter(j => j.key !== job.key);
    if (todayJobs.length && !main.querySelector(".card.job")) drawToday();
  }
  if (tab === "queue") {
    queueJobs = queueJobs.filter(j => j.key !== job.key);
    if (queueJobs.length && !main.querySelector(".card.job")) drawQueue();
  }
  refreshQueueCount();
  toast(label, undoStatus ? async () => {
    await api("/api/mark", { keys: job.keys || [job.key], status: undoStatus });
    render();
  } : null, TONES[status]);
  if (!main.querySelector(".card.job") && (tab === "today" || tab === "queue")) {
    const [title, text] = tab === "today"
      ? ["All caught up", "You've been through every match. New roles show up here when you check again."]
      : ["Queue cleared", "Every job you picked has been handled. Nicely done."];
    fill(main.querySelector(".cards") || main, h("div", { class: "empty done" }, h("div", { class: "big" }, "✨"),
      h("h2", {}, title), text));
    confetti(null, { count: 60, power: .8 });
  }
}

// The recurring actions (Queue, Apply, Skip, Details, Score, Prepare, I applied, Snooze, Remove) each keep one

// is aria-hidden), or the `aria-label` a caller gives. An `href` makes it a link. A third word is the name (and
// tooltip) of a button whose label is shorter than what it does.
const ACT = { queue: ["bookmark", "Queue"], apply: ["external", "Apply"], skip: ["x", "Skip"], details: ["info", "Details"],
  score: ["gauge", "Score"], prepare: ["sparkle", "Prepare"], applied: ["check", "I applied"], snooze: ["pause", "Snooze"],
  remove: ["minus", "Remove", "Remove from queue"] };
const actLabel = (kind, label = ACT[kind][1]) => [icon(ACT[kind][0], 14), h("span", { class: "label" }, label)];
function actButton(kind, attrs = {}, label = ACT[kind][1]) {
  const { class: more, ...rest } = attrs;
  const name = ACT[kind][2] && label === ACT[kind][1] ? { title: ACT[kind][2], "aria-label": ACT[kind][2] } : {};
  return h(attrs.href ? "a" : "button", { ...name, ...rest, class: `btn act act-${kind}` + (more ? ` ${more}` : "") },
    actLabel(kind, label));
}
function detailsButton(job) { return actButton("details", { onclick: () => openDetails(job.key) }); }

// Why a job has no fit score yet (the server's `unscored`: in line, no posting text, failed...).
// No Score button while it's being scored, or for a post listing several roles (never scored).
const NO_SCORE_BUTTON = ["scoring", "many_roles"];
const SCORING_WORD = "Scoring…";
const scoringNow = job => job.unscored?.code === "scoring";
function unscoredNote(job) {
  if (scoringNow(job)) return null;  // the card's ring spot shows a spinner instead (noFitBox)
  return job.unscored ? h("span", { class: "muted small", title: job.unscored.text }, job.unscored.text) : null;
}
// A job with no posting text gets it here. What a card offers depends on where the job came from (postingOffer):
//  - a job from a board has its link set by the board, so a link is only ever READ for its text: when the board's link
//    is the company's posting, "Read posting" reads it; when it only lists the job (an aggregator, the VC fund's own
//    board), a link box asks for the company's own page; either way the text can be pasted
//  - a job added by hand (or from an alert email) can have its link set too: the form is "Add the posting"
//  - a LinkedIn or Indeed link is read by the browser extension (readButton), unchanged.
// Hosts that list jobs without being the company's posting: a link there says where the job was found, not what it says.
const LISTING_HOST = /(^|\.)(theladders|ziprecruiter|glassdoor|simplyhired|builtin|builtinsf|wellfound|monster|dice|jooble|adzuna|careerbuilder|lensa|workatastartup|ycombinator)\.(com|org)$/i;
const isManual = job => job.manual ?? String(job.key).startsWith("manual:");
// Whether a board job's own link goes to the company's posting, not to a page that lists jobs: an aggregator, or the VC
// fund's own portfolio board (its key names the board: vc:<host/path>:<id>).
function linkIsPosting(job) {
  let host;
  try { host = new URL(job.url).hostname.toLowerCase().replace(/^www\./, ""); } catch { return false; }
  if (LISTING_HOST.test(host)) return false;
  if (String(job.key).startsWith("vc:")) {
    const board = job.key.slice(3).split("/")[0].toLowerCase().replace(/^www\./, "");
    if (board && (host === board || host.endsWith("." + board))) return false;
  }
  return true;
}
function postingOffer(job) {
  const manual = isManual(job), browser = BROWSER_POSTING.test(job.url || "");
  const direct = !!job.url && !browser && (manual || linkIsPosting(job));  // a link to read now
  const linkBox = manual || (!browser && !direct);  // a board's own link can't be replaced: a box only when it isn't the posting
  return { manual, browser, direct, linkBox,
    open: manual ? "Add the posting" : linkBox ? "Read posting" : "Paste the text instead" };
}
// An error from this form in plain words: the job's company and title (never its key) with what the server said.
function postingFailure(job, message) {
  const who = `${job.company}: ${job.title}`;
  const text = String(message || "Something went wrong").split(job.key).join(who);
  return text.includes(job.title) ? text : `${who}: ${text}`;
}
const SAVED_SHOWN_MS = 900;  // how long "Saved: now scoring" stays up before the card changes
function postingControls(job, done) {
  const offer = postingOffer(job);
  // Under the buttons, until the next try: what went wrong, in words (also a toast, which is gone in seconds)
  const msg = h("div", { class: "post-msg", role: "alert", hidden: true });
  const say = (text, tone) => { msg.textContent = text || ""; msg.dataset.tone = tone || ""; msg.hidden = !text; };
  // The one call every button of this form makes: spinner while it works, the answer shown, then the card changes.
  const send = async (body, button, idle, working) => {
    button.disabled = true;
    const stop = buttonBusy(button, working, { usual: "posting" });  // the seconds say it is running, not stuck
    say("");
    try {
      const r = await api("/api/posting", { key: job.key, ...body });
      stop(!!r.has_text);  // a read that got text teaches the estimate for the next one
      const saved = r.has_text ? (r.scoring === false || r.not_scored ? "Saved" : "Saved: now scoring") : "Saved";
      button.replaceChildren(saved);
      say(`${saved}. ${r.said}`, "ok");
      toast(readToast(r));
      setTimeout(() => done(r, "form"), SAVED_SHOWN_MS);
    } catch (e) {
      stop();
      const text = postingFailure(job, e.message);
      say(text, "error");
      toast(text);
      button.disabled = false;
      button.replaceChildren(...idle);
    }
  };
  const read = !offer.direct ? null : h("button", { class: "btn primary", title: `Read the posting at ${new URL(job.url).hostname.replace(/^www\./, "")}` +
      ", save its text and score the job (the job's link is not changed)" }, "Read posting");
  if (read) read.onclick = () => send({ url: job.url }, read, ["Read posting"], "Reading…");
  const open = h("button", { class: offer.linkBox && !offer.manual ? "btn primary" : "btn",
    title: offer.manual ? "Add a link to the company's posting, or paste its text, so it can be scored"
      : offer.linkBox ? "Give the company's own page for this job, or paste its text, so it can be scored"
      : "Paste the posting's text instead of reading it" }, offer.open);
  open.onclick = () => {
    const id = `post-url-${job.key.replace(/\W/g, "-")}`;
    const url = !offer.linkBox ? null : h("input", { type: "url", id, placeholder: "https://…" });
    const text = h("textarea", { rows: 4, placeholder: offer.linkBox ? "…or paste the posting's text" : "Paste the posting's text" });
    const label = offer.manual ? "Link to the company's posting"
      : "Link to the company's own posting (only used to read the text)";
    const save = h("button", { class: "btn primary" }, offer.linkBox && !offer.manual ? "Read posting" : "Save");
    const idle = [save.textContent];
    save.onclick = () => send({ ...(url ? { url: url.value } : {}), text: text.value }, save, idle,
      !offer.manual && url?.value.trim() && !text.value.trim() ? "Reading…" : "Saving…");
    // Where a read button is also there, the form is only for pasting; the box only when a link can be given
    const form = h("div", { class: "post-form" }, url ? h("label", { for: id }, label) : null, url, text, h("div", {}, save));
    open.replaceWith(form);
    (url || text).focus();

}

// A job from a LinkedIn alert: opens its LinkedIn page in a new tab (jobwatch never reads linkedin.com itself). There,
// the extension's "Open the company's posting" presses LinkedIn's Apply button, and the company's page fills the job in.
function linkedinButton(job) {
  if (!/^https?:\/\/([\w-]+\.)?linkedin\.com\/jobs\//i.test(job.url || "")) return null;
  return h("a", { class: "btn", href: job.url, target: "_blank", rel: "noopener",
    title: "Open the job on LinkedIn. With the jobwatch browser extension, click its icon there and choose \"Open the " +
      "company's posting\" to get to the company's own page for it." }, "Open on LinkedIn ↗");
}

// A job from a LinkedIn or Indeed alert: those sites show a posting only to a signed-in browser, so jobwatch can't read it.
// This opens it in a new tab with #jobwatch-read in the address; the jobwatch browser extension (which reads nothing
// there otherwise) copies the posting's text to jobwatch and closes the tab. Back here, the card fills in.
const BROWSER_POSTING = /^https?:\/\/([\w-]+\.)?(linkedin\.com\/jobs\/view\/|indeed\.com\/(m\/)?(viewjob|rc\/clk))/i;
// With the extension's page bridge (chrome-extension/page-bridge.js marks <html data-jobwatch-bridge>) the posting opens
// in a tab behind this one, so the person keeps their place, and `done(answer)` updates just this card when it is read.
// Without it the tab opens in front, and coming back redraws the page where it was. This page is served by the latest
// jobwatch and must work with any extension version (a Web Store release lags): the bridge also says what the extension
// can do (<html data-jobwatch-caps="readInBackground">, set once it answers a ping; an older extension answers with an
// empty list), and an extension that still says "unknown message" to the request is treated the same way. Both end in
// the tab opening in front, with a one-time hint to update or reload the extension.
const readWaiting = new Map(); // job key -> what to do with the extension's answer
window.addEventListener("message", e => {
  if (e.source === window && e.data?.type === "jobwatch:read-posting-done") readWaiting.get(e.data.key)?.(e.data);
});

const EXTENSION_HINT = "Update or reload the jobwatch extension to read in the background.";
function readsInBackground() {
  const d = document.documentElement.dataset;
  if (d.jobwatchBridge !== "1") return false;
  return d.jobwatchCaps === undefined || d.jobwatchCaps.split(" ").includes("readInBackground"); // no answer yet: try it
}
function extensionHintOnce() {  // the hint, once per browser session: "" after that
  try {
    if (sessionStorage.getItem("readHintShown")) return "";
    sessionStorage.setItem("readHintShown", "1");
  } catch { /* no storage: say it each time */ }
  return " " + EXTENSION_HINT;
}
async function redrawInPlace() {
  const y = window.scrollY;
  await render();
  window.scrollTo(0, y);
}
// What Read posting says when it's done. A posting found closed (the site's banner, a 404 or 410, the board's mark) is
// not scored: the server says so in not_scored ({code, text, said}), and the toast leads with it.
const readToast = r => r.not_scored ? `Read it: ${r.not_scored.said}.` : r.said;
// A read that scores (the job is open) leaves the card "scoring now"; one that found it closed leaves the reason, and
// the card's Score button, which scores it anyway
function afterRead(job, r, how = "") {
  if (r.not_scored) job.unscored = { code: r.not_scored.code, text: r.not_scored.text };
  else if (r.has_text) job.unscored = how === "form" && !r.scoring ? { code: "queued", text: "Posting added: in line to score" }
    : { code: "scoring", text: "Posting read: scoring it now…" };
}
function readButton(job, done) {
  if (!BROWSER_POSTING.test(job.url || "")) return null;
  const site = /indeed/i.test(job.url) ? "Indeed" : "LinkedIn";
  const b = h("button", { class: "btn primary", title: `Open the posting on ${site} in a new tab (you need to be signed in). ` +
      "The jobwatch browser extension reads its text, gives it to jobwatch and closes the tab." }, "Read posting ↗");
  // The way every extension version reads: the tab opens in front, reads itself and closes; coming back redraws in place.
  const openInFront = (hint = false) => {
    window.open(job.url.split("#")[0] + "#jobwatch-read", "_blank", "noopener");
    toast(`Opened on ${site}. The extension reads the posting and closes the tab: come back here.` + (hint ? extensionHintOnce() : ""));
    window.addEventListener("focus", () => setTimeout(redrawInPlace, 1500), { once: true });
  };
  b.onclick = () => {
    if (!done || !readsInBackground()) return openInFront(document.documentElement.dataset.jobwatchBridge === "1" && !!done);
    b.disabled = true;
    const stop = buttonBusy(b, "Reading…", { usual: "read" });
    readWaiting.set(job.key, r => {
      readWaiting.delete(job.key);
      stop(r.ok);
      b.disabled = false;
      b.textContent = "Read posting ↗";

      if (!r.ok) return toast(`Couldn't read the posting: ${r.error}`);
      toast(readToast(r));

function scoreButton(job, canScore, card = j => todayCard(j, canScore, 0)) {
  if (job.fit && !job.fit.stale) return null;
  const redraw = j => document.getElementById("job-" + j.key)?.replaceWith(card(j));  // (gone if its tab was left)
  if (job.unscored?.code === "no_text")
    return [postingControls(job, (r, how) => {  // read in the background: this card alone changes
      // jobwatch scores a job as soon as its posting is read (whatever scoring.auto says): the card waits for the
      // "score" event (listenForEvents), or "score-failed". A text added by hand waits in the scorer's line. A posting
      // found closed is not scored: afterRead leaves the reason.
      afterRead(job, r, how);
      if (r.closed) Object.assign(job, { closed_state: "closed", closed: new Date().toISOString() });
      else if (r.not_scored) Object.assign(job, { closed_state: r.not_scored.code, closed: job.closed || new Date().toISOString() });
      if (document.getElementById("job-" + job.key)) redraw(job);
    }), linkedinButton(job), unscoredNote(job)];
  if (!canScore || NO_SCORE_BUTTON.includes(job.unscored?.code)) return unscoredNote(job);
  // Two buttons, one handler and one label: the bottom row's "Score" and the card's corner one (jobCard puts that one
  // where the empty score slot was and drops the bottom one). Either press sets both to "Scoring…".
  const title = "Compare this posting with your resume (can take a while)";
  const idle = () => actLabel("score");
  const b = actButton("score", { title });
  const corner = actButton("score", { class: "score-corner", title });
  const run = async () => {
    // both buttons tick together (one key), and a score that comes back teaches the estimate for the next one
    const stops = [b, corner].map(x => { x.disabled = true; return buttonBusy(x, SCORING_WORD, { key: "score-button:" + job.key, usual: "score" }); });
    try {
      job.fit = await api("/api/score", { key: job.key });
      stops.forEach((stop, i) => stop(i === 0));  // one run, counted once
      Object.assign(job, (await fetchAdvice([job.key]))[job.key] || {});  // the card is drawn again from `job`
      redraw(job);
    } catch (e) {
      stops.forEach(stop => stop());
      for (const x of [b, corner]) x.disabled = false;
      b.replaceChildren(...idle()); corner.replaceChildren(...idle()); toast(e.message);
    }
  };
  b.onclick = corner.onclick = run;
  b.corner = corner;
  return [b, unscoredNote(job)];
}

// "Snooze": not a no, only not while an application is in progress at the same company. The job comes back to the
// queue when that application ends, or after store.SNOOZE_DAYS (many companies never say no). `act(status, label)`
// marks it. No button when there's nothing to wait for.
const SNOOZE_LIMIT = "3 weeks";
function snoozeButton(job, act) {
  const on = job.waiting_on || [];
  if (!on.length || closedState(job) === "closed" || job.status === "snoozed") return null;
  const what = on.length === 1 ? `your ${on[0].title} application` : `your ${on.length} applications there`;
  return actButton("snooze", { title: `Set it aside while ${what} is in progress. It comes back to your queue ` +
      `when ${on.length === 1 ? "that ends" : "they end"}, or in ${SNOOZE_LIMIT} if there's no news.`,
    onclick: () => act("snoozed", `😴 Snoozed: ${job.title}. Back in your queue when ${what} ends, or in ${SNOOZE_LIMIT}.`) });
}

// Opens the application form in a new tab (a link, so the browser lets it open); `then` runs alongside, e.g.
// queueing the job. The jobwatch browser extension fills the form there and records it when it's submitted.
function applyButton(job, then) {
  if (closedState(job) === "closed" || !(job.apply_url || job.url)) return null;
  return actButton("apply", { href: job.apply_url || job.url, target: "_blank", rel: "noopener",
    "aria-label": "Apply (opens the application form in a new tab)",
    title: "Open the application form. With the jobwatch browser extension, click its icon there to fill " +
      "the form; it marks the job applied when you submit.", onclick: () => then && then() });
}

// "Prepare" on a queued job runs three steps in order and keeps each result with the job: a tailored resume, the ATS
// check of that resume against the posting, and a cover letter draft. Each step is a panel that draws its own
// result ({ el, run }: run() does the step and answers [state, text], the state being ok, warn, err or skip), and a
// strip of chips above them says how far it got. Nothing is sent or submitted: you review all three, then apply.
//
// The resume step: resume-kit drafts a version from the posting and builds its PDF (seconds), kept as this job's
// resume, which the extension attaches. Updates in place, and says to review the PDF before applying. When
// resume-kit isn't set up, the panel says how to (job.tailor_setup). `job.resume` is the name kept so far.
function tailorResultLine(r) {
  const pages = r.pages == null ? "" : `${r.pages} page${r.pages === 1 ? "" : "s"}`;
  return [r.new ? "new" : "rebuilt", pages, r.ok ? "ok" : "needs a look"].filter(Boolean).join(" · ");
}
function tailorPanel(job) {
  const out = h("div", { class: "tailor", "data-step": "tailor" });
  const draw = r => {
    out.hidden = !(job.resume || r || job.tailor_help);
    out.dataset.tone = r ? (r.ok ? "ok" : "warn") : job.tailor_help ? "warn" : "";
    fill(out,
      job.tailor_help ? h("span", { class: "problems" }, job.tailor_help) : null,
      job.resume ? [h("span", {}, "Resume: "), h("button", { class: "open", title: `Open ${job.resume} to review it`,
        onclick: () => openStored(job.key, job.resume) }, icon("file", 14), job.resume, " ↗")] : null,
      r ? h("span", { class: "badge" + (r.ok ? "" : " warn") }, tailorResultLine(r)) : null,
      r ? h("span", { class: "small" }, `version ${r.version}`) : null,
      r && r.problems.length ? h("div", { class: "problems" }, r.problems.join("\n")) : null,
      r ? h("div", { class: "review small" }, "Review this PDF before you apply: the page picks your confirmed facts " +
        "by what the posting asks for, but the headline and summary are the ones your version already had.") : null);
