function drawApplied(d) {
  const all = d.applications;
  const counts = {};
  for (const a of all) counts[a.status] = (counts[a.status] || 0) + 1;
  const isEnded = a => isEndedStatus(a.status);
  const talking = all.filter(a => ["screening", "interviewing", "offer"].includes(a.status)).length;
  const week = all.filter(a => !isEnded(a) && a.follow_up && a.follow_up <= addDays(d.today, 7)).length;
  const dueCount = all.filter(freshDue).length;
  const quietCount = all.filter(a => a.quiet).length;
  const snoozedCount = all.filter(a => appGroup(a) === "snoozed").length;
  const closedCount = all.filter(isEnded).length;
  const liveFilter = h("div", { class: "live-filter" });
  const drawLive = () => fill(liveFilter,
    segmented([["all", "All"], ["live", `Live ${all.filter(a => appLiveMatch(a, "live", d.today) && !isEnded(a)).length}`],
      ["waiting", `Waiting ${all.filter(a => appLiveMatch(a, "waiting", d.today)).length}`]], appView.live,
      v => { appView.live = v; remember("apps.live", v); draw(); }),
    h("span", { class: "small muted" }, "Live: screening, interviewing, offer. Waiting: applied, follow-up ahead."));
  const addArea = h("div", {}), body = h("div", {}), showing = h("div", { class: "showing" }), pager = h("div", {});
  const filters = h("div", { class: "status-filter", role: "group", "aria-label": "Filter by status" });
  const search = h("input", { type: "search", placeholder: "Search companies, roles, notes" });
  search.value = appView.q;
  search.oninput = () => { appView.q = search.value; draw(); };
  const pick = s => { appView.stage = appView.stage === s ? "" : s; redraw(); };
  const stages = h("div", {});
  const drawStages = () => fill(stages, d.stages.filter(s => counts[s]).map(s =>
    h("button", { class: "facet" + (appView.stage === s ? " on" : ""), style: `--sc:var(--s-${s})`, onclick: () => pick(s) },
      h("span", {}, h("i", { class: "dot" }), STAGE_NAMES[s]), h("span", { class: "c" }, counts[s]))));
  // The same filter as a row of chips over the list: All, Follow up now, then each stage in use.
  const drawFilters = () => fill(filters,
    [["", "All", all.length, null], dueCount ? ["due", "Follow up now", dueCount, "var(--warn)"] : null,
      quietCount ? ["quiet", "Gone quiet", quietCount, "var(--muted)"] : null,
      snoozedCount ? ["snoozed", "Snoozed", snoozedCount, "#0ea5e9"] : null,
      ...d.stages.filter(s => counts[s]).map(s => [s, STAGE_NAMES[s], counts[s], `var(--s-${s})`])].filter(Boolean)
      .map(([s, label, n, color]) => h("button", { class: "sf" + (appView.stage === s ? " on" : ""),
        style: color ? `--sc:${color}` : null, "aria-pressed": appView.stage === s ? "true" : "false",
        onclick: () => { appView.stage = s; redraw(); } },
        color ? h("i", { class: "dot" }) : null, label, h("span", { class: "c" }, n))));
  const redraw = () => { drawStages(); drawFilters(); draw(); };

  const draw = () => {
    const q = appView.q.trim().toLowerCase();
    const apps = all.filter(a => (!appView.stage || (appView.stage === "due" ? freshDue(a) : appView.stage === "quiet" ? a.quiet
      : appView.stage === "snoozed" ? appGroup(a) === "snoozed" : a.status === appView.stage)) &&
      appLiveMatch(a, appView.live, d.today) &&
      (!q || `${a.company} ${a.title} ${a.note || ""} ${a.next_step || ""}`.toLowerCase().includes(q)));
    const table = appView.view === "table";
    // Cards come grouped live first (due, live, quiet, waiting) with the snoozed and closed ones folded away below;
    // the table is sorted, and a page is a slice of that order.
    const g = name => apps.filter(a => appGroup(a) === name);
    const ordered = table ? sortApps(apps, d) : [...g("due"), ...g("live"), ...g("quiet"), ...g("waiting")];
    const pg = paged(ordered, appView, JSON.stringify([appView.stage, appView.live, q, appView.view, appView.sort, appView.dir]), draw);
    const page = pg.items;
    const inPage = name => page.filter(a => appGroup(a) === name);
    const snoozed = g("snoozed"), closed = g("closed");
    // A fold opens by itself when what you picked or searched for is inside it.
    const wanted = name => appView.open[name] || appView.stage === name || (name === "closed" && isEndedStatus(appView.stage))
      || (q && (name === "closed" ? closed : snoozed).length > 0);
    let i = 0;
    const group = (title, list, cls, n) => list.length
      ? [section(title, n, cls), h("div", { class: "grid-cards" }, list.map(a => appCard(a, d, i++)))] : null;
    // A collapsed section: its cards are built only when it is opened (73 closed ones would slow every redraw).
    const fold = (name, title, list, hint) => {
      if (!list.length) return null;
      const body = h("div", { class: "fold-body" }), el = h("details", { class: "fold " + name },
        h("summary", {}, title, h("span", { class: "n" }, list.length), hint ? h("span", { class: "hint" }, hint) : null), body);
      const build = () => { if (!body.childNodes.length) fill(body, h("div", { class: "grid-cards" }, list.map(a => appCard(a, d, 0)))); };
      el.addEventListener("toggle", () => { appView.open[name] = el.open; if (el.open) build(); });
      if (wanted(name)) { el.open = true; build(); }
      return el;
    };
    const nextWake = snoozed.map(a => a.snoozed_until).sort()[0];
    fill(showing, (apps.length === all.length ? `${all.length} applications` : `Showing ${apps.length} of ${all.length}`) +
      (pg.range ? ` · ${pg.range}` : ""),
      apps.length !== all.length ? h("button", { class: "btn ghost", onclick: () => {
        appView.stage = ""; appView.q = ""; appView.live = "all"; remember("apps.live", "all"); search.value = ""; drawLive(); redraw(); } }, "Clear filters") : null,
      h("span", { class: "spacer" }),
      segmented([["cards", "Cards"], ["table", "Table"]], appView.view, v => { appView.view = v; remember("apps.view", v); draw(); }));
    fill(body, all.length ? null : emptyState("No applications yet. Mark a queued job “I applied”, or add one you " +
        "applied to somewhere else. The first one is the hardest."),
      all.length && !apps.length ? emptyState("No applications match.", appView.q.trim() ? elsewhere(appView.q) : null) : null,
      !apps.length ? null : table ? appTable(page, d, draw)
        : [group("Follow up now", inPage("due"), "hot", g("due").length), group("Live", inPage("live"), "live", g("live").length),
          group("Gone quiet", inPage("quiet"), "quiet", g("quiet").length),
          group("Waiting to hear", inPage("waiting"), null, g("waiting").length),
          fold("snoozed", "Snoozed", snoozed, nextWake ? `next back ${fmtDay(nextWake, d.today)}` : ""),
          fold("closed", "Closed", closed, "rejected, withdrawn and closed by company")]);
    fill(pager, pg.nav);
  };

  put(
    pagehead("Applications", "What needs you and what is live come first. Snoozed and closed ones are folded away below.",

// Every application as one row: sort by a column's header, change a stage in place, open the details.
const APP_COLUMNS = [
  ["company", "Company"], ["title", "Role"], ["status", "Stage"], ["applied_at", "Applied"],
  ["next", "Next step"], [null, "Sent", "col-sent"], [null, ""]];

// The table's order: the column picked (appView.sort), either way (appView.dir).
function sortApps(apps, d) {
  const byNext = a => [freshDue(a) ? 0 : isEndedStatus(a.status) ? 2 : 1, a.follow_up || "9999", a.applied_at ? -Date.parse(a.applied_at) : 0];
  const key = {
    company: a => [a.company.toLowerCase()], title: a => [a.title.toLowerCase()],
    status: a => [d.stages.indexOf(a.status)], applied_at: a => [a.applied_at || ""], next: byNext }[appView.sort];
  const cmp = (x, y) => { for (let n = 0; n < x.length; n++) if (x[n] !== y[n]) return x[n] < y[n] ? -1 : 1; return 0; };
  return [...apps].sort((a, b) => cmp(key(a), key(b)) * appView.dir);
}

function appTable(rows, d, redraw) {
  const head = h("tr", {}, APP_COLUMNS.map(([k, label, cls]) => k
    ? h("th", { "aria-sort": appView.sort === k ? (appView.dir > 0 ? "ascending" : "descending") : null },
      h("button", { class: "sort" + (appView.sort === k ? " on" : ""), onclick: () => {
        appView.dir = appView.sort === k ? -appView.dir : 1; appView.sort = k; redraw(); } },
        label, h("span", { class: "arrow" }, appView.sort === k ? (appView.dir > 0 ? "↑" : "↓") : "")))
    : h("th", { class: cls }, label)));
  return h("div", { class: "table-wrap" }, h("table", { class: "apps" },
    h("thead", {}, head), h("tbody", {}, rows.map(a => appRow(a, d)))));
}

function isEndedStatus(s) { return s === "rejected" || s === "withdrawn" || s === "closed"; }

// A job's card on the page being shown (a Today or Queue card, an Applications card), scrolled to and pinged; false
// when there is none on this page.
function jumpToCard(key) {
  const card = document.getElementById("job-" + key) || [...document.querySelectorAll(".card.app")].find(c => c.dataset.key === key);
  if (!card) return false;
  card.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" });
  card.classList.remove("ping"); void card.offsetWidth; card.classList.add("ping");
  return true;
}

// Which tab a job's card is on, by its status: Today (new, shown), Queue, Applications (every stage and the ended
// ones). A skipped or snoozed job has no card: its details open.
const CARD_TAB = { new: "today", shown: "today", queued: "queue", applied: "applied", screening: "applied",
  interviewing: "applied", offer: "applied", rejected: "applied", withdrawn: "applied", closed: "applied" };
const TAB_NAMES = { today: "Today", queue: "Queue", applied: "Applications" };

// Open a job from where it is named (an Activity row: {key, status}): its card on its tab, scrolled to and pinged;
// its details when it has no card, or the tab doesn't list it (Today's filters hide it, say).
async function openJobCard(ref) {
  const name = CARD_TAB[ref.status];
  if (!name) return openDetails(ref.key);
  if (tab !== name) await go(name);
  for (let i = 0; i < 15; i++) {  // a tab draws its cards a moment after its data arrives
    if (jumpToCard(ref.key)) return;
    await new Promise(r => setTimeout(r, 100));
  }
  openDetails(ref.key);
}

// Postings of your applications and queued jobs that were taken down, kept until cleared (see closed_notice.py):
// each links to its card (or its details when the card isn't on this page), with a Got it button that only hides
// the notice, and a "live" marker on an application still in process.
function closedStrip(d) {
  const list = d.closed_notices || [];
  if (!list.length) return null;
  const go = n => { if (!jumpToCard(n.key)) openDetails(n.key); };
  const clear = async body => { try { await api("/api/closed/dismiss", body); render(); } catch (e) { toast(e.message); } };
  // Closed by company (an applied application) and Skip (a queued job) change the status, so each asks inline first
  // and is undoable for 8 seconds; a live application (screening, interviewing, offer) only gets "Got it".
  const act = async (action, body) => {
    try {
      const r = await api("/api/closed/act", { action, ...body });
      toast(action === "skip" ? "Skipped." : `${r.done === 1 ? "1 application" : r.done + " applications"} marked closed by the company.`,
        async () => { await api("/api/closed/undo", { undo: r.undo }); render(); }, "onward", "Undo", 8000);
      render();
    } catch (e) { toast(e.message); }
  };
  const BUTTON = { close: "Closed by company", skip: "Skip" };
  const ASK = { close: "Mark this application Closed by company? You can change the status back.",
    skip: "Skip this job? You can change the status back." };
  const applied = list.filter(n => n.action === "close");
  const el = h("div", { class: "closed-strip", role: "region", "aria-label": "Closed postings" });
  let asking = null;  // a row's key, or "all", waiting on its inline confirm
  const confirm = (text, yes, no) => h("span", { class: "cs-confirm" }, h("span", { class: "small" }, text),
    h("button", { class: "btn primary", onclick: yes }, "Yes"), h("button", { class: "btn ghost", onclick: no }, "Cancel"));
  const draw = () => fill(el,
    h("div", { class: "cs-head" }, h("b", {}, `Closed postings (${list.length})`),
      h("span", { class: "small muted" }, "taken down by the company since you last looked"), h("span", { class: "spacer" }),
      asking === "all" ? confirm(`Mark ${applied.length} application${applied.length === 1 ? "" : "s"} Closed by company? You can change the status back.`,
        () => act("close", { all: true }), () => { asking = null; draw(); })
        : applied.length > 1 ? h("button", { class: "btn ghost", onclick: () => { asking = "all"; draw(); },
          title: "Marks every applied application in this list Closed by company. Screening and interviewing ones are left alone." },
          "Closed by company, all applied") : null,
      list.length > 1 && asking !== "all" ? h("button", { class: "btn ghost", title: "Clears these notices. Your applications stay tracked.",
        onclick: () => clear({ all: true }) }, "Got it, all") : null),
    h("div", { class: "small muted cs-note" }, "Clearing a notice only hides it here. Nothing is removed or changed in your applications."),
    list.map(n => h("div", { class: "cs-row" },
      h("span", { class: "cs-what", title: `${n.company}: ${n.title}` },
        h("a", { onclick: () => go(n) }, `${n.company}: ${n.title}`)),
      LIVE_STAGES.includes(n.status) ? h("span", { class: "cs-live", title: "This application is still in process: a closed posting is not a rejection." }, "live") : null,
      h("span", { class: "cs-meta" }, `${n.application ? STAGE_NAMES[n.status] || n.status : "queued"} · closed ${fmtDay(n.day, d.today)}`),
      asking === n.key ? confirm(ASK[n.action], () => act(n.action, { key: n.key }), () => { asking = null; draw(); }) : [
        n.action ? h("button", { class: "btn ghost", onclick: () => { asking = n.key; draw(); },
          title: n.action === "skip" ? "Skip this queued job: its posting is gone." : "The company took the posting down: mark the application Closed by company." },
          BUTTON[n.action]) : null,
        h("button", { class: "btn ghost", title: "Clears this notice. The application stays tracked.",
          onclick: () => clear({ key: n.key }) }, "Got it")])));
  draw();
  return el;
}
const LIVE_STAGES = ["screening", "interviewing"];

// A stage picked on a card or a table row: save it, cheer the good news, offer an undo.
async function changeStage(a, d, stage) {
  const before = a.status;
  try {
    const to = stage.value;
    await api("/api/track", { key: a.key, status: to });
    const forward = d.stages.indexOf(to) > d.stages.indexOf(before) && !isEndedStatus(to);
    toast(stageWords(a.company, to), async () => { await api("/api/track", { key: a.key, status: before }); render(); },
      TONES[to]);
    if (to === "offer") { confetti(null, { count: 220, power: 1.4 }); setTimeout(() => confetti(stage, { count: 80 }), 350); }
    else if (forward) confetti(stage, { count: 70, power: .8 });
    render();
  } catch (e) { toast(e.message); stage.value = before; }
}

// The bell on an application card (only when the watchlist has follow_ups: reminders): a popover for a one-off
// Apple Reminders reminder, with a title ("Company: "), a day and time and an optional note.
function bellButton(a) {
  const wrap = h("span", { class: "bell-wrap" });
  const close = () => { wrap.querySelector(".bell-pop")?.remove(); document.removeEventListener("click", away, true); };
  const away = e => { if (!wrap.contains(e.target)) close(); };
  const open = () => {
    if (wrap.querySelector(".bell-pop")) return close();
    const title = h("input", { type: "text" }); title.value = `${a.company}: `;
    const soon = new Date(Date.now() + 86400000), pad = n => String(n).padStart(2, "0");
    const when = h("input", { type: "datetime-local" });
    when.value = `${soon.getFullYear()}-${pad(soon.getMonth() + 1)}-${pad(soon.getDate())}T09:00`;
    const note = h("textarea", { rows: 2, placeholder: "Optional note" });
    const save = async () => {
      try {
        await api("/api/remind", { key: a.key, title: title.value, due: when.value, note: note.value });
        close(); toast(`Reminder set for ${when.value.replace("T", " ")}: ${title.value.trim()}`);
      } catch (e) { toast(e.message); }
    };
    title.onkeydown = e => { if (e.key === "Enter") save(); if (e.key === "Escape") close(); };
    wrap.append(h("div", { class: "bell-pop", role: "dialog", "aria-label": "Remind me" },
      h("div", {}, h("label", {}, "Title"), title), h("div", {}, h("label", {}, "When"), when),
      h("div", {}, h("label", {}, "Note"), note),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: close }, "Cancel"),
        h("button", { class: "btn primary", onclick: save }, "Remind me"))));
    document.addEventListener("click", away, true);
    title.focus(); title.setSelectionRange(title.value.length, title.value.length);
  };
  wrap.append(h("button", { class: "btn ghost", onclick: open, title: "Remind me about this (Apple Reminders)",
    "aria-label": "Remind me" }, icon("bell", 14)));
  return wrap;
}

// Under a quiet application: how long, what to do next (never done for you), and one-click ways to do it.
function quietBar(a, d) {

  };
  view();
  return bar;

    h("h3", {}, queued ? "Add a job " : "Add an application ", h("span", { class: "hint" },
      queued ? "you found somewhere else, to look at before applying: LinkedIn, a referral, a recruiter"
        : "for a job you found somewhere else: a referral, a recruiter, LinkedIn")),
    h("label", {}, "Link to the posting ", h("span", { class: "hint" }, "on its own is enough for a board jobwatch reads")), url,
    h("div", { class: "grid" },
      h("div", {}, h("label", {}, "Company"), company), h("div", {}, h("label", {}, "Job title"), title),
      stage ? h("div", {}, h("label", {}, "Stage"), stage) : null),
    h("label", {}, "The posting ", h("span", { class: "hint" }, "(optional)")), text,
    f ? f.el : null,
    h("div", { class: "row actions" }, add, h("button", { class: "btn", onclick: () => card.remove() }, "Cancel"), msg));
  setTimeout(() => url.focus(), 0);
  return card;
}

// -- settings

function lines(v) { return (v || []).join("\n"); }
// One per line, or comma-separated; a comma inside brackets or after a backslash is a pattern's own (`{0,40}`, `[,;]`).
function unlines(v) {
  const out = [];
  for (const line of v.split("\n")) {
    let depth = 0, from = 0;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === "\\") i++;
      else if ("([{".includes(c)) depth++;
      else if (")]}".includes(c)) depth = Math.max(0, depth - 1);
      else if (c === "," && !depth) { out.push(line.slice(from, i)); from = i + 1; }
    }
    out.push(line.slice(from));
  }
  return out.map(s => s.trim()).filter(Boolean);
}
// Places and company names, one per line: "Boulder, CO" is one place, "Initech, Inc." one company.
function placeLines(v) { return v.split("\n").map(s => s.trim()).filter(Boolean); }

// A setting in Settings: a short label, its input, and a line of help under it (so inputs side by side line up).
function field(label, input, help, cls) {
  const f = h("div", { class: "field" + (cls ? " " + cls : "") + (help ? " has-help" : "") }, h("label", {}, label,
    help ? h("span", { class: "qm", role: "button", tabindex: "0", title: help, "aria-label": "Help",
      onclick: e => { e.preventDefault(); f.classList.toggle("open"); e.currentTarget.classList.toggle("on"); },
      onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.currentTarget.click(); } } }, "?") : null),
    input, help ? h("div", { class: "help" }, help) : null);
  return f;
}
// Inputs for settings that may be left blank: blank is the default, shown as the placeholder.
function numInput(value, placeholder, { min = 0, max, step = 1 } = {}) {
  const i = h("input", { type: "number", min, max, step, placeholder: placeholder ?? "" });
  i.value = value ?? "";
  return i;
}
function textInput(value, placeholder) {
  const i = h("input", { type: "text", placeholder: placeholder ?? "" });
  i.value = value ?? "";
  return i;
}
function areaInput(list, placeholder) {
  const t = h("textarea", { placeholder: placeholder ?? "" });
  t.value = lines(list);
  return t;
}
function choice(options, value) {
  const s = h("select", {}, options.map(([v, label]) => h("option", { value: v }, label)));
  s.value = value ?? "";
  return s;
}
function checkLine(on, text) {
  const box = h("input", { type: "checkbox" });
  box.checked = !!on;
  return { box, el: h("label", { class: "check" }, box, h("span", {}, text)) };
}
function numberOf(i) { return i.value.trim() === "" ? null : Number(i.value); }
function textOf(i) { return i.value.trim() || null; }
// A watchlist section as saved, with these settings set; one left blank (null) is left out, for its default.
// Settings in it that the page doesn't edit are kept. null when nothing's left.
function merged(base, values) {
  const out = { ...(base || {}) };
  for (const [k, v] of Object.entries(values)) {
    if (v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)) delete out[k];
    else out[k] = v;
  }
  return Object.keys(out).length ? out : null;
}
// A Settings card, with an id for the bar's links to it
// Each card has an icon, a hue shift for its tile, and a one-line subtitle (used when the card gives no hint).
const SET_LOOK = {
  goals: ["sparkle", 0, "What you want next"], companies: ["cloud", -30, "The job boards jobwatch checks"],
  filters: ["check", 25, "A job must pass these to show"], keywords: ["pencil", 50, "Words that rank a job higher"],
  today: ["calendar", -50, "How much Today shows and your pace"], resume: ["file", 15, "Your resume and fit scores"],
  people: ["users", 40, "Who you know at companies"], usage: ["dollar", 35, "Which backend scores, and what it cost"],
  prompts: ["pencil", -20, "What the model is told"],
  providers: ["cloud", 75, "A free or paid API (OpenRouter, Groq, Google or any OpenAI-compatible one) for fit scores"],
  chat: ["send", 30, "Ask jobwatch"], pay: ["dollar", -60, "Expected pay"], alerts: ["inbox", 10, "Job-alert emails"],
  incoming: ["inbox", 80, "Texts, WhatsApp, Gmail and LinkedIn"],
  suggestions: ["plus", -10, "Companies worth watching"], skills: ["arrow", 55, "What to learn next"],
  display: ["refresh", -40, "Theme, width and files"],

// A card's header: an icon orb, the title (plus anything in extra), and a one-line subtitle.
function setHead(id, title, hint, extra) {

function uploadField(kind, accept, current, help) {
  const input = h("input", { type: "file", accept });
  const status = h("span", { class: "muted small" }, current ? `Using ${current}` : "Not set");

// Looking up a company's board by name or job link (/api/find), with an Add button on each board found. has(hit):
// already added; add(hit, typed): add it (may be async; if it throws, the error shows in place of the button).
// {input, button, out} for the caller to lay out.
function companyFinder(has, add) {
  const input = h("input", { type: "text", placeholder: "Company name, or paste a link to one of their jobs" });
  const out = h("div", {});
  const button = h("button", { class: "btn" }, "Find");
  const find = async () => {
    button.disabled = true; out.replaceChildren(h("div", { class: "muted small" }, busyNote("Looking…")));
    try {
      const hits = await api("/api/find", { company: input.value });
      out.replaceChildren(...(hits.length ? hits.map(hit => h("div", { class: "list-item" },
        h("div", { style: "flex:1" },
          h("div", {}, h("b", {}, hit.name || hit.board), ` · ${hit.open_roles} open jobs · `, link(hit.careers, "careers page")),
          h("div", { class: "muted small" }, "e.g. " + hit.sample_titles.slice(0, 3).join(" · "))),
        has(hit) ? h("span", { class: "muted small" }, "added")
          : h("button", { class: "btn primary", onclick: async e => {
              const b = e.target;
              b.disabled = true;
              try { await add(hit, input.value.trim()); b.replaceWith(h("span", { class: "muted small" }, "added")); }
              catch (err) { b.disabled = false; b.replaceWith(h("span", { class: "error small" }, err.message)); }
            } }, "Add")))
        : [h("div", { class: "muted small" }, "No Greenhouse, Lever, Ashby, Workable, Workday, Eightfold, Rippling, SmartRecruiters, Avature, iCIMS, Jobvite, Gem or Recruitee board found, nor one linked from their own careers page. Try a link to their " +
            "careers page or one of their job postings. Some companies use other systems that jobwatch can't read yet.")]));
    } catch (e) { out.replaceChildren(h("div", { class: "error small" }, e.message)); }
    button.disabled = false;
  };
  button.onclick = find;
  input.addEventListener("keydown", e => { if (e.key === "Enter") find(); });
  return { input, button, out };
}

// -- goals: what you want next (goals), your pay target and the Comps weights. Settings' first card and the first
// steps of onboarding share these.

const GOAL_KINDS = [["tech", "A tech company"], ["consulting", "A consultancy"], ["enterprise", "A large enterprise"]];
const GOAL_ROLES = [["product", "Building the product"], ["customer", "Working with customers"], ["internal", "Building internal tools"]];
const GOAL_STAGES = [["startup", "A startup (seed to Series B)"], ["growth", "Growth stage (Series C and later)"], ["public", "A large or public company"]];
const CHOICES = ["1st", "2nd", "3rd", "4th"];

// A few choices in order of preference, best first, or "I don't mind". value() is the list as the watchlist keeps it
// (["any"] for no preference, [] for none said).
function rankPicker(options, saved) {
  const any = checkLine(saved.length === 1 && saved[0] === "any", "I don't mind");
  const picks = options.map((_, n) => choice([["", "—"], ...options], saved[n] && saved[n] !== "any" ? saved[n] : ""));
  const sync = () => picks.forEach(p => { p.disabled = any.box.checked; });
  any.box.addEventListener("change", sync);
  sync();
  return {
    el: h("div", {}, h("div", { class: "fields" }, picks.map((p, n) => field(`${CHOICES[n]} choice`, p))), any.el),
    value: () => any.box.checked ? ["any"] : [...new Set(picks.map(p => p.value).filter(Boolean))],
  };
}

// The pay target as written ("180000" or "170000-190000"), and back: {target, target_max} for the watchlist.
function targetText(p) { return p.target_max ? `${p.target}-${p.target_max}` : String(p.target ?? ""); }
function targetValues(text) {
  const t = text.trim();
  return { target: t === "" ? null : /^\d+$/.test(t) ? Number(t) : t, target_max: null };
}

// "Tell me about yourself" and the questions after it. values() is `goals` as the watchlist keeps it (null when
// nothing is said); what the page doesn't edit is kept.
function goalsForm(s) {
  const g = s.goals || {};
  const about = h("textarea", { rows: 5, placeholder: "e.g. Staff engineer, ten years in security tooling. I want to build a product again, " +
    "and I'd rather join a company that sells software than one that uses it." });
  about.value = g.about || "";
  const kinds = rankPicker(GOAL_KINDS, g.company_kinds || []), roles = rankPicker(GOAL_ROLES, g.roles || []);
  const stages = rankPicker(GOAL_STAGES, g.stages || []);
  let track = g.track || "either";
  const trackCtl = segmented([["ic", "Individual contributor"], ["manager", "Manager"], ["either", "Either"]], track, v => {
    track = v;
    trackCtl.dispatchEvent(new Event("change", { bubbles: true }));  // Settings marks it unsaved
  });
  const horizon = textInput(g.horizon, "e.g. take risks for the next 3-5 years");
  return {
    // the free-text box, and the questions after it (onboarding puts the resume between them)
    aboutField: field("Tell me about yourself", about, "Who you are and what you want next, in your own words. It stays on this computer; " +
      "it goes to a model only if you ask for title suggestions."),
    questions: [
      h("div", { class: "field" }, h("label", {}, "What kind of company do you want to work for?"),
        h("div", { class: "help" }, "Best first. The Comps tab scores a job's career value from this."), kinds.el),
      h("div", { class: "field" }, h("label", {}, "What would you rather be doing?"),
        h("div", { class: "help" }, "What the job builds, best first."), roles.el),
      h("div", { class: "field" }, h("label", {}, "A startup or an established company?"),
        h("div", { class: "help" }, "Best first. Comps counts it for a company whose stage it knows (from its Company health)."),
        stages.el),
      field("Which track?", trackCtl, "Individual contributor, people manager, or either."),
      field("How far ahead are you thinking?", horizon, "In your own words: how much risk you will take, and for how long.")],
    values: () => merged(g, { about: textOf(about), company_kinds: kinds.value(), roles: roles.value(), stages: stages.value(),
      track: track === "either" ? null : track, horizon: textOf(horizon) }),
  };
}

// The five parts of the Comps suggestion as sliders, each showing its share of the whole. values() is
// comps.weights (null while they are all the defaults).
const COMP_PARTS = { career: ["Career value", "What the company and role are worth to you (from your goals)."],
  pay: ["Pay", "Against your target."], fit: ["Fit score", "How well your resume matches."],
  progress: ["How far along", "Further along the process counts more."], health: ["Company health", "Funding, layoffs, ratings."] };
function weightSliders(s) {
  const dflt = s.defaults.comps.weights, saved = (s.comps || {}).weights || {};
  const raw = Object.fromEntries(Object.keys(dflt).map(k => [k, saved[k] ?? dflt[k]]));
  const sum = Object.values(raw).reduce((a, b) => a + b, 0) || 1;
  const rows = Object.keys(dflt).map(k => {
    const input = h("input", { type: "range", min: 0, max: 100, step: 1, "aria-label": COMP_PARTS[k][0] });
    input.value = Math.round(raw[k] / sum * 100);
    return { k, input, out: h("output", {}) };
  });
  const show = () => {
    const total = rows.reduce((a, r) => a + Number(r.input.value), 0);
    for (const r of rows) r.out.textContent = total ? `${Math.round(Number(r.input.value) / total * 100)}%` : "0%";
  };
  for (const r of rows) r.input.addEventListener("input", show);
  show();
  return {
    el: h("div", { class: "fields" }, rows.map(r => field(COMP_PARTS[r.k][0], h("div", { class: "fitrange" }, r.input, r.out),
      COMP_PARTS[r.k][1]))),
    values: () => {
      const given = Object.fromEntries(rows.map(r => [r.k, Number(r.input.value)]));
      if (!Object.values(given).some(Boolean)) throw new Error("The Comps weights can't all be 0: the suggestion would weigh nothing.");
      const isDefault = !Object.keys(saved).length && rows.every(r => given[r.k] === Math.round(dflt[r.k] * 100));
      return isDefault ? null : given;
    },
  };
}

// Onboarding's plain-words way to set the Comps weights: what matters most in a company, best first. 1st 35, 2nd 25,
// 3rd 20, 4th 10, how far along 10; parts left out share what's left. "I don't mind" or nothing picked keeps the
// defaults (null). Settings' sliders fine-tune the same weights.
const MATTERS = [["pay", "Pay"], ["career", "What it adds to my career"], ["health", "A stable, healthy company"],
  ["fit", "A job that fits what I've done"]];
const MATTER_SHARE = [35, 25, 20, 10];
function mattersWeights(order) {
  if (!order.length || order[0] === "any") return null;
  const left = MATTERS.map(([k]) => k).filter(k => !order.includes(k));
  const spare = MATTER_SHARE.slice(order.length).reduce((a, b) => a + b, 0);
  return { progress: 10, ...Object.fromEntries(order.map((k, n) => [k, MATTER_SHARE[n]])),
    ...Object.fromEntries(left.map(k => [k, Math.round(spare / left.length)])) };
}
// The saved weights as that order (heaviest first), or [] while they are the defaults.
function mattersOrder(s) {
  const saved = (s.comps || {}).weights || {};
  if (!Object.keys(saved).length) return [];
  return MATTERS.map(([k]) => k).sort((a, b) => (saved[b] ?? 0) - (saved[a] ?? 0));
}
function mattersField(s) {
  const pick = rankPicker(MATTERS, mattersOrder(s));
  return {
    el: h("div", { class: "field" }, h("label", {}, "What matters most to you in a company?"),
      h("div", { class: "help" }, "Best first. The Comps tab weighs jobs by it; Settings fine-tunes the weights. " +
        "Anything else (remote, mission, team size)? Say it in Tell me about yourself."), pick.el),
    weights: () => mattersWeights(pick.value()),
  };
}

// Settings' first card: goals, pay target and floor, and the Comps weights.
function goalsCard(s) {
  const p = s.pay || {}, form = goalsForm(s), weights = weightSliders(s);
  const target = textInput(targetText(p), "e.g. 180000, or 170000-190000"), floor = numInput(p.floor, "e.g. 150000", { step: 5000 });
  const el = setCard("goals", "Your goals", "what you want next: it shapes how Comps scores a job's career value",
    form.aboutField, form.questions,
    h("div", { class: "fields" },
      field("Pay target (per year)", target, "What you'd like to be offered: a number, or a range like 170000-190000. Comps scores pay against it."),
      field("Lowest you'd accept (private)", floor, "Private: kept in your watchlist file, never shown anywhere else on the page " +
        "and never sent to Claude.")),
    h("h3", { style: "margin-top:18px" }, "How Comps weighs a job", " ", h("span", { class: "hint" }, "each share of the whole")),
    weights.el);
  el.classList.add("full");
  el.goals = () => form.values();
  el.weights = () => merged(s.comps, { weights: weights.values() });
  el.payValues = () => ({ ...targetValues(target.value), floor: numberOf(floor) });
  return el;
}

// display.story_fit: whether your stories' evidence (storyfit.py) counts toward the fit minimum and Today's Fit chip.

// One prompt in a fold, closed until opened: its text to edit, "edited" while it isn't the default, "Reset to
// default", and the placeholders it must keep. p: {name, about, text, default, placeholders}. {fold, text, changed}.
function promptFold(p, editable = true) {
  const text = h("textarea", { spellcheck: "false", readonly: !editable, "aria-label": p.name,
    rows: Math.min(20, p.text.split("\n").length + 1) });
  text.value = p.text;
  const mark = h("span", { class: "chip hit" }, "edited");
  const reset = h("button", { class: "btn", onclick: () => { text.value = p.default; sync(); } }, "Reset to default");
  const changed = () => text.value.trim() !== p.default.trim();
  const sync = () => { mark.style.display = changed() ? "" : "none"; reset.disabled = !changed(); };
  text.addEventListener("input", sync);
  sync();
  const keep = p.placeholders.length ? h("span", { class: "hint" }, "Keep ",
    p.placeholders.map((x, i) => [i ? ", " : "", h("code", {}, `{${x}}`)]), ": the data goes there.") : h("span");
  const fold = h("details", { class: "prompt" },
    h("summary", {}, h("code", {}, p.name), mark, h("span", { class: "hint" }, p.about)),
    text, editable ? h("div", { class: "row" }, keep, reset) : null);
  return { text, changed, fold };
}

// The prompts fit scoring sends (shortlist-ai's), one fold each. Only the edited ones are saved (scoring.prompts),
// with the rest of Settings; "Reset to default" puts one back. Read-only, with a note, when the installed
// shortlist-ai can't take edited prompts; no card when fit scoring isn't installed. card.edited() gives what to save.
function fitPromptsCard(info) {
  if (!info || !info.installed) return null;
  const boxes = info.prompts.map(p => ({ p, ...promptFold(p, info.editable) }));
  const c = setCard("prompts", "Fit score prompt", "what the model is told when it scores a job",
    h("p", { class: "small muted lead" }, "An edited prompt changes fit scores from the next one on. The scores you have " +
      "were made with the prompts as they were: saving an edit sets them aside and Today's jobs are scored again " +
      "(putting the prompts back brings those scores back)."),
    info.note ? h("p", { class: "small error" }, info.note) : null,
    boxes.map(b => b.fold));
  c.classList.add("full");
  c.editable = info.editable;
  c.edited = () => Object.fromEntries(boxes.filter(b => b.changed()).map(b => [b.p.name, b.text.value]));
  return c;
}

// The chat (Ask jobwatch): where its model runs, which model, how long it goes on, and its instructions (chat.prompt,

  const c = s.chat || {}, d = s.defaults.chat;

  const prompt = promptFold({ name: "chat prompt", about: "what the assistant is told before every question: its " +

  const el = setCard("chat", "Chat", "Ask jobwatch, on Today and beside each job",
    h("div", { class: "fields" },

// The Claude cost this month as {main, notes}: recorded dollars (tokens kept from the API replies) plus an
// estimate for scores made before tokens were recorded; "not recorded" when there's nothing to average from.
function claudeCostText(c) {
  const notes = [];
  const scores = (n, what = "score") => `${n} ${what}${n === 1 ? "" : "s"}`;
  if (c.recorded_jobs) notes.push(`${USD(c.recorded_usd)} recorded for ${scores(c.recorded_jobs)}`);
  if (c.estimated_jobs) notes.push(`${USD(c.estimated_usd)} estimated for ${scores(c.estimated_jobs, "earlier score")}, at ${USD(c.average_usd)} each`);
  if (c.not_recorded_jobs) notes.push(`${scores(c.not_recorded_jobs)} made before tokens were recorded: cost not recorded`);
  if (c.unpriced && c.unpriced.length) notes.push(`no price known for ${c.unpriced.join(", ")}`);
  const main = !c.recorded_jobs && !c.estimated_jobs && !c.not_recorded_jobs ? "$0.00"
    : !c.recorded_jobs && !c.estimated_jobs ? "not recorded"
    : USD(c.total_usd) + (c.estimated_jobs ? " (partly estimated)" : "");
  return { main, notes };

// -- referrals: the people you know at companies with jobs you're tracking, and whom to ask. Use puts someone
// ahead of closer ties, Don't use hides them from every "You know" line (they wait in the fold to be restored);
// people in the watchlist's connections_skip are listed there too, but only that file changes them.
// One card per company, in a grid that fills the width, so what the people there share is said once. It shows what suits
// you, not what exists: the good fits at the company (a job you queued or applied to, or a fit at or above the Fit
// minimum, and not a title the watchlist's filters turn down), the best five of them, then the jobs not scored yet and the
// total as small text. Below, a slim row per person you know there (the closest first), the first four and "+ N more
// people". "See the good fits" opens a large dialog on its Good fits tab, with Applied and queued, Not scored, All and
// People a click away (search, sort; the arrow keys step through the companies). The search box finds a person by name,
// company or title and keeps the company's card with just the people it matched. The jobs you are working are always
// worth a line.
const REF_LIVE = ["queued", "applied", "screening", "interviewing", "offer"];
const REF_TOP = 3;
const REF_CAP = 3;
// A long list shows this many at a time, with a button for more: the cards (500 companies are 500 cards), the people left out and a dialog's rows.
const REF_PAGE = 24;
const REF_ROWS = 100;
// The furthest a company's jobs have got comes first.
const REF_FURTHEST = ["offer", "interviewing", "screening", "applied", "queued"];
const REF_SORTS = { fit: "Best fit first", count: "Most good fits", people: "Most people you know", recent: "Last messaged", name: "A-Z" };
// "Hide companies with no good fits" is remembered as referrals.nogood; it was "Hide companies with no openings" (referrals.noopen):
// an old "on" carries over to the new key, and the old one is cleared.
function refNoGoodRemembered() {
  if (remembered("referrals.noopen", "")) { remember("referrals.nogood", "1"); remember("referrals.noopen", ""); }
  return remembered("referrals.nogood", "") === "1";
}
const refView = { q: remembered("referrals.q", ""), sort: remembered("referrals.sort", "fit"), ask: false, working: false, foldOpen: false,
  noGood: refNoGoodRemembered(), limit: REF_PAGE, leftLimit: REF_ROWS };
if (!REF_SORTS[refView.sort]) refView.sort = "fit";
const refButtons = new Map();  // company key + ":jobs" or ":people" -> that button now on the page, for focus to return to
let refSearchBox = null;       // the page's search box while the tab is open (the "/" key focuses it)

// One character for one, lower case and without accents, so a match found in the folded text sits at the same place in
// the original (which is what gets highlighted).
function foldChar(c) {
  const f = c.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
  return f.length === 1 ? f : c.toLowerCase().length === 1 ? c.toLowerCase() : c;
}
function foldText(s) { return Array.from(String(s ?? ""), foldChar).join(""); }
function searchTokens(q) { return foldText(q).split(/\s+/).filter(Boolean); }

// case, accents ignored.
// What is searched in a person is folded once (a search runs on every key, over thousands of people).
const refHays = new WeakMap();
const refFolds = new Map();
function personMatches(p, tokens, extra = "") {

  if (extra) {
    let f = refFolds.get(extra);
    if (f === undefined) refFolds.set(extra, f = foldText(extra));

  for (const s of spans.sort((a, b) => a[0] - b[0])) {

    out.push(h("mark", {}, s.slice(a, b)));

}
// Best fit first, an unscored job after every scored one, then the freshest.
const byFit = (a, b) => (b.fit ?? -1) - (a.fit ?? -1) || (b.seen || "").localeCompare(a.seen || "") || a.title.localeCompare(b.title);
// A good fit: a job you queued or applied to, or one with a fit at or above the minimum unless the watchlist's title
// filters turn its title down (j.off). A job with no score yet is never one by its score.
const refGood = (j, minFit) => REF_LIVE.includes(j.status) || (!j.off && j.fit != null && j.fit >= minFit);

// not scored yet, the best fit among the good ones (0 when only a job you are working has none), and the furthest stage.
function refSummary(jobs, minFit) {
  const good = jobs.filter(j => refGood(j, minFit)).sort(byFit), top = good.slice(0, REF_TOP);
  return { total: jobs.length, open: jobs.filter(j => !j.closed).length, good: good.length, top, more: good.length - top.length, unscored: jobs.filter(j => j.fit == null).length,
    best: good.length ? Math.max(0, ...good.map(j => j.fit ?? 0)) : -1, stage: REF_FURTHEST.find(s => jobs.some(j => j.status === s)) || null };
}
// "1 job", "2 jobs": the count with its noun (a plural of more than an "s" is given).
function plural(n, one, many = one + "s") { return `${n} ${n === 1 ? one : many}`; }
// The card's words: "12 good fits" or "No good fit yet", "262 not scored yet", "of 313 open" (only when there are others), "+ 7 more"
// and the button ("See the 12 good fits", "See the good fit"; with none, every job: "See all 313 jobs", "See the job").
function refLabels(sum) {
  return { good: sum.good ? plural(sum.good, "good fit") : "No good fit yet", unscored: sum.unscored ? `${sum.unscored} not scored yet` : null,
    of: sum.total > sum.good ? `of ${sum.total} open` : null, more: sum.more ? `+ ${sum.more} more` : null,

// and the ribbon names the furthest stage.
const refAccent = stage => !stage ? "" : stage === "queued" ? "live live-queued" : "live live-working";

// The day of the last message, from "messaged 9×, last 2026-06-23" ("" when there is none).
const refLast = p => (/last (\d{4}-\d{2}-\d{2})/.exec(p.why || "") || [])[1] || "";

function refPeopleOrder(a, b) {

// The companies: people who share a tracked job are one company, whatever each one's LinkedIn employer says ("Amazon", "Amazon

function refCompanies(d) {
  const cut = d.min_fit || 60, groups = [], owner = new Map();
  for (const { p, jobs } of refEntries(d)) {
    const keys = jobs.length ? jobs.map(j => j.key) : ["co:" + foldText(p.company)];
    const found = [...new Set(keys.map(k => owner.get(k)).filter(Boolean))];
    let g = found[0];
    if (!g) groups.push(g = { people: [], jobs: new Map() });
    for (const other of found.slice(1)) {  // a person who bridges two companies' jobs joins them
      g.people.push(...other.people);

      other.people = []; other.jobs = new Map();

    const people = g.people.sort(refPeopleOrder);
    return { key: jobs.length ? jobs.map(j => j.key).sort()[0] : "co:" + foldText(name), name, people, jobs, cut, cutSet: d.min_fit_set !== false,
      sum: refSummary(jobs, cut), last: people.map(refLast).sort().pop() || "", health: (d.health || {})[name] || null };

// -- activity: what jobwatch has been doing (checking the boards, reading job-alert mail, scoring, pay), newest
// first, and what it's doing now. It asks again every 10 seconds while it's open; details left open stay open.
// One list at a time (the kinds each shows), so the hundreds of jobs scored don't bury the board checks and emails.
const ACT_KINDS = [["boards", "Job Boards"], ["mail", "Gmail"], ["score,pay,logos", "Scored"], ["prep", "Prep sheets"]];
// the list an event's kind is shown in ("score" → "score,pay,logos"), so a notice opens Activity where it is
function actListFor(kind) { return (ACT_KINDS.find(([k]) => k.split(",").includes(kind)) || ACT_KINDS[0])[0]; }
const activityView = { kind: remembered("activity.kind", "boards"), open: new Set(), timer: null, seen: "0" };
const ACT_ICON = { boards: "refresh", mail: "inbox", score: "sparkle", pay: "dollar", logos: "cloud", prep: "file" };
// what started it, said only when it was you: the schedule and the background are what jobwatch always does
const ACT_BY = { page: "You pressed Check for new jobs" };

// A link to a job a row is about: its card on its tab (see openJobCard), its details when it has no card.
function actJobLink(ref, label) {
  const where = CARD_TAB[ref.status] ? `its card in ${TAB_NAMES[CARD_TAB[ref.status]]}` : "its details";
  return h("a", { class: "act-job", href: "#", title: `${ref.company}: ${ref.title}. Opens ${where}`,
    onclick: e => { e.preventDefault(); openJobCard(ref); } }, label || `${ref.company}: ${ref.title}`);
}

// A row's line, with the job it names a link when exactly one job is meant and its "Company: Title" is in the line.
// The rows that name several jobs list them (see actJobsList); one whose line doesn't name its job says "About".
function actWhat(e) {
  const refs = e.jobs || [];
  const one = refs.length === 1 ? refs[0] : null;
  const name = one && `${one.company}: ${one.title}`;
  const at = name ? e.text.indexOf(name) : -1;
  if (at < 0) return [e.text];
  return [e.text.slice(0, at), actJobLink(one), e.text.slice(at + name.length)];
}

function actAbout(e) {
  const one = (e.jobs || []).length === 1 ? e.jobs[0] : null;
  return one && !e.text.includes(`${one.company}: ${one.title}`)
    ? h("div", { class: "small act-about" }, "About ", actJobLink(one)) : null;
}

// The jobs of a row that is about several, each a link, folded like the details.
function actJobsList(e, open) {
  const refs = e.jobs || [];
  if (refs.length < 2) return null;
  const more = h("details", { class: "act-jobs" }, h("summary", {}, `${refs.length} jobs`),
    h("ul", {}, refs.map(r => h("li", {}, actJobLink(r)))));
  more.open = open.has(e.at + "#jobs");
  more.ontoggle = () => more.open ? open.add(e.at + "#jobs") : open.delete(e.at + "#jobs");
  return more;
}

function activityTick() {
  clearTimeout(activityView.timer);
  activityView.timer = setTimeout(() => {
    if (tab !== "activity") return;
    if (document.hidden) activityTick(); else render();
  }, 10000);
}

async function renderActivity() {
  // a notice not seen yet (a strong fit, say) opens the list it's in, not the one picked last time; the pick stays
  if (notices.list) { activityView.kind = notices.list; notices.list = null; }
  // what's worth a look and new since you last looked stands out; looking marks it seen (see watchNotices)
  // (what was new when the tab opened stays marked while it refreshes itself)
  if (!main.classList.contains("quiet")) activityView.seen = remembered("activity.seen", "0");
  // the list's own calls (the logs the watchlist names, and the events of the list shown) are made together, and the
  // page is drawn once both are here (a log's lines come with its list of logs)
  const ctx = loadCtx();
  const host = h("div", {}, layout([skelPanel(), skelPanel()], skelRows(8)));
  const place = ctx.shell(pagehead("Activity", "What jobwatch has been doing: checking the boards, reading your job-alert emails, scoring jobs and looking up pay. It updates by itself."), host);
  const evPath = "/api/activity?kind=" + (activityView.kind.startsWith("log:") ? ACT_KINDS[0][0] : activityView.kind);
  let logsData = null, events = null;
  const maybe = () => { if (logsData && events) { place(); drawActivity(logsData.logs, events); } };
  try {
    await Promise.all([ctx.swr("/api/activity-logs", x => { logsData = x; maybe(); }),
      ctx.swr(evPath, x => { events = x; maybe(); })]);
  } catch (e) {
    if (isAbort(e)) throw e;
    place();
    fill(host, partError(e, () => render(), "the activity list"));
  }
  activityTick();
}

function drawActivity(logs, d) {
  // other programs' logs the watchlist names (ui.activity_logs) get a chip each, beside jobwatch's own lists
  const kinds = [...ACT_KINDS, ...logs.map(l => ["log:" + l.name, l.name])];
  if (!kinds.some(([k]) => k === activityView.kind)) activityView.kind = ACT_KINDS[0][0];
  const log = logs.find(l => "log:" + l.name === activityView.kind);
  const seen = activityView.seen, newest = d.events.find(e => e.notable)?.at;
  if (newest && newest > remembered("activity.seen", "0")) remember("activity.seen", newest);
  const s = d.now.score;
  const now = [d.now.boards && "Checking the boards for new jobs",
    s.running && `Scoring ${s.current || "jobs"}` + (s.left ? ` · ${s.left} left` : ""),
    d.now.pay && "Looking up expected pay on Levels.fyi"].filter(Boolean);
  const line = (text, idle) => h("div", { class: "now-line" + (idle ? " idle" : "") }, h("span", { class: "dot" }), text);
  const side = h("div", {},
    panel("Now", now.length ? now.map(t => line(t)) : line("Nothing running", true)),
    panel("Show", segmented(kinds, activityView.kind, k => {
      activityView.kind = k;
      remember("activity.kind", k);
      render();
    })));
  const rows = [];
  let day = "";
  for (const e of log ? [] : d.events) {
    const at = new Date(e.at);
    const label = at.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    if (label !== day) rows.push(h("div", { class: "acts-day" }, day = label));
    let more = null;
    if (e.detail.length) {
      more = h("details", {}, h("summary", {}, `${e.detail.length} detail${e.detail.length === 1 ? "" : "s"}`),
        h("ul", {}, e.detail.map(x => h("li", {}, x))));
      more.open = activityView.open.has(e.at);
      more.ontoggle = () => more.open ? activityView.open.add(e.at) : activityView.open.delete(e.at);
    }
    const one = (e.jobs || []).length === 1 ? e.jobs[0] : null;
    rows.push(h("div", { class: "act" + (e.ok ? "" : " fail") + (e.notable ? " notable" : "") + (e.notable && e.at > seen ? " unseen" : ""),
      title: e.notable ? "Worth a look" : null },
      // the time first, so a day's list reads down the clock
      h("span", { class: "when", title: `${at.toLocaleString()} (${ago(e.at)})` },
        at.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })),
      icon(ACT_ICON[e.kind] || "file", 16),
      h("div", { class: "body" }, h("div", { class: "what" }, actWhat(e)), actAbout(e),
        ACT_BY[e.by] ? h("div", { class: "small muted" }, ACT_BY[e.by]) : null, actJobsList(e, activityView.open), more),
      // for the keyboard and the hover: a button to the one job's card, beside the link in the line
      one ? h("button", { class: "btn ghost act-open", title: `Open ${one.company}: ${one.title}`,
        onclick: () => openJobCard(one) }, "open card", icon("arrow", 12)) : null));
  }
  if (log) {
    // a log's last lines, newest first; a line with no time of its own sits under the day above it
    if (!log.exists) rows.push(h("div", { class: "quiet-note" }, "No log yet"));
    else if (!log.lines.length) rows.push(h("div", { class: "quiet-note" }, "Nothing in this log yet"));
    for (const e of log.lines) {
      const at = e.at ? new Date(e.at) : null;
      const label = at ? at.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) : day;
      if (label && label !== day) rows.push(h("div", { class: "acts-day" }, day = label));
      rows.push(h("div", { class: "act" },
        h("span", { class: "when sec", title: at ? `${at.toLocaleString()} (${ago(at.toISOString())})` : null },
          at ? at.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" }) : ""),
        icon("file", 16),
        h("div", { class: "body" }, h("div", { class: "what logline" }, actWhat(e)), actAbout(e)),
        h("span", { class: "src-badge" }, log.name)));
    }
  }
  put(pagehead("Activity", "What jobwatch has been doing: checking the boards, reading your job-alert emails, scoring jobs and looking up pay. It updates by itself."),
    layout(side, h("div", {}, rows.length ? rows
      : emptyState("Nothing yet. What jobwatch does shows up here as it happens."))));
}

async function refreshQueueCount() {
  try {
    const ready = settings && settings.exists;
    // One small call for the three numbers: reading the queue, the applications and the interviews in full after
    // every click made each tab wait behind them (the queue alone is seconds of work).
    const { queue: n, due, interviews: iv } = ready ? await api("/api/counts") : { queue: 0, due: 0, interviews: 0 };
    const q = document.getElementById("qcount");
    q.replaceChildren(n ? h("span", { class: "count" }, n) : "");
    if (n > (refreshQueueCount.last ?? n)) bump(q.firstChild);
    refreshQueueCount.last = n;
    document.getElementById("duecount").replaceChildren(due ? h("span", { class: "count", title: "follow-ups due" }, due) : "");
    document.getElementById("ivcount").replaceChildren(iv ? h("span", { class: "count", title: "interviews today" }, iv) : "");
  } catch { /* the page still works without the counts */ }
}

// -- notices: what's worth a look (a new strong fit for a job Today shows, the mailbox couldn't be read, no board
// could be read, scoring stopped; the server marks them notable: see watch.news). The page asks every minute, on any tab: one that comes in
// while it's open shows as a toast; no count on the Activity tab or the browser tab's title, since they pulled for
// attention they don't need. Opening Activity marks them seen. "Seen" is the newest one's time, kept per browser; the first
// time on a browser, what came before counts as seen (it's all on the tab).
const notices = { newest: null, timer: null, list: null };
async function watchNotices() {
  clearTimeout(notices.timer);
  try {
    if (settings && settings.exists) {
      const seen = remembered("activity.seen", "");
      const d = await api("/api/activity?notable=1&limit=50&since=" + encodeURIComponent(seen || "0"));
      if (!seen) remember("activity.seen", d.events[0]?.at || "0");
      const unseen = !seen || tab === "activity" ? [] : d.events;
      const fresh = notices.newest === null ? [] : unseen.filter(e => e.at > notices.newest);
      notices.newest = d.events[0]?.at ?? notices.newest ?? "0";
      notices.list = unseen.length ? actListFor(unseen[0].kind) : null;
      if (fresh.length) toast(fresh.length === 1 ? `Worth a look: ${fresh[0].text}` : `${fresh.length} things worth a look`,
        () => go("activity"), "win", "Show");
    }
  } catch { /* the page may be restarting: try again next minute */ }
  notices.timer = setTimeout(watchNotices, 60000);
}

// A company's job's status word. "New" means not acted on yet, so a role still open from long ago (all of a
// board's open roles arrive as new when it's first watched) says how old it is instead of looking fresh.
function companyStatus(j, today, maxAge) {
  const age = j.posted ? -dayDiff(j.posted.slice(0, 10), today) : null;
  if ((j.status === "new" || j.status === "shown") && age != null && age > (maxAge || 30))
    return [age >= 365 ? `Posted ${Math.floor(age / 365)}y+ ago` : `Posted ${Math.round(age / 30)}mo ago`,
      `Still open, but posted ${age} days ago: older than Today shows (${maxAge || 30} days), so it isn't new`];
  return [STAGE_NAMES[j.status] || j.status[0].toUpperCase() + j.status.slice(1),
    j.status === "new" ? "Not acted on yet" : null];
}
// The chip before a job's title on the company page: its status, unless it's simply open to act on.
function stageChip(j, today) {
  const [word, why] = companyStatus(j, today, (settings.filters || {}).max_age_days);
  if ((j.status === "new" || j.status === "shown") && word === (STAGE_NAMES[j.status] || j.status[0].toUpperCase() + j.status.slice(1))) return null;
  return h("span", { class: "chip stage-chip", title: why,
    style: `background:color-mix(in srgb, var(--s-${j.status}) 15%, transparent);color:var(--s-${j.status})` }, word);
}
// What only the company page says about a job: the day applied, what's next, what a snoozed job waits for.
function companyFacts(j, today) {
  const waiting = j.status === "snoozed" && (j.waiting_on || []).length;
  const lines = [
    j.applied_at ? `Applied ${fmtDay(j.applied_at, today)}` : null,
    closedState(j) === "closed" ? `Posting closed ${fmtDay(localDay(j.closed), today)}`
      : closedState(j) === "checking" ? `Posting may have closed ${fmtDay(localDay(j.closed), today)}: checking` : null,
    waiting ? `Waiting on ${j.waiting_on.map(a => a.title).join(", ")}` + (j.follow_up ? `; back by ${fmtDay(j.follow_up, today)}` : "") : null,
    j.status !== "snoozed" && (j.next_step || j.follow_up) ? (j.due ? "Due: " : "Next: ") +
      [j.next_step, j.follow_up && `follow up ${fmtDay(j.follow_up, today)}`].filter(Boolean).join(" · ") : null,
    j.status === "queued" && j.note ? `Note: ${j.note}` : null,  // other statuses have the card's Note row
    roundsLine(j),
  ].filter(Boolean);
  return lines.length ? h("div", { class: "facts" }, lines.map(l => h("div", {}, l))) : null;
}
// A job card as on Today and the Queue, with the buttons its status calls for. Marking one keeps it on the page,
// now at its new status, with a way back; the counts above follow.
function companyCard(j, i, c) {
  const today = todayIso();
  const redraw = () => document.getElementById("job-" + j.key)?.replaceWith(companyCard(j, i, c));
  const move = async (to, note) => {
    const r = await api("/api/mark", { keys: [j.key], status: to, note });
    c.counts[j.status] = Math.max(0, (c.counts[j.status] || 0) - 1);
    c.counts[to] = (c.counts[to] || 0) + 1;
    j.status = to;
    j.follow_up = r.follow_up;
    refreshQueueCount();
    return r;
  };
  const act = async (status, label) => {
    const was = j.status, origin = document.activeElement;
    const done = pending(document.getElementById("job-" + j.key));
    try {
      const r = await slowGuard(move(status));
      if (status === "applied") { confetti(origin); return render(); }  // other jobs here can be snoozed now
      redraw(); drawCompanyTiles();
      toast(r.warning ? `${label}. ${r.warning}` : label, async () => { await move(was); redraw(); drawCompanyTiles(); }, TONES[status]);
    } catch (e) { done(); toast(e.message); }
  };
  const queueIt = (label = "Queue") => closedState(j) === "closed" ? null : actButton("queue", {
    onclick: () => act("queued", `📌 Queued: ${j.title}. ${pick(QUEUED)}`) }, label);
  const skipIt = () => actButton("skip", { onclick: () => act("skipped", `Skipped: ${j.title}. ${pick(SKIPPED)}`) });
  const posting = () => link(j.url, "Posting ↗");
  const score = () => scoreButton(j, j.can_score, x => companyCard(x, i, c));
  // The company's people are listed once, in the page's left panel; "Who to contact" is per job, so it sits by Details.
  const [whoButton, whoPanel] = whoToContact(j);
  const details = () => [detailsButton(j), whoButton];
  const actions = APPLIED.includes(j.status) ? [details(), posting(),
      j.has_package ? h("span", { class: "sent-chip", title: "What you sent is saved with this job" }, icon("clip", 13), "package saved") : null]
    : j.status === "queued" ? [applyButton(j), prepareButton(j),
      actButton("applied", { onclick: () => act("applied") }),
      snoozeButton(j, act), skipIt(), details(), score()]
    : j.status === "snoozed" ? [queueIt("Queue now"), applyButton(j), skipIt(), details(), score()]
    : j.status === "skipped" ? [queueIt(), applyButton(j), details(), score()]
    : [queueIt(), applyButton(j, () => act("queued", `📌 Queued and opened: ${j.title}. Submit it there.`)),
      snoozeButton(j, act), closedState(j) === "closed" ? null : skipIt(), details(), score()];
  return jobCard(j, actions, i, companyFacts(j, today), stageChip(j, today), { people: false, after: whoPanel });
}

  };
  const tiles = h("div", {}), list = h("div", { class: "cards grid-cards top-aligned" }), showing = h("div", { class: "showing" }), pager = h("div", {});
  const closedBox = h("div", {});
  drawCompanyTiles = () => fill(tiles, companyTiles(c));
  const draw = () => {
    const closed = c.jobs.filter(inClosedGroup), live = c.jobs.filter(j => !inClosedGroup(j));
    const pg = paged(live, v, c.company, draw);
    fill(showing, pg.range ? `Showing ${pg.range}` : null);
    fill(list, live.length ? pg.items.map((j, i) => companyCard(j, i, c))
      : closed.length ? null : emptyState("Nothing to list here: every role is hidden by your filters or closed."));
    fill(pager, pg.nav);
    fill(closedBox, closedGroup(closed, c, draw));
  };
  const more = [
    c.more_open ? h("div", { class: "small muted" }, `${c.more_open} more open role${c.more_open === 1 ? "" : "s"} you haven't acted on: see Today`) : null,
    c.left_out ? h("div", { class: "small muted" },
      `${c.left_out} open role${c.left_out === 1 ? "" : "s"} your filters leave out (` +
      Object.entries(c.left_out_by).map(([k, n]) => `${k} ${n}`).join(", ") + "). ",
      h("button", { class: "btn ghost", onclick: () => openCompany(c.company, true),
        title: "Settings → Display → Company page lists them every time" }, "Show them")) : null,
    c.closed_unacted ? h("div", { class: "small muted" }, `${c.closed_unacted} closed posting${c.closed_unacted === 1 ? "" : "s"} you never acted on, not listed`) : null,
  ].filter(Boolean);
  putCompany(
    pagehead(c.company, "Everything tracked here, whatever its status.", careersChip(c.company, c.careers), jumpBox),
    layout([
      tiles,
      c.contacts.length || c.find_referral ? panel("People you know", peopleRow(c, 8), h("div", { class: "pmore" }, addPersonButton(c.company))) : null,
      w.watched ? null : panel("Not watched", h("div", { class: "warns" }, "Its board isn't on your watchlist, so new roles there aren't checked. "),
        w.suggested ? h("button", { class: "btn", onclick: e => watch(e.currentTarget),
          title: w.entry ? `Watch ${w.entry}` : "Look for its board by name and watch it" }, "Watch its board")
          : h("div", { class: "hint" }, w.entry ? `Add ${w.entry} in Settings.` : "Look for its board with Settings → Add a company.")),
      more.length ? panel("Not listed", more) : null,
      c.also.length ? panel("Also matches", h("div", { class: "chips" },
        c.also.map(n => h("button", { class: "chip toggle", onclick: () => openCompany(n) }, n)))) : null,
    ], [h("div", { class: "status-row" }, showing), list, pager, closedBox]));
  drawCompanyTiles();
  draw();
  watchPay(c.jobs);
}

let lastTab = null;
async function render() {
  main.classList.toggle("quiet", tab === lastTab);  // entrance animations only when a tab opens
  lastTab = tab;
  abortTab();  // the tab before this one stops waiting: a late answer of its can't draw over this one
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  document.getElementById("fetchBtn").style.display = settings.companies.length ? "" : "none";
  const home = tab === "today" && settings.exists && settings.companies.length > 0;
  chatFab.style.display = home ? "" : "none";
  if (!home) homeChat(false);
  try {
    if (tab === "settings") renderSettings();
    else if (!settings.exists || (!settings.companies.length && tab !== "applied")) renderWelcome();
    else await loading(document.querySelector(`#tabs button[data-tab="${tab}"]`),
      { today: renderToday, interviews: renderInterviews, queue: renderQueue, applied: renderApplied, company: renderCompany, comps: renderComps, referrals: renderReferrals, skills: renderSkills,
        activity: renderActivity }[tab]);
  } catch (e) {
    if (isAbort(e)) return;  // this tab was left while it loaded
    main.replaceChildren(partError(e, () => render(), "this page"));
  }
  refreshQueueCount();
}

// A tab that takes a moment to load says so: after a beat (so quick ones don't flicker) its button gets a
// spinning ring and the page it's replacing dims. Only the latest one clears it, so a slow tab that finishes
// after another was clicked can't stop that one's spinner.
let loads = 0;
async function loading(button, work, delay = 150) {
  const n = ++loads;
  for (const b of document.querySelectorAll("#tabs button.loading")) b.classList.remove("loading");
  let tick = null, stop = null;  // the seconds beside the ring, once it shows (the spinner clock)
  const timer = setTimeout(() => {
    if (n !== loads) return;
    button?.classList.add("loading");
    main.setAttribute("aria-busy", "true");
    if (button) {
      tick = h("span", { class: "tab-clock" });
      button.append(tick);
      stop = spinnerClock(tick, { short: true, say: `Loading ${button.textContent.trim()}`.replace(/\s*\d+$/, "") });
    }
  }, delay);
  try { return await work(); }
  finally {
    clearTimeout(timer);
    stop?.(); tick?.remove();
    if (n === loads) {
      button?.classList.remove("loading");
      main.removeAttribute("aria-busy");
    }
  }
}

function go(name) {
  tab = name;
  history.replaceState(null, "", "#" + name + (name === "company" && companyView.q ? "/" + encodeURIComponent(companyView.q) : ""));
  return render();
}
for (const b of document.querySelectorAll("#tabs button")) b.onclick = () => go(b.dataset.tab);
listenForEvents();
const TABS = ["today", "interviews", "queue", "applied", "company", "comps", "referrals", "skills", "activity", "settings"];
window.addEventListener("hashchange", () => {
  const to = pageOfHash(location.hash, TABS);
  if (!to || !settings) return;
  if (to.tab === "company" && to.sub && to.sub !== companyView.q) return openCompany(to.sub);
  if (to.tab !== tab) { tab = to.tab; render(); }
  else if (tab === "settings" && to.sub && renderSettings.show) renderSettings.show(to.sub, { card: to.card, hash: false });
});

const fetchLabel = () => [icon("refresh", 14), "Check for new jobs"];
fill(document.getElementById("fetchBtn"), fetchLabel());
document.getElementById("fetchBtn").onclick = async () => {
  const btn = document.getElementById("fetchBtn"), status = document.getElementById("fetchStatus");
  btn.disabled = true; btn.classList.add("spin");
  // The button's icon turns and its label counts ("Checking… 12s"); the line beside it says what's happening and
  // how long a check usually takes in this browser. The button holds its width while its words change.
  btn.style.minWidth = btn.offsetWidth + "px";
  const tick = h("span", {});
  fill(btn, icon("refresh", 14), "Checking… ", tick);
  const stopBtn = spinnerClock(tick, { usual: "check", say: "Checking every company", owner: btn });
  fill(status, busyNote("Checking every company…", { expected: usualSeconds("check"), say: "" }));  // the button speaks
  try {
    const r = await api("/api/fetch", {});
    stopBtn(true);
    const failed = Object.keys(r.errors).length, warned = Object.keys(r.warnings || {}).length;
    status.textContent = `${r.new} new of ${r.jobs.toLocaleString()} open jobs` + (failed ? ` · ${failed} failed` : "") +
      (warned ? ` · ${warned} to look at` : "");
    status.title = [...Object.entries(r.errors), ...Object.entries(r.warnings || {})].map(([b, e]) => `${b}: ${e}`).join("\n");
    tab = "today"; lastTab = null; await render();
    if (r.new) { toast(`✨ ${r.new} new job${r.new === 1 ? "" : "s"} to look at`, null, "win"); confetti(btn, { count: 40, power: .6 }); }
    else toast("No new jobs since the last check. Fresh ones land every day.", null, "onward");
  } catch (e) { stopBtn(); status.textContent = e.message; }
  fill(btn, fetchLabel());
  btn.disabled = false; btn.classList.remove("spin"); btn.style.minWidth = "";
};

(async () => {
  // The page is served the moment the server listens; the API may need a few seconds more after a restart. The shell
  // in the HTML says so, with the seconds, and the page tries again until the server answers.
  const note = document.getElementById("startNote"), tick = h("span", {});
  note.replaceChildren("Starting… ", tick);
  const stopStarting = spinnerClock(tick, { say: "Starting" });  // the shared spinner clock
  for (;;) {
    try { settings = await api("/api/settings"); break; }
    catch (e) {
      if (e instanceof TypeError || /^HTTP 50[234]/.test(e.message)) { await new Promise(r => setTimeout(r, 1000)); continue; }  // not up yet
      stopStarting();
      return main.replaceChildren(partError(e, () => location.reload(), "jobwatch"));
    }
  }
  stopStarting();
  applyDisplay(settings.display);
  const start = pageOfHash(location.hash, TABS);
  tab = start?.tab || "today";
  if (tab === "company" && start.sub) companyView.q = start.sub;
  render();
  watchNotices();
})();
</script>
