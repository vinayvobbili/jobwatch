<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobwatch</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5a5cf2">
<style>
:root {
  --bg: #f3f4fa; --glow-1: rgba(99, 102, 241, .16); --glow-2: rgba(236, 72, 153, .09);
  --panel: rgba(255, 255, 255, .88); --panel-solid: #fff; --text: #141a2e; --muted: #626a84; --line: #e2e5f0;
  --accent: #5457f0; --accent-2: #a14cf2; --accent-text: #fff; --accent-soft: rgba(84, 87, 240, .1);
  --good: #0c9468; --warn: #c26d00; --bad: #d83450; --chip: #eef0f8; --chip-text: #3a4160;
  --shadow: 0 1px 2px rgba(20, 26, 46, .04), 0 10px 28px -16px rgba(20, 26, 46, .16);
  --shadow-hover: 0 2px 4px rgba(20, 26, 46, .05), 0 22px 44px -20px rgba(70, 60, 190, .34);
  --radius: 16px;
  --grad: linear-gradient(135deg, #5a5cf2, #a24af0);  /* filled surfaces carry white text in both themes */
  --s-applied: #3b82f6; --s-screening: #8b5cf6; --s-interviewing: #f59e0b; --s-offer: #10b981;
  --s-rejected: #94a3b8; --s-withdrawn: #a8a29e; --s-closed: #64748b;
  --s-queued: #06b6d4; --s-skipped: #a8a29e; --s-snoozed: #8b5cf6; --s-new: #5a5cf2; --s-shown: #5a5cf2;
  /* a dialog's Close chip: a solid tint (light) or a white wash (dark), its edge and X in the accent; tests/test_close_chip.py
     checks the contrast against the dialog (text 4.5:1, edge and X 3:1) */
  --close-bg: #eceeff; --close-fg: #141a2e; --close-edge: #5457f0; --close-x: #5457f0;
  color-scheme: light;
}
/* dark: set by the Theme setting, or by the computer's when that is System (applyDisplay) */
:root[data-theme="dark"] {
    --bg: #0a0d16; --glow-1: rgba(99, 102, 241, .2); --glow-2: rgba(192, 80, 240, .1);
    --panel: rgba(21, 25, 38, .86); --panel-solid: #151926; --text: #e9ebf5; --muted: #8f97b2; --line: #252a3b;
    --accent: #8d8fff; --accent-2: #c77dff; --accent-text: #0a0d16; --accent-soft: rgba(141, 143, 255, .14);
    --good: #3ddc97; --warn: #fbbf24; --bad: #ff7a93; --chip: #1e2333; --chip-text: #c3c9e0;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 32px -20px rgba(0, 0, 0, .9);
    --shadow-hover: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 22px 48px -20px rgba(110, 100, 255, .5);
    --close-bg: rgba(255, 255, 255, .10); --close-fg: #f4f6ff; --close-edge: #7f81f5; --close-x: #a9abff;
    color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(1100px 560px at 8% -12%, var(--glow-1), transparent 62%),
    radial-gradient(900px 520px at 102% -6%, var(--glow-2), transparent 60%), var(--bg);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.ico { flex: none; vertical-align: -2px; }

/* header */
header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel-solid) 74%, transparent); backdrop-filter: saturate(1.5) blur(16px);
  -webkit-backdrop-filter: saturate(1.5) blur(16px); }
.bar { max-width: 1680px; margin: 0 auto; padding: 12px 32px; display: flex; gap: 16px; align-items: center; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.02em;
  margin-right: 10px; }
.brand b { background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
nav { display: flex; gap: 2px; padding: 4px; background: var(--chip); border-radius: 12px; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 14px; border-radius: 9px;
  font: inherit; font-weight: 550; cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: color .15s, background .15s; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--text); background: var(--panel-solid); box-shadow: 0 1px 3px rgba(20, 26, 46, .12); }
/* the open tab gets a gradient underline that sweeps in */
nav button { position: relative; }
nav button.on::before { content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px; height: 2.5px;
  border-radius: 2px; background: var(--grad); transform-origin: left; animation: grow .35s cubic-bezier(.2, .7, .2, 1); }
/* a tab still loading: a small ring on its button, and the page it's replacing dims */
nav button.loading::after { content: ""; width: 9px; height: 9px; border: 2px solid currentColor;
  border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
main[aria-busy="true"]:not([data-shell]) { opacity: .5; pointer-events: none; transition: opacity .2s; }
/* progressive loading: a tab draws its head and these placeholders at once, then each part fills in as its data lands */
.skel { position: relative; overflow: hidden; border-radius: 8px;
  background: color-mix(in srgb, var(--muted) 16%, transparent); }
.skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(100deg, transparent 15%, color-mix(in srgb, #fff 38%, transparent) 50%, transparent 85%);
  animation: skel-sweep 1.5s ease-in-out infinite; }
@keyframes skel-sweep { to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .skel::after { animation: none; display: none; } }
.skel-card { min-height: 210px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.skel-card .skel { height: 14px; }
.skel-card .skel.t { height: 20px; width: 62%; } .skel-card .skel.m { width: 38%; }
.skel-card .skel.w { width: 92%; } .skel-card .skel.s { width: 70%; } .skel-card .skel.b { height: 34px; width: 46%; margin-top: auto; }
.skel-row { height: 58px; margin-bottom: 10px; }
.stat.skel-stat { min-height: 84px; background: var(--panel); }
.stat.skel-stat .skel { height: 26px; width: 44%; margin-bottom: 10px; } .stat.skel-stat .skel + .skel { height: 12px; width: 72%; margin: 0; }
.panel .skel { height: 14px; margin: 10px 0; } .panel .skel.s { width: 64%; }
.part-error { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.part-error b { color: var(--warn); }
/* the last data is on screen and a fresh copy is on its way (or couldn't be had) */
#updating { position: fixed; left: 18px; bottom: 18px; z-index: 25; display: flex; align-items: center; gap: 8px;
  padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line);
  box-shadow: var(--shadow-hover); backdrop-filter: blur(6px); animation: fade .2s; }
#updating[hidden] { display: none; }
#updating i { width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%;
  animation: spin .8s linear infinite; }
#updating.failed { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
@media (prefers-reduced-motion: reduce) { #updating i { animation: none; border-right-color: var(--accent); } }
.count { font-size: 11.5px; font-weight: 700; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px;
  display: inline-grid; place-items: center; color: #fff;
  background: var(--grad); }
#duecount .count { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.spacer { flex: 1; }
.status { color: var(--muted); font-size: 13.5px; }

main { max-width: 1680px; margin: 0 auto; padding: 28px 32px 80px; }
:root[data-width="wide"] main, :root[data-width="wide"] .bar { max-width: 2400px; }
:root[data-width="full"] main, :root[data-width="full"] .bar { max-width: none; }
.pagehead { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.pagehead > div:first-child { flex: 1; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.025em; margin: 0; font-weight: 800; }
.sub { color: var(--muted); margin: 6px 0 0; }
h2 { font-size: 20px; letter-spacing: -.01em; margin: 8px 0 4px; }
h3 { font-size: 15.5px; margin: 0; letter-spacing: -.005em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* stats */
.hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 22px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
.stat .num { font-size: 28px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  line-height: 1.1; }
.stat .lbl { color: var(--muted); font-size: 13px; margin-top: 2px; }
/* big-number tiles: a soft gradient wash, a gradient-filled number, a mono caption, a hover lift */
.stat:not(.lead) { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 10%, var(--panel)),
  color-mix(in srgb, var(--accent-2) 5%, var(--panel)) 75%); transition: transform .2s ease, box-shadow .2s ease; }
.stat:not(.lead):hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.stat:not(.lead):not(.warn):not(.good) .num { background: var(--grad); -webkit-background-clip: text; background-clip: text;
  color: transparent; }
.stat .num { font-size: 34px; }
.mono-cap, .stat .lbl, .section h3, .layout > aside .hint { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; }
.stat .lbl { margin-top: 4px; }
/* hero headline: an eyebrow caption, then the title with its key phrase filled with the gradient */
.eyebrow { display: block; color: var(--accent); margin-bottom: 6px; }
h1 .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1.hero-title { font-size: 40px; letter-spacing: -.035em; }
/* fit chip: a rounded pill by score band, same colors as the ring */
.fitchip { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
  white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.fitchip.hi { --c: var(--good); } .fitchip.mid { --c: var(--warn); } .fitchip.lo { --c: var(--bad); }
.stat.lead { color: #fff; border-color: transparent; background: var(--grad); }
.stat.lead .lbl { color: rgba(255, 255, 255, .82); }
.stat.warn .num { color: var(--warn); }
.stat.good .num { color: var(--good); }
.stat:nth-child(2) { animation-delay: 50ms; } .stat:nth-child(3) { animation-delay: 100ms; }
.stat:nth-child(4) { animation-delay: 150ms; }
.filtered { color: var(--muted); font-size: 13px; margin: -10px 0 14px; }

/* the filter bar on Today: the filters in force, each edited in place, and what they hide */
.fbar { position: relative; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px;
  box-shadow: var(--shadow); margin: 0 0 18px; font-size: 14px; }
.fbar > .ico { color: var(--accent); margin: 0 4px 0 4px; }
.fpart { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid transparent; background: none;
  font: inherit; color: var(--text); padding: 4px 9px; border-radius: 9px; cursor: pointer; max-width: 100%;
  text-align: left; transition: background .15s, border-color .15s; }
.fpart:hover { background: var(--chip); }
.fpart.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.fpart .k { color: var(--muted); }
.fpart .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px; }
.fpart.off .v { color: var(--muted); font-weight: 500; }
.fbar .sep { color: var(--muted); opacity: .45; }
.fbar .edit { margin-left: auto; }
.fline { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--muted);
  font-size: 13px; border-top: 1px dashed var(--line); margin-top: 3px; padding: 7px 6px 1px; }
.fline b { color: var(--text); font-weight: 650; }
.fline.bad, .fline.bad b { color: var(--bad); }
.fline a { color: inherit; }
.hchip { border: 0; font: inherit; font-size: 12.5px; font-weight: 550; background: var(--chip); color: var(--chip-text);
  border-radius: 999px; padding: 1px 10px; cursor: pointer; transition: background .15s, color .15s; }
.hchip:hover { background: var(--accent-soft); color: var(--accent); }
.hchip .n { font-variant-numeric: tabular-nums; font-weight: 750; margin-right: 4px; }
.fpop { position: absolute; top: calc(100% + 6px); left: 0; width: min(420px, calc(100vw - 32px));
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 2px 16px 14px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .45); animation: pop .2s cubic-bezier(.2, .8, .2, 1) both; }
.fpop.all { width: min(680px, calc(100vw - 32px)); }
.fpop textarea { min-height: 88px; }
.fpop .foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.fpop .foot .msg { flex: 1; font-size: 13px; }
.hidden-list .list-item { align-items: flex-start; }
.hidden-list a.title { color: var(--text); font-weight: 650; text-decoration: none; }
.hidden-list a.title:hover { color: var(--accent); text-decoration: underline; }
.hidden-list .meta { margin: 1px 0 0; }
.chip.why { background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn); white-space: nowrap; }
.company.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.company.bad .x { opacity: 1; }
.company .who .err { color: var(--bad); white-space: normal; font-weight: 550; }

/* pipeline */
.pipeline { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); margin: -8px 0 22px; }
.pipeline .bar-track { display: flex; gap: 4px; height: 12px; }
.pipeline .seg { background: var(--sc); border-radius: 6px; min-width: 12px; transform-origin: left;
  animation: grow .7s cubic-bezier(.2, .7, .2, 1) both; }
.pipeline .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.pipeline .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--sc);
  margin-right: 6px; }
.pipeline .legend b { color: var(--text); margin-left: 3px; }

/* buttons */
button.btn, a.btn { font: inherit; font-size: 14px; font-weight: 550; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--text); border-radius: 10px; padding: 6px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .12s, box-shadow .15s, border-color .15s; }
a.btn { text-decoration: none; } /* a link that opens a page, drawn as a button (Apply ↗, prep sheets) */
button.btn:hover, a.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
button.btn:active, a.btn:active { transform: translateY(1px); }
button.primary, a.btn.primary { color: #fff; border-color: transparent; background: var(--grad);
  box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
button.primary:hover, a.btn.primary:hover { border-color: transparent; filter: brightness(1.07);
  box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--accent) 90%, transparent); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 5px 10px; }
button.ghost:hover { color: var(--text); background: var(--chip); border-color: transparent; }
button.btn:disabled { opacity: .55; cursor: default; }
/* A dialog's Close (closeButton): a quiet secondary button, a translucent chip with a hairline border, an X and the word
   (a round X alone in the small dialogs). Hover lifts it and lights it in the accent; Esc closes the dialog too. */
button.btn.btn-close { min-height: 36px; font-size: 14px; gap: 7px; color: var(--close-fg); padding: 6px 15px 6px 11px; font-weight: 650;
  border-radius: 999px; background: var(--close-bg); border: 1px solid var(--close-edge);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 1px 2px rgba(20, 26, 46, .12);
  transition: transform .15s, box-shadow .15s, border-color .15s, background .15s, color .15s; }
button.btn.btn-close .ico { width: 15px; height: 15px; stroke-width: 2.4; color: var(--close-x); transition: transform .2s; }
button.btn.btn-close:hover { color: var(--close-fg); transform: translateY(-1px); border-color: var(--close-x);
  background: color-mix(in srgb, var(--close-x) 22%, var(--close-bg));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--close-x) 32%, transparent), 0 8px 18px -10px color-mix(in srgb, var(--close-x) 85%, transparent); }
button.btn.btn-close:hover .ico { transform: rotate(90deg); }
button.btn.btn-close:active { transform: translateY(0); box-shadow: 0 0 0 2px color-mix(in srgb, var(--close-x) 32%, transparent); }
button.btn.btn-close:focus-visible { outline: 2px solid var(--close-x); outline-offset: 2px;
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--close-x) 30%, transparent); }
button.btn.btn-close.icon-only { width: 36px; height: 36px; padding: 0; justify-content: center; }
@media (prefers-reduced-motion: reduce) { button.btn.btn-close, button.btn.btn-close .ico { transition: none; }
  button.btn.btn-close:hover .ico { transform: none; } }
/* The action buttons (actButton), one icon and one color each, the same on every view and card state: Queue purple
   and Apply green are filled; Skip rose, Snooze amber, I applied blue, Prepare magenta, Score cyan are tinted;
   Details slate and Remove from queue grey. Nothing else restyles them. */
.btn.act { --t: var(--chip-text); padding: 6px 12px; color: var(--t);
  background: color-mix(in srgb, var(--t) 10%, var(--panel-solid)); border-color: color-mix(in srgb, var(--t) 38%, var(--line)); }
.btn.act:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--t);
  background: color-mix(in srgb, var(--t) 18%, var(--panel-solid)); }
.btn.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.act-skip { --t: var(--bad); }
.btn.act-snooze { --t: var(--warn); }
.btn.act-applied { --t: #2563eb; }
.btn.act-prepare { --t: #c026d3; font-weight: 650; }
.btn.act-score { --t: #0e7490; }
:root[data-theme="dark"] .btn.act-applied { --t: #7aa2ff; }
:root[data-theme="dark"] .btn.act-prepare { --t: #e879f9; }
:root[data-theme="dark"] .btn.act-score { --t: #67e8f9; }
.btn.act-details { background: var(--chip); border-color: transparent; }
.btn.act-details:hover:not(:disabled) { border-color: var(--line); background: var(--chip); color: var(--text); }
.btn.act-remove { --t: var(--muted); background: transparent; border-style: dashed; }
.btn.act.act-queue, .btn.act.act-apply { color: #fff; border-color: transparent;
  box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
.btn.act.act-queue { background: var(--grad); }
.btn.act.act-apply { background: linear-gradient(135deg, #0c9468, #14b8a6); box-shadow: 0 6px 16px -8px rgba(12, 148, 104, .8); }
:root[data-theme="dark"] .btn.act.act-apply { color: #04281c; background: linear-gradient(135deg, #3ddc97, #5eead4); }
.btn.act.act-queue:hover:not(:disabled), .btn.act.act-apply:hover:not(:disabled) { border-color: transparent; filter: brightness(1.07); }
.btn.act.act-queue:hover:not(:disabled) { background: var(--grad); }
.btn.act.act-apply:hover:not(:disabled) { background: linear-gradient(135deg, #0c9468, #14b8a6); }
:root[data-theme="dark"] .btn.act.act-apply:hover:not(:disabled) { background: linear-gradient(135deg, #3ddc97, #5eead4); }
.btn.act-score:disabled { animation: score-pulse 1.3s ease-in-out infinite; opacity: .8; transform: none; }
@keyframes score-pulse { 50% { opacity: .5; } }
/* Scoring now: a ring in the score's place, in the accent colors, turning (a pulsing dot when motion is reduced) */
.score-spin { width: 52px; height: 52px; margin: 7px auto; border-radius: 50%; animation: spin .9s linear infinite;
  background: conic-gradient(from 0deg, transparent 0 10%, var(--accent-2), var(--accent));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); }
/* The seconds sit inside the ring (the spinner clock, see spinnerClock in the script); a ring that has run past a
   minute gets smaller digits. With reduced motion the ring holds still and the number keeps ticking. */
.score-spin-wrap { position: relative; width: 52px; height: 52px; margin: 7px auto; }
.score-spin-wrap .score-spin { position: absolute; inset: 0; width: auto; height: auto; margin: 0; }
.score-spin-wrap .spin-clock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px;
  font-weight: 700; color: var(--accent); }
.score-spin-wrap .spin-clock.long { font-size: 10px; }
.score-spin-wrap .spin-clock.slow { color: var(--muted); }
.spin-note { color: var(--muted); }
.spin-note:empty { display: none; }
.spin-clock { font-variant-numeric: tabular-nums; white-space: nowrap; }

}

/* A button was pressed and the server hasn't answered (pending() in the script): the card dims and lifts a little under

.card.pending { box-shadow: 0 16px 34px -18px color-mix(in srgb, var(--accent) 75%, transparent),

  border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

  animation: pending-sheen 1.1s ease-in-out infinite; }

/* cards */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px 16px 22px; margin: 12px 0; box-shadow: var(--shadow); overflow: hidden;
  transition: transform .2s cubic-bezier(.2, .7, .2, 1), box-shadow .2s, border-color .2s;

.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, transparent); }
.card.job:hover, .card.app:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover);
  border-color: color-mix(in srgb, var(--stripe, var(--accent)) 35%, var(--line)); }
/* a job card (Today, Queue): header (logo, title, one meta line; a compact ring beside them, top right), labeled rows

.card.job { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto auto auto;

  column-gap: 8px; align-items: center; text-align: left; padding-left: 0; }

.card.job > .fitbox.noscore small { align-self: auto; }
/* the corner one is the loud one: filled with the cyan gradient, white text */
.btn.act-score.score-corner { padding: 5px 14px; font-size: 13.5px; font-weight: 650; justify-content: center; min-width: 76px;
  color: #fff; border-color: transparent; background: linear-gradient(135deg, #0e7490, #2563eb);
  box-shadow: 0 6px 16px -8px rgba(37, 99, 235, .8); transition: transform .15s, box-shadow .15s, filter .15s; }

  background: linear-gradient(135deg, #0e7490, #2563eb); box-shadow: 0 10px 22px -10px rgba(37, 99, 235, .9); }
.btn.act-score.score-corner:active { transform: translateY(0); }
.btn.act-score.score-corner:disabled { filter: saturate(.8); transform: none; }
.fitbox .fit-note { grid-column: 1 / -1; margin-top: 6px; max-width: 280px; line-height: 1.35; }
.card.job > .fitbox .scorer { margin-top: 3px; justify-self: start; align-self: start; }
.card.job > .jc-rows { grid-area: 2 / 1 / 3 / -1; min-width: 0; margin-top: 10px; }

.jc-title { display: flex; gap: 6px; align-items: center; min-height: 26px; }

.meta.jc-meta { flex-wrap: nowrap; margin: 2px 0 0; white-space: nowrap; }

.krow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 6px 0;
  border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent); font-size: 13.5px; }

  display: flex; align-items: center; gap: 6px; }

.kv { min-width: 0; }

  padding: 1px 10px; border-radius: 999px; background: color-mix(in srgb, var(--good) 14%, transparent); }

  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.psrc-posted, .psrc-ask { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); font-weight: 700; }

.kv .advice { margin: 0; }
.kv .advice .atext { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kv .warns { margin: 0; }
.kv .chips { margin: 0; max-height: 50px; overflow: hidden; }
.kv .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kv .note { margin: 0; }
.person { display: flex; gap: 6px; align-items: center; color: var(--good); min-width: 0; }
.person .ptext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .dont { flex: none; margin-left: auto; }
.pmore { color: var(--muted); font-size: 13px; }
.pmore a { color: var(--muted); text-decoration: none; }
.pmore a:hover { color: var(--accent); text-decoration: underline; }
.card.fit-hi { --stripe: var(--good); } .card.fit-mid { --stripe: var(--warn); } .card.fit-lo { --stripe: var(--bad); }
.card.fit-none { --stripe: color-mix(in srgb, var(--accent) 35%, transparent); }
.card a.title { color: var(--text); font-weight: 700; font-size: 17px; letter-spacing: -.01em; text-decoration: none; }
.card a.title:hover { color: var(--accent); }
.mono { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-weight: 800;
  font-size: 16px; letter-spacing: -.02em; background: hsl(var(--h) 80% 93%); color: hsl(var(--h) 60% 36%);
  box-shadow: inset 0 0 0 1px hsl(var(--h) 60% 50% / .12); }

.mono { position: relative; overflow: hidden; flex: none; }

  box-sizing: border-box; background: #fff; opacity: 0; }
.mono.logo img { opacity: 1; }
/* a logo that is a button to the Company tab (monogram(name, true)): it lifts and rings in the company's hue */
button.mono-link { border: 0; padding: 0; font-family: inherit; cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease; }
button.mono-link:hover, button.mono-link:focus-visible { transform: translateY(-2px) scale(1.04);
  box-shadow: 0 0 0 2px hsl(var(--h) 75% 55% / .55), 0 8px 16px -8px hsl(var(--h) 80% 40% / .6); }
button.mono-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.mono-link:active { transform: translateY(0) scale(.98); }
.meta { color: var(--muted); font-size: 13.5px; margin: 3px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 8px;
  align-items: center; }

.meta .sep { opacity: .45; }
.pay { color: var(--good); font-weight: 650; font-variant-numeric: tabular-nums; }
/* an hourly (rate) pay shown as a year's: amber, not the green of a salary */
.pay.rate, .paychip.rate { color: var(--warn, #b45309); }
.psrc-posted.rate { background: color-mix(in srgb, var(--warn, #d97706) 14%, transparent); color: var(--warn, #b45309); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions { margin-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }

  padding: 1px 10px; font-size: 12.5px; font-weight: 500; }

.badge { font-size: 11px; font-weight: 800; letter-spacing: .06em; border-radius: 6px; padding: 2px 7px;
  text-transform: uppercase; }
.badge.new { color: #fff; background: var(--grad);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: pulse 2.4s ease-out infinite; }

/* found closed once: a second look confirms it, so amber (not red) until then */
.badge.checking { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); text-transform: none; letter-spacing: 0; }
/* a posting that closed since you last looked: amber, gently pulsing, until cleared (click it) */

  cursor: pointer; font-family: inherit; animation: glow 2.6s ease-out infinite; transition: transform .15s; }

/* the Closed postings strip over the Applications list */
.closed-strip { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-radius: 14px;
  padding: 12px 14px; margin: 0 0 16px; animation: rise .45s cubic-bezier(.2, .7, .2, 1) both;

.closed-strip .cs-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }

.card.app.ping, .card.job.ping { animation: ping 1.4s ease-out 1; }

.badge.round { background: var(--grad); color: #fff; text-transform: none; letter-spacing: 0; margin-left: 8px;
  vertical-align: 2px; }

.fitbox { text-align: center; padding-left: 4px; }
.ring { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto;
  background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--chip) 0); animation: fade .6s both; }

.closed-group { margin-top: 22px; }

/* Rescore: a small round button on the ring's edge, shown on hover; a ring being scored again spins its rim */

.ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); grid-auto-rows: auto; gap: 14px; align-items: stretch; }  /* a row is as tall as its tallest card, which the others match */

/* a card stands off the page: a mid-tone edge and a left bar in its company's colour (--h; edges 3:1 or more against the page,

:root { --ref-page: #e3e7f6; --ref-tint-a: #eceffb; --ref-tint-b: #dbe0f3; --ref-edge-s: 38%; --ref-edge-l: 37%; --ref-ac-l: 48%; --ref-band: .13;

  --ref-band: .17; --ref-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 12px 26px -14px rgba(0, 0, 0, .95), 0 2px 6px rgba(0, 0, 0, .5); }

  background-image: radial-gradient(1100px 560px at 8% -12%, var(--glow-1), transparent 62%),

.card.ref { --h: 230; --ac: hsl(var(--h) 66% var(--ref-ac-l)); --edge: hsl(var(--h) var(--ref-edge-s) var(--ref-edge-l)); --stripe: var(--ac);
  --rj: 28px; --rp: 60px; container: refcard / inline-size;  /* a job row and a person row: the same height in every card */
  display: flex; flex-direction: column; gap: 6px; padding: 0 16px 10px 18px; border: 1px solid var(--edge); box-shadow: var(--ref-shadow);
  background: radial-gradient(120% 70% at 100% 0%, hsl(var(--h) 80% 60% / .10), transparent 60%), var(--panel-solid); }

.card.ref.live-queued .ref-ribbon { --rb: #0a7a56; } .card.ref.live-working .ref-ribbon { --rb: #b45309; }

/* comps: the opportunities as columns on a wide screen, as stacked cards on a phone */
table.comps { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%; }

  min-width: 190px; max-width: 280px; }
table.comps th.lbl { position: sticky; left: 0; z-index: 1; min-width: 150px; max-width: 175px; background: var(--panel-solid);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
table.comps thead th { border-top: 3px solid var(--sc); padding-top: 12px; }
/* the head row sticks under the nav (--head is its height), opaque with a tint of the stage's colour, over the rows and under
   the nav (z 5) and dialogs; the label column sticks to the left as well. A table wider than its box scrolls inside it
   (.hscroll), where the head sticks to that box's top; the row of buttons below the head is not sticky. */
.comp-table:not(.hscroll) { overflow: visible; }
table.comps thead tr.hd th { position: sticky; top: var(--head, 64px); z-index: 3; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  background: linear-gradient(color-mix(in srgb, var(--sc) 10%, transparent), transparent 80%), var(--panel-solid); }
table.comps thead tr.hd th.lbl { z-index: 4; border-top-color: transparent; background: var(--panel-solid); }
table.comps thead tr.acts th { border-top: 0; padding-top: 0; padding-bottom: 10px; background: var(--panel-solid); }
table.comps thead tr.acts th:not(.lbl) { background: linear-gradient(transparent, color-mix(in srgb, var(--sc) 5%, transparent)), var(--panel-solid); }
.comp-table.hscroll { overflow: auto; max-height: calc(100vh - var(--head, 64px) - 20px); }
.comp-table.hscroll table.comps thead tr.hd th { top: 0; }
.comp-table.stuck table.comps thead tr.hd th { box-shadow: 0 10px 14px -10px rgba(20, 26, 46, .45); transition: box-shadow .2s; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .comp-table.stuck table.comps thead tr.hd th { box-shadow: 0 10px 14px -10px rgba(0, 0, 0, .8); } }
:root[data-theme="dark"] .comp-table.stuck table.comps thead tr.hd th { box-shadow: 0 10px 14px -10px rgba(0, 0, 0, .8); }
@media (prefers-reduced-motion: reduce) { .comp-table.stuck table.comps thead tr.hd th { transition: none; } }
table.comps thead .co-sub { display: flex; align-items: center; gap: 8px; margin-top: 6px; min-width: 0; }

.comps .best { color: var(--good); font-weight: 700; border-radius: 999px; padding: 1px 9px;

.comps .stale, .comp-cards .stale { color: var(--warn); font-weight: 650; }
/* comps suggestion: stat tiles, then ranked cards (medal, company, score ring, part bars, pay gauge); the columns share it */

.cmp-title { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }

.cmp-card { --sc: var(--line); --glow: transparent; position: relative; min-width: 0; padding: 14px 16px 12px; border-radius: var(--radius);

.medal { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px;

.medal.bronze { color: #3a1d08; background: linear-gradient(145deg, #f3c9a0, #b8693a); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 4px 10px -4px #b8693a; }

@property --pp { syntax: "<number>"; inherits: false; initial-value: 0; }

  box-shadow: 0 6px 16px -8px var(--c1); animation: ringfill .9s cubic-bezier(.2, .7, .2, 1) both; }

.cmp-ring.mini { width: 36px; height: 36px; } .cmp-ring.mini::before { inset: 4px; } .cmp-ring.mini b { font-size: 12.5px; }

.stagebadge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 650; text-transform: capitalize;
  color: color-mix(in srgb, var(--sc) 75%, var(--text)); background: color-mix(in srgb, var(--sc) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--sc) 35%, transparent); }

.cmp-head { margin: 8px 0 0; font-size: 13.5px; line-height: 1.4; }

.comps thead th { background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 14%, var(--panel-solid)), var(--panel-solid) 75%); }

/* a row's label: a tinted icon chip and the words, coloured by group (money green, process purple, fit amber, people blue,

.comp-cards dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 12px; margin: 10px 0 0; font-size: 14px; }
.comp-cards dt { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; padding-top: 2px; }

.note { font-size: 13.5px; color: var(--muted); margin-top: 6px; padding-left: 10px;
  border-left: 2px solid var(--line); }
/* An application's note grows a dated entry at every step: three lines on the card, the whole note in Details. */
.app .note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.warns { font-size: 13.5px; color: var(--warn); margin: 2px 0 4px; }
.warns b { font-weight: 600; }
/* a job's tailored resume: what's kept, and what a build just said (review it before applying) */
.tailor { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13.5px;
  padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); color: var(--muted);
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%); animation: rise .35s both; }
.tailor[hidden] { display: none; }

  cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }

.followup, .cover { display: block; margin-top: 8px; }

.cover .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.cover-compare { margin-top: 10px; }
.cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 13px; margin-top: 4px; }
.cc { padding: 2px 8px; border-radius: 8px; line-height: 1.4; }

@media (max-width: 640px) { .cc-grid { grid-template-columns: 1fr; } }
.followup .fu-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 6px; }

.followup .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
/* Who to contact: the people a posting and your notes name, searches to open, and a note to one of them */

  background: radial-gradient(120% 140% at 0% 0%, var(--accent-soft), transparent 60%), var(--card);
  animation: rise .35s cubic-bezier(.2, .7, .2, 1) both; }
.who[hidden] { display: none; }
.who .who-person { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 6px 0; border-top: 1px dashed var(--line); }

.who .who-role.connection { background: linear-gradient(135deg, #12a37f, #3b9ae8); }
.who .who-why { color: var(--muted); font-size: 12.5px; flex: 1 1 200px; }
.who .who-person .btn { margin-left: auto; transition: transform .15s, box-shadow .2s; }
.who .who-person .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--accent-soft); }
.who .who-search { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 8px 0 4px; }
.who .who-search a { font-size: 12.5px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--accent);
  background: var(--chip); text-decoration: none; transition: transform .15s, background .2s; }
.who .who-search a:hover { transform: translateY(-1px); background: var(--accent-soft); }
.who .who-existing { color: var(--warn); font-size: 13px; margin-bottom: 4px; }
.who .who-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.who input[type="text"], .who textarea { width: 100%; margin-bottom: 6px; }

.who .problems { flex-basis: 100%; color: var(--warn); white-space: pre-wrap; margin-top: 6px; }
/* Prepare: chips that say how far the three steps got, above the panels each step fills */
.prepare { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; }
.prepare[hidden] { display: none; }
.prep-steps { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.prep-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 12px; border-radius: 999px;
  font: inherit; font-size: 12.5px; font-weight: 650; color: var(--muted); border: 1px solid var(--line); background: var(--chip);
  cursor: pointer; max-width: 100%; transition: background .2s, color .2s, border-color .2s, transform .15s, box-shadow .2s; }
.prep-chip[hidden] { display: none; }
.prep-chip::after { content: ""; flex: none; width: 6px; height: 6px; margin: -3px 1px 0 0; border: solid currentColor;
  border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: .75; transition: transform .2s, margin .2s; }
.prep-chip[aria-expanded="true"]::after { transform: rotate(-135deg); margin-top: 3px; }
.prep-chip:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06);
  box-shadow: 0 6px 14px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
.prep-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.prepare .tailor .problems, .prepare .tailor .small { overflow-wrap: anywhere; }

.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0; }
.prep-chip[data-state="run"] { color: var(--accent); border-color: var(--accent);
  background: var(--accent-soft); animation: pulse 1.2s ease-in-out infinite; }

  background: color-mix(in srgb, var(--bad) 10%, transparent); }

  font-weight: 600; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); }
.gaps { font-size: 13.5px; color: var(--muted); margin: 2px 0 4px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.gaps.open { -webkit-line-clamp: unset; }
.gaps b { color: var(--text); font-weight: 600; }
.whyfit { font-size: 13.5px; margin: 2px 0 6px; } .whyfit summary { cursor: pointer; color: var(--muted); }
.whyfit ul { list-style: none; padding: 0; margin: 6px 0 0; } .whyfit li { margin: 4px 0; }
.whyfit .v { display: inline-block; min-width: 62px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; }
.whyfit .v.met { color: var(--good); } .whyfit .v.partial { color: var(--warn); }
.whyfit .v.not_met { color: var(--bad); }
.whyfit q { display: block; color: var(--muted); margin-left: 66px; font-style: italic; }
.fitrange { display: flex; align-items: center; gap: 10px; } .fitrange input { flex: 1; }
.fitrange output { min-width: 34px; font-weight: 600; text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 56px 16px; border: 1.5px dashed var(--line);
  border-radius: var(--radius); background: color-mix(in srgb, var(--panel) 50%, transparent); }
.empty .ico { display: block; margin: 0 auto 10px; color: var(--accent); opacity: .7; }
/* an empty page still feels alive: a soft glow, and its icon drifts */

  color-mix(in srgb, var(--panel) 50%, transparent); }
.empty .ico { color: var(--accent-2); opacity: .85; animation: float 4s ease-in-out infinite; }

/* find a company: the box in the header, on every tab */
.jump { position: relative; width: 320px; max-width: 100%; flex: none; }
.jump input[type=search] { padding-right: 30px; }
.jump kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; font: inherit;
  font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

  color: var(--text); padding: 7px 10px; border-radius: 8px; cursor: pointer; }

.stage-chip { margin-right: 6px; }
.jc-note .facts { color: var(--muted); font-size: 13px; display: grid; gap: 3px; }

/* applications */
.section { display: flex; align-items: center; gap: 10px; margin: 26px 0 4px; }
.section h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.section .n { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 999px;
  padding: 0 8px; }
.section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.section.hot h3 { color: var(--warn); }
.card.app { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 16px; --stripe: var(--sc); }
.app-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }

/* The posting form (postingControls): a link box and a text box under the buttons, and what happened under them. An
   error stays until the next try; a success shows a moment before the card changes. */
input[type=url] { font: inherit; color: var(--text); background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 11px; width: 100%; transition: border-color .15s, box-shadow .15s; }
input[type=url]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.post-form { flex-basis: 100%; display: grid; gap: 8px; }

.post-msg { flex-basis: 100%; font-size: 13.5px; line-height: 1.45; padding: 8px 12px; border-radius: 10px; color: var(--bad);
  border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 9%, transparent); }
.post-msg[data-tone=ok] { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent);
  background: color-mix(in srgb, var(--good) 9%, transparent); }
.sent-chip { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--muted); border: 0;
  background: none; cursor: pointer; padding: 3px 8px; border-radius: 8px; font-family: inherit; }
.sent-chip:hover { background: var(--chip); color: var(--text); }
.sent-chip.empty-pkg { color: var(--accent); }
/* the bell on an application: a one-off Apple Reminders reminder, asked for in a small popover */
.bell-wrap { position: relative; display: inline-flex; }
.bell-wrap .btn { transition: transform .15s, color .15s; }
.bell-wrap .btn:hover { transform: translateY(-1px) rotate(-12deg); color: var(--accent); }
.bell-pop { position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 20; width: min(300px, 86vw); display: grid; gap: 8px;
  padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-solid);
  box-shadow: var(--shadow-hover); animation: bell-pop .18s ease-out; }
.bell-pop::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; border-radius: 14px 14px 0 0; background: var(--grad); }
.bell-pop label { font-size: 12px; color: var(--muted); }
.bell-pop .row { display: flex; gap: 6px; justify-content: flex-end; }
@keyframes bell-pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }
.quiet-bar { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--chip); font-size: 13.5px; }
.quiet-bar .why { color: var(--muted); }
.quiet-bar .acts { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.quiet-bar input { flex: 1; min-width: 180px; }
.section.quiet h3 { color: var(--muted); }
.section.live h3 { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.section.live .n { background: var(--grad); color: #fff; }
/* the live-first filter, and the Snoozed and Closed folds that stay shut until you want them */

.live-filter .seg-ctl { flex: none; }

/* overlay, toast, forms */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text);
  color: var(--bg); border-radius: 12px; padding: 10px 16px; display: none; gap: 14px; align-items: center;
  z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .45);
  animation: rise .3s cubic-bezier(.2, .7, .2, 1); font-weight: 550; }
.toast button { background: none; border: 0; color: inherit; font: inherit; font-weight: 800; cursor: pointer;
  text-decoration: underline; }
/* a colored edge says what kind of news it is: good news is green, a no gets a sunrise (it's not the end) */
.toast { overflow: hidden; padding-left: 20px; }
.toast::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--grad); }
.toast[data-tone="win"]::before { background: linear-gradient(180deg, #34d399, #10b981); }
.toast[data-tone="onward"]::before { background: linear-gradient(180deg, #fbbf24, #f472b6); }
.toast { animation: toast-in .3s cubic-bezier(.2, .7, .2, 1); }
.toast[data-tone="win"] { animation: toast-pop .5s cubic-bezier(.2, .7, .2, 1); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes toast-pop { from { opacity: 0; transform: translate(-50%, 14px) scale(.92); }
  60% { transform: translate(-50%, -3px) scale(1.03); } }
.overlay { position: fixed; inset: 0; background: rgba(8, 10, 20, .5); backdrop-filter: blur(4px);
  display: none; z-index: 10; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.dialog { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px; max-width: 780px;
  width: 100%; padding: 22px 24px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); animation: rise .3s both; }
.posting { white-space: pre-wrap; font-size: 14px; max-height: 60vh; overflow-y: auto; border-top: 1px solid
  var(--line); margin-top: 14px; padding-top: 14px; line-height: 1.6; }
label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 5px; }
.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], input[type=date], textarea, select { font: inherit; color: var(--text);
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; width: 100%;
  transition: border-color .15s, box-shadow .15s; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 70px; resize: vertical; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.list-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.kw { display: grid; grid-template-columns: 1fr 160px auto; gap: 6px; margin: 5px 0; }
.error { color: var(--bad); }
.done-ok { color: var(--good); }
/* Settings' AI tab: what each backend scored and cost sits on its own card (use-*), and one slim strip above the
   cards holds the order, the daily cap and the background scorer. (use-* names: .lead and .bar are taken.) */
.use-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 22px; align-items: center;
  margin: 14px 0 0; padding: 10px 16px; border-radius: 14px; font-size: 12.5px; border: 1px solid var(--line);
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 11%, transparent),
    color-mix(in srgb, #a24af0 8%, transparent) 60%, transparent); animation: rise .4s cubic-bezier(.2, .7, .2, 1) both; }
.use-strip[hidden] { display: none; }
.use-strip .lbl { display: block; color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; }
.use-strip .val { font-weight: 600; overflow-wrap: anywhere; }
.use-strip .use-order { grid-column: 1 / -1; }
.use-strip .use-bar { height: 5px; border-radius: 3px; background: var(--chip); margin-top: 5px; overflow: hidden; }
.use-strip .use-bar i { display: block; height: 100%; background: var(--grad); border-radius: 3px; transition: width .6s ease; }
.use-strip .chips { margin-top: 4px; }
.ai-tile .use { margin-top: auto; display: grid; gap: 8px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 9%, transparent), transparent 75%); }
.ai-tile .use + .foot { margin-top: 0; }
.ai-tile .use-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted);
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.ai-tile .use-counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ai-tile .use-counts div { text-align: center; padding: 6px 4px; border-radius: 9px; background: var(--chip); }
.ai-tile .use-counts b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ai-tile .use-counts span { font-size: 10.5px; color: var(--muted); }
.ai-tile .use-price { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.ai-tile .use-notes { display: grid; gap: 2px; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.ai-tile.compact { cursor: default; padding: 14px 16px; }
.ai-tile.compact:hover { transform: none; box-shadow: none; }
.ai-tile.compact .orb { width: 34px; height: 34px; }
.chip.on { background: var(--accent-soft); color: var(--accent); }

/* where the AI runs: a tile per choice (pick the main one), then the fallback chain */
/* three across where there's room (Settings), stacked in a narrow card (onboarding) */
.ai-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 18px 0 14px; }
.ai-tile { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px;
  border: 1.5px solid var(--line); background: var(--panel-solid); cursor: pointer;
  transition: transform .14s, box-shadow .14s, border-color .14s; }
.ai-tile:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(84, 87, 240, .12); }
.ai-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ai-tile.on { border-color: transparent; cursor: default; box-shadow: 0 12px 30px rgba(84, 87, 240, .2);
  background: linear-gradient(var(--panel-solid), var(--panel-solid)) padding-box, var(--grad) border-box; }
.ai-tile .main-tag { position: absolute; top: -10px; left: 16px; background: var(--grad); color: #fff; font-size: 10.5px;
  font-weight: 800; letter-spacing: .07em; text-transform: uppercase; padding: 2px 9px; border-radius: 6px; }
.ai-tile .top { display: flex; align-items: center; gap: 10px; }
.ai-tile .orb { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); }
.ai-tile.on .orb { background: var(--grad); color: #fff; }
.ai-tile .name { font-weight: 700; font-size: 15px; }
.ai-tile .state { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.ai-tile .state.ready { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.ai-tile .state.setup { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.ai-tile .state.wait { background: var(--chip); color: var(--muted); }
.ai-tile .about { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.meters { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: center; font-size: 12px; color: var(--muted); }
.meters .bars { display: flex; gap: 4px; }
.meters .bars i { width: 22px; height: 7px; border-radius: 4px; background: var(--line); }
.meters .bars i.f { background: var(--grad); }
.ai-steps { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 10px;
  counter-reset: step; font-size: 12.5px; }
.ai-steps li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.ai-steps li::before { content: counter(step); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 11.5px; }
.ai-steps a { font-weight: 600; }
.cmd { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.cmd code { flex: 1; min-width: 0; font-size: 12px; padding: 6px 9px; border-radius: 9px; background: var(--chip); overflow-wrap: anywhere; }
.lm-suggest { display: grid; gap: 8px; padding: 11px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.45;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 11%, transparent), color-mix(in srgb, var(--good) 9%, transparent));
  border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); animation: bell-pop .3s ease both; }
.lm-suggest .lm-model { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.lm-suggest .lm-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 10.5px;
  font-weight: 800; background: var(--grad); color: #fff; vertical-align: 1px; white-space: nowrap; }
.lm-suggest .lm-tag.soft { background: var(--chip); color: var(--muted); }
.lm-suggest .lm-running { display: flex; align-items: center; gap: 8px; font-family: ui-monospace, monospace; font-size: 11.5px;
  text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.lm-suggest .lm-running .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.lm-suggest .lm-running.on { color: var(--text); }
.lm-suggest .lm-running.on .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.lm-suggest .lm-running b { text-transform: none; letter-spacing: 0; font-size: 13px; }
.lm-suggest .lm-warn { color: var(--warn); font-weight: 600; }
.lm-suggest .cmd { margin-top: 0; }
.lm-suggest details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.lm-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
.lm-table th, .lm-table td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.lm-table th { color: var(--muted); font-weight: 600; border-top: 0; }
.lm-table tr.me td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.lm-table code { font-size: 11px; overflow-wrap: anywhere; }
.lm-suggest .lm-alt { display: grid; gap: 4px; }
.lm-suggest a { font-weight: 600; }
@media (max-width: 520px) {
  .lm-table, .lm-table tbody, .lm-table tr, .lm-table td { display: block; }
  .lm-table th { display: none; }
  .lm-table tr { padding: 6px 0; border-top: 1px solid var(--line); }
  .lm-table td { border: 0; padding: 2px 6px; }
  .lm-table tr.me td { background: none; }
  .lm-table tr.me { background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 8px; }
  .lm-table td[data-l]::before { content: attr(data-l); display: block; color: var(--muted); font-size: 10.5px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
}
.ai-key { display: grid; gap: 6px; }
.ai-key .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.ai-tile .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
.ai-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 16px; border-radius: 14px;
  background: var(--accent-soft); margin: 0 0 12px; }
.ai-chain .title { flex-basis: 100%; font-weight: 700; font-size: 13.5px; }
.ai-chain .cap { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.ai-chain .link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px; font: inherit;
  font-weight: 600; font-size: 13px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--panel-solid);
  cursor: pointer; transition: transform .12s; }
.ai-chain .link:hover { transform: translateY(-1px); }
.ai-chain .link.main { background: var(--grad); color: #fff; border-color: transparent; cursor: default; transform: none; }

/* Settings › Cloud providers: a tile per OpenAI-compatible API (key, model, test, chain), then the add form */
.prov-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; margin: 0 0 14px; }
.prov { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px;
  border: 1.5px solid var(--line); background: var(--panel-solid); overflow: hidden;
  transition: transform .14s, box-shadow .14s; animation: rise .5s cubic-bezier(.2, .7, .2, 1) both;
  animation-delay: calc(var(--i, 0) * 60ms); }
.prov::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--grad); }
.prov::after { content: ""; position: absolute; width: 180px; height: 180px; right: -70px; top: -90px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--glow-1), transparent); pointer-events: none; }
.prov:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(84, 87, 240, .14); }
.prov .top { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
.prov .orb { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--grad); color: #fff; }
.prov .name { font-weight: 700; font-size: 15px; }
.prov .url { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.prov .state { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.prov .state.ready { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.prov .state.setup { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.prov .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; position: relative; z-index: 1; }
.prov .lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
.prov .row-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
.prov .row-btns .spacer { flex: 1; }
.prov .help { font-size: 12px; color: var(--muted); line-height: 1.4; }
.prov .links { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; font-size: 12px; font-weight: 600; }
.prov .links a { color: var(--accent); text-decoration: none; }
.prov .links a:hover { text-decoration: underline; }
.prov .pick { display: grid; gap: 6px; margin-top: 6px; position: relative; z-index: 1; }
.prov .pick[hidden] { display: none; }
.prov .pick label { display: inline-flex; align-items: center; gap: 4px; }
.prov .pick label[hidden] { display: none; }
.prov .pick select { max-width: 100%; }
.prov .env { font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--chip); }
.prov-add { display: grid; gap: 10px; padding: 16px; border-radius: 16px; background: var(--accent-soft); margin-top: 6px; }
.prov-add .title { font-weight: 700; font-size: 13.5px; }
.prov-add .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.ai-chain .link.off { border-style: dashed; border-color: var(--muted); color: var(--muted); opacity: .7; }
.ai-chain .link.off .ico { display: none; }
.ai-chain .then { color: var(--accent); display: inline-flex; }
.ai-chain .link .n { font-size: 11px; font-weight: 800; opacity: .8; }
/* a chain step: its number, backend, model menu and ← → × tools; a paused one (out of credit or quota) is dimmed */
.ai-chain .step { cursor: default; padding: 4px 6px 4px 12px; }
.ai-chain .step:hover { transform: none; }
.ai-chain .step-model, .ai-chain .step-add { width: auto; font-size: 12.5px; padding: 3px 8px; border-radius: 999px;
  background: var(--panel-solid); color: var(--text); border: 1px solid var(--line); cursor: pointer; }
.ai-chain .step.main .step-model { background: rgba(255, 255, 255, .18); color: #fff; border-color: rgba(255, 255, 255, .35); }
.ai-chain .step.main .step-model option { color: var(--text); background: var(--panel-solid); }
.ai-chain .step-add { border-style: dashed; color: var(--accent); font-weight: 600; }
.ai-chain .step-tools { display: inline-flex; gap: 2px; margin-left: 2px; }
.ai-chain .step-btn { width: 22px; height: 22px; border-radius: 50%; border: 0; display: grid; place-items: center;
  padding: 0; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; color: inherit;
  background: color-mix(in srgb, currentColor 10%, transparent); transition: background .15s, transform .15s; }
.ai-chain .step-btn:hover:not(:disabled) { background: color-mix(in srgb, currentColor 22%, transparent); transform: scale(1.1); }
.ai-chain .step-btn:disabled { opacity: .3; cursor: default; }
.ai-chain .step.paused { border-style: dashed; opacity: .75; }
.ai-chain .pool-flags { display: flex; flex-wrap: wrap; gap: 6px 14px; width: 100%; font-size: 12px; }
.ai-chain .pool-flag .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
  background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
.ai-chain .pool-flag.off .dot { background: #f59e0b; box-shadow: 0 0 6px #f59e0b88; }
.ai-chain .step.main.paused { background: linear-gradient(135deg, #8a8ca3, #a5a3b8); }
.ai-chain .pause-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
  padding: 1px 8px; border-radius: 999px; color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.ai-chain .step.main .pause-tag { color: #fff; background: rgba(0, 0, 0, .2); }
label.check.off { opacity: .55; cursor: not-allowed; }
.onboard > .card { max-width: 760px; margin-bottom: 16px; }
.onboard details { margin: 12px 0; }
.onboard summary { cursor: pointer; font-weight: 600; }
.welcome { padding: 32px; border: 0; color: #fff; background: var(--grad); }
.welcome h2 { font-size: 26px; }
.welcome button.primary { background: #fff; color: #5a5cf2; }
.companies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.company { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel-solid); transition: border-color .15s, transform .15s; }
.company:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-1px); }
.company .mono { width: 32px; height: 32px; border-radius: 9px; font-size: 12.5px; }
.company .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.company .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.company .who span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.company .x { border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 7px; padding: 3px 7px;
  opacity: 0; transition: opacity .15s; }
.company:hover .x { opacity: 1; }
.company .x:hover { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }

.count.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
.stat.lead { position: relative; overflow: hidden; }
.stat.lead::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%);
  animation: sheen 1.6s .4s ease-in-out both; }
.card.job .ring { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.card.job:hover .ring { transform: scale(1.06) rotate(-4deg); }
.empty.done { border-style: solid; border-color: color-mix(in srgb, var(--good) 35%, var(--line)); animation: rise .5s both; }
.empty.done .big { font-size: 40px; animation: float 3s ease-in-out infinite; }
.empty.done h2 { color: var(--text); margin: 6px 0; }
main.quiet .card, main.quiet .stat, main.quiet .seg, main.quiet .ring, main.quiet .stat.lead::after { animation: none; }
/* wide layout: sidebar + content */
.layout { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 28px; align-items: start; }
.layout > aside { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 14px;
  max-height: calc(100vh - 104px); overflow-y: auto; padding: 2px 4px 12px 2px; margin: -2px -4px 0 -2px;
  scrollbar-width: thin; }
.layout > aside .hero { grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.layout > aside .hero .stat:only-child, .layout > aside .hero .stat.wide { grid-column: 1 / -1; }
.layout > aside .stat { padding: 12px 14px; }
.layout > aside .stat .num { font-size: 24px; }
.layout > aside .filtered { margin: 0; padding: 0 4px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); }
.panel h4 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.pipeline.panel { margin: 0; padding: 14px; }
input[type=search] { font: inherit; color: var(--text); background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 11px; width: 100%; }
input[type=search]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.seg-ctl { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-ctl button { flex: 1; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--muted); padding: 5px 6px; border-radius: 8px; cursor: pointer; }
.seg-ctl button.on { background: var(--panel-solid); color: var(--text); box-shadow: 0 1px 3px rgba(20, 26, 46, .12); }

.msg.bot code { font-size: 12.5px; background: color-mix(in srgb, var(--text) 8%, transparent); padding: 1px 5px; border-radius: 5px; }

.turn { align-self: flex-start; max-width: 88%; display: flex; flex-direction: column; gap: 4px; animation: rise .25s both; }

/* voice mock interview: a chat with the interviewer, a mic dock, then a report */
.vm-log { display: flex; flex-direction: column; gap: 12px; margin: 14px 0; padding: 16px 14px; min-height: 240px;
  max-height: min(52vh, 520px); overflow-y: auto; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  background: radial-gradient(420px 220px at 0% 0%, var(--accent-soft), transparent 70%),

.vb { max-width: 86%; padding: 10px 14px; border-radius: 18px; line-height: 1.5; overflow-wrap: anywhere; animation: rise .3s both; }
.vb.them { align-self: flex-start; background: var(--chip); border-bottom-left-radius: 5px; font-weight: 600; box-shadow: var(--shadow); }
.vb .who { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }

  box-shadow: 0 10px 24px -14px color-mix(in srgb, var(--accent) 90%, transparent); }
.vb.me .who { color: rgba(255, 255, 255, .8); }
.vb.me textarea { min-height: 84px; color: #fff; background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .38); }

.vb.me .row .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .28); }
.vb.sys { align-self: center; max-width: 92%; padding: 6px 12px; font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 12px; }
.vb.err { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.vb .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.vb .dots span:nth-child(2) { animation-delay: .15s; } .vb .dots span:nth-child(3) { animation-delay: .3s; }
.vm-dock { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); }
.mic { position: relative; flex: none; width: 64px; height: 64px; display: grid; place-items: center; padding: 0; border: 0;
  border-radius: 50%; cursor: pointer; color: #fff; background: var(--grad);
  box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 90%, transparent); transition: transform .15s, box-shadow .15s; }
.mic:hover:not(:disabled) { transform: translateY(-2px) scale(1.05); }
.mic:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
.mic:disabled { opacity: .45; cursor: default; }
.mic::before, .mic::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
.mic:not(:disabled):not(.rec)::before { animation: mic-idle 2.8s ease-out infinite; }
.mic.rec { background: linear-gradient(135deg, #ef4444, #f97316); box-shadow: 0 10px 28px -8px rgba(239, 68, 68, .75); }
.mic.rec::before, .mic.rec::after { border-color: #ef4444; animation: mic-ring 1.5s ease-out infinite; }
.mic.rec::after { animation-delay: .75s; }
@keyframes mic-idle { from { transform: scale(.96); opacity: .45; } to { transform: scale(1.45); opacity: 0; } }
@keyframes mic-ring { from { transform: scale(.95); opacity: .75; } to { transform: scale(1.75); opacity: 0; } }
.vm-time { min-width: 62px; font: 650 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

.vm-hint { flex: 1 1 160px; font-size: 13px; color: var(--muted); }
.vm-meter { display: flex; align-items: center; gap: 2px; flex: 1 1 140px; height: 34px; }
.vm-meter i { flex: 1; max-width: 6px; height: 3px; border-radius: 3px; opacity: .45; transition: height .08s linear;
  background: linear-gradient(var(--accent-2), var(--accent)); }
.vr-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }

  animation: rise .35s both; }

.vr-tile.t2 { background: linear-gradient(135deg, #0ea5e9, #6366f1); } .vr-tile.t3 { background: linear-gradient(135deg, #10b981, #0ea5e9); }
.vr-tile.t4 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.vr-card { margin: 0 0 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  animation: rise .35s both; transition: transform .15s, box-shadow .15s; }
.vr-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

.vr-track { position: relative; height: 10px; margin: 14px 0 6px; border-radius: 6px; background: var(--chip); }
.vr-zone { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: color-mix(in srgb, var(--good) 32%, transparent); }

  background: var(--grad); border: 2px solid var(--panel-solid); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }

.vr-line { margin-top: 6px; font-size: 14px; } .vr-line b { color: var(--accent); }
ol.vr-ops { list-style: none; margin: 8px 0; padding: 0; counter-reset: op; }
ol.vr-ops li { position: relative; margin: 0 0 8px; padding: 8px 12px 8px 44px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); counter-increment: op; animation: rise .35s both; }
ol.vr-ops li::before { content: counter(op); position: absolute; left: 10px; top: 8px; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; background: var(--grad); }

@keyframes bump { 40% { transform: scale(1.45); } }
@keyframes sheen { to { transform: translateX(100%); } }
@keyframes float { 50% { transform: translateY(-6px); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
