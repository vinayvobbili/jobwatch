# Skills that job postings ask for, how to spot them in text, and where to learn them.
#
# search: what to type into a course site's search, when the name alone is ambiguous (default: the name).
# match: regular expressions, case-insensitive (wrap a part in (?-i:...) to make it case-sensitive).
# options: official pages only, so a link says what it is.
#   kind: certification (an exam), course, or guide (free docs or a tutorial). cost: free or paid.
#   time: roughly how long for someone new to it: hours (a sitting or a weekend), weeks (2-8), months (2+).
#   Prices and exact hours change, so they're left to the linked page.
# JOBWATCH_LINK_TESTS=1 pytest tests/test_learn.py checks that every link still resolves.

- id: aws
  name: AWS
  match: ['\bAWS\b', 'Amazon Web Services']
  options:
    - {name: "AWS Skill Builder", provider: AWS, kind: course, cost: free, time: weeks, url: "https://skillbuilder.aws/"}
    - {name: "AWS Certified Solutions Architect – Associate", provider: AWS, kind: certification, cost: paid, time: months, url: "https://aws.amazon.com/certification/certified-solutions-architect-associate/"}
- id: gcp
  name: Google Cloud
  match: ['\bGCP\b', 'Google Cloud']
  options:
    - {name: "Google Cloud Skills Boost", provider: Google Cloud, kind: course, cost: free, time: weeks, url: "https://www.cloudskillsboost.google/"}
    - {name: "Professional Cloud Architect", provider: Google Cloud, kind: certification, cost: paid, time: months, url: "https://cloud.google.com/learn/certification/cloud-architect"}
- id: azure
  name: Azure
  match: ['\bAzure\b']
  options:
    - {name: "Azure Fundamentals (AZ-900)", provider: Microsoft, kind: certification, cost: paid, time: weeks, url: "https://learn.microsoft.com/en-us/credentials/certifications/azure-fundamentals/"}
    - {name: "Azure Solutions Architect Expert", provider: Microsoft, kind: certification, cost: paid, time: months, url: "https://learn.microsoft.com/en-us/credentials/certifications/azure-solutions-architect/"}
- id: kubernetes
  name: Kubernetes
  match: ['Kubernetes', '\bK8s\b', '\bEKS\b', '\bGKE\b', '\bAKS\b']
  options:
    - {name: "Kubernetes Basics", provider: kubernetes.io, kind: guide, cost: free, time: hours, url: "https://kubernetes.io/docs/tutorials/kubernetes-basics/"}
    - {name: "Certified Kubernetes Application Developer (CKAD)", provider: Linux Foundation, kind: certification, cost: paid, time: weeks, url: "https://training.linuxfoundation.org/certification/certified-kubernetes-application-developer-ckad/"}
    - {name: "Certified Kubernetes Administrator (CKA)", provider: Linux Foundation, kind: certification, cost: paid, time: months, url: "https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/"}
- id: docker
  name: Docker and containers
  search: "Docker containers"
  match: ['\bDocker\b', '\bcontainers?\b', 'containeri[sz]']
  options:
    - {name: "Docker: Get started", provider: Docker, kind: guide, cost: free, time: hours, url: "https://docs.docker.com/get-started/"}
- id: terraform
  name: Terraform
  match: ['Terraform', 'infrastructure[- ]as[- ]code', '\bIaC\b']
  options:
    - {name: "Terraform tutorials", provider: HashiCorp, kind: guide, cost: free, time: hours, url: "https://developer.hashicorp.com/terraform/tutorials"}
    - {name: "HashiCorp Certified: Terraform Associate", provider: HashiCorp, kind: certification, cost: paid, time: weeks, url: "https://developer.hashicorp.com/certifications/infrastructure-automation"}
- id: go
  name: Go
  search: "Go programming language"
  # "Go" is an everyday word, so only in a list of languages or after "in/with/using".
  match: ['\bGolang\b', '(?-i:[,/(]\s?Go\b)', '(?-i:\bGo\s?[,/)])', '(?-i:\b(?:in|with|using|and|or)\s+Go\b)']
  options:
    - {name: "A Tour of Go", provider: go.dev, kind: guide, cost: free, time: hours, url: "https://go.dev/tour/"}
    - {name: "Go: learn", provider: go.dev, kind: guide, cost: free, time: weeks, url: "https://go.dev/learn/"}
- id: rust
  name: Rust
  search: "Rust programming language"
  match: ['(?-i:\bRust\b)']
  options:
    - {name: "The Rust Programming Language", provider: rust-lang.org, kind: guide, cost: free, time: weeks, url: "https://doc.rust-lang.org/book/"}
