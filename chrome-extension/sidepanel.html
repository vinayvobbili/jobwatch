<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jobwatch</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; min-width: 280px; overflow: hidden; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
      :root { --g-apply: #5a5cf2; --g-msg: #0ea5a4; --g-jobs: #e0568f; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --g-apply: #8d8fff; --g-msg: #2dd4bf; --g-jobs: #ff7ab0; } }
      :root[data-theme="dark"] { --g-apply: #8d8fff; --g-msg: #2dd4bf; --g-jobs: #ff7ab0; }
      header {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 11px 14px; border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, var(--soft), transparent);
      }
      .brand { font-size: 18px; margin-right: auto; }
      #options { font-size: 12px; white-space: nowrap; text-decoration: none; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); }
      #options:hover { color: var(--accent); border-color: var(--accent); }
      #pair { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
      #pair.good { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
      #pair.good::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--good) 6%, transparent); } }
      /* a problem is a full-width note under the wordmark, as it always was */
      #pair.warn { order: 9; flex-basis: 100%; display: block; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 500; color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
      #where { margin: 8px 14px 0; font-size: 12px; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #where:empty { display: none; }
      .note { margin: 10px 14px 0; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; background: var(--soft); }
      main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .scroll { flex: 1; min-height: 0; overflow: auto; padding-bottom: 4px; }
      .scroll .note:first-child { margin-top: 10px; }
      .rows { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
      .row {
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; animation: rise .3s both;
        transition: box-shadow .15s, transform .15s;
      }
      .row:hover { box-shadow: 0 10px 24px -16px rgba(70, 60, 190, .5); transform: translateY(-1px); }
      .top { display: flex; gap: 8px; align-items: flex-start; }
      .top input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); flex: none; }
      .q { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
      .badge {
        display: inline-block; margin: 5px 0 0 22px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px;
        background: var(--chip); color: var(--muted);
      }
      .badge.details, .badge.resume { background: var(--grad); color: #fff; }
      .badge.past { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
      .badge.draft { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
      .val {
        width: 100%; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
        color: var(--text); font: inherit; resize: vertical;
      }
      .val:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .meta { margin-top: 5px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
      .meta.bad { color: var(--bad); } .meta.good { color: var(--good); }
      .pill {
        padding: 7px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 600; animation: rise .3s both;
        border: 1px solid color-mix(in srgb, var(--good) 40%, transparent);
        background: linear-gradient(135deg, color-mix(in srgb, var(--good) 20%, transparent), color-mix(in srgb, var(--accent) 12%, transparent));
        color: var(--good);
      }
      .pill.cloud {
        border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn);
        background: linear-gradient(135deg, color-mix(in srgb, var(--warn) 22%, transparent), color-mix(in srgb, var(--bad) 10%, transparent));
      }
      .row.warnrow { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); font-size: 13px; font-weight: 600; }
      .checks { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
      .checks li { margin-top: 3px; overflow-wrap: anywhere; }
      .small { margin-top: 6px; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--text); font-size: 12px; }
      .small:hover { border-color: var(--accent); }
      footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); }
      footer .count { flex: 1; min-width: 80px; color: var(--muted); font-size: 12px; }
      .go:disabled { opacity: .5; transform: none; }
      .empty { padding: 28px 18px; text-align: center; color: var(--muted); }
      .empty .go { margin-top: 14px; padding: 11px 18px; font-size: 15px; }
      .empty.home { padding: 14px 14px 18px; text-align: left; display: flex; flex-direction: column; gap: 14px; }
      .empty.home > .msg { padding: 8px 10px; border-radius: 10px; background: var(--soft); color: var(--text); font-size: 12.5px; animation: rise .3s both; }
      .list-options { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
      .list-options input[type=number] { width: 52px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
      .list-options input[type=checkbox] { accent-color: var(--accent); }

      /* the lead card: what this page is, and the one thing to do about it */
      .lead {
        position: relative; overflow: hidden; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel);
        box-shadow: 0 14px 34px -22px rgba(70, 60, 190, .5); animation: rise .35s both; --k: var(--g-apply); color: var(--text); text-align: left;
      }
      .lead::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--k), var(--accent-2)); }
      .lead::after { content: ""; position: absolute; width: 190px; height: 190px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--k) 26%, transparent), transparent 68%); pointer-events: none; }
      .lead.thread { --k: var(--g-msg); } .lead.list { --k: var(--g-jobs); } .lead.posting { --k: var(--g-jobs); }
      .lead.idle { --k: var(--muted); box-shadow: none; }
      .lead.idle::before { opacity: .35; } .lead.idle::after { display: none; }
      .kicker { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--k); }
      .kicker svg { width: 14px; height: 14px; }
      .lead h2 { margin: 5px 0 0; font-size: 16px; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; position: relative; }
      .lead.idle h2 { font-size: 14px; font-weight: 600; color: var(--muted); }
      .lead .detail { margin-top: 2px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; position: relative; }
      .lead .why { margin-top: 4px; font-size: 12px; color: var(--muted); position: relative; }
      .lead .go { position: relative; display: block; width: 100%; margin-top: 12px; padding: 10px 14px; font-size: 14px; }
      .lead .go:disabled { opacity: .55; transform: none; cursor: default; }
      .lead .list-options { position: relative; }
      .lead .busy { position: relative; margin-top: 8px; font-size: 12px; color: var(--muted); }

      /* the actions: grouped tiles of equal weight; the ones that don't suit this page are dimmed, never hidden */
      .group { animation: rise .35s both; --k: var(--g-apply); }
      .group.msg-g { --k: var(--g-msg); } .group.jobs-g { --k: var(--g-jobs); }
      .group h3 { margin: 0 0 6px 2px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
      .tile {
        position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; min-height: 74px;
        padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
        transition: transform .15s, box-shadow .15s, border-color .15s, opacity .15s;
      }
      .tile:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--k); box-shadow: 0 14px 26px -18px var(--k); }
      .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .tile .ico {
        display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; color: #fff;
        background: linear-gradient(135deg, var(--k), color-mix(in srgb, var(--k) 55%, var(--accent-2)));
        box-shadow: 0 6px 14px -8px var(--k);
      }
      .tile .ico svg { width: 16px; height: 16px; }
      .tile .lbl { font-size: 12.5px; font-weight: 650; line-height: 1.25; }
      .tile.dim { opacity: .5; }
      .tile.dim:hover:not(:disabled) { opacity: .85; }
      .tile:disabled { opacity: .4; cursor: default; }
      .tile .cnt {
        position: absolute; top: 8px; right: 8px; min-width: 22px; padding: 1px 7px; border-radius: 99px; text-align: center;
        font-size: 11px; font-weight: 800; color: #fff; background: var(--grad); box-shadow: 0 4px 10px -4px var(--k);
      }
      @media (max-width: 300px) { .tiles { grid-template-columns: 1fr 1fr; } .tile { min-height: 66px; } }
      @media (min-width: 560px) { .empty.home { max-width: 760px; margin: 0 auto; width: 100%; } }
      .empty .msg + .ghost, .empty .msg + .go { margin-top: 14px; }
      .empty .msg.good { color: var(--good); font-weight: 600; font-size: 14.5px; }
      .empty .msg.small { margin-top: 12px; font-size: 12.5px; }
      a.linkbtn { display: inline-block; text-decoration: none; color: #fff; border-radius: 10px; }
      #toast {
        position: fixed; left: 14px; right: 14px; bottom: 64px; padding: 9px 12px; border-radius: 10px; color: #fff; font-size: 13px;
        background: var(--good); animation: rise .25s both; z-index: 5; box-shadow: 0 12px 28px -14px rgba(0, 0, 0, .5);
      }
      #toast.bad { background: var(--bad); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">jobwatch</span>
      <span id="pair">Checking...</span>
      <a id="options" href="#">Settings</a>
    </header>
    <div id="where"></div>
    <main id="view"></main>
    <script src="logic.js"></script>
    <script src="look.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
