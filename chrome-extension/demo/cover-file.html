<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Platform Engineer - Initech</title>
<style>body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; } p { margin: 12px 0; }</style>
</head>
<body>
<!-- a careers page that takes the cover letter only as a file to attach: the extension never fills a file with it -->
<h1>Platform Engineer</h1>
<form action="#" novalidate>
  <p><label for="fn">First name</label><br><input id="fn" name="fn" type="text"></p>
  <p><label for="cl">Cover letter</label><br><input id="cl" name="cl" type="file"></p>
  <button type="submit">Submit</button>
</form>
</body>
</html>
