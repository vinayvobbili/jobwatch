<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search Jobs | Ladders (demo)</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; background: #f4f6f9; }
  header { background: #fff; padding: 14px 24px; font-weight: 700; color: #1b3a6b; border-bottom: 1px solid #ddd; }
  main { max-width: 560px; margin: 16px auto; padding: 0 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .job-card_jobCardContainer { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .job-card_jobCardTitleLink { font-weight: 600; color: #1b3a6b; text-decoration: none; }
  h3 { margin: 0; font-size: 15px; }
  .job-card_jobCardDescription div { color: #555; font-size: 13px; }
</style>
</head>
<body>
<!-- Page 2 of the made-up Ladders list (ladders-jobs.html): the last page, so no Next. -->
<header>Ladders | Jobs</header>
<main>
  <h1>Search results</h1>
  <div class="job-card_jobCardContainer">
    <div class="job-card_jobCardDescription">
      <div class="job-card_jobCardTitle"><h3><a class="job-card_jobCardTitleLink" href="/job/data-analyst-hooli-remote_90000004">Data Analyst</a></h3></div>
      <div>Hooli</div>
      <div>•</div>
      <div>$100K — $120K *</div>
      <div>Remote</div>
      <div>Just now</div>
    </div>
  </div>
  <div class="job-card_jobCardContainer">
    <div class="job-card_jobCardDescription">
      <div class="job-card_jobCardTitle"><h3><a class="job-card_jobCardTitleLink" href="/job/release-engineer-soylent-denver-co_90000006">Release Engineer</a></h3></div>
      <div>Soylent</div>
      <div>•</div>
      <div>Denver, CO</div>
      <div>In-Person</div>
      <div>5 days ago</div>
    </div>
  </div>
</main>
</body>
</html>
